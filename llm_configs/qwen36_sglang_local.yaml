# Qwen3.6-35B-A3B — 사내 SGLang 로컬 배포
# ─────────────────────────────────────────────────────────────
# 모델 출처: https://huggingface.co/Qwen/Qwen3.6-35B-A3B
# 배포: SGLang (RadixAttention prefix caching 동작 O)
# 운영자 권장 sampling 값 적용 (사내 채택)

# provider 종류 — anthropic 외는 모두 OpenAI 호환으로 처리
provider: sglang

# API endpoint (api_key 는 .env 의 LLM_API_KEY 로 별도)
api_base: http://ai-server.dream-flow.com:30000/v1

# 모델 이름 — 사내 SGLang 배포명 (HuggingFace slug 와 다름)
model: frentis-ai-model

# 비용 절감용 작은 모델 — 안 박으면 model 사용 (같은 endpoint 라 동일 모델)
model_small: ""

# 토큰 / 타임아웃
# SGLang 배포 context 한도 131072 — 입력 + max_tokens 가 이를 넘으면 400 거부.
# 65K = 출력 큰 결과(상세 분석)에도 여유 + 입력 약 65K 까지 받을 수 있는 균형값.
max_tokens: 65384
timeout_seconds: 300

# 사내 자체 인증서 환경이 아니면 true. http endpoint 라 SSL 무관.
verify_ssl: true

# ChatOpenAI 표준 sampling — 분석 파이프라인은 reproducibility 강제 (사용자 명시:
# "랜덤성 절대 X"). 같은 입력 → 같은 출력 + KV 캐시 적중 효과 일관.
# 운영자 권장 0.7/0.8 은 일반 chat 용 — 분석 작업엔 deterministic 이 맞다.
sampling:
  temperature: 0.1
  top_p: 1.0                 # temperature=0 이면 의미 없음, 표준값

# reasoning_effort — OpenAI o-series / Anthropic 만 코드가 표준 키 자동 매핑.
# 로컬 모델 (SGLang/vLLM) 은 비표준 키 ``chat_template_kwargs.enable_thinking`` 으로
# 운영자가 ``extra_body`` 에 명시 박아야 함 (자동 주입 X — provider 별 분기 사고 차단).
# Plan §3.4 — 운영기는 "none" 으로 토큰/비용 폭증 방지.
reasoning_effort: none

# SGLang 비표준 인자 — ChatOpenAI 의 extra_body 로 전달.
# ``chat_template_kwargs.enable_thinking: false`` = qwen3.6 thinking mode 끄기 (reasoning none 효과).
# ``top_k: 1`` = 매 토큰 가장 확률 높은 1개만 선택 (deterministic). presence_penalty 0 = 분석 작업엔 불필요.
# OpenAI 본점 / Anthropic 호출 시 yaml 에서 이 블록 통째 제거 (hosted API 거부 400).
extra_body:
  chat_template_kwargs:
    enable_thinking: false
  top_k: 1
  min_p: 0.0
  presence_penalty: 0.0
