# P-GPT — 사내 AI 게이트웨이 (POSCO)
# ─────────────────────────────────────────────────────────────
# 분석기는 Architect 백엔드와 **별개 프로세스**라 `PGPT_BASE_URL` 이 안 닿는다.
# 이 갈래는 코드가 아니라 이 파일로 옮긴다.
#
#     ROBO_LLM_CONFIG=pgpt
#     ROBO_LLM_API_KEY=<게이트웨이 키>      # yaml 에 박지 않는다
#
# Architect 쪽 진단(GET /api/auth/provider 의 aiGateway)에서 이 갈래는
# status=config-only 로 뜬다 — 우리가 못 보는 프로세스라 "돌고 있다"고
# 말하지 않는다. 실제로 옮겨졌는지는 분석기 기동 로그에서 확인한다.
#
# 개발계 http://taigpt.posco.net/gpgpta01-gpt/v1
# 운영계 http://aigpt.posco.net/gpgpta01-gpt/v1
#
# ✔ **2026-10-29 에 스펙을 받았다**(`electron-test/2026-10-29/p-gpt-embedding.md`).
#   OpenAI 호환이고 인증은 `Authorization: Bearer <발급 키>` 그대로다 — 우리 쪽
#   코드는 손댈 것이 없다. ⚠ 레거시 API(personalApi·personalRagApi·
#   personalEmbeddingApi)만 키를 Base64 로 싸는데, 우리가 쓰는 길이 아니다.
#
# ⚠ **남은 것은 키 발급 하나다.** 키가 오면 **켜기 전에** 이것부터 확인한다:
#     GET {api_base}/models  — 게이트웨이가 실제로 노출하는 slug
#   아래 `model` 은 받은 문서의 **예시**(gpt-5.2)를 적어 둔 것이지 확인한 값이
#   아니다. 본점 이름을 그대로 두면 404 가 난다.
#
# ⓘ 임베딩은 이 파일이 아니라 `ROBO_EMBED_*` 가 정한다
#   (`ROBO_EMBED_API_BASE` 를 비우면 여기 `api_base` 로 떨어진다).
#   스펙이 준 모델: text-embedding-3-small · -3-large · ada-002.

provider: openai

api_base: http://aigpt.posco.net/gpgpta01-gpt/v1

# ⚠ 받은 문서의 **예시**다. `/v1/models` 로 확인한 뒤 확정한다.
model: gpt-5.2

# 게이트웨이는 본점보다 컨텍스트가 좁은 경우가 많다. 넘치면 **조용히 잘린 응답**이
# 오는 쪽이라(ENT-AI-001) 넉넉하게 잡지 않는다.
max_tokens: 16000
timeout_seconds: 300

# 사내 게이트웨이가 사설 CA 인증서를 쓰면 false 로 둔다. 기본은 검증한다.
verify_ssl: true

sampling:
  temperature: 0.3
  top_p: 0.8

reasoning_effort: none

# **`json_schema` 를 기본으로 켜지 않는다.** 게이트웨이가 중개하는 모델이 구조화
# 출력을 지원하는지는 배포마다 다르고, 안 되면 400 이 아니라 **형식이 어긋난 응답**이
# 온다. 실제 게이트웨이에서 확인한 뒤에 올린다.
structured_output_method: provider_default
