extends: _common
max_tokens: 400
user_template_specific: |
  `summary` 하나만 반환한다.

  - 무엇을 조회·판단·변경·위임하는지와 성공 시 주요 효과를 1~3문장으로 쓴다.
  - **조건만 걷어내고 업무 내용은 남긴다.** 조건을 지우려고 문장을 통째로 버려
    "~를 처리한다" 수준으로 줄이지 마라 — 대상·산출물·연동 모듈은 그대로 살린다.
  - 조건, 기준, 숫자, 상태·코드값, 정상/실패 분기, 거부·오류·보정·반환코드를 쓰지 않는다.
  - `경우`, `이면`, `하면`, `시`, `때`, `실패`, `거부`, `초과`, `이하`, `이상`을 쓰지 않는다.
    `오류 상황`, `결과를 반환한다`처럼 분기 결과를 다시 설명하는 표현도 쓰지 않는다.
  - 상세 정책은 검색 전용 상세에 이미 있으므로 반복하지 않는다.
  - 입력에 없는 업무 사실을 만들지 않는다.

  나쁨: "금액이 기준 이상이면 재인증이 필요하고 아니면 통과한다."
  나쁨(내용까지 버림): "결제 요청을 처리한다."
  좋음: "결제 요청의 추가 인증 필요 여부를 판단한다. 판단 결과는 결제 승인 흐름에 전달된다."
  나쁨: "등급이 미정이면 구매액으로 재계산하여 최종 등급을 반환한다."
  좋음: "회원의 등급 정보를 조회·산정하여 제공한다. 산정에는 누적 구매액을 사용한다."
