## Framework 분할 1 — 사용자 설명과 검색 의미.
extends: _common
max_tokens: 1500
shared_values:
  summary_contract: ../common/summary_contract.md
  search_text_contract: ../common/search_text_contract.md
  domain_terms_contract: ../common/domain_terms_contract.md
user_template_specific: |
  # [분할 계약: SummaryOutput]

  `search_text`, `domain_terms`, `logical_name`, `summary`, `stereotype`만 출력한다.
  Rule·Example·Question과 테이블·컬럼 설명은 만들지 않는다.

  ## summary

  {summary_contract}

  ## search_text

  {search_text_contract}

  summary와 search_text는 같은 근거에서 각각 작성한다. 의미·핵심 용어·문장 일부가
  겹치는 것은 정상이며 억지로 다르게 만들지 않는다.

  - 잘못: 두 필드를 다르게 보이게 하려고 search_text에 본문에 없는 할인 정책을 추가
  - 좋음: 두 필드 모두 “요청을 검증한다”는 핵심을 유지하되, summary는 사용자용 목적과
    결과를 설명하고 search_text는 근거에 실제로 있는 검색 가능한 대상·대표 조건을 포함
  - 잘못: 같은 의미가 겹친다는 이유로 한쪽에서 핵심 반환 결과를 삭제
  - 좋음: 핵심 결과는 양쪽에 필요하면 모두 보존

  ## logical_name

  형제와 구별되는 짧은 업무 표시명 한 줄을 쓴다. 함수명을 번역하거나 구현 토큰을 붙이지
  말고, 본문에서 확인한 대상과 행동으로 이름을 만든다.

  - 잘못: `validate_order`를 그대로 옮긴 “Validate Order”
  - 좋음: 본문이 주문 필수값을 검사하면 “주문 필수정보 검증”

  ## stereotype

  아래 ontology 값 중 본문 주동작에 맞는 하나만 글자 그대로 선택한다:
  {stereotype_options}

  이름이 아니라 실제 주동작으로 고른다. 여러 동작이 있으면 호출자가 이 루틴을 사용하는
  주된 이유를 기준으로 한다.

  - 잘못: 함수명에 `route`가 있다는 이유만으로 `Router`
  - 좋음: 입력 유형별로 서로 다른 처리 대상에 전달하는 것이 주동작일 때 `Router`
  - 잘못: 조회 후 상태까지 바꾸는 루틴을 SELECT가 있다는 이유만으로 `Query`
  - 좋음: 상태 변경이 핵심이면 허용 목록의 변경 책임 역할을 선택

  역할은 부수 단계가 아니라 최종 관측 책임으로 고른다. 아래 우선 대조를 적용한다.

  1. 입력 종류에 따라 서로 다른 대상에 전달하는 것이 주동작이면 `Router`.
  2. 외부 시스템·프로토콜·다른 모듈의 호출 규약으로 변환해 위임하는 것이 주동작이면 `Adapter`.
  3. 호출 후 저장·갱신·전송 등 업무 상태 변화 하나가 주동작이면 `Command`.
  4. 상태를 바꾸지 않고 조회·복호화·계산 결과를 돌려주는 것이 주동작이면 `Query`.
  5. 허용 여부 판정 자체가 산출물이면 `Validator`.
  6. 위 역할 하나로 설명되지 않고 여러 협력자의 서로 다른 업무 단계를 조정하는 유스케이스
     진입점일 때만 `ApplicationService`.

  - 잘못: 여러 함수를 호출한다는 이유만으로 모든 위임·조회·전송 루틴을 `ApplicationService`
  - 좋음: 조회 둘을 순서대로 호출해 조회값을 반환하면 `Query`, 외부 전송 형식으로 바꿔
    전송 호출에 위임하면 `Adapter`, 한 메시지를 실제 전송하는 책임이면 `Command`
  - 잘못: 앞부분에 입력검사가 있다는 이유로 종류별 검사기로 보내는 분배기를 `Validator`
  - 좋음: 최종 책임이 처리 대상 선택·전달이면 `Router`

  ## domain_terms

  {domain_terms_contract}

  다섯 필드를 각각 한 번 작성하고 종료한다.

user_template_evidence: |

  # [Summary 전용 제어 구조]

  아래 목록은 원문의 제어 구조를 읽기 쉽게 표시한 보조 인덱스다. `[decision]`은 실제
  판정, `[complement]`는 같은 층의 나머지 경우, `[controller]`는 하위 결정을 묶는
  문맥이며 그 자체를 별도 결과로 만들지 않는다. 반드시 원문 SOURCE와 함께 확인한다.

  - 잘못된 예: `[controller] SWITCH` 한 줄만 보고 “기타 경우를 처리한다”고 요약
  - 좋은 예: `[decision] CASE`들과 각 본문의 결과를 읽어 실제 선택 결과를 요약

  {branch_index}
