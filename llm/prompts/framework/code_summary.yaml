## code_summary — 분할 1: summary + stereotype + logical_name + search_text + domain_terms
extends: _common
max_tokens: 1500
user_template_specific: |
  # [이 분할 고유 지침]

  이번 호출은 `SummaryOutput`의 다섯 필드만 작성한다:
  `search_text`, `domain_terms`, `logical_name`, `summary`, `stereotype`.
  테이블/컬럼 설명과 규칙/예시는 다른 분할 책임이다.

  ## 출력 순서와 종료

  1. 본문을 한 번 읽고 `search_text`를 1~2문장으로 쓴다.
  2. 같은 읽기에서 확인한 후보로 `domain_terms`를 0~10개 쓴 뒤 배열을 닫는다.
  3. `logical_name` 한 줄, `summary` 1~3줄, `stereotype` 하나를 쓰고 즉시 종료한다.
  4. 이미 닫은 필드로 돌아가 항목이나 문장을 추가하지 않는다.
  5. 동일·유사 문구를 반복하지 않는다.

  ## search_text

  검색에서 이 함수를 구별할 업무 조건·상태 전이·정책값·테이블 상호작용을 자연어
  1~2문장으로 쓴다. 용어 목록이나 `용어=뜻` 사전을 쓰지 않는다. 단순 위임 함수는 `""`.

  ## domain_terms — ★ 10개 절대 상한

  - 허용 개수는 **0~10개**다. **10개는 목표가 아니라 마지노선**이다.
  - 실제 후보가 2개면 2개만 쓴다. 10개를 채우려고 일반어·조합어를 만들지 않는다.
  - 후보가 11개 이상이면 아래 우선순위로 상위 10개만 선택하고 즉시 배열을 닫는다.
  - 같은 우선순위 후보끼리는 함수 본문에 먼저 등장한 순서로 선택한다.
  - 11번째 항목은 어떤 이유로도 출력하지 않는다.

  우선순위:

  1. 외부 시스템·기관·결제망·프로토콜·공식 규격의 고유명
  2. 현업이 그 이름 그대로 질문하는 낯선 업무 약어·업무어
  3. 이름 붙은 업무 정책·상태 체계
  4. 그 밖의 검색 연결 가치가 있는 고유 표제어

  후보 자격은 아래를 모두 만족해야 한다:

  - `term` 글자가 함수 본문·설명 주석·업무 문자열에 **연속된 그대로** 존재한다.
  - 코드와 독립된 현업 사전 표제어다.
  - `meaning`의 모든 사실을 해당 본문이나 주석에서 확인할 수 있다.
  - 같은 개념은 한 번만 쓴다.

  다음은 후보가 아니다:

  - 변수명·함수명·상수명·테이블명·물리 컬럼명과 그 번역
  - 원문에 존재하더라도 그 자체가 상태·쿠폰·이벤트·채널 등의 조회 키인 영문/숫자
    코드값과 열거 리터럴. 코드값이 가리키는 이름 붙은 업무 개념이 원문에 별도로 쓰였을
    때만 그 업무 명칭을 후보로 삼고, 식별용 값 자체는 쓰지 않는다.
  - SQL/프로그래밍 용어, 리턴코드·버퍼·길이 같은 기술 배관
  - 원문에 없는 단어 조합, 접미어 추가, 상위/하위 개념 파생
  - 기존 표제어 뒤에 `상세`, `코드`, `메시지`, `결과`를 연쇄적으로 붙인 변형

  후보를 배열에 넣기 직전에 겹치는 원문 구절을 다시 비교한다.

  - `SMS 게이트웨이`처럼 원문에 완전한 업무 명칭이 있으면 검색 의미가 약한 부분 문자열
    `SMS`만 잘라 쓰지 말고 완전한 명칭을 쓴다. 단, 약어 자체가 원문에서 독립된 공식
    표제어로 설명될 때만 둘을 별개 후보로 볼 수 있다.
  - `W01`, `A17`, `ENC`, `EVT2025`처럼 대문자·숫자로 된 짧은 토큰은 주석에 반복되거나
    기본값·분기값으로 중요해도 **값 자체는 표제어가 아니다**. 원문에 별도로 적힌
    `대표창고`, `암호화`, `기획전` 같은 업무 명칭만 후보가 될 수 있다.
  - 배열을 닫기 직전에 각 `term`을 한 번 검사한다. `^[A-Z0-9_*.-]{1,12}$` 모양의 ASCII
    토큰은 원문 주석이 외부 기관·망·프로토콜·공식 규격의 고유명이라고 명시한 경우가
    아니면 삭제한다. 내부 포맷 표식·접두어·상태키·기본값은 예외 없이 삭제한다.
    특히 `ENC`, `HEX`, `TMP`, `BUF`처럼 인코딩·표현형식·임시값·버퍼를 나타내는 기술
    표식은 업무 용어가 아니다. 대문자 약어는 원문이 외부 시스템·공식 규격·이름 붙은
    업무 등급/분류라고 명시할 때만 예외적으로 허용한다.
  - 반대로 `가용재고`, `정산대상`처럼 원문에 그대로 있고 현업이 그 말로 정책과 코드를
    찾는 완전한 업무 명사는, 더 일반적인 `재고`, `정산`보다 우선한다.
  - 배열을 닫기 직전 모든 ASCII 대문자 전용 항목을 다시 검사해, 위의 공식 명칭 예외를
    원문에서 입증하지 못하면 삭제한다. 중요해 보인다는 이유만으로 기술 표식을 살리지 않는다.

  ### 올바른 예시

  입력:

  ```c
  /* SK-VAN: 카드 승인 중계망. 부분취소 요청을 전송한다. */
  send_to_pg("SK-VAN", amount);
  ```

  출력:

  ```json
  [
    {"term":"SK-VAN","meaning":"카드 승인 요청을 중계하는 결제망"},
    {"term":"부분취소","meaning":"결제 금액 일부만 취소하는 처리"}
  ]
  ```

  실제 후보가 2개이므로 2개에서 끝낸다.

  후보가 없으면 `[]`가 정답이다. 10개를 채우기 위해 하나라도 만들면 실패다.

  `A17`, `W01`, `ENC`, `EVT2025`, `CHANNEL_X`처럼 업무 분기나 조회에 쓰이는 코드 리터럴만 있고 그
  코드의 공식 업무 명칭이 원문에 없다면 해당 값은 용어가 아니므로 `[]`를 유지한다.

  ### 잘못된 예시 — 실제 장애와 같은 무한 파생

  ```json
  [
    {"term":"PG사 정산 대조 결과","meaning":"..."},
    {"term":"PG사 정산 대조 결과 상세","meaning":"..."},
    {"term":"PG사 정산 대조 결과 상세 코드","meaning":"..."},
    {"term":"PG사 정산 대조 결과 상세 메시지","meaning":"..."}
  ]
  ```

  원문에 각 표제어가 그대로 있지 않고 하나에서 계속 파생했으므로 전부 금지다.

  ### 10개 경계 예시

  원문에 실제 고유 후보가 12개 있으면 외부 시스템/규격·현업 약어·정책 순으로 정렬해
  **상위 10개만** 쓴다. 10번째에서 배열을 닫고 11·12번째는 출력하지 않는다.
  같은 우선순위라면 원문에 먼저 나온 것을 우선한다.
  반대로 실제 후보가 6개면 6개만 쓰며 4개를 채워 넣지 않는다.

  ## logical_name

  형제 함수와 구별되는 업무 표시명 한 줄. 권장 22자 전후의 체언형이며 코드 식별자와
  구현 문법을 쓰지 않는다. 같은 문장을 반복하지 않는다.

  ## summary

  함수가 무엇을 판단·변경·반환하는지 1~3줄로 쓴다. 세부 규칙을 나열하거나 동일 내용을
  반복하지 않는다.

  ## stereotype

  본문 실제 동작으로 아래 하나만 선택한다:
  `ApplicationService`, `DomainService`, `Repository`, `Factory`, `Command`, `Query`,
  `Validator`, `Translator`, `Adapter`, `Strategy`, `EventHandler`, `Scheduler`, `Helper`,
  `Controller`, `Initializer`.

  INSERT/UPDATE/DELETE가 본질이면 `Command`, SELECT 조회가 본질이면 `Query`, 검증만 하면
  `Validator`, 단순 변환이면 `Translator`, 기술 보조면 `Helper`를 우선 검토한다.

  응답은 다섯 필드만 포함하고 각 필드를 한 번만 작성한 뒤 JSON을 닫는다.
