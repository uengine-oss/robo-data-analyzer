## Framework 분할 1 — bounded dynamic semantic frame + 역할 분류.
extends: _common
max_tokens: 6000
structured_output_method: function_calling
shared_values:
  semantic_frame_contract: ../common/semantic_frame_contract.md
user_template_specific: |
  # [TASK — TARGET의 applicable semantic slot 의미와 충분성]

  목표는 parser/linker가 미리 지정한 각 slot에 TARGET의 입증된 의미만 채우는 것이다.
  자유형 summary·question·Rule·TABLE/COLUMN 설명을 별도로 만들지 않는다. legacy summary와
  question은 이 frame에서 시스템이 투영한다.

  {semantic_frame_contract}

  ## [OUTPUT CONTRACT — frame summary concern]

  최상위에는 response_format이 required로 지정한 필드만 출력한다. `slots`는 항상 지정되는
  exact key map이고 각 값은 공통 leaf 계약을 따른다. `stereotype`은 target 단위 소유 배치의
  response_format에 있을 때만 출력하며, 없는 배치에서는 만들지 않는다.

  ## [DECISION — stereotype 역할 분류]

  response_format에 `stereotype`이 있을 때만 아래 ontology 값 중 target의 최종 관측 책임에
  맞는 하나를 글자 그대로 선택한다:
  {stereotype_options}

  둘 이상이면 다음 우선순위를 적용한다:
  {stereotype_priority}

  - 이름·호출 수·분기 수가 아니라 호출자가 얻는 최종 책임으로 판정한다.
  - 외부·지속 상태를 바꾸지 않고 정보가 산출물이면 `Query`, 상태 변경이 목적이면 `Command`다.
  - 직접 검사 종합은 `Validator`, 입력별 전문 처리 계약 선택은 `Router`다.
  - I/O 계약을 다른 모듈 계약으로 변환하고 결과를 되돌리면 `Adapter`, 단순 위임은 `Helper`다.
  - 여러 업무 단계를 조정해 유스케이스를 완성할 때만 `ApplicationService`다.
  - 저수준 자료구조·문자열 연산은 `Util`, 횡단 시스템 기능은 `Utility`다.
  - 결정론 writes가 있는 target에 조회 전용 역할을 선택하지 않는다.

  ## [SELF CHECK]

  - 최상위에 response_format이 요구한 필드만 썼는가
  - `stereotype`이 요구된 배치라면 ontology literal이고 FUNCTION.RESPONSIBILITY와 모순되지 않는가

user_template_evidence: |
  # [FRAME ASSIGNMENT]

  structural_profile_json:
  {structural_profile}

  applicable_slots_json:
  {applicable_slots}

  # [Summary 전용 제어 구조]

  아래 branch_index는 profile의 control/rule 좌표를 사람이 읽기 쉽게 표시한 보조 인덱스다.
  `[decision]`은 판정, `[complement]`는 같은 층의 나머지, `[controller]`는 하위 결정 문맥,
  `[implicit_false]`는 ELSE 없는 정상 거짓 경로, `[error_only]`는 실행 중 오류 경로다.

  {branch_index}
