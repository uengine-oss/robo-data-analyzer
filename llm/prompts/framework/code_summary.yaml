user_template_specific: |
  # [분할 계약: SummaryOutput]

  `search_text`, `domain_terms`, `logical_name`, `summary`, `stereotype`만 출력한다.
  Rule·Example·Question과 테이블·컬럼 설명은 만들지 않는다.

  ## summary

  {summary_contract}

  ## search_text

  {search_text_contract}

  summary와 search_text는 같은 근거에서 각각 작성한다. 의미·핵심 용어·문장 일부가
  겹치는 것은 정상이며 억지로 다르게 만들지 않는다.

  - 잘못: 두 필드를 다르게 보이게 하려고 search_text에 본문에 없는 할인 정책을 추가
  - 좋음: 두 필드 모두 “요청을 검증한다”는 핵심을 유지하되, summary는 사용자용 목적과
    결과를 설명하고 search_text는 근거에 실제로 있는 검색 가능한 대상·대표 조건을 포함
  - 잘못: 같은 의미가 겹친다는 이유로 한쪽에서 핵심 반환 결과를 삭제
  - 좋음: 핵심 결과는 양쪽에 필요하면 모두 보존

  ## logical_name

  형제와 구별되는 짧은 업무 표시명 한 줄을 쓴다. 함수명을 번역하거나 구현 토큰을 붙이지
  말고, 본문에서 확인한 대상과 행동으로 이름을 만든다.

  - 잘못: `validate_order`를 그대로 옮긴 “Validate Order”
  - 좋음: 본문이 주문 필수값을 검사하면 “주문 필수정보 검증”

  ## stereotype

  아래 ontology 값 중 본문 주동작에 맞는 하나만 글자 그대로 선택한다:
  {stereotype_options}

  이름·호출 개수·분기 개수·중간 구현이 아니라 **호출자가 얻는 최종 관측 책임**으로 고른다.
  다음 절차를 순서대로 적용하고 첫 단계에서 결론을 내리지 않는다.

  1. 호출 전후 무엇이 외부에 남는지 적는다: 반환 정보·허용 판정·선택된 대상·외부/지속 상태
     변화·생명주기 준비 중 하나다.
  2. 로컬 변수, 작업 버퍼, 출력 파라미터, 반환 객체에 값을 쓰는 것은 그 자체로 업무 상태
     변경이 아니다. 외부 시스템·메시지·지속 데이터에 효과가 남을 때만 변경 책임이다.
  3. 하위 호출은 수단이다. 조회를 위임했다는 이유로 `Adapter`, 호출이 여러 개라는 이유로
     `ApplicationService`, 분기했다는 이유로 `Router`를 고르지 않는다.
  4. 아래 경계표로 가장 좁고 직접적인 최종 책임 하나를 선택한다.

  - `Query`: 외부·지속 상태를 바꾸지 않고 조회·복호화·계산 정보를 반환한다. 출력 버퍼에
    조회값을 쓰거나 외부 조회 함수를 호출해도 최종 산출물이 정보이면 Query다.
    - 잘못: 외부 조회 함수를 호출하고 출력 구조체를 채웠다는 이유로 `Adapter` 또는 `Command`
    - 좋음: 조회 결과를 출력 구조체와 반환값으로 돌려주고 외부 상태를 바꾸지 않으면 `Query`
  - `Command`: 저장·갱신·삭제·메시지 전송처럼 호출 뒤 외부 또는 지속 업무 상태가 실제로
    달라지는 것이 최종 목적이다.
    - 잘못: 로컬 플래그나 반환 버퍼를 갱신했다는 이유로 `Command`
    - 좋음: 외부 메시지를 실제 전송하거나 지속 데이터를 변경하면 `Command`
  - `Adapter`: 경계 형식·프로토콜·호출 규약을 내부 규약에 연결하는 것 자체가 최종 책임이다.
    단순히 외부 조회를 호출하거나 반환값을 전달하는 것만으로는 Adapter가 아니다.
    - 잘못: 원격 조회를 한 번 호출했다는 이유로 `Adapter`
    - 좋음: 내부 요청을 외부 프로토콜 형식으로 변환해 호출하고 응답을 내부 형식으로 되돌리면 `Adapter`
  - `Translator`: 외부 I/O 효과 없이 표현 형식·모델·메시지 사이 값을 변환하는 것이 최종
    책임이다.
    - 잘못: 변환 후 외부 전송까지 수행하는 루틴을 `Translator`
    - 좋음: 메모리 안에서 한 표현을 다른 표현으로 매핑해 반환하면 `Translator`
  - `Validator`: 어느 하위 검사 경로를 사용하든 최종 산출물이 하나의 허용/거절·정합성 판정이면 Validator다.
    - 잘못: 입력 종류별 검사기로 나눈다는 이유로 `Router`
    - 좋음: 여러 검사 결과를 하나의 유효/무효 판정으로 반환하면 `Validator`
  - `Router`: 입력 종류에 따라 서로 다른 처리 대상으로 전달하며, 그 대상 선택과 분배가
    루틴의 최종 책임이다.
    - 잘못: 여러 분기가 같은 검증 결과를 만들 뿐인데 `Router`
    - 좋음: 입력 종류별로 서로 다른 처리 대상에 전달하면 `Router`
  - `ApplicationService`: 조회·검증·변경·전송처럼 **서로 다른 업무 단계**를 조정해 하나의
    유스케이스 결과를 완성할 때만 선택한다.
    - 잘못: 같은 종류의 조회를 여러 번 호출하거나 단일 전송을 감쌌다는 이유로 `ApplicationService`
    - 좋음: 조회한 정보를 검증하고 상태를 변경한 뒤 후속 전송까지 조정하면 `ApplicationService`
  - `Repository`: 저장소 경계의 조회·저장·변경·삭제 추상화 자체가 책임일 때 선택한다.
    - 잘못: 상위 유스케이스가 Repository를 호출한다는 이유로 상위 루틴도 `Repository`
    - 좋음: 저장소 접근 계약을 직접 제공하는 경계 루틴이면 `Repository`
  - `Initializer`: 프로세스·모듈·컴포넌트의 시작·등록·부트스트랩처럼 생명주기 준비가
    최종 책임일 때만 선택한다.
    - 잘못: 매 요청마다 작업 버퍼를 비운다는 이유로 `Initializer`
    - 좋음: 컴포넌트 시작 시 공유 자원과 등록 정보를 준비하면 `Initializer`
  - `Util` / `Utility` / `Helper`: 저수준 자료구조·문자열 원시 연산은 `Util`, 시간·체크섬·
    환경 정리 같은 횡단 시스템 기능은 `Utility`, 한 상위 작업만 돕는 좁은 내부 단계는 `Helper`.
    - 잘못: 재사용 가능하다는 이유만으로 세 역할을 임의 선택
    - 좋음: 문자열 복사 원시는 `Util`, 시스템 시간 조회는 `Utility`, 한 유스케이스의 내부
      보조 단계는 `Helper`

  남은 `DomainService`, `Factory`, `Strategy`, `EventHandler`, `Scheduler`, `Controller`도
  위 절차로 최종 책임을 먼저 확정한 뒤 ontology 설명과 대조한다.

  ## domain_terms

  {domain_terms_contract}

  다섯 필드를 각각 한 번 작성하고 종료한다.

user_template_evidence: |

  # [Summary 전용 제어 구조]

  아래 목록은 원문의 제어 구조를 읽기 쉽게 표시한 보조 인덱스다. `[decision]`은 실제
  판정, `[complement]`는 같은 층의 나머지 경우, `[controller]`는 하위 결정을 묶는
  문맥이며 그 자체를 별도 결과로 만들지 않는다. 반드시 원문 SOURCE와 함께 확인한다.

  - 잘못된 예: `[controller] SWITCH` 한 줄만 보고 “기타 경우를 처리한다”고 요약
  - 좋은 예: `[decision] CASE`들과 각 본문의 결과를 읽어 실제 선택 결과를 요약

  {branch_index}
