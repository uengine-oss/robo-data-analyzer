## code_rules_merge — 폴백 병합 전용 (spec 054 US3 / FR-005)
## 반복 이상으로 함수를 조각내 각 조각을 code_rules_examples 로 분석한 뒤, 그 조각별
## 결과를 하나의 함수 규칙/예시로 병합한다. 규칙 판단 지침은 _common + code_rules_examples
## 가 단일 진실 — 여기서는 **병합 전용 지시만** 얇게 얹는다(지침 재진술 X, KV 캐시 유지).
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 폴백 병합: 조각별 규칙/예시 → 함수 규칙/예시
  # ════════════════════════════════════════════════════════════════

  이 호출은 한 함수를 제어문 경계로 나눈 **조각들의 분석 결과를 병합**한다. 아래 [조각 결과]
  는 같은 함수의 서로 다른 부분을 분석한 code_rules_examples 산출이다. 이를 함수 하나의
  ``RulesExamplesOutput`` 으로 합친다.

  ## 출력 스키마 (code_rules_examples 와 동일)
  ```
  RulesExamplesOutput {
    rules:[ { statement:"<조건>이면 <결과>",
              examples:[ { given, when, then, affected_tables:[ {table, op} ] } ] } ],
    questions:[ { text, reason } ] }
  ```

  ## 병합 규칙 (이것만 수행 — 새 규칙 발명·재판단 금지)
  1. **조각 경계를 넘어 같은 Rule 을 합친다.** 서로 다른 조각이 같은 조건·결과의 Rule 을
     냈으면 하나로 합치고, 그 하위 example 을 한 Rule 아래로 모은다.
  2. **표현만 다른 동일 Example 을 제거한다.** `(given, when, then, affected_tables)` 가
     의미상 같으면(문장·값·기술경로만 다름) 하나만 남긴다. 의미중복 0 이 목표다.
  3. **같은 결과의 입력 변주는 한 given 으로 합친다.** 같은 catch-all 로 귀결되는 임의값
     여러 개는 대표 1개. 같은 `when` 아래 코드 리터럴만 바뀌면 파라미터화 한 행으로 합친다.
  4. **서로 다른 정책·분기 결과는 보존한다.** 조각이 달라 나온 진짜 다른 업무 결과는 합치지
     않는다(합치면 누락).
  5. **원문에 없는 규칙을 발명하지 않는다.** 조각 결과에 있던 것만 병합한다. 조각에 없던
     새 Rule/Example 을 지어내지 않는다.
  6. **개수 상한을 목표로 채우거나 자르지 않는다.** 서로 다른 결과는 개수와 무관하게 모두
     보존하고, 중복은 개수와 무관하게 모두 제거한다.
  7. `affected_tables` 는 조각 결과의 값을 그대로 유지한다(재추론 X).

  ## 제출 전 자가 점검
  - 병합 후 동일 `(given, when, then, affected_tables)` 가 2회 이상이면 첫 행만 남긴다.
  - 조각 A·B 에 나뉘어 있던 같은 Rule 이 하나로 합쳐졌는가.
  - 서로 다른 업무 결과가 실수로 뭉개지지 않았는가.
  - 어떤 string 도 공백·줄바꿈만으로 끝내지 않는다.

  # ════════════════════════════════════════════════════════════════
  # [조각 결과] — 병합 대상 (같은 함수의 조각별 code_rules_examples 산출)
  # ════════════════════════════════════════════════════════════════
  함수 시그니처: {signature}

  {fragment_results}
