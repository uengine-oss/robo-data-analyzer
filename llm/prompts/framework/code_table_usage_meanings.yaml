## Framework 분할 2 — 현재 함수의 테이블 접근 의미.
extends: _common
inherit_inputs: false
shared_values:
  function_table_usage_contract: ../common/function_table_usage_contract.md
user_template_specific: |
  # [TASK — TARGET의 direct TABLE access meaning]

  TARGET의 exact direct table usage로 미리 묶은 FT 결과만 채운다.
  함수 summary, Rule, COLUMN 의미는 만들지 않는다.

  ## [OUTPUT CONTRACT]

  최상위 객체 자체가 ASSIGNED_TABLE_USAGES의 FT key exact required map이다.
  각 FT key를 빠짐없이 한 번만 쓰고, 값에는 이 함수에서 해당 table/access를
  사용하는 업무 의미 문자열 하나만 쓴다. 입력으로 의미를 입증할 수 없으면
  그 FT key의 값은 빈 문자열로 둔다.

  status, missing context 문장, FT key를 summary 문장 안에 복사하지 않는다.
  table identity, READ/WRITE, DML operation, column, 좌표는 Analyzer가 이미 소유하므로
  다시 고르거나 출력하지 않는다.

  {function_table_usage_contract}

user_template_evidence: |
  # [INPUT — TABLE usage frame packet]

  response_locale: {response_locale}

  assigned_table_usages_json: {assigned_table_usages}

  linked_table_context_json: {table_contexts}

  ## [SOURCE]
  아래 번호가 붙은 각 source line은 원문 literal delimiter와 escape를 치환하지 않은 exact text다.
  ```
  {code_body}
  ```
