## Framework 분할 2 — 현재 함수의 테이블별 직접 사용 의미.
extends: _common
max_tokens: 5000
user_template_specific: |
  # [분할 계약: TableInsightsOutput]

  `table_insights`만 출력한다. summary·이름·용어·Rule·Example·Question을 만들지 않는다.
  `table_insights`는 배열이 아니라 입력 reads/writes의 exact `table_id`를 key로 쓰는
  객체다. schema에 required로 주어진 모든 key를 정확히 한 번 채운다. 바깥 key가 table 좌표이므로
  값 안에서 table을 반복하지 않고 `role`, `usage_summary`만 쓴다.

  ## 테이블 경계

  현재 함수가 직접 접근한 table_id key만 출력하고 callee나 같은 함수의 다른 테이블 의미를
  섞지 않는다.

  - 잘못: 함수가 A를 조회하고 B에 저장하므로 A 설명에도 B의 임시 적재 역할을 붙임
  - 좋음: A에는 조회·판단 역할만, B에는 저장 역할만 각각 기록

  `role`은 직접 reads/writes에서 확인되는 READ/WRITE 조합을 설명한다. 허용값은
  `READ-only`, `WRITE-only`, `READ_WRITE`, `append-only`, `lookup`, `upsert`이며
  정확히 하나를 쓴다. 조회 결과를 판단에 쓰면 `lookup`, 그대로 반환하면 `READ-only`;
  INSERT만 하면 이력성일 때 `append-only`, 아니면 `WRITE-only`; MERGE·충돌 갱신처럼
  삽입과 갱신을 함께 보장할 때만 `upsert`다.
  읽기만 주입됐으면 `READ-only`/`lookup`, 쓰기만 주입됐으면
  `WRITE-only`/`append-only` 중에서 고른다. 읽기와 쓰기가 모두 주입된 경우에만
  `READ_WRITE`를 쓴다. `upsert`는 입력의 권위 연산이 MERGE인 경우에만 쓴다.
  `usage_summary`는 현재 함수가 바로 그 테이블에 수행하는 조회·쓰기와 그 결과가 현재
  함수 판단·산출에 어떻게 쓰이는지를 한 줄로 쓴다.

  - 잘못: “업무 처리에 사용되는 테이블”
  - 좋음: “요청 식별자로 기존 배송 상태를 조회해 변경 가능 여부 판단에 사용”
  - 잘못: reads에만 있는 테이블을 `WRITE-only`로 판정
  - 좋음: 같은 근거에서 판정용 조회라면 `lookup`으로 판정

  ## 컬럼

  현재 결정론 입력에는 code-node→column 관계가 없으므로 컬럼 필드는 출력하지 않는다.
  본문 식별자나 table/구조체 이름 유사도로 컬럼을 추측하지 않는다.
  전체 DDL 컬럼의 설명·논리명은 후속 table 통합 단계가 DDL `HAS_COLUMN` 관계에서 별도로
  생성한다.

  근거 없는 테이블·컬럼 항목으로 개수를 채우지 않는다. schema의 table key를 누락하거나
  입력 밖 key를 추가하지 않는다.
