  ## [SOURCE]
  각 접두사는 절대 파일 줄번호다. 접두사 숫자와 `|`는 소스 코드가 아니다.
  `[QUOTED_LITERAL value=...]`는 응답 JSON과 충돌하는 따옴표·escape 구분자만 제거한
  결정론 투영이며 value 철자와 절대 줄 좌표는 원본 source와 같다.
