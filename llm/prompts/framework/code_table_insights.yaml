  ## [TABLE_USAGE_TARGET]
  target_id: {id}
  signature: {signature}
  file: {source_file}
  source_range: {source_range}
  coordinate_system: {coordinate_system}
  source_status: {source_status}

  ## [EXACT_DIRECT_TABLE_EVIDENCE]
  direct_reads_json:
  {direct_reads}

  direct_writes_json:
  {direct_writes}

  direct_table_operations_json:
  {table_ops}

  direct_data_object_usages_json:
  {data_object_usages}

  column_usage_candidates_json:
  {column_usage_candidates}

  target_referenced_symbol_definitions_json:
  {referenced_symbols}

  target_linked_external_context_json:
