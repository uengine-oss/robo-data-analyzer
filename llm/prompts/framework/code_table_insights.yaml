## Framework 분할 2 — 현재 함수의 테이블별 직접 사용 의미.
extends: _common
max_tokens: 5000
user_template_specific: |
  # [분할 계약: TableInsightsOutput]

  `table_insights`만 출력한다. summary·이름·용어·Rule·Example·Question을 만들지 않는다.
  각 항목은 입력 reads/writes에 있는 테이블 하나의 `table`, `role`, `usage_summary`,
  `columns`만 가진다.

  ## 테이블 경계

  `table`은 주입된 table_id를 글자 그대로 사용한다. 현재 함수가 직접 접근한 테이블만
  출력하고 callee나 같은 함수의 다른 테이블 의미를 섞지 않는다.

  - 잘못: 함수가 A를 조회하고 B에 저장하므로 A 설명에도 B의 임시 적재 역할을 붙임
  - 좋음: A에는 조회·판단 역할만, B에는 저장 역할만 각각 기록

  `role`은 직접 reads/writes에서 확인되는 READ/WRITE 조합을 설명한다. 허용값은
  `READ-only`, `WRITE-only`, `WRITE-then-READ`, `append-only`, `lookup`, `upsert`이며
  정확히 하나를 쓴다. 조회 결과를 판단에 쓰면 `lookup`, 그대로 반환하면 `READ-only`;
  INSERT만 하면 이력성일 때 `append-only`, 아니면 `WRITE-only`; MERGE·충돌 갱신처럼
  삽입과 갱신을 함께 보장할 때만 `upsert`다.
  읽기만 주입됐으면 `READ-only`/`lookup`, 쓰기만 주입됐으면
  `WRITE-only`/`append-only` 중에서 고른다. 읽기와 쓰기가 모두 주입된 경우에만
  `WRITE-then-READ`를 쓴다. `upsert`는 입력의 권위 연산이 MERGE인 경우에만 쓴다.
  `usage_summary`는 현재 함수가 바로 그 테이블에 수행하는 조회·쓰기와 그 결과가 현재
  함수 판단·산출에 어떻게 쓰이는지를 한 줄로 쓴다.

  - 잘못: “업무 처리에 사용되는 테이블”
  - 좋음: “요청 식별자로 기존 배송 상태를 조회해 변경 가능 여부 판단에 사용”
  - 잘못: reads에만 있는 테이블을 `WRITE-only`로 판정
  - 좋음: 같은 근거에서 판정용 조회라면 `lookup`으로 판정

  ## 컬럼

  reads/writes의 해당 테이블에 주입된 `columns` 허용 목록을 입력 순서대로 정확히 한 번씩
  모두 출력한다. 목록 밖 컬럼을 만들거나 본문 미등장을 이유로 누락하지 않는다. `name`은
  입력 컬럼명을 정확히 echo한다. `logical_name`은 사용자 표시명, `description`은 source
  설명과 이 함수의 직접 사용에서 확인되는 역할이다. 직접 사용이 없으면 source 설명을
  보존하고, 그것도 없으면 물리 이름이 입증하는 최소 범위만 쓴다. 다른 컬럼 의미를 복사하지 않는다.

  - 잘못: `owner_ref`라는 이름만 보고 “소유자 이메일 주소”라고 추측
  - 좋음: 입력 설명이 없으면 “소유자 참조값”처럼 현재 비교·조인 역할까지만 기술
  - 잘못: 한 컬럼 후보를 같은 테이블의 모든 빈 컬럼에 복사
  - 좋음: 각 컬럼의 직접 비교·저장·조회 근거를 독립적으로 작성
  - 잘못: 현재 본문에 안 보인다는 이유로 주입된 컬럼을 누락
  - 좋음: 허용 목록 전체를 반환하되 직접 근거가 적은 컬럼은 보수적으로 설명

  날짜와 일시, 암호화와 마스킹, 식별자와 연락처, 기관과 채널처럼 근거가 구별하는 개념을
  임의로 좁히거나 넓히지 않는다.

  - 잘못: 날짜 필드를 일시로 확대하거나 암호화된 값을 마스킹 값으로 변경
  - 좋음: 입력 근거의 정확한 범위와 보호 방식을 유지

  근거 없는 테이블·컬럼 항목으로 개수를 채우지 않는다.
