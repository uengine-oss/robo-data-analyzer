## Framework 분할 2 — 현재 함수의 테이블별 직접 사용 frame.
extends: _common
inherit_inputs: false
max_tokens: 5000
shared_values:
  semantic_frame_contract: ../common/semantic_frame_contract.md
user_template_specific: |
  # [TASK — TARGET이 직접 사용한 TABLE operation slots]

  TARGET의 exact direct table operation에 미리 지정된 semantic slot meaning만 채우고,
  각 table의 폐쇄형 접근 role을 고른다. 함수 summary, Rule, COLUMN 의미는 만들지 않는다.

  {semantic_frame_contract}

  ## [OUTPUT CONTRACT]

  최상위에는 `slots`, `table_roles`만 쓴다. `slots`는 APPLICABLE_SLOTS exact required map이다.
  `table_roles`는 direct table ID exact required map이며 각 값은 response_format literal 중 하나다.

  ## [TABLE ROLE]

  - READ만 있으면 `READ-only|lookup`: 판정용 조회일 때만 lookup
  - WRITE만 있으면 `WRITE-only|append-only`: INSERT 이력 추가일 때만 append-only
  - READ와 WRITE가 모두 있으면 `READ_WRITE`
  - 권위 연산이 MERGE일 때만 `upsert`

  ## [GROUNDING]

  각 operation slot은 자기 DATA_OBJECT evidence의 table만 설명한다. 같은 SOURCE에서 보이는
  연산·조건·결과 사용처까지만 쓰며 callee나 다른 table 효과를 섞지 않는다. SELECT만 보이면
  저장·후속 DML을 만들지 않는다. unresolved 객체를 exact table에 귀속하지 않는다.

