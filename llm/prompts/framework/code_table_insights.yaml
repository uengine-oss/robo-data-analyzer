## Framework 분할 2 — 현재 함수의 테이블별 직접 사용 의미.
extends: _common
inherit_inputs: false
max_tokens: 5000
user_template_specific: |
  # [TASK — TARGET이 직접 사용한 TABLE 역할]

  목표는 TARGET SOURCE가 **직접** 접근한 각 exact table의 사용 역할만 설명하는 것이다.
  함수 전체 summary나 callee·COLUMN 의미를 만들지 않는다. COLUMN은 결정론 좌표를 원문과 함께
  받는 최종 TABLE/COLUMN 요청에서 한 번만 생성한다.

  ## [OUTPUT CONTRACT — TableInsightsOutput]

  이 요청은 `table_insights`만 출력한다. summary·이름·용어·Rule·Example·Question은 다른
  요청의 몫이므로 만들지 않는다.
  `table_insights`는 배열이 아니라 입력 direct reads/writes의 exact `table_id`를 key로 쓰는
  객체다. schema에 required로 주어진 모든 key를 정확히 한 번 채운다. 바깥 key가 table
  좌표이므로 값 안에서 table을 반복하지 않고 `role`, `usage_summary`만 쓴다.
  아래 절은 각각 자기 절이 명시한 필드에만 적용된다.

  ## [INPUT GUIDE — 각 값의 뜻·권한·허용 판정]

  - `TABLE_USAGE_TARGET`은 이번 출력의 유일한 소유자다.
  - `SOURCE`는 직접 동작·조건·순서의 최우선 근거다. `source_status`가 available이 아니면
    정상 원문처럼 추측해 채우지 않는다.
  - `direct_reads_json`/`direct_writes_json`은 TARGET에서 exact source edge로 확인된 방향이며
    출력 table key와 `role`의 허용 범위를 정한다. effective/ancestor/callee 접근이 아니다.
  - `direct_table_operations_json`은 exact table의 SELECT/INSERT/UPDATE/DELETE/MERGE 같은
    구조 연산이다. `role`과 동작 동사를 고르는 데만 사용한다.
  - `direct_data_object_usages_json`은 `TARGET_ACCESSES_DATA_OBJECT` 관계와 source 좌표,
    alias, qualified column, exact/unresolved 상태를 잇는다. unresolved 객체를 exact table에
    귀속하지 않는다.
  - `column_usage_candidates_json`은 table→column→source line의 결정론 소유권이다. 여기에
    없는 column을 이름 유사도로 추가하지 않는다.
  - symbol definition/external context는 각각 `TARGET_REFERENCES_DEFINITION`과
    `TARGET_REFER_TO_EXTERNAL_CHUNK` 관계로 SOURCE 식별자의 입증된 뜻을 설명하는 보조 근거다.
    table 소유권이나 접근 방향을 바꾸지 못한다.
  - `[]`/`{}`는 해당 direct 근거가 없다는 뜻이다. schema required key를 상식으로 채우지 않는다.

  ## [DECISION PROCEDURE]

  1. direct read/write key로 출력할 table과 허용 role을 고정한다.
  2. SOURCE와 direct operation으로 각 table의 실제 동작·조건·결과 사용처를 찾는다.
  3. data-object/column relation의 table_id·좌표와 일치하는 근거만 연결한다.
  4. 각 table에 입증된 한 문장만 쓰고 다른 table·callee 의미가 섞이지 않았는지 확인한다.

  ## 소유권 — 어느 테이블에 무엇을 쓰는가

  현재 함수가 직접 접근한 table_id key만 출력하고 callee나 같은 함수의 다른 테이블 의미를
  섞지 않는다. 근거 없는 테이블 항목으로 개수를 채우지 않으며, schema의 table key를
  누락하거나 입력 밖 key를 추가하지 않는다.

  예시 — 함수가 테이블 A를 조회하고 테이블 B에 저장할 때, 테이블 A 쪽 출력:

  - 잘못: A의 usage_summary에 B의 저장 대상·쓰기 결과를 함께 넣음
  - 좋음: A의 SOURCE에 직접 있는 조회 대상·조건과 그 결과의 현재 함수 내 용도만 서술

  ## `role` — 접근 유형 분류

  이 절은 `role` 필드에만 적용된다.

  `direct_reads_json`/`direct_writes_json`에서 확인되는 READ/WRITE 조합을 허용값
  `READ-only`, `WRITE-only`, `READ_WRITE`, `append-only`, `lookup`, `upsert` 중
  정확히 하나로 분류한다.

  판정 절차:
  1. 읽기만 주입됐으면 `READ-only`/`lookup` 중에서 고른다 — 조회 결과를 판단에 쓰면
     `lookup`, 그대로 반환하면 `READ-only`.
  2. 쓰기만 주입됐으면 `WRITE-only`/`append-only` 중에서 고른다 — INSERT만 하고
     이력성이면 `append-only`, 아니면 `WRITE-only`.
  3. 읽기와 쓰기가 모두 주입된 경우에만 `READ_WRITE`를 쓴다.
  4. `upsert`는 입력의 권위 연산이 MERGE인 경우에만 쓴다.

  - 잘못: reads에만 있는 테이블을 `WRITE-only`로 판정
  - 좋음: 같은 근거에서 판정용 조회라면 `lookup`으로 판정

  ## `usage_summary` — 사용 설명

  이 절은 `usage_summary` 필드에만 적용된다.

  현재 함수가 바로 그 테이블에 수행하는 조회·쓰기와, **같은 SOURCE 범위 안에서 보이는
  경우에만** 그 결과가 현재 함수의 판단·산출에 어떻게 쓰이는지를 한 줄로 쓴다. SOURCE가
  직접 사용처를 보여 주지 않으면 접근 동작·대상·조건까지만 쓰고 후속 저장·반환을 만들지 않는다.

  - 잘못: "업무 처리에 사용되는 테이블" — 어느 테이블에나 붙는 문장은 설명이 아니다.
  - 좋음: 현재 table의 직접 연산 동사·대상·조건을 SOURCE에 맞춰 구체화
  - 잘못: 조회만 보이는 SOURCE에 후속 저장이나 반환을 덧붙임
  - 좋음: 같은 SOURCE가 보여 주는 조회·조건·직접 소비까지만 설명
  - `WRITE-only`/`append-only`이면 저장·추가·갱신을 말하고 조회·판정으로 바꾸지 않는다.
    `READ-only`/`lookup`이면 조회한 값·조건과 사용처를 말하며 다른 테이블의 쓰기를 넣지 않는다.
  - 위 예시 문구나 일반적인 업무 문장을 출력에 복사하지 않는다. SOURCE와
    `direct_table_operations_json`에서 현재 table에 입증된 말만 쓴다.

  ## [SELF CHECK]

  - required table key를 전부, 입력 밖 key 없이 채웠는가
  - 각 role이 주입된 direct reads/writes 방향과 맞는가
  - 각 usage_summary가 그 테이블에만 해당하는 내용인가
  - COLUMN 의미나 `columns` 필드를 중복 생성하지 않았는가
