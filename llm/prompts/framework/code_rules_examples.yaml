## Framework 분할 3 — 관측 가능한 계약, 시나리오, 실제 정보 공백.
extends: _common
max_tokens: 12000
shared_values:
  rule_evidence_contract: ../common/rule_evidence_contract.md
user_template_specific: |
  # [분할 계약: RulesExamplesOutput]

  `rules`와 `questions`만 출력한다. 각 Rule의 `examples`는 그 Rule 아래에 둔다.
  summary·이름·용어·테이블 설명을 만들지 않는다.

  {rule_evidence_contract}

  ## 출력 구조

  ```
  RulesExamplesOutput {
    rules: [{
      statement: "<조건 또는 적용범위>이면 <관측 결과>",
      anchor_line: <해당 결정을 시작하는 분기 줄, 무조건 계약이면 0>,
      examples: [{
        given: "<사전상태·입력>",
        when: "<사용자·호출자의 한 행동>",
        then: "<반환·상태·데이터·외부 I/O 결과>",
        affected_tables: [{table: "<주입된 ID>", op: "READ|INSERT|UPDATE|DELETE|MERGE"}]
      }]
    }],
    questions: [{text: "<필요한 외부 정보>", reason: "<입력에 답이 없는 이유>"}]
  }
  ```

  ## 작성 순서

  1. 아래 `branch_index`를 SOURCE와 함께 위에서 아래로 훑어 각 분기의 관측 결과를 찾는다.
  2. 활성 주동작과 서로 다른 종료 결과마다 담당 Rule을 하나씩 정한다.
  3. 각 결과에 도달하려면 반드시 참이어야 하는 바깥 조건·AND/OR·부정·경계를 함께 적는다.
  4. 같은 조건과 같은 결과로 가는 값만 한 집합으로 묶고 값→결과 대응을 바꾸지 않는다.
  5. 각 Rule에 대표 회귀 시나리오 1개를 붙인다. 별도 경계/fallback 결과가 있으면 Rule을
     분리하며, 한 Rule의 Example은 최대 2개다.
  6. 본문과 입력 전체에 정말 답이 없는 공백만 Question으로 남긴다.

  - 잘못: 안쪽 조건만 보고 바깥 승인 가드를 생략
  - 좋음: “승인 상태이고 추가 확인값이 존재할 때”처럼 도달 조건 전체를 보존
  - 잘못: 정상·대상 없음·오류를 “처리 결과 반환” 한 행으로 합침
  - 좋음: 호출자가 구별하는 반환·상태·I/O가 다르면 별도 시나리오로 보존
  - 잘못: “업무구분에 따라 하위 처리를 호출한다”, “조건에 따라 값을 설정한다”
  - 좋음: 각 입력 집합이 어느 호출·반환·상태 변경으로 이어지는지 Rule만 읽어 복원 가능

  ## anchor_line

  Rule의 조건을 결정하는 줄을 아래 [분기 목록]에서 골라 그대로 쓴다. 목록 밖 줄번호를
  만들지 않는다. `else/default`는 같은 층 앞선 조건의 여집합이다. 분기 없는 무조건 변환·
  위임·I/O·반환 계약은 0이다.

  - 잘못: 실제 조건과 무관한 가까운 줄을 선택
  - 좋음: statement의 조건식이 시작되는 정확한 분기 줄을 선택

  ## Rule과 Example의 경계

  Rule은 제거했을 때 호출자·사용자·외부 데이터가 관측하는 결과가 달라지는 계약이다.
  단순 위임도 호출·입력 전달·반환 전달이 루틴의 주동작이면 Rule이다. 로그·임시 대입·버퍼
  초기화처럼 별도 관측 결과를 만들지 않는 내부 단계만 제외한다.

  Example은 하나의 given/when/then만 읽어도 경로와 기대 결과를 검증할 수 있어야 한다.
  “정상 처리”, “적절한 결과”, “상황에 따라”처럼 결과를 복원할 수 없는 문장은 금지한다.
  같은 Rule의 코드값 변주를 여러 Example로 나열하지 않는다. 실제 값 전체를 한 `given`의
  집합·매핑으로 묶는다.

  - 잘못: “검증하면 적절한 결과를 반환”
  - 좋음: “필수 배송지가 없을 때 주문 검증을 수행하면 주문을 생성하지 않고 거절 결과를 반환”
  - 잘못: 위임 함수에 callee 내부의 등급별 정책 사례를 복제
  - 좋음: 부모가 직접 구별하는 성공 전달·실패 전달만 부모 사례로 작성

  ## 값·경계·fallback

  원문의 리터럴 표기를 바꾸지 않는다. `>=`/`>`와 `<=`/`<`, 부정, AND/OR를 정확히 보존한다.
  매핑은 모든 명시 값과 fallback을 한 번씩 포함하고 같은 fallback의 임의값 변주를 반복하지
  않는다. 계산 결과는 활성 연산으로 검산할 수 있을 때만 구체값을 쓴다.

  - 잘못: `010`을 `10`으로 정규화하거나 3720초를 3720분으로 설명
  - 좋음: 원문 표기 `010`을 유지하고, 단위는 입력 근거가 명시한 경우에만 환산
  - 잘못: `{A→승인, B→거절, 기타→보류}`를 “A 또는 B면 승인 또는 거절”로 합침
  - 좋음: 값과 결과의 대응표를 그대로 복원

  ## affected_tables

  각 항목은 현재 입력의 직접 reads/writes와 정확히 일치해야 한다. 테이블 ID를 그대로 echo하고
  callee·형제의 테이블을 추가하지 않는다. 현재 직접 R/W가 없으면 `[]`다.

  - 잘못: writes가 비었는데 callee의 저장 테이블을 부모 Example에 추가
  - 좋음: 부모 affected_tables는 `[]`, 저장은 callee 소유 결과에만 기록

  ## questions

  다음을 모두 만족할 때만 질문한다: 결과 해석에 꼭 필요하고, 본문·else/default·심볼값·
  R/W·외부증거·callee interface 어디에도 답이 없으며, 질문 없이 쓰면 추측이 된다.
  코드 작성 의도, 호출자 초기화 위치, 상수의 내부 정수값, 명백한 현재 동작이 “맞는지”는
  질문하지 않는다. 질문 0개가 정상이며 보통 더 좋다.

  - 잘못: else가 현재 값을 반환하는데 “그렇게 반환하는 것이 의도인가?”
  - 좋음: 외부 계약의 코드값 뜻이 입력 어디에도 없고 그 뜻에 따라 결과 해석이 달라질 때 질문

  ## 제출 전 대조

  활성 주동작, 정상·오류·대상 없음·조기종료·fallback을 위에서 아래로 한 번 대조한다.
  서로 다른 관측 결과의 누락과 같은 `(Rule + 원문 분기 + 관측 결과)` 중복이 모두 0일 때
  JSON을 닫는다.

user_template_evidence: |

  # [Rule 전용 고변동 증거]

  ancestor_context:
  {ancestor_context}

  branch_index:
  {branch_index}

  child_business_logic:
  {child_business_logic}
