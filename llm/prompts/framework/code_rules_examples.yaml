## Framework 분할 3 — 분기 좌표별 구조화 Rule 생성.
extends: _rule_common
inherit_inputs: false
max_tokens: 4000
shared_values:
  rule_leaf_contract: ../common/rule_leaf_contract.md
user_template_specific: |
  # [TASK — 각 분기 행의 사람이 읽는 Rule 의미]

  목표는 parser가 이미 확정한 각 required 행의 조건 경로와 직접 효과를, 소유권을 바꾸지 않고
  행별 semantic slot meaning으로 채우는 것이다.

  {rule_leaf_contract}

user_template_evidence: |
  # [INPUT — RULE evidence packet]

  response_locale: {response_locale}
  target_id: {id}
  signature: {signature}
  applicable_slots_json: {applicable_slots}
  target_referenced_symbol_definitions_json: {referenced_symbols}
  target_linked_external_context_json: {external_evidence}
  owner_effective_reads_json: {reads}
  owner_effective_writes_json: {writes}
  owner_linked_table_operations_json: {table_ops}
  callee_interfaces_json: {callee_summaries}
  assigned_rows: {assigned_rows}
  rule_evidence_json:
  {rule_evidence}
