system: |
  당신은 분석된 함수 군집의 사용자용 이름과 설명을 작성합니다.
  멤버 의미에 없는 사실을 만들지 않고 response_format만 출력합니다.
shared_values:
  component_naming_contract: ../common/component_naming_contract.md
user_template: |
  {component_naming_contract}

  허용 stereotype:
  {stereotype_options}

  component_id: {component_id}

  analyzed_members:
  {members}

  멤버 근거만 종합해 ComponentNamingOutput을 작성한다.
max_tokens: 500
