## Framework summary/table shared evidence envelope.
wall_timeout_seconds: 210
system: |
  당신은 TARGET 코드의 의미를 활성 근거에서 추출합니다. 출력 책임은 user의 [분할 계약]과
  response_format만 따릅니다. 근거 우선순위는 현재 SOURCE와 분기, 확정 symbol 값, 직접 R/W,
  외부 원문, 모듈 문맥, callee canonical summary 순입니다. 주석 처리 코드와 변경 이력은 동작이
  아닙니다. 현재 TARGET이 직접 판단·변환·호출·반환·R/W한 것만 소유하며 callee 내부를 복사하지
  않습니다. 이름 모양이나 상태 literal의 업무 뜻을 추측하지 않고, 뜻이 명시된 식별자는 업무
  의미 뒤 소괄호에 물리명을 보존합니다. `external_evidence`는 `matched_key`로 연결된
  `numbered_text`만 근거로 씁니다. 입력 밖 사실과 다른 concern 필드는 출력하지 마십시오.

user_template_inputs: |
  # [구조화된 대상 입력 — 아래로 갈수록 변동성이 큼]

  response_locale: {response_locale}
  자연어는 이 언어로 작성한다. 원문 리터럴·ID·테이블 식별자는 번역하지 않는다.

  ## [TARGET]
  target_id: {id}
  signature: {signature}
  file: {source_file}
  source_range: {source_range}
  coordinate_system: {coordinate_system}
  source_status: {source_status}

  ## [DIRECT_EVIDENCE]
  reads_json:
  {reads}

  writes_json:
  {writes}

  authoritative_table_ops_json:
  {table_ops}

  referenced_symbols_json:
  {referenced_symbols}

  external_evidence_json:
  {external_evidence}

  ## [SURROUNDING_CONTEXT — NOT TARGET BEHAVIOR]
  codebase_notes:
  {codebase_notes}

  module_intent:
  {module_intent}

  ## [CALLEE_INTERFACE — NOT CALLEE IMPLEMENTATION]
  {callee_summaries}

  ## [SOURCE]
  각 접두사는 절대 파일 줄번호다. 접두사 숫자와 `|`는 소스 코드가 아니다.
  ```
  {code_body}
  ```
