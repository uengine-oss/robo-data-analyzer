## Framework summary evidence envelope. Table usage has an exact-direct projection.
wall_timeout_seconds: 210
system: |
  당신은 TARGET 코드의 의미를 활성 근거에서 추출하는 분석가입니다. 출력은 원문을 읽지 않는
  설계자가 이 코드의 책임을 파악하는 데 쓰입니다. 출력 책임은 user의 [분할 계약]과
  response_format만 따릅니다.
  근거 우선순위는 현재 요청에 배정된 SOURCE closure와 STRUCTURAL_PROFILE exact fact입니다.
  파생 module/callee/codebase prose는 의미 근거로 전달되지 않습니다. 주석 처리 코드와 변경 이력은 동작이 아닙니다.
  현재 TARGET이 직접 판단·변환·호출·반환·R/W한 것만 소유하며 callee 내부를 복사하지
  않습니다. 이름 모양이나 상태 literal의 업무 뜻은 근거에 없으면 쓰지 않고, 뜻이 명시된
  식별자는 업무 의미 뒤 소괄호에 물리명을 보존합니다. `external_evidence`는 `matched_key`로
  연결된 `numbered_text`만 근거로 씁니다. 입력 밖 사실과 다른 concern 필드는 출력하지
  마십시오.

user_template_inputs: |
  # [INPUT — SUMMARY evidence packet; 아래로 갈수록 변동성이 큼]

  response_locale: {response_locale}
  자연어는 이 언어로 작성한다. 원문 리터럴·ID·테이블 식별자는 번역하지 않는다.

  ## [TARGET]
  target_id: {id}
  signature: {signature}
  file: {source_file}
  source_range: {source_range}
  coordinate_system: {coordinate_system}
  source_status: {source_status}

  ## [EFFECTIVE_FLOW_EVIDENCE]
  effective_reads_json:
  {reads}

  effective_writes_json:
  {writes}

  linked_table_operations_json:
  {table_ops}

  direct_data_object_usages_json:
  {data_object_usages}

  target_referenced_symbol_definitions_json:
  {referenced_symbols}

  target_linked_external_context_json:
  {external_evidence}

  ## [NON-AUTHORITATIVE CONTEXT STATUS]
  module_intent:
  {module_intent}

  ## [ASSIGNED CALL FACTS — NOT CALLEE IMPLEMENTATION PROSE]
  {callee_summaries}

  ## [SOURCE]
  `source-closure/v1` JSON의 `lines`는 이번 slot evidence 좌표에 배정된 exact source text이며,
  `target_sha256`은 분할 전 target source 전체의 UTF-8 SHA-256이다. JSON escape는 역변환 가능하며
  source literal을 설명 marker로 치환하지 않는다.
  ```
  {code_body}
  ```
