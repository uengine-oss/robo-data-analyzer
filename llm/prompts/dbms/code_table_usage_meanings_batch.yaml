## DBMS split 2 — direct table usage meanings by node.
extends: _common
inherit_inputs: false
structured_output_method: function_calling
shared_values:
  function_table_usage_contract: ../common/function_table_usage_contract.md
user_template_specific: |
  # [TASK — 각 TARGET_NODE의 직접 테이블 접근 의미]

  각 packet에서 Analyzer가 미리 묶은 `FT` 항목의 업무 목적만 채운다. 요약, Rule, COLUMN 의미는 만들지 않는다.

  ## [OUTPUT CONTRACT]

  응답 최상위 `nodes`는 response_format이 지정한 exact node key map이다. 각 node의 값은 그 node에 배정된 FT key exact required map이다. 모든 node와 `FT` key를 정확히 한 번 채우고 다른 key를 만들지 않는다. 각 `FT` 값은 업무 목적 문자열 하나이며, 입증할 수 없으면 빈 문자열이다.

  {function_table_usage_contract}

user_template_dynamic_inputs: |
  # [INPUT]

  response_locale: {response_locale}
  각 packet의 `numbered_source`는 literal delimiter와 escape를 바꾸지 않은 exact text다.

  table_usage_packets_json:
  {table_usage_packets}
