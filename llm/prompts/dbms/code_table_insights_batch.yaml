## DBMS 분할 2 — node별 direct table operation frames.
extends: _common
inherit_inputs: false
max_tokens: 6000
structured_output_method: function_calling
shared_values:
  semantic_frame_contract: ../common/semantic_frame_contract.md
user_template_specific: |
  # [TASK — 각 TARGET_NODE의 direct TABLE operation slots]

  각 node의 exact direct table operation에 미리 지정된 semantic slot meaning만 채우고
  table별 폐쇄형 접근 role을 고른다. 조상·형제·callee·COLUMN 의미를 만들지 않는다.

  {semantic_frame_contract}

  ## [OUTPUT CONTRACT]

  최상위 `nodes`는 exact node_key required map이다. 각 node 값은 `slots`, `table_roles`만 갖는다.
  slots와 table_roles 모두 그 node 입력의 exact required key를 빠짐없이 한 번 채운다.

  ## [TABLE ROLE]

  - READ만 있으면 `READ-only|lookup`: 판정용 조회일 때만 lookup
  - WRITE만 있으면 `WRITE-only|append-only`: INSERT 이력 추가일 때만 append-only
  - READ+WRITE면 `READ_WRITE`, MERGE일 때만 `upsert`

  각 slot은 자기 DATA_OBJECT evidence의 table·node만 설명한다. SOURCE에 보이는 연산·조건·
  결과 사용처까지만 쓰고 보이지 않는 후속 DML이나 다른 table 효과를 만들지 않는다.

user_template_evidence: |
  # [INPUT — BATCH TABLE frame packets]

  response_locale: {response_locale}
  procedure_id: {unit_id}
  signature: {unit_signature}
  node_count: {node_count}
  required_node_keys: {node_keys}

  각 packet의 번호가 붙은 source line은 원문 literal delimiter와 escape를 치환하지 않은 exact text다.
  {table_usage_nodes}
