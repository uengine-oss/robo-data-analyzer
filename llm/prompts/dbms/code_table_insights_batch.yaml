## DBMS 분할 2 — 배치 노드별 테이블 직접 사용 의미.
extends: _common
max_tokens: 10000
user_template_specific: |
  # [분할 계약: BatchTableInsightsOutput]

  `nodes`는 배열이 아니라 입력의 각 DML `node_key`를 key로 쓰는 객체다. schema에 required로
  주어진 모든 node key를 정확히 한 번 채운다. 바깥 key가 좌표이므로 값 안에서 `node_key`를
  반복하지 않고 `table_insights`만 가진다.
  `table_insights`도 배열이 아니라 해당 노드 reads/writes의 exact `table_id`를 key로 쓰는
  객체이며, 각 값은 `role`, `usage_summary`만 포함한다. 바깥 table_id key를 값 안에서
  반복하지 않는다. summary·이름·용어·Rule·Example·Question은 다른 요청의 몫이므로 만들지
  않는다. 아래 절은 각각 자기 절이 명시한 필드에만 적용된다.

  ## 소유권 — 어느 노드가 어느 테이블을 소유하는가

  table ID는 입력 표기를 그대로 echo한다. 현재 노드의 직접 R/W만 사용하고
  조상·형제·callee 테이블을 추가하지 않는다. 한 노드가 여러 테이블을 쓰면 각 테이블의
  직접 역할을 분리한다. 입력에 없는 node_key·테이블·컬럼을 만들지 않는다.

  예시 — 한 노드가 대상 테이블을 조회하고 이력 테이블에 저장할 때, 대상 테이블 쪽 출력:

  - 잘못: `usage_summary: "대상 상태를 조회하고 처리 결과를 이력으로 저장"` — 이력
    테이블의 역할이 섞였다
  - 좋음: `usage_summary: "처리 대상의 현재 상태를 조회해 갱신 여부 결정에 사용"`

  ## `role` — 접근 유형 분류

  이 절은 `role` 필드에만 적용된다.

  직접 READ/WRITE 조합을 허용값
  `READ-only`, `WRITE-only`, `READ_WRITE`, `append-only`, `lookup`, `upsert` 중
  정확히 하나로 분류한다.

  판정 절차:
  1. 읽기만 주입됐으면 `READ-only`/`lookup` 중에서 고른다 — 단순 SELECT 반환은
     `READ-only`, 판정용 조회는 `lookup`.
  2. 쓰기만 주입됐으면 `WRITE-only`/`append-only` 중에서 고른다 — 단순 쓰기는
     `WRITE-only`, 이력 추가는 `append-only`.
  3. 읽기와 쓰기가 모두 주입된 경우에만 `READ_WRITE`를 쓴다.
  4. `upsert`는 입력의 권위 연산이 MERGE인 경우에만 쓴다.

  - 잘못: writes에만 있는 테이블을 `READ-only`로 판정
  - 좋음: 같은 근거에서 단순 갱신이면 `WRITE-only`로 판정

  ## `usage_summary` — 사용 설명

  이 절은 `usage_summary` 필드에만 적용된다.

  이 노드가 해당 테이블에 한 일과 그 결과가 판단·반환·후속 DML에 어떻게 쓰이는지를
  한 줄로 설명한다.

  - 잘못: "프로시저에서 사용하는 테이블" — 어느 테이블에나 붙는 문장은 설명이 아니다.
  - 좋음: "처리 대상의 현재 상태를 조회해 갱신 여부를 결정"

  ## 컬럼 — 출력하지 않는 것

  현재 결정론 입력에는 node→column 관계가 없으므로 컬럼 필드는 출력하지 않는다. SQL
  식별자나 이름 유사도로 컬럼 소유권을 추측하지 않는다. 전체 DDL 컬럼의 설명·논리명은
  후속 table 통합 단계가 DDL `HAS_COLUMN` 관계에서 별도로 생성한다.

  ## 내보내기 전 자기 점검

  - required node key와 그 안의 table key를 전부, 입력 밖 key 없이 채웠는가
  - 각 role이 주입된 reads/writes 방향과 맞는가
  - 각 usage_summary가 그 노드·그 테이블에만 해당하는 내용인가
