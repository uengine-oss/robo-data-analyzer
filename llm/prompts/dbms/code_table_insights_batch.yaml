## code_table_insights_batch (dbms 분할 2) — 배치 안 각 DML 노드의 테이블 role + 컬럼 의미.
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실 (extends).
## ★ 이 분할은 테이블을 건드리는 DML 노드만 배치로 들어온다 (비-DML 노드는 호출자가 제외).
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 2: 테이블별 사용 양상 (배치 안 각 노드)
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드

  - **이 분할이 하는 일**: 각 노드마다 `table_insights` 배열 — 그 노드의 `reads`/`writes`
    각 테이블에 대해 사용 역할(`role`) + 주입된 DDL 전체 컬럼의 비즈니스 메타데이터(`columns`).
  - **이 분할이 안 하는 일**: 노드 의미·역할(→분할 1) / 비즈니스 규칙·시나리오·질문(→분할 3).
  - **입력**: 이 배치 노드는 모두 **DML(테이블 접근) 노드** — 각자 reads/writes 가 있음.
  - **출력**: `nodes` 배열 — 입력 `### 노드 <key>` 마다 1 항목 (`node_key` echo + `table_insights`).
    ```
    BatchTableInsightsItem {
      node_key: "<start>-<end>",
      table_insights: [
        { table: "db.schema.TARGET_DAILY_TB", role: "upsert",
          columns: [ { name:"ITEM_CNT", logical_name:"항목건수", description:"일별 항목 건수" },
                     { name:"WORK_DATE", logical_name:"작업일자", description:"집계 기준 일자 키" } ] }
      ]
    }
    ```

  ## 0. 작성 절대 원칙 (모든 영역 공통)
  - **0.0 테이블 ID 정확 보존**: 각 `table_insights[*].table`은 해당 노드 reads/writes JSON의
    `table_id` 중 하나를 글자 그대로 echo한다. 설명을 id에 이어 붙이지 않으며,
    구분자·대소문자·접두어·마지막 이름을 바꾸지 않는다.
  - **0.1 컬럼 그라운딩과 전수 coverage — 주입된 컬럼 목록 기준**(공통 단계 3): 같은 JSON
    원소의 `columns` 배열 = 실제 컬럼(권위). 출력에는 각 이름을 입력 순서대로 정확히 한 번씩
    전부 echo한다. 본문 미등장을 이유로 DDL 컬럼을 생략하지 않는다. 직접 SQL·구조체 멤버·대입·
    바인딩에 등장한 컬럼은 실제 사용 맥락을 우선 반영하고, 미등장 컬럼은 테이블 설명·컬럼 이름·
    샘플에서 확인 가능한 최소 의미만 보수적으로 쓴다. 목록 밖 이름은 추측·생성하지 않으며,
    목록이 없을 때만 `columns: []`다.
  - **0.2 코드 식별자 X**(공통 단계 1): `columns[*].name`은 입력 `columns` 허용 목록의 표기를
    글자 그대로 echo한다. 본문의 대소문자·별칭으로 바꾸지 않는다. `description` 자연어에는
    변수·프로시저·커서명 같은 코드 토큰 박지 X.
  - **0.3 주석 환각 차단**(공통 단계 7): `usage` 결정은 실제 SQL 위치가 진실. 주석 무시.
  - **0.4 빈값**: reads/writes 모두 비면 `table_insights: []`. 테이블이 있으면 본문 컬럼 등장
    수와 무관하게 주입된 `columns` 전체를 출력한다. 허용 목록 자체가 없을 때만 `columns: []`다.

  ## [1] role — 테이블별 1개 (허용 풀 6)
  - `READ-only` — SELECT 만, 조회 후 분기/반환.
  - `WRITE-only` — INSERT/UPDATE/DELETE 만, 후속 SELECT 없음.
  - `WRITE-then-READ` — 쓰고 같은 트랜잭션서 다시 SELECT(시퀀스·자동컬럼 회수).
  - `append-only` — INSERT 만, 갱신·삭제 X(이력/로그).
  - `lookup` — SELECT 후 코드/상태값을 결정에 사용(단순 표시 X).
  - `upsert` — INSERT-or-UPDATE(MERGE / ON CONFLICT). ★PL/SQL MERGE 가 대표.

  ### 결정 트리
  ```
  INSERT 만, 같은 테이블 UPDATE/DELETE 없음? → append-only
  INSERT/UPDATE/DELETE 후 같은 트랜잭션서 같은 테이블 SELECT? → WRITE-then-READ
  INSERT-or-UPDATE(MERGE)? → upsert
  SELECT 만 + 결과를 분기·계산·매핑? → lookup
  SELECT 만 + 결과 그대로 반환? → READ-only
  INSERT/UPDATE/DELETE 만 + 후속 SELECT 없음? → WRITE-only
  ```
  ### 안티패턴
  - X: SELECT+반환만인데 `lookup` → O: `READ-only`.
  - X: INSERT 만인데 `WRITE-then-READ` → O: `append-only`/`WRITE-only`.
  - X: UPDATE 한 번인데 `upsert`(MERGE 아님) → O: `WRITE-only`.

  ## [2] columns — 테이블별 주입 DDL 컬럼 전부
  입력 `columns` 허용 목록의 모든 컬럼을 정확히 한 번씩 반환한다. 본문 미등장은 생략 사유가
  아니며 허용 목록 밖 컬럼 생성은 금지한다.
  ### 의미 근거 우선순위
  1. raw SQL 절·명시적 매핑에서 확인되는 실제 사용 맥락.
  2. 같은 JSON 원소의 테이블 `description`.
  3. `sample_rows`의 값 형태와 컬럼 이름이 직접 드러내는 최소 의미.

  코드값의 공식 의미·상태 전이·정책을 확인할 수 없으면 창작하지 않는다. 식별자/코드/금액/
  수량/일자/시각/여부/내용처럼 이름에서 직접 확인되는 보수적 역할만 쓴다.
  ### 각 컬럼 필드 3개
  - `name` — DDL 컬럼명 정확히(추측 X, 대소문자 본문대로).
  - `logical_name` — 이름에서 직접 확인되는 최소 표시명 한 줄(2~10자 체언).
    ①코드 식별자·DDL 타입·물리 컬럼명 그대로 X ②동어반복·문장형 X(짧은 이름만)
    ③모든 주입 컬럼에 비어 있지 않은 표시명. 근거가 적으면 `식별자`, `상태코드`, `등록일시`처럼
    이름의 토큰이 직접 드러내는 최소 역할만 쓰고 업무 의미를 창작하지 않는다.
  - `description` — 비즈니스 의미 한 줄. **4가지 준수**: ①DDL 타입 X(`VARCHAR2(20)` 같은
    정의 X) ②코드 토큰 X ③동어반복 X("X를 저장하는 컬럼" 금지) ④추론 불가 시 빈값 X /
    확인 가능한 최소 역할을 비어 있지 않게 기재하고 코드값 의미·정책·상태 전이는 추측하지 않는다.
  - (필드는 name·logical_name·description 셋 — 사용위치 usage 는 소비처 미사용이라 응답에서 제외.)
  ### description 좋은 예
  - 상태 코드의 값별 뜻이 입력에 없으면 "처리 상태 코드"까지만 쓴다.
  - 날짜 이름만 확인되면 "기준 일자"처럼 최소 의미만 쓴다.
  - 건수 이름만 확인되면 "집계 건수"처럼 최소 의미만 쓴다.
  ### 안티패턴
  - X: description="VARCHAR2(20) 컬럼"(DDL 타입) → O: "처리 상태 코드 ('A'/'C'/'P')".
  - X: "X를 저장하는 컬럼"(동어반복) → O: "처리 상태 코드 — 흐름 분기에 사용".
  - X: SQL 미등장이라는 이유로 주입 목록의 `CREATED_AT` 누락 → O: `CREATED_AT`을 출력하고
    이름만 근거라면 logical_name="생성일시", description="레코드 생성 일시"처럼 최소 의미 기재.
  - X: 주입 목록에 없는 `UPDATED_BY`를 관례로 추가 → O: 허용 목록 밖 컬럼은 출력하지 않음.

