## DBMS 분할 2 — 배치 노드별 테이블 직접 사용 의미.
extends: _common
max_tokens: 10000
user_template_specific: |
  # [분할 계약: BatchTableInsightsOutput]

  입력의 각 DML `node_key`마다 `BatchTableInsightsItem` 하나를 정확히 출력한다. 각 항목은
  `node_key`와 `table_insights`만 가진다. summary·이름·용어·Rule·Example·Question은
  만들지 않는다.

  각 table insight는 현재 node body와 주입 reads/writes에 직접 근거한 `table`, `role`,
  `usage_summary`, `columns`만 포함한다.

  ## 소유권

  table ID와 column name은 입력 표기를 그대로 echo한다. 현재 노드의 직접 R/W만 사용하고
  조상·형제·callee 테이블을 추가하지 않는다. 한 노드가 여러 테이블을 쓰면 각 테이블의
  직접 역할을 분리한다.

  - 잘못: A 조회와 B 저장을 모두 A의 usage_summary에 서술
  - 좋음: A에는 조회·필터 역할, B에는 저장·갱신 역할을 별도로 기록

  ## 테이블 역할

  role은 직접 READ/WRITE 조합을 나타낸다. usage_summary는 이 노드가 해당 테이블에 한 일과
  그 결과가 판단·반환·후속 DML에 어떻게 쓰이는지를 한 줄로 설명한다.
  role 허용값은 `READ-only`, `WRITE-only`, `WRITE-then-READ`, `append-only`, `lookup`,
  `upsert`이며 정확히 하나만 쓴다. 단순 SELECT 반환과 판정용 조회, 단순 쓰기와 이력 추가,
  실제 upsert를 구별한다.
  읽기만 주입됐으면 `READ-only`/`lookup`, 쓰기만 주입됐으면
  `WRITE-only`/`append-only` 중에서 고른다. 읽기와 쓰기가 모두 주입된 경우에만
  `WRITE-then-READ`를 쓴다. `upsert`는 입력의 권위 연산이 MERGE인 경우에만 쓴다.

  - 잘못: “프로시저에서 사용하는 테이블”
  - 좋음: “처리 대상의 현재 상태를 조회해 갱신 여부를 결정”
  - 잘못: writes에만 있는 테이블을 `READ-only`로 판정
  - 좋음: 같은 근거에서 단순 갱신이면 `WRITE-only`로 판정

  ## 컬럼

  reads/writes의 해당 테이블에 주입된 `columns` 허용 목록을 입력 순서대로 정확히 한 번씩
  모두 출력한다. 목록 밖 컬럼 생성과 본문 미등장 컬럼 누락을 금지한다. source/DDL 설명이
  있으면 우선하며, `logical_name`은 표시명, `description`은 source 의미와 현재 노드의
  직접 사용 역할이다. 둘 다 없으면 물리 이름이 입증하는 최소 범위만 쓴다.

  - 잘못: `party_ref`를 근거 없이 이메일 주소로 한정
  - 좋음: 입력이 말하는 당사자 식별값과 현재 조인 역할까지만 설명
  - 잘못: 날짜를 일시로, 암호화를 마스킹으로 바꿈
  - 좋음: 입력 근거의 정확한 개념 범위를 유지
  - 잘못: 현재 SQL에 안 보인다는 이유로 주입된 컬럼을 누락
  - 좋음: 허용 목록 전체를 반환하고 근거가 적은 컬럼은 보수적으로 설명

  입력에 없는 node_key·테이블·컬럼을 만들지 않는다.
