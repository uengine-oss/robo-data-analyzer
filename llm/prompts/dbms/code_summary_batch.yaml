## DBMS 분할 1 — node별 bounded dynamic semantic frame + 역할 분류.
extends: _common
max_tokens: 6000
shared_values:
  semantic_frame_contract: ../common/semantic_frame_contract.md
user_template_specific: |
  # [TASK — 각 TARGET_NODE의 applicable semantic slot 의미와 충분성]

  각 node의 parser/linker가 지정한 slot에 그 node가 직접 소유한 입증된 의미만 채운다.
  자유형 summary·question·Rule·TABLE/COLUMN 설명은 별도로 만들지 않는다. legacy 필드는
  검증된 frame에서 시스템이 투영한다.

  {semantic_frame_contract}

  ## [OUTPUT CONTRACT — batch frame summary concern]

  최상위 `nodes`는 입력의 exact `node_key`를 required key로 갖는다. 각 node 값은 `slots`,
  `stereotype`만 갖고, `slots`는 그 node의 `APPLICABLE_SLOTS` exact key map이다.

  ## [DECISION — stereotype 역할 분류]

  아래 ontology 값 중 node의 최종 관측 책임에 맞는 하나만 선택한다:
  {stereotype_options}

  둘 이상이면 다음 우선순위를 적용한다:
  {stereotype_priority}

  - 부수 SELECT·DML·검증 하나가 아니라 node 범위의 최종 책임을 본다.
  - 상태 변경 없는 조회 결과가 산출물이면 `DataQuery`, DML 상태 변경이면 `DataMutator`다.
  - 코드·마스터·설정 조회 자체가 목적이면 `MetadataLookup`, 허용/정합 판정이면 `Validator`다.
  - 다수 행 일괄 처리가 골격이면 `BatchProcessor`, 커서 순회·행별 위임이 골격이면 `CursorLooper`다.
  - 결정론 writes가 있는 node에 조회 전용 역할을 선택하지 않는다.

  ## [DBMS STRUCTURE GUIDE]

  각 TARGET_NODE의 `STRUCTURAL_PROFILE`과 `APPLICABLE_SLOTS`가 유일한 ID/slot 정본이다.
  `ast_type/expression/target/operator/call_target`, CONTROL_FLOW_INDEX, SOURCE는 그 refs의 의미를
  판정하는 내부 근거다. 조상·형제·callee 효과를 현재 node로 복사하지 않는다.
  CHILD_SUMMARY_CANDIDATE는 원문이 아니며 조건·극성은 CONTROL_FLOW_INDEX를 따른다.

  ## [SELF CHECK]

  - required node_key와 각 node의 required slot을 전부 정확히 한 번 썼는가
  - 각 slot meaning이 그 node와 evidence refs에만 속하는가
  - 최상위 node 값에 `slots`, `stereotype` 외 필드를 만들지 않았는가
