  아래 내용은 위치와 용어를 이해하는 참고 문맥이다. 현재 node_key의 직접 동작으로 복사하지 않는다.

  codebase_notes:
  {codebase_notes}

  module_intent:
  {module_intent}

  ancestor_context:
  {ancestor_context}

