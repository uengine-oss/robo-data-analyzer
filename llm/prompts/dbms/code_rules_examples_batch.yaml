## DBMS 분할 3 — 배치 노드별 관측 계약, 시나리오, 실제 정보 공백.
extends: _common
max_tokens: 16000
shared_values:
  rule_evidence_contract: ../common/rule_evidence_contract.md
user_template_specific: |
  # [분할 계약: BatchRulesOutput]

  입력의 각 `node_key`마다 `BatchRulesItem` 하나를 정확히 출력한다. 각 항목은 `node_key`,
  `rules`(하위 `examples` 포함), `questions`만 가진다. summary·이름·용어·테이블 설명은
  만들지 않는다.

  {rule_evidence_contract}

  ## 노드별 출력 구조

  ```
  BatchRulesItem {
    node_key: "<입력 줄범위 그대로>",
    rules: [{
      statement: "<조건 또는 적용범위>이면 <관측 결과>",
      anchor_line: <근거 분기 줄, 확정할 수 없거나 무조건 계약이면 0>,
      examples: [{given, when, then,
                  affected_tables: [{table, op: READ|INSERT|UPDATE|DELETE|MERGE}]}]
    }],
    questions: [{text, reason}]
  }
  ```

  ## 노드별 처리 순서

  1. 현재 node body만 위에서 아래로 읽어 주동작과 서로 다른 종료 결과를 찾는다.
  2. 같은 TARGET_NODE의 `CONTROL_FLOW_INDEX`를 누락 검사표로 사용해 각 decision/complement의
     서로 다른 관측 결과에 담당 Rule이 있는지 확인한다.
  3. `ancestor_context`의 바깥 가드는 현재 노드 도달 조건에만 사용하고 별도 Rule로 복제하지 않는다.
  4. 현재 노드가 직접 결정하는 조건·값·DML·반환만 Rule/Example로 만든다.
  5. 같은 조건과 같은 결과의 값만 집합으로 합치고 값→결과 대응과 fallback을 보존한다.
  6. Rule마다 대표 Example 1개를 두고 별도 경계/fallback 결과가 있을 때만 2개까지 둔다.
     세 번째 결과는 별도 Rule로 분리한다.
  7. 현재 node_key를 한 번 닫은 뒤 형제 의미를 되돌아와 추가하지 않는다.

  - 잘못: 형제 노드의 SELECT 조건을 현재 UPDATE Rule로 복사
  - 좋음: 현재 노드의 직접 조건과 UPDATE 효과만 기록
  - 잘못: 바깥 가드를 빼고 안쪽 조건만 Rule로 작성
  - 좋음: 실제 도달에 필요한 조상 조건과 현재 조건을 함께 보존

  ## Rule과 Example

  호출자·사용자·외부 데이터가 관측하는 무조건 변환·위임·DML·상태 변경·반환도 Rule이다.
  로그·임시 변수·버퍼 처리처럼 별도 관측 결과가 없는 내부 단계만 독립 Rule에서 제외한다.
  정상·업무 오류·대상 없음·변경 없이 통과·조기 종료가 서로 다른 결과면 각각 보존한다.

  Example은 given/when/then만 읽어도 기대 결과를 검증할 수 있어야 한다. “정상 처리”,
  “상황에 따라”, “결과 반환”처럼 복원 불가능한 문장은 쓰지 않는다.
  “조건에 따라 처리”, “적절한 값 설정”, “여러 검증 수행”처럼 조건·값·결과를 숨기는
  포괄 Rule도 쓰지 않는다.

  - 잘못: “조회 후 적절한 결과 반환”
  - 좋음: “대상이 없을 때 자격 조회를 수행하면 상태를 바꾸지 않고 대상 없음 결과를 반환”
  - 잘못: DB 오류라는 이유만으로 호출자가 받는 다른 오류 반환까지 삭제
  - 좋음: 정상과 다른 반환·상태·데이터 효과가 있으면 그 계약을 보존

  ## 값·경계·매핑

  부정, AND/OR, `>`/`>=`, `<`/`<=`, else/default 여집합, 원문 리터럴 표기를 바꾸지 않는다.
  명시 값과 fallback은 누락·중복 없이 한 번씩 포함한다. 계산값은 활성 연산과 입력 단위로
  검산할 수 있을 때만 쓴다.

  - 잘못: `{P→승인, F→거절, 기타→보류}`를 “P 또는 F면 처리”로 축약
  - 좋음: 값별 결과와 기타 fallback을 그대로 복원
  - 잘못: 원문 `007`을 `7`로 바꾸거나 초를 분으로 임의 해석
  - 좋음: 표기와 단위 근거를 그대로 유지

  ## affected_tables

  현재 노드에 주입된 reads/writes와의 교집합만 사용한다. table ID는 입력 문자열 그대로
  echo한다. 직접 R/W가 없으면 `[]`이며 조상·형제·호출 대상 테이블을 추가하지 않는다.

  - 잘못: 같은 프로시저의 다른 노드가 쓰는 테이블을 현재 Example에 추가
  - 좋음: 현재 노드 입력에 직접 연결된 테이블과 op만 기록

  ## questions

  결과 해석에 꼭 필요한 외부 정의가 모든 입력에 실제로 없고, 질문 없이 쓰면 추측이 될 때만
  질문한다. else/default와 현재 반환이 이미 답이면 질문하지 않는다. 현재 코드가 의도적인지,
  상수 내부값이 무엇인지, 호출자가 어디서 초기화하는지는 질문하지 않는다.

  - 잘못: 무조건 정상 반환 코드가 있는데 “오류여도 정상 반환이 의도인가?”
  - 좋음: 외부 상태 코드의 뜻이 입력 어디에도 없고 그 뜻에 따라 규칙이 달라질 때만 질문

  각 node_key에서 활성 주동작과 서로 다른 결과의 누락 0, 같은
  `(Rule + 원문 분기 + 관측 결과)` 중복 0을 확인하고 다음 node_key로 이동한다.
