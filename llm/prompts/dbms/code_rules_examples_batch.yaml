## code_rules_examples_batch (dbms 분할 3) — 배치 안 각 노드의 rules + examples + questions.
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실 (extends).
## ★ 입력 body = 그 문장의 **원문 통째**(자식 서브트리 포함 — 1차 증거). 단위 = 예산 내 최고 조상 문장.
## ★ 단위 문장들이 배치로 들어옴 → 노드마다 1 항목(node_key echo). 단위 아래 노드는 규칙 없음(단위가 흡수).
## ★ 구조 = 모든 지침 바로 밑에 인라인 예시(✅/❌). 별도 "예시 모음" 섹션 없음.
## ※ 도메인어(단계1)·죽은주석(단계7)·DECODE/IF·ELSIF(§4)의 일반 원칙은 공통이 진실 — 상충 금지.
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 3: 비즈니스 규칙 · 시나리오 · 질문
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드
  - **하는 일**: 노드마다 `rules`(규칙, 각 규칙 하위 `examples` 중첩) + `questions`(모호점).
  - **안 하는 일**: 노드 의미·역할(→분할1) / 컬럼 의미(→분할2)는 손대지 않는다.
  - **출력 스키마**:
    ```
    BatchRulesItem { node_key:"<start>-<end>",
      rules:[ { statement:"<조건>이면 <결과>",
                examples:[ { given, when, then, affected_tables:[{table, op:READ|INSERT|UPDATE|DELETE|MERGE}] } ] } ],
      questions:[ { text, reason } ] }
    ```
  - 아래 모든 예시는 **범용 설명용**(패턴만) — 산출물엔 그 노드 본문에 **실제 등장한 값만** 쓴다.
  - 목표: **rules+examples 만 보고 코드를 다시 만들면 원문과 똑같이 동작.**

  ## Example 의미적 유일성 계약 — 테스트케이스 개수는 제한하지 않고 무의미한 반복만 금지
  - 각 Example은 (1) 정확히 한 Rule의 조건·결과에 직접 대응하고,
    (2) 원문 분기·상수·연산으로 기대 결과를 계산할 수 있으며, (3) 앞선 Example에 없던 업무 결과·정책·경계를
    하나 이상 추가할 때만 허용한다. 셋 중 하나라도 아니면 출력하지 않는다.
  - 문장이 달라도 Rule 복원이나 테스트 설계에 새 정보를 주지 않으면 의미 중복이다. 값만 다르고 결과가 같거나
    같은 skip/성공/실패 결과를 기술 경로만 바꿔 설명하면 한 given 집합으로 합친다.
  - 로그, 재시도, 반복 조회, DB 오류 전달 같은 기술 흐름은 그 자체로 Example 자격이 없다. 업무 반환값·상태·
    데이터 결과를 독립적으로 바꾸는 원문 근거가 있을 때만 해당 Rule에 매핑한다.
  - 동일하거나 의미가 같은 `(given, when, then, affected_tables)`는 표현만 바꿔 다시 쓰지 않는다. 의미 중복은 0개여야 한다.
  - 원문의 서로 다른 업무 결과·정책·경계는 개수와 무관하게 모두 보존한다. 같은 결과의 값은 한 Example의 given에 집합으로 묶고, 값마다 결과가 다르면
    한 Example 안에 `값 A→결과 X, 값 B→결과 Y`처럼 완전한 매핑을 압축한다. 누락이나 반복 행으로 해결하지 않는다.
  - 한 노드의 JSON을 쓰다가 앞서 만든 Rule/Example 묶음으로 되돌아가거나 같은 행을 두 번째 쓰려는 순간
    즉시 그 노드의 배열을 닫고 다음 `node_key`로 이동한다.
  - ❌ 같은 제외 결과의 Example을 번호만 바꾸어 반복하거나 대표 분기 묶음 전체를 다시 출력
  - ✅ 성공→대상 추가 1개, 오류·기타 실패 코드 집합→제외 1개처럼 결과별 대표 사례만 유지
  - ❌ 문장은 서로 다르지만 모두 같은 Rule의 "대상 제외" 결과이고 경계값·정책 차이도 없는 행 여러 개
  - ✅ 같은 결과 값은 `{취소, 오류, 미지원 코드}→대상 제외` 한 행으로 합치고, 성공→추가처럼 결과가 바뀌는 행만 분리

  ### ★★★ 절대 우선: 사실 기반 Example 선별과 의미 중복 차단 절차
  이 절차는 뒤의 "빠짐없이 추출" 지침보다 먼저 적용한다. **빠짐없음은 각 노드 원문의 서로 다른 테스트 의미를
  빠뜨리지 않는다는 뜻이지, 입력값 조합·실행 경로·문장 변주를 전부 행으로 늘리라는 뜻이 아니다.**

  1. 각 노드에서 Example을 쓰기 전에 후보를 `근거 분기 → Rule → 관측 결과`로 내부 정리한다.
     그 노드 원문에서 특정할 수 없는 후보는 버린다.
  2. 후보마다 다음 세 질문에 모두 답한다.
     - 어느 활성 원문 분기·상수·연산이 이 given과 then을 직접 증명하는가?
     - 어느 Rule의 조건과 결과를 검증하는가?
     - 앞서 채택한 Example에 없던 분기 회귀, 업무 결과, 정책 또는 경계값을 무엇 하나 새로 검증하는가?
     셋 중 하나라도 답하지 못하면 **가치 없는 Example이므로 출력 금지**다.
  3. 새 후보마다 같은 노드의 앞선 모든 Example과 `Rule + 실제 원문 분기 + 관측 결과`를 비교한다.
     셋이 같으면 문장·변수값·기술 경로가 달라도 의미 중복이므로 즉시 버린다.
  4. 서로 다른 명시적 `IF/ELSIF/CASE/DECODE` 리터럴 분기를 각각 회귀 검증해야 하면 결과가 같아도 보존할 수 있다.
     동일한 catch-all `ELSE`에 들어가는 임의의 값 여러 개는 같은 분기이므로 대표 1개만 둔다.
  5. 같은 Rule·같은 결과의 값 집합은 한 given에 합친다. 값별 결과가 다르면 대응표를 한 Example에 완전하게
     적거나 실제 독립 테스트 분기일 때만 행을 나눈다.
  6. 중복을 삭제한 뒤 개수를 채우기 위해 표현·임의값·기술 경로만 바꾼 대체 Example을 만들지 않는다.
     테스트 가치가 끝났으면 해당 노드 배열을 닫는다. Example 수에는 목표도 절대 상한도 없다.
  7. 각 노드 종료 전 Example을 정방향과 역방향으로 읽는다. 같은 의미 행 또는 이미 출력한 2개 이상의 행 묶음이
     다시 시작되면 두 번째 묶음부터 전부 제거하고 다음 `node_key`로 이동한다.

  - ❌ 동일한 `ELSE → 대상 제외`에 임의값 A, B, C를 각각 넣어 3개 행 생성
  - ✅ 동일 fallback 분기는 `미지원 값 집합 → 대상 제외` 대표 1개
  - ❌ 성공/취소/대상없음 묶음을 출력한 뒤 표현만 바꾸어 같은 묶음을 재출력
  - ✅ 각 원문 분기와 관측 결과를 한 번만 검증하고 즉시 해당 노드 배열 종료
  - ❌ 로그 문구, 재조회 횟수, 호출 순서만 달라지고 반환값·상태·데이터 결과가 같은 행 추가
  - ✅ 실제 반환값, 저장 상태, 계산 결과 또는 명시적 경계가 달라지는 경우만 별도 테스트로 채택
  - ✅ 코드값 A와 B가 각각 별도 명시 분기라면 같은 표시명이어도 두 분기 회귀 테스트는 보존 가능
  - ❌ A와 B가 모두 하나의 catch-all `ELSE`를 통과한다면 두 행으로 나누지 않음

  ### 매핑이 많은 노드 — 응답 예산 때문에 뒤쪽 대응을 누락하지 마라
  동일한 행동에서 입력 코드만 바뀌고 기대 결과만 대응되는 변환표·상태표·등급표는 개별 행을 계속
  나열하지 말고 **파라미터화된 Example**으로 작성한다. 한 Example도 여러 테스트 입력쌍을 완전하게 담을 수 있다.

  **강제 판정:** 후보 Example들의 `when`이 같고 given의 코드 리터럴과 then의 대응값만 바뀐다면 이 노드는
  매핑형이다. 코드마다 한 행씩 쓰는 형식은 오답이며 금지한다. 반드시 같은 그룹의 전체 매핑을
  파라미터화된 한 행으로 합친 뒤 다음 그룹으로 이동한다.

  - 같은 그룹·같은 Rule·같은 `when`의 코드 매핑은 `given="입력→기대값 전체 집합"`,
    `then="각 입력에 대응하는 결과"`로 묶되 원문의 모든 명시적 쌍과 fallback을 빠짐없이 적는다.
  - 그룹별 정책이나 when이 다르면 그룹별 Example로 나눈다. 뒤쪽 그룹을 생략하거나 `등`으로 줄이지 않는다.
  - 파라미터화 전후 테스트 의미는 동일해야 한다. 명시 분기 A·B와 catch-all fallback을 뭉개지 않는다.
  - ❌ 코드 A→명칭1, B→명칭2를 한 행씩 계속 쓰다가 응답이 끝나 뒤쪽 그룹 전체 누락
  - ❌ `A→명칭1, B→명칭2 등`처럼 `등`으로 원문 매핑 생략
  - ✅ `given="코드 매핑 {A→명칭1, B→명칭2, C→명칭3, 기타→미상}"`,
    `when="각 코드의 명칭 조회"`, `then="각 입력에 명시된 기대 명칭 반환"`
  - 출력 전 원문의 모든 명시 리터럴과 각 catch-all fallback을 회계한다. 각 항목은 정확히 한 파라미터화
    Example에 있어야 하며 0회면 누락, 2회 이상이면 중복이다. 둘 다 고친 뒤 해당 노드 배열을 닫는다.
  - 중첩 매핑은 내부 그룹마다 존재하는 `ELSE/default`를 그 그룹의 파라미터화 Example에 `기타→fallback 결과`로
    포함한다. 바깥 unknown-group fallback과 입력 NULL/빈값 guard는 별도 분기이므로 각각 검증한다.
  - ❌ 각 그룹의 명시 코드만 적고 그룹 내부 기타값 fallback, 바깥 unknown-group, 빈 입력 guard를 생략
  - ✅ 그룹별 `{명시 코드 전부, 기타→fallback}` + 바깥 unknown-group + 빈 입력 guard를 원문대로 보존

  ### 활성 코드만 사실이다 — 주석의 희망 동작을 Example로 만들지 마라
  호출 성공 분기가 있어도 반환값을 출력 변수·상태·테이블에 실제 대입하는 활성 코드가 없으면 그 결과를
  생성하지 않는다. "운영에서는 설정됨", "향후 처리", "관례상" 같은 주석은 질문 근거일 수 있지만 실행 결과가 아니다.

  - ❌ 조회 성공 후 결과 대입 코드가 없는데 주석만 보고 `then="조회된 명칭 반환"`
  - ✅ 활성 코드가 실제로 수행하는 fallback 매핑 결과만 Example로 쓰고, 조회 성공값 사용 여부가 필요하면 Question

  ### 교차-Rule 중복 금지
  하나의 테스트 후보는 가장 구체적으로 그 분기를 설명하는 Rule 한 개에만 귀속한다. 일반 Rule과 세부 Rule이
  겹쳐도 같은 given/when/then을 양쪽에 복사하지 않는다.

  - ❌ 일반 "입력이 유효하면 허용" Rule과 세부 "상태 A→B 허용" Rule 양쪽에 A→B 테스트를 동일하게 추가
  - ✅ A→B는 세부 Rule에만 두고 일반 Rule에는 세부 Rule과 겹치지 않는 독립 경계 테스트만 둔다.
  - ❌ "이력 없음이면 등록"과 "가격이 다르면 등록" Rule에 같은 given/when/then을 복사
  - ✅ 실제 원문 분기를 구분한 뒤 이력 없음과 가격 차이를 각각 정확한 Rule의 서로 다른 given으로 검증
  - 최종 중복 검사는 Rule별이 아니라 **각 노드의 모든 Rule을 합친 전체 Example 집합**에서 수행한다.

  ## 최상위 판정 게이트 — 아래 세부 설명보다 우선

  각 노드는 다음 증거 순서로만 판단한다.

  1. 해당 노드의 활성 실행 body와 분기
  2. 해당 노드 `참조심볼(JSON)`의 `immutable_constant.declared_value`
  3. 해당 노드의 직접 reads/writes와 정확한 table id
  4. callee summary — 반환 의미의 보조 증거이며 callee Rule·테이블을 현재 노드로 복사하지 않음
  5. 주석 — 활성 코드가 확인할 때만 보조 증거

  노드마다 `업무 후보 추출 → 기술 가지 제거 → 실제 값↔결과 매핑 → 테스트 가능한 Example 작성 →
  중복·코드 토큰·환각 점검 → 다음 노드` 순서로 한 번만 진행한다.

  기술 제거 대상은 버퍼·NULL 포인터 방어, DB/하위호출 실패 전달, 포맷팅, 로그만 남기는 가지,
  단순 재시도다. 로그 기록만으로 Rule을 만들지 않는다. 활성 코드가 데이터 복구·롤백·상태 원복을
  업무 무결성 정책으로 수행하면 그 **데이터 결과**만 Rule 후보이며 부수 로그는 핵심 결과가 아니다.

  각 Example은 독립 테스트 케이스다.

  - `given`: 사전상태와 실제 입력값
  - `when`: 함수명·SQL·결과문이 아닌 한 가지 업무 행동
  - `then`: 반환값·상태변경·DB 반영·외부 요청 중 관측 가능한 기대 결과

  작성 후 두 가지를 강제로 검산한다.

  - `affected_tables`는 해당 노드에 주입된 직접 reads/writes와 글자 및 연산이 정확히 같은
    항목만 남긴다. callee가 읽거나 쓰는 테이블은 제거한다.
  - 문자열 길이·마스킹·금액·비율처럼 계산한 기대값은 활성 코드의 연산을 다시 적용해
    입력 길이·자리수·합계·경계 불변식을 만족하는지 역산한다. 검산하지 못한 구체값은 쓰지 않는다.

  `affected_tables` 최종 허용 집합은 추론하지 않고 기계적으로 제한한다.

  - 직접 reads가 비었으면 `READ` 0개, 직접 writes가 비었으면 write op 0개다.
  - `reads=[A]`, `writes=[B]`이면 `A/READ`와 입력에서 확인된 `B/<write op>`만 가능하다.
    `A/UPDATE`, `B/READ`, callee 테이블 `C/*`는 삭제한다.
  - Rule 문장·callee summary·DDL 컬럼 목록에 보인 테이블은 허용 근거가 아니다.

  `affected_tables`는 자유 추론이 아니라 주입 목록과의 교집합이다. 해당 노드의
  `reads=[]`, `writes=[]`이면 모든 Example은 반드시 `affected_tables:[]`다. READ는 reads의
  ID만, INSERT/UPDATE/DELETE/MERGE는 writes의 ID만 허용한다. callee의 테이블은 넣지 않는다.
  ❌ 현재 노드 `reads=[]`, callee가 `db:orders` 조회 → orders READ 추가 / ✅ `[]`.
  ❌ 현재 부모 `writes=[]`, callee가 `db:cart` MERGE → 부모에 cart MERGE 추가 / ✅ `affected_tables:[]`.

  JSON을 닫기 직전에 각 노드의 모든 Example에서 `affected_tables`를 항목별로 다시 검사한다.
  `(table, op)`가 그 노드에 주입된 직접 목록에서 정확히 증명되지 않으면 해당 항목을 삭제한다.
  Rule·Example의 업무 대상 이름이 테이블처럼 보여도 직접 목록 밖이면 추가하지 않는다. 직접 목록이
  `reads=[A]`, `writes=[A]`뿐이면 `B/*`는 항상 0개다. 애매하면 추론하지 말고 생략하며 `[]`를 허용한다.
  Rule 문장이나 업무상 연관성에서 테이블을 추측하지 말고 **주입된 ID 문자열을 그대로 복사한 항목만** 허용한다.
  예를 들어 직접 `reads=[db:A, db:B]`뿐인데 업무상 관련 있어 보인다는 이유로 `db:C/READ`를 쓰면 오답이며 제거한다.

  이 게이트와 뒤의 예시가 충돌해 보이면 이 게이트가 우선이다.

  ### 범용 정답/오답 대조

  내부 버퍼 검증, DB 호출, 실패 로그, 받은 오류값 반환뿐인 기술 노드:

  - ❌ Rule "출력 버퍼가 NULL이면 실패 반환"
  - ❌ Example given="DB 오류", when="호출 실패", then="오류 결과 반환"
  - ✅ `rules:[]`

  활성 코드가 `등급='G'`이고 누적액 `100000` 이상이면 주문을 거절하고 `-4`를 반환하는 노드:

  - ❌ given="조건 충족", when="검증", then="적절히 처리"
  - ❌ `grade_cd`, `checkLimit()`, `RET_DENIED` 같은 코드 토큰을 사람용 필드에 복사
  - ✅ given="회원 등급='G'이고 누적 주문액이 100000 이상",
    when="추가 주문 자격을 검증", then="주문을 생성하지 않고 -4를 반환"

  `정상 처리`, `오류 결과 반환`, `상황에 따라 처리`처럼 테스트 oracle을 복원할 수 없는 then은
  실패다. 구체화할 원문 근거가 없으면 Rule을 만들지 말고 정확성에 직접 필요할 때만 question으로 남긴다.
  노드 출력을 닫기 직전 `정상 처리`, `정상 처리를 반환`, `결과를 반환`, `처리 결과`를 검색해
  실제 반환값·변경 상태·호출 보존 관계로 교체하고, 근거가 없으면 해당 Example을 제거한다.

  라우터가 선택한 대상 호출의 반환값을 그대로 전달한다면 ❌ `대상 처리 결과를 반환`이 아니라
  ✅ `선택된 대상 호출이 1회 발생하고 그 반환코드를 변경 없이 반환`으로 쓴다.

  문자열 변환 코드가 길이 8 입력에서 뒤 3글자를 보존한다면:

  - ❌ given="입력='ABCDEFGH', 보존길이=3", then="'*****DEFGH' 반환" — 길이와 보존 수 불일치
  - ✅ given="입력='ABCDEFGH', 보존길이=3", then="'*****FGH' 반환" — 길이 8, 뒤 3글자 보존
  - 활성 조건이 `위치 < 입력길이-보존길이`이고 보존길이가 입력길이보다 크면 우변이
    음수라 마스킹 조건은 한 번도 참이 아니다. ❌ "전부 마스킹"이 아니라
    ✅ "입력을 변경 없이 반환"이다. 경계값은 조건식에 숫자를 대입해 역산한다.

  # ════════════════════════════════════════════════════════════════
  # 0. 북극성 — 두 축 + 흔한 오해
  # ════════════════════════════════════════════════════════════════
  ## 0.1 두 축 (충돌 아님, 경계 = "가치")
  - (A) 완전성: 동작에 영향 주는 도메인 결정·코드값 **하나도 안 빠뜨림**(값은 본문 그대로).
  - (B) 무폭주: 가치 없는 노이즈·중복·입력 변주는 **0**.
  - 경계 = "이 조건/값이 사라지면 코드 동작이 달라지나" → 달라지면 (A), 안 달라지면 (B).
  - 예: ✅가치(A) "한도 금액 이상이면 거절" · ❌노이즈(B) "처리 후 COMMIT" · "처리 건수를 변수에 담음".

  ## 0.2 흔한 오해 4가지 (누락·노이즈·붕괴의 원인) — 각 오해에 예시
  - 오해① "간결=코드값 집합 줄이기" → X. 예: ❌ "상태 ∈ [s1..s5]" 를 "상태=s1"로 축소 / ✅ 집합 다 나열.
  - 오해② "통합=다른 결정도 한 룰로" → X. 예: ❌ "상태 승인규칙" 과 "수수료 계산규칙"을 한 룰로 / ✅ 별 룰.
  - 오해③ "래퍼/IO 노드니 전부 빈 배열" → X. 예: 조회(기술)+코드분기(도메인) 섞이면 → ✅ 도메인 분기만 Rule.
  - 오해④ "한 노드=규칙 하나" → X. 예: 반복문이 값 조정·별도 계산 2작업 → ✅ 규칙 2개. ❌ "두 작업을 처리" 1개.

  # ════════════════════════════════════════════════════════════════
  # 1. 규칙을 몇 개·무엇을 (개수 = 서로 다른 "작업/결정" 수)
  # ════════════════════════════════════════════════════════════════
  ## 1.1 판단 단위 = 함수가 아니라 "작업/결정"
  한 노드가 기술 작업과 도메인 작업을 섞어 하면 → **도메인 작업만 Rule**.
  - 예: 노드가 ① 외부 조회(기술) ② 조회 코드 ∈ [c1,c2] 면 정상, 그 외 거절(도메인) ③ DB오류면 에러(기술)
    → ✅ ②만 Rule "조회 결과 코드 ∈ [c1,c2] 면 정상, 그 외 거절". ①③은 버림.

  ## 1.2 ★★ 한 문장 원문 안의 별개 작업마다 규칙 (과소추출 방지 1위)
  body 는 이 문장의 **원문 통째**(자식 구문 포함). 이 문장이 서브트리의 **유일한 규칙 소유자**(내부 구문은
  따로 규칙 안 뽑힘) → 원문 안 **서로 다른 도메인 작업/결정마다 규칙 하나**. 내부에 독립 작업이 6개면
  **규칙 6개**(3·8개도 정상). 내부 구문(IF·MERGE·SELECT·INSERT)의 경계가 작업의 경계다.
  - 예(입력 → 규칙 2개, FETCH=기술 제외):
    ```
    LOOP  -- 처리 대상 순회
      FETCH 커서 INTO 대상행;
      IF 상태='A' THEN 수량을 입력값만큼 차감
      ELSIF 상태='B' THEN 수량 복원 END IF;
      MERGE 대상 ... 분류 'X','Y' 는 비율 1%, 그 외 3% 로 결과값 계산 반영;
    END LOOP
    ```
    ✅ R1 "상태에 따라 수량을 조정한다" · R2 "분류별 계산 비율을 달리한다".
    ❌ 붕괴: 규칙 하나 "대상을 순회하며 두 작업을 처리한다" = 두 결정 뭉갬.
  - ★ body 에 `....` 로 **접힌 자식 구간**이 보이면 = 그 내부는 별도 단위가 규칙을 담당한다.
    이때는 **자기 줄의 조건(게이트)·선별·반복 대상만** 규칙으로 — 접힌 내부를 추측해 규칙 만들지 X.
    ✅ 예: body `IF 처리 대상이고 기준일 전이면 THEN .... END IF`
       → 규칙 1개 "처리 대상이고 기준일 전일 때만 후속 집계를 수행한다" (내부 내용 규칙 X).
    ✅ 예: body `LOOP -- 검증 불일치 건 순회 .... END LOOP` → "검증 불일치 건만 재처리 대상으로 순회한다".

  ## 1.3 ★★ 절대 뭉치지 마라 ("A·B·C 순으로 처리" 나열 금지)
  서로 다른 작업을 한 statement 에 나열하면 손실. 나열하려던 것 **각각을 별 규칙**으로.
  - 예(게이트 IF 안 서로 다른 MERGE 4블록 원문):
    ```
    IF 처리 대상이고 기준일 전이면 THEN
      MERGE ... 첫 번째 값을 계산해 대상에 반영 ...;
      MERGE ... 분류별 비율을 계산해 대상에 반영 ...;
      MERGE ... 그룹별 합계를 대상에 반영 ...;
      MERGE ... 전체 총계를 대상에 반영 ...;
    END IF
    ```
    ✅ 규칙 4개(각 MERGE 별 규칙): "첫 값 계산"·"분류별 비율"·"그룹별 합계"·"전체 총계".
    ❌ 붕괴: 규칙 하나 "여러 값을 **순으로** 반영한다".

  ## 1.4 ★ 분기 난사 금지 — 단 "같은 정책으로 가는 값 분기"만 통합 (§1.3 과 반대 아님)
  **하나의 판정**(if/elsif/CASE 한 트리)이 값에 따라 갈리되 **결과·정책의 종류가 같은** 다발만 1 Rule(값은 example).
  - 예(통합 O — 같은 정책): 하나의 IF 트리 "유형 'A' 且 값≥50000 且 구분 'I' → 허용; 값<50000 → 거절;
    구분 'O' → 거절" = **"허용 가부" 하나의 정책** →
    ✅ 규칙 1개 "유형·값·구분에 따라 허용 가부 판정" (분기는 example given/then).
    ❌ 난사: "CARD면…" "금액<50000이면…" "해외면…" 을 각각 Rule 3개로.
  - ★★ 예(분리 O — 상위 분기마다 정책이 다르면 별 Rule, 과통합 금지): 한 IF/ELSIF/ELSE 트리라도
    "종류='a' → **이 조건이면 허용** / 종류='b' → **저 조건이면 허용** / 그 외 → **거절 + 사유 문구 부착**"
    처럼 **분기마다 정책 내용·결과 형태가 다르면** 분기별 별 Rule 이 정답 →
    ✅ R1 "종류 'a' 는 …이면 허용" / R2 "종류 'b' 는 …이면 허용" / R3 "그 외 종류는 거절하고 사유 부착".
    ❌ 과통합: "종류에 따라 허용 여부 판정" 1 Rule → 각 분기의 조건↔결과 짝이 뒤섞이거나 소실.
  - 구분 요약: **서로 다른 작업 = 분리(§1.2·§1.3) / 같은 정책의 값 분기 = 통합 / 분기마다 정책·결과가 다른
    상위 축 = 분리(§2.6)**. 판별 = "합치면 어느 분기의 조건↔결과 짝이 흐려지나?" → 흐려지면 분리.

  ## 1.5 ★ 빈 배열이 정답일 수 있다 (막무가내 채우기 = 환각)
  본문에서 가치를 못 찾으면 `rules:[]`·`questions:[]` 가 정상.
  - 예: 노드가 "입력을 담아 외부 조회 1건, DB오류면 에러·없으면 통과, 결과를 전역 저장"만
    → ✅ `rules:[]` (도메인 분기·값·정책 없음). ❌ "조회 실패면 에러 반환"을 Rule 로.

  ## 1.6 ★★ 잔심부름(기술) = 규칙 아님 (과추출 방지)
  본문의 구문 중 **종류만으로 규칙 아님**:
  - COMMIT·ROLLBACK·FETCH·커서 open/close·EXIT·CONTINUE·표준출력·단순 대입
    → 트랜잭션·반복·출력 = 기술 뼈대.
  - **DML/조회여도 용도가 기술이면 규칙 아님**: 로그·디버그·이력 기록 INSERT/UPDATE · 제어용 COUNT
    (존재·건수를 IF 게이트로만 씀) · 형식 변환(TO_CHAR·SYSDATE) · 개별 블록의 단순 "오류면 출력" 방어.
  - **반대로 규칙인 것**: 도메인 계산 대입(`수수료:=금액×0.02`) · 정책 임계 판단 · 업무 데이터 write · 의미 있는 silent pass.
  - **★ 헷갈리기 쉬운 규칙 O 두 가지 (빼먹지 마라)**:
    - **업무 절차의 후속 위임 호출(CALL)** = 규칙 O — "무엇을 마친 뒤 무엇을 이어서 하는가"는 업무 절차다.
      ✅ 예: body 가 후속 프로시저 호출이면 → "일 집계 완료 후 공급량 재계산을 이어서 수행한다".
      (❌ 단순 출력·유틸 호출은 X — 업무 데이터가 이어지는 호출만.)
    - **루틴 전역의 예외 복구 정책(EXCEPTION)** = 규칙 O — "실패 시 전체를 되돌리고 감사 기록을 남긴다"는
      데이터 무결성 정책이다. ✅ 예: "처리 중 오류가 발생하면 전체를 롤백하고 오류 이력을 기록한다".
      (❌ 개별 블록의 "오류 메시지 출력" 만인 EXCEPTION 은 X.)
  - 예(원문):
    ```
    LOOP
      SELECT COUNT(*) INTO 지점수 FROM ...;   FETCH 커서 INTO ...;   EXIT WHEN 없음;
      MERGE ... 지점별 판매량을 합산해 본사 합계에 반영 ...;
      COMMIT;
    END LOOP
    ```
    ✅ 규칙 1개(도메인은 MERGE 뿐): "지점별 판매량을 합산해 본사 합계에 반영한다".
    ❌ 과추출: COUNT·FETCH·EXIT·COMMIT 을 각각 규칙으로.
  - 예(용도 구분): ❌ "오류 메시지를 디버그 테이블에 기록"(로그) / ✅ "확정된 주문을 주문 테이블에 기록"(도메인 write).
  - 예(감사·이력 로그도 기술): 처리 전후로 "변경 전 값 기록 → 본처리 → 변경 후 값 기록" 구조라면
    → ✅ 규칙은 **본처리만** / ❌ "변경 전후 값을 이력 테이블에 기록한다"를 별도 Rule 로 (감사 이력 = 기술 뼈대).

  ## 1.7 ★ 코드값 보존 + 도메인 언어 (일반 원칙은 공통 단계1)
  - 도메인 코드 VALUE 리터럴은 본문 그대로 보존(상태·구분·결과·임계·기본값). 없는 값 지어내기 X.
  - 변수·테이블·컬럼·함수·커서명은 statement·given/when/then 에 베끼지 말고 도메인어로.
  - 예: ❌ "V_FLAG='Y' 이면 OUT_CODE='3'"·"XXX_TB 에 MERGE"·"checkStatus() 호출"
        ✅ "비활성 여부='Y' 이면 처리구분='3'"·"일 집계를 반영"·"상태를 조회" (값 '3'·'Y' 는 보존).
  - ★ 괄호 병기도 베끼기: ❌ "적용여부(gc_yn)" → ✅ "적용여부".

  ## 1.8 출력 폭주 = 사고
  어떤 string 도 공백·줄바꿈만으로 끝낼 수 없음 — `:` 뒤 즉시 값, `}`/`]` 즉시 닫기.
  - 예: ❌ `"then":"          "`(공백 폭주) / ✅ `"then":"거절"`.

