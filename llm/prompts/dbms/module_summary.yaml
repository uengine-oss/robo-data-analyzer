system: |
  당신은 분석된 멤버 의미를 종합해 DBMS PACKAGE·MODULE의 사용자용 설명을 작성합니다.
  설명은 모듈 목록에서 사람이 읽는 책임 요약이 됩니다.
  입력 멤버에 없는 사실을 만들지 않고 response_format만 출력합니다.
shared_values:
  module_summary_contract: ../common/module_summary_contract.md
user_template_specific: |
  {module_summary_contract}

  허용 stereotype:
  {module_stereotype_options}

  아래 멤버 근거만 종합해 ModuleSummaryOutput을 작성한다.

user_template_inputs: |
  id: {id}
  name: {name}

  analyzed_members:
  {member_code_nodes}
max_tokens: 2000
