## code_gate_rules_batch (dbms 분할 3-게이트) — 예산 초과로 쪼개진 컨테이너의 "자기 줄" 규칙.
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실 (extends — KV prefix 동일).
## ★ 입력 body = 컨테이너의 **골격**: 자기 줄 원문 + 자식 구간은 `....` 로 접힘.
##   자식 내부의 결정은 각 자식 단위가 별도로 규칙화한다 — 이 콜의 책임이 아니다.
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 게이트 규칙: 컨테이너 "자기 줄"의 조건만
  # ════════════════════════════════════════════════════════════════

  ## 책임 카드
  - 입력 각 노드 = 큰 컨테이너 문장(IF/LOOP 등)의 **골격** — 자기 줄 원문 + 자식은 `....` 접힘.
  - **이 콜이 하는 일**: 자기 줄에 있는 **게이트(진입 조건)·선별(무엇을 골라 도는가)·반복 대상**을 규칙으로.
  - **안 하는 일**: `....` 내부의 내용 규칙(각 자식 단위 담당 — 여기서 만들면 중복) / 요약·컬럼(다른 분할).
  - 출력 스키마 (입력 `### 노드 <key>` 마다 1 항목):
    ```
    BatchRulesItem { node_key:"<start>-<end>",
      rules:[ { statement:"<조건>이면 <결과>",
                examples:[ { given, when, then, affected_tables:[] } ] } ],
      questions:[] }
    ```
  - 아래 예시는 범용 설명용 — 산출물엔 그 노드 자기 줄에 **실제 등장한 조건·값만** 쓴다.

  ## 1. ★★ 기본값 = 규칙 1개 (빈 배열이 아니다)
  이 콜에 온 컨테이너는 **자기 줄에 진입 조건·선별 로직이 있어서** 온 것이다. 자기 줄의 도메인 조건이
  보이면 **"<조건>일 때만 <접힌 내부 처리>를 수행한다" 규칙 1개가 기본**이다.
  - ✅ 예: body `IF 대상 건수 >= 1 AND 기준일 < 오늘 THEN .... END IF`
    → 규칙 "대상이 존재하고 기준일이 오늘 이전일 때만 후속 처리를 수행한다"
      · example given "대상 ≥ 1 且 기준일 < 오늘" then "후속 처리" / given "그 외" then "수행하지 않음".
  - ✅ 예: body `LOOP  -- 커서: 검증 '불일치' 건 순회  FETCH ...; EXIT WHEN ...; .... END LOOP`
    → 규칙 "검증 결과가 '불일치'인 건만 재처리 대상으로 순회한다".
  - ✅ 예: body `IF 처리유형 = 1 THEN .... ELSE .... END IF` (자기 줄 분기 조건)
    → 규칙 "처리유형이 1이면 시간 단위 재계산 경로를, 그 외면 일 단위 경로만 수행한다"
      (분기 결과의 **방향**만 — 내부 내용은 X).
  - **빈 배열이 정답인 유일한 경우** = 자기 줄 조건이 **순수 기술**일 때(무한 재시도 루프·트랜잭션 경계뿐).
    도메인 값·업무 조건이 하나라도 있으면 규칙 O.

  ## 2. 금지 (중복·월권 방지)
  - ❌ `....` 내부를 추측·복원해 내용 규칙 만들기 (각 자식 단위가 이미 담당 — 만들면 중복).
  - ❌ 자기 줄 커밋·롤백·FETCH·EXIT 자체를 규칙으로 (그건 반복 뼈대 — 선별 **조건**만 가치).
  - ❌ 없는 조건 지어내기 — 자기 줄에 실제 있는 조건·값만(코드값 리터럴 보존, 변수·테이블명은 도메인어로 = 공통 단계1).

  ## 3. questions — 이 콜에선 기본 빈 배열
  게이트 조건의 코드값 의미가 어디에도 없을 때만 1개(공통 4조건). 그 외 `questions:[]`.

  # ── 제출 전 자가 점검 ──
  - 자기 줄의 도메인 진입·선별 조건을 규칙으로 담았나? (기본 = 규칙 1개, 빈 배열 아님)
  - `....` 내부 내용을 규칙으로 만들지 않았나? 조건·값이 자기 줄에 실제로 있나?

  # ════════════════════════════════════════════════════════════════
  # [응답 형식] BatchRulesOutput.nodes — 입력 각 노드마다 1개, node_key echo.
  # 각 string 필드는 콜론 뒤 즉시 값 — 공백·줄바꿈 반복 폭주 절대 금지.
  # ════════════════════════════════════════════════════════════════

# 출력 상한 = 실측 정상 최대의 여유배수 — 반복 루프 피해를 초 단위로 고정 (정상 호출 영향 0).
max_tokens: 20000
