## DBMS split 3 — exact atom meanings for batched deterministic Rule/Example projection.
extends: ../framework/_common
inherit_inputs: false
structured_output_method: function_calling
shared_values:
  rule_meaning_contract: ../common/rule_meaning_contract.md
user_template_specific: |
  # [TASK — each TARGET_NODE's Rule atom meanings]

  {rule_meaning_contract}

  ## [OUTPUT CONTRACT]

  최상위 `nodes`는 response_format이 지정한 exact node key map이다. 각 node는 `effects`,
  `rows` exact required key를 빠짐없이 한 번 채운다. node 사이의 의미를 합치거나 부모·형제의
  효과를 현재 node에 복사하지 않는다. 풍부한 직접 효과 의미를 먼저 판단한 뒤 행 전체의 업무 Rule
  여부를 판단한다. 입력의 `conditions`는 이해에만 쓰며 응답에서 번역하거나 복창하지 않는다.

user_template_dynamic_inputs: |
  # [INPUT — BATCH RULE meaning packets]

  response_locale: {response_locale}
  meaning 값만 이 언어로 작성한다. 원문 리터럴과 물리 식별자는 번역하지 않는다.

  rule_packets_json:
  {rule_packets}
