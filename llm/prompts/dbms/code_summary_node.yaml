## DBMS single effective-AST node — complete evidence-closure semantic frame.
extends: ../framework/_common
inherit_inputs: false
shared_values:
  semantic_frame_contract: ../common/semantic_frame_contract.md
  function_summary_contract: ../common/function_summary_contract.md
user_template_specific: |
  # [TASK — effective AST TARGET의 세부 의미와 전체 요약]

  parser/linker가 미리 지정한 각 slot에 현재 DBMS CodeNode가 직접 소유한 입증된 의미만 채운다.
  같은 응답의 slot 의미와 SOURCE 전체를 종합해 현재
  CodeNode의 실제 흐름을 하나의 자연스러운 요약으로 작성한다. Rule·Example·TABLE/COLUMN
  설명·question은 만들지 않는다.

  {semantic_frame_contract}

  {function_summary_contract}

  ## [OUTPUT CONTRACT — exact node summary]

  최상위에는 response_format이 required로 지정한 `slots`, `summary`, `stereotype`만 출력한다.
  `slots`는 현재 TARGET에 배정된 전체 exact key map이고, `summary`와 `stereotype`도 같은 응답에서
  각각 정확히 한 번 출력한다. `summary`는 slot 문장을 단순 결합하거나 원문을 행별 번역하지 않는다.
  입력·조건별 처리·직접 CALL/RW·반환과 상태 변화를 실행 순서대로 한 흐름으로 설명하되,
  현재 CodeNode 밖의 부모·형제·callee 내부 책임은 복사하지 않는다.

  ## [DECISION — DBMS stereotype]

  아래 ontology 값 중 effective AST target의 최종 관측 책임에 맞는 하나를 선택한다:
  {stereotype_options}

  둘 이상이면 다음 우선순위를 적용한다:
  {stereotype_priority}

  - 부수 SELECT·DML·검증 하나가 아니라 현재 node 범위의 최종 책임을 본다.
  - 상태 변경 없는 조회 결과가 산출물이면 `DataQuery`, DML 상태 변경이면 `DataMutator`다.
  - 코드·마스터·설정 조회 자체가 목적이면 `MetadataLookup`, 허용/정합 판정이면 `Validator`다.
  - 다수 행 일괄 처리가 골격이면 `BatchProcessor`, 커서 순회·행별 위임이 골격이면 `CursorLooper`다.

  ## [SELF CHECK]

  - required slot을 전부 정확히 한 번 썼는가
  - 각 meaning은 assigned evidence refs와 exact SOURCE line만 설명하는가
  - summary는 현재 TARGET 전체의 자연스러운 한 흐름인가
  - stereotype을 ontology 값 하나로 정확히 한 번 출력했는가

user_template_evidence: |
  # [INPUT — SUMMARY meaning packet]

  response_locale: {response_locale}
  자연어 의미 값만 이 언어로 작성한다. 원문 리터럴과 물리 식별자는 번역하지 않는다.

  structural_profile_json:
  {structural_profile}

  applicable_slots_json:
  {applicable_slots}

  linked_callee_outcomes_json:
  {callee_contexts}

  linked_external_source_json:
  {external_evidence}

  ## [SOURCE]
  각 줄은 `절대 파일 줄번호 | 원문`이다. 줄번호는 근거를 맞추는 좌표일 뿐 실행 코드가 아니다.
  줄 번호와 원문을 의미 출력에 복사하지 않는다.
  ```text
  {code_body}
  ```
