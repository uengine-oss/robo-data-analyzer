      (2026-10-29).
    model_revision_note: >-
      OpenAI 페이지가 gpt-4.1-2025-04-14 스냅샷을 **deprecated** 로 표시한다.
      그래서 호출에는 날짜를 박지 않은 `gpt-4.1` 을 쓴다(LLM_MODEL=gpt-4.1).
      이 칸은 그 별칭이 가리키는 스냅샷을 **기록**해 둔 것이다.
    runtime_config_sha256_note: >-
      ⚠ 이 값의 정본 규약이 저장소에 **문서로 없다**. 기존 두 파일의 쪽지에
      "canonical deployment_identity snapshot hash" 라고만 적혀 있고 만드는
      절차가 없어, 그 값들을 재현해 보려 했지만 맞추지 못했다(2026-10-29).
      지어내지 않기 위해 **규약을 명시해 둔다** — 이 값은

          sha256("openai-api|v1|gpt-4.1|gpt-4.1-2025-04-14|1047576|32768")

      의 16진 요약이다. provider_managed 런타임에는 우리가 쥔 배포 설정이 없으므로
      "무엇을 호출하는가" 를 그대로 정본으로 삼았다. 다음 사람이 규약을 통일하려면
      이 줄을 근거로 바꾸면 된다.
