# LLM 가격 — 단일 진실 (1M tokens 당 USD).
#
# 가격 변동 시 이 파일 한 곳만 갱신 + `last_updated` 날짜 변경 후 커밋.
# 새 모델 추가 = `models:` 아래 1 블록 추가.
#
# 갱신 보조: `python scripts/refresh_pricing.py`
#   → 현재 표 출력 + 공식 페이지 URL 안내 + 갱신 절차 가이드.
#
# 매칭 로직 (`llm/usage/pricing.py:lookup_price`):
#   1. 정확 매칭 (`models` 키 그대로)
#   2. 날짜 suffix strip (`-YYYYMMDD` 또는 `-YYYY-MM-DD`)
#   3. provider prefix 제거 (`anthropic/` / `openai/` / `qwen/`)

last_updated: "2026-05-27"

sources:
  - "https://www.anthropic.com/pricing"
  - "https://openai.com/api/pricing/"
  - "https://openrouter.ai/models"

models:
  # ── Anthropic Claude ───────────────────────────────────────
  claude-3-5-sonnet-20241022:
    input_per_1m: 3.0
    output_per_1m: 15.0
    cached_input_per_1m: 0.30
  claude-sonnet-4:
    input_per_1m: 3.0
    output_per_1m: 15.0
    cached_input_per_1m: 0.30
  claude-opus-4:
    input_per_1m: 15.0
    output_per_1m: 75.0
    cached_input_per_1m: 1.50
  claude-haiku-4-5:
    input_per_1m: 0.80
    output_per_1m: 4.0
    cached_input_per_1m: 0.08

  # ── OpenAI ─────────────────────────────────────────────────
  gpt-4o:
    input_per_1m: 2.50
    output_per_1m: 10.0
  gpt-4o-mini:
    input_per_1m: 0.15
    output_per_1m: 0.60
  gpt-5-nano:
    input_per_1m: 0.05
    output_per_1m: 0.40
  gpt-5-mini:
    input_per_1m: 0.25
    output_per_1m: 2.00
  gpt-5.4-nano:
    input_per_1m: 0.20
    output_per_1m: 1.00
  gpt-5.4-mini:
    input_per_1m: 0.75
    output_per_1m: 4.50

  # ── Qwen (OpenRouter 또는 자체 호스팅) ─────────────────────
  qwen-3-8b:
    input_per_1m: 0.06
    output_per_1m: 0.20
  qwen-3-32b:
    input_per_1m: 0.30
    output_per_1m: 0.80
  qwen-3-72b:
    input_per_1m: 0.60
    output_per_1m: 1.20
  qwen/qwen3.6-35b-a3b:
    input_per_1m: 0.15
    output_per_1m: 1.0
  qwen3.6-35b-a3b:
    input_per_1m: 0.15
    output_per_1m: 1.0

  # ── 로컬 / 자체 호스팅 SGLang / vLLM (비용 0) ──────────────
  local:
    input_per_1m: 0.0
    output_per_1m: 0.0
  frentis-ai-model:
    input_per_1m: 0.0
    output_per_1m: 0.0

  # ── Robo Architect Lite: Claude Code 다리 (llm/configs/claude_code_bridge.yaml) ──
  # 다리가 사용자 PC 의 `claude -p` 로 답하고 응답 model 을 "claude-code" 로 돌려준다. 토큰 단가로
  # 청구되지 않으므로 0 — 없으면 첫 LLM 콜에서 UnknownModelPriceError 로 run 이 죽는다.
  claude-code:
    input_per_1m: 0.0
    output_per_1m: 0.0
