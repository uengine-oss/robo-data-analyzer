# 온톨로지 — 소스 확장자·언어별 구문·antlr node type 분류 + stereotype 풀.
#
# source_extensions: parser 지원 확장자와 lexing-only 확장자의 분리된 단일 진실.
# roles     : antlr node type → 역할 (parser 출력의 언어별 구조 분류).
#             pipeline/languages.py 의 role_of 가 읽음 (분류 전용 — 라벨엔 안 씀).
# paradigm  : 언어 → oop / procedural.
# framework / dbms : LLM stereotype 풀 — 풀에 없는 값은 빈 문자열로 강제(환각 차단).
#
# ★Neo4j 라벨 = 노드의 antlr type 그대로 (reader 가 node["type"] 직결). roles 는 "어느
#   dataclass / 어느 엣지 / internal(노드X)"를 정하는 분류 전용 — 라벨 결정엔 안 쓴다.
# ※ 실제 antlr-parser 출력 기준. Java 는 CONSTRUCTOR/ENUM/RECORD 안 박음,
#   함수 내 지역변수 안 박음, PARAMETER 안 박음(시그니처 텍스트만).

# parser는 실제 AST reader가 지원하는 확장자만 선언한다. lexing_only는 parser 지원을
# 주장하지 않지만, 이미 존재하는 CodeNode의 주석/문자열을 링커가 안전하게 가를 때 쓴다.
# 새 확장자는 코드 분기 대신 이 표와 source_lexicon을 함께 추가한다.
source_extensions:
  parser:
    framework:
      java: [java]
      c: [c, h]
      python: [py]
    dbms:
      sql: [sql, pks, pkb, pls, ddl]
  lexing_only:
    c: [pc]
    cobol: [cbl, cob, cpy]

# ───────────────────────────────────────────────
# 1. roles — node type → 역할 (Framework)
# ───────────────────────────────────────────────
roles:
  module:                    # 역할=컨테이너(그릇). 라벨은 antlr type(CLASS/INTERFACE/FILE)
    java:    [CLASS, INTERFACE]
    c:       [FILE]
    python:  [CLASS, FILE]
  data_type:                 # 역할=데이터타입(함수 못 품 — C 구조체류). 라벨=STRUCT/UNION/ENUM
    c:       [STRUCT, UNION, ENUM]
  function:                  # 역할=함수(호출가능). 라벨=METHOD/FUNCTION
    java:    [METHOD]
    c:       [FUNCTION]
    python:  [METHOD, FUNCTION]
  variable:                  # 역할=변수. 라벨=FIELD/MEMBER/GLOBAL_VARIABLE/VARIABLE
    java:    [FIELD]
    c:       [FIELD, MEMBER, GLOBAL_VARIABLE]
    python:  [FIELD, VARIABLE]
    sql:     [PARAMETER, VARIABLE, PACKAGE_VARIABLE]
  constant:                  # 역할=상수. 라벨=CONSTANT_FIELD/DEFINE
    java:    [CONSTANT_FIELD]
    c:       [DEFINE, CONSTANT_FIELD]
    python:  [CONSTANT_FIELD]
    sql:     [CONSTANT_FIELD]
  internal:                  # Neo4j 노드 X — 분석 흐름 단서 (호출/import/파일컨테이너)
    java:    [FILE, FUNCTION_CALL, NEW_INSTANCE, IMPORT]
    c:       [FUNCTION_CALL, INCLUDE, TYPEDEF, ENUM_CONSTANT]
    python:  [FUNCTION_CALL, NEW_INSTANCE, IMPORT]
  control_structure:         # 제어 흐름 의미 AST 뼈대 (spec 007, parser 007 emit).
                             # 그래프에 CodeNode 로 보존(기본 숨김)하되 routine 이 아니므로
                             # LLM 분석 대상에서 제외된다(ROUTINE_LABELS 단일 진실). 폴백 분할용.
                             # CALLS/READS/WRITES 는 이 노드가 아니라 소유 routine 에 귀속(reader).
    c:       [IF, ELSE, LOOP, SWITCH, CASE]
    java:    [IF, ELSE, LOOP, SWITCH, CASE, TRY, CATCH, FINALLY]  # FINALLY: 2026-08-05 emit 추가
    python:  [IF, ELSE, LOOP, TRY, CATCH, WITH]           # WITH: 2026-08-05 emit 추가. SWITCH/CASE 없음, match 는 범위 밖(계약 §1)
    # PL/SQL (spec 118, 2026-08-08). rwis AST 전수 조사에서 **실측한 라벨만** 선언한다.
    #   TRY       = BEGIN…END 블록,  EXCEPTION = 그 블록의 EXCEPTION WHEN … THEN 핸들러 섹션
    #               (framework TRY/CATCH 쌍의 PL/SQL 철자다 — 원문 대조로 확인)
    #   ELSIF     = ELSIF <조건> THEN. parser 가 조건식을 정상 보존한다
    #   EXIT      = EXIT WHEN <조건>. 조건 없는 `LOOP` 은 자기 조건이 없고 반복 종료 판정이
    #               오직 여기 있다 — C 의 `if (cond) break;` 에 해당한다. parser 가 조건을
    #               보존하도록 2026-08-08 수리했다(spec 118 §1.4). 무조건 EXIT 는 조건이
    #               없는 것이 사실이므로 controller 로 내려간다.
    # 문법에는 있으나 이 코퍼스에서 emit 을 확인하지 못한 라벨(CASE 문 등)은 넣지 않는다.
    sql:     [IF, ELSE, ELSIF, LOOP, TRY, EXCEPTION, EXIT]
  statement:                 # 구조 statement (parser spec 016 emit — RETURN/대입/종료 이동).
                             # 그래프에 CodeNode 로 보존(routine 아님 — LLM 분석 제외)하고
                             # branch_inventory 가 종료행·반환식·대입·entry 의 AST 정본으로 소비.
    c:       [RETURN, BREAK, CONTINUE, GOTO, LABEL, ASSIGNMENT]
    java:    [RETURN, THROW, BREAK, CONTINUE, ASSIGNMENT]
    python:  [RETURN, RAISE, BREAK, CONTINUE, ASSIGNMENT, YIELD]
    sql:     [RETURN, ASSIGNMENT, EXIT, COMMIT, ROLLBACK]

# statement 라벨 → Rule 직접 효과 op (rule_expression.EFFECT_FUNCTIONS 의 부분집합 —
# 드리프트 테스트가 감시). 여기 선언된 statement 는 소유 행의 효과 보기로 노출된다
# (target = statement 대상: GOTO 는 라벨명). 새 구문 편입 = 데이터 1줄, 코드 분기 0.
# 실측 근거: `if (...) goto PFM_CATCH;` 분기는 점프가 유일한 효과인데 보기가 비어
# 모델이 고를 사실이 없었다(2026-08-05 framework corpus).
statement_effect_ops:
  RETURN: ret
  THROW: raise_error
  RAISE: raise_error
  GOTO: jump
  BREAK: jump
  CONTINUE: jump
  EXIT: exit_loop
  COMMIT: commit
  ROLLBACK: rollback

# DML 구문 종류(`dml_semantics.yaml` 의 dml_type) → Rule 직접 효과 op
# (`rule_expression.EFFECT_FUNCTIONS` 의 부분집합 — 드리프트 테스트가 감시).
# step5 링커가 DML 노드마다 (테이블, dml_type) 을 이미 결정론으로 만든다. 이 표는 그 사실을
# rule 효과 어휘로 옮기는 유일한 지점이며, **미선언 dml_type 은 조용히 버리지 않고 좌표와
# 함께 실패한다**(헌법 IV). 새 DML 지원 = 여기 한 줄.
# 근거: rwis 의무 행 59개 중 효과 증거가 있는 행이 19개(32%)뿐이었다 — framework 는 83%.
# 원인은 효과 축이 ASSIGNMENT/RETURN 만 보고 INSERT/UPDATE/MERGE/SELECT 347개를 못 본 것
# (spec 119).
# rule 증거의 **호출 좌표**를 제공하는 CodeNode 라벨 (언어별).
# framework 는 parser 가 FUNCTION_CALL 을 노드가 아닌 call_site 로 내보내 reader 가 좌표를
# 싣지만, DBMS 는 `CALL` 이 실제 CodeNode 이고 CALLS 엣지는 CallLinker 가 그 노드에서 만든다
# — 생산자를 둘로 만들지 않기 위해 reader 에 call_site 를 추가하지 않고 여기서 선언한다.
# 이 표가 비면 그 언어는 이 경로를 쓰지 않는다는 뜻이다(framework 동작 불변).
# 근거: rwis 의 CALL 59개가 효과 축에 없어 handler 20행·decision 일부가 `then` 을 만들 사실이
# 없었다(spec 119).
callsite_labels:
  sql: [CALL]

dml_effect_ops:
  SELECT:   select
  INSERT:   insert
  UPDATE:   update
  DELETE:   delete
  MERGE:    upsert     # MATCHED→UPDATE / NOT MATCHED→INSERT 를 합친 의미
  TRUNCATE: delete     # 조건 없는 전량 삭제
  CREATE:   insert     # CTAS — 새 테이블에 조회 결과를 적재한다

# 결정론 해석이 원리상 불가한 구문 — 값 추적을 흉내 내지 않는다(폐기 확정 설계).
# 커버리지 잔차 감사가 장부로 세어 표면화한다(kind → live 소스 정규식). 새 종류 = 데이터 1줄.
unsupported_constructs:
  c:
    dynamic_call: '\(\s*\*\s*[A-Za-z_][A-Za-z0-9_]*\s*\)\s*\('
    # C 의 멤버 접근 호출은 함수 포인터 디스패치다. parser 가 name 만 남기고 수신자를
    # 버려 정적 호출로 위장되므로(사용자 지적 2026-08-05) 장부로 표면화한다.
    # Java/Python 의 멤버 호출은 정상 관례라 등록하지 않는다.
    member_fn_call: '(?:->|\.)\s*[A-Za-z_][A-Za-z0-9_]*\s*\('
    nonlocal_jump: '\b(?:setjmp|longjmp)\s*\('
  java:
    reflection_call: '\b(?:Class\.forName|\.getMethod\s*\(|\.invoke\s*\()'
  python:
    dynamic_attribute_call: '\bgetattr\s*\('

# Canonical parser control nodes have one language-neutral prompt role. A CASE
# whose source spelling is a default label is refined by source_lexicon.
#
# 이 표는 **의미 축**만 선언한다 — decision = 조건으로 갈리는 자리, controller = 감싸는
# 자리, complement = 여집합. 어떤 노드에 조건이 실제로 있는지는 데이터가 아니라 그 노드의
# 사실이므로, 조건이 빈 decision 은 ``Branch.prompt_role()`` 이 controller 로 내린다
# (spec 118 §2.1 — sql bare LOOP · c `for(;;)` · java FINALLY 가 같은 결함이었다).
control_roles:
  controller: [SWITCH, TRY, WITH]      # WITH: 감싸는 자원 블록 — 자원 식은 문맥, 조건 아님
  complement: [ELSE]
  # 오류 경로 진입 행. framework 는 skill 이 선언한 handler 마커(PFM_CATCH)로 같은 축의
  # 행 67개를 만든다 — PL/SQL 은 그 자리가 AST 노드(EXCEPTION 섹션)다. 조건 없이도 의무
  # 행이며 cond·then 을 요구하지 않는다(spec 118 §2.4, 사용자 확정 2026-08-08).
  # controller 로 두면 의무에서 빠져 오류 처리 블록 28개가 규칙 0건이 된다 — framework
  # 동급 완료 기준과 어긋나므로 이 축을 별도로 둔다.
  handler: [EXCEPTION]
  # FINALLY 는 조건이 없어 실행 시 controller 로 내려간다(경로 항 없음 — 회귀 5호 계약 유지).
  decision: [IF, LOOP, CASE, CATCH, FINALLY, ELSIF, EXIT]

# 그룹 라벨 이후의 statement는 해당 라벨이 소유해야 한다. parser가 이 canonical ownership을
# 못 만들면 analyzer가 언어별로 수선하지 않고 명시 실패해 생산자 재생성을 요구한다.
control_ownership:
  SWITCH:
    grouped_child: CASE

# 참조 심볼을 prompt에 전달할 때의 언어 중립 scope. parser label의 의미는 언어마다
# 다를 수 있으므로 코드 if/set이 아니라 이 표가 소유한다. 각 언어의 roles.variable /
# roles.constant label은 아래에서 정확히 한 번 모두 분류되어야 한다.
symbol_kinds:
  c:
    global: [GLOBAL_VARIABLE]
    field: [FIELD, MEMBER]
    constant: [DEFINE, CONSTANT_FIELD]
  java:
    field: [FIELD]
    constant: [CONSTANT_FIELD]
  python:
    global: [VARIABLE]
    field: [FIELD]
    constant: [CONSTANT_FIELD]
  sql:
    global: [PACKAGE_VARIABLE]
    local: [VARIABLE]
    parameter: [PARAMETER]
    constant: [CONSTANT_FIELD]

# (옛 `paradigm:` 섹션 삭제 — ontology.paradigm() 만 읽던 죽은 데이터였고
#  그 함수도 호출부 0건이라 함께 제거. spec 046 FR-010.)

# ───────────────────────────────────────────────
# 2. source_lexicon — 언어별 어휘 구문 (spec 101 근거성 게이트)
# ───────────────────────────────────────────────
# 게이트 로직은 언어를 모른다. "활성 코드 / 주석 / 비활성 블록"을 가르는 데 필요한
# **구문 표(데이터)** 만 여기서 받는다. 새 언어 = 아래 표 한 줄.
# 분기 노드 타입은 위 roles.control_structure 가 단일 정의처다(여기에 중복 정의 금지).
#   line             : 줄 주석 시작 토큰
#   line_regex       : 줄 전체가 주석인 위치 의존 문법(예: COBOL 고정형 7열 indicator)
#   block            : [열림, 닫힘] 블록 주석 쌍
#   string_quotes    : 문자열/문자 리터럴 인용부호 (주석 판정에서 보호할 구간)
#   inactive         : 컴파일에서 빠지는 블록 [열림, 중첩열림, 닫힘] 정규식
#   case_fallthrough : 본문 없는 CASE 가 다음 CASE 의 효과를 공유하는가
#   control_keywords : `이름(` 형태지만 호출이 아닌 예약어 (호출 집합에서 제외)
#   octal_case_labels: CASE 라벨의 0 접두 정수를 8진으로 읽는 언어 — 분기표가 수치
#                      병기(canonical)를 만들어 `case 02` ↔ `== 2` 대조를 가능하게 한다.
#   complement_owner_types: ELSE 같은 여집합 노드가 부정할 수 있는 canonical 제어
#                      노드 타입. 구조 부모가 허용 타입이면 부모가 소유자이고, 부모가
#                      없거나 비허용일 때만 평면 형상의 가장 가까운 선행 허용 타입을 쓴다.
#                      이 표가 없거나 타입이 틀리면 추측하지 않고 실패한다.
#   alternative_clause_types: 부모 판정의 **본문이 아니라 대안 절**인 노드 타입.
#                      PL/SQL 은 `ELSIF`/`ELSE` 를 IF 의 자식으로 내는데(평면 형상),
#                      대안 절에 도달하려면 부모 판정과 **앞선 형제 대안 절 전부가
#                      부정**이어야 한다. 이 사실이 없으면 조상 조건을 "성립"으로
#                      상속해 경로가 정반대가 된다(실측: `FN_EDIT_YN.sql:41,50,52`).
#                      C/Java/Python 은 `else { if … }` 중첩이라 조상 사슬이 이미
#                      담당하므로 빈 목록이다 — 빈 목록은 "해당 없음"의 명시다.
# 종료문·반환식·대입쌍·CASE 라벨·반복문 머리·조건 괄호는 **parser AST 가 소유**한다
# (spec 016 구조 구문 계약). analyzer 는 좌표와 expression 을 소비만 하며 원문을
# 정규식·첫 토큰으로 재탐색하지 않는다 — 그래서 그 어휘 키들은 이 표에서 삭제됐다.
source_lexicon:
  c:
    identifier_pattern: '[^\W\d]\w*'
    line:          ["//"]
    block:         [["/*", "*/"]]
    string_quotes: ["\"", "'"]
    inactive:      ['^#\s*if\s+0\b', '^#\s*if', '^#\s*endif']
    # 컴파일러가 인접 문자열 리터럴("a" "b")을 이어붙이는 언어 — 링킹이 이어붙인
    # 논리 문자열 뷰를 추가로 스캔한다 (regex_table_linker, spec 108 감시항목 표화).
    adjacent_string_concat: true
    case_fallthrough: true
    control_keywords: [if, else, for, while, do, switch, case, default, return, sizeof]
    complement_owner_types: [IF]
    alternative_clause_types: []
    octal_case_labels: true
  java:
    identifier_pattern: '(?:[^\W\d]|\$)(?:\w|\$)*'
    line:          ["//"]
    block:         [["/*", "*/"]]
    string_quotes: ["\"", "'"]
    inactive:      []
    case_fallthrough: true
    control_keywords: [if, else, for, while, do, switch, case, default, return, try, catch,
                       finally, synchronized, throw, new, instanceof]
    complement_owner_types: [IF]
    alternative_clause_types: []
    octal_case_labels: true
  python:
    identifier_pattern: '[^\W\d]\w*'
    line:          ["#"]
    # 삼중따옴표는 문법상 문자열이지만 **실행 코드가 아니다**(독스트링). 활성으로 두면
    # 그 안의 산문·예시 SQL 이 "코드에 있는 값"으로 둔갑해 근거성 판정이 무너진다.
    # (실측: library_system/database.py 의 CREATE TABLE 독스트링이 활성 원자로 샜다)
    block:         [['"""', '"""'], ["'''", "'''"]]
    string_quotes: ["\"", "'"]
    inactive:      []
    case_fallthrough: false
    control_keywords: [if, elif, else, for, while, try, except, finally, with, return,
                       match, case, assert, print, def, class, lambda]
    # Python for/while-else 는 LOOP가 실제 소유자이므로 일반 if-else와 함께 선언한다.
    complement_owner_types: [IF, LOOP]
    alternative_clause_types: []
    octal_case_labels: false
  sql:
    identifier_pattern: '[^\W\d]\w*'
    line:          ["--"]
    block:         [["/*", "*/"]]
    string_quotes: ["'", "\""]
    inactive:      []
    case_fallthrough: false
    control_keywords: [if, elsif, elseif, else, loop, while, for, case, when, then,
                       return, exit, begin, end]
    complement_owner_types: [IF]
    alternative_clause_types: [ELSIF, ELSE]
    octal_case_labels: false
  cobol:
    identifier_pattern: '[^\W\d][\w-]*'
    line:          ["*>"]
    line_regex:    ['^.{6}[*/]']
    block:         []
    string_quotes: ["\"", "'"]
    inactive:      []
    case_fallthrough: false
    control_keywords: []
    complement_owner_types: []
    alternative_clause_types: []
    octal_case_labels: false

# 모듈 경계 REFERENCES/INIT_BY를 위한 import 소유권 해석. analyzer 코드는 언어명을
# 분기하지 않고 resolver의 범용 소유권 모델만 실행한다. roles.internal에 IMPORT/INCLUDE를
# 선언한 모든 언어는 여기 정확히 한 항목이 있어야 하며, 누락은 시작 시 명시 실패한다.
reference_imports:
  c:
    resolver: local_file
    local_path_pattern: '^"(?P<path>[^"]+)"'
  java:
    resolver: namespace
    separator: '.'
    static_prefix: static
    wildcard_suffix: '.*'
  python:
    resolver: module_path
    separator: '.'
    alias_keyword: as
    list_separator: ','
    file_extension: py
    from_pattern: '^from\s+(?P<relative>\.*)(?P<module>[\w.]*)\s+import\s+(?P<members>.+)$'

# 상속은 import 유무와 다른 능력이다. Parser listener가 소유하는 AST 필드만 데이터로 읽고,
# 부모 해소는 같은 파일과 위 import 소유권 신호의 단독 후보만 사용한다. 미등록 언어는
# 상속 해석을 주장하지 않는다.
reference_inheritance:
  java:
    separator: '.'
    ast_fields: [extends_type, implements_types]
    parent_separator: ','
    generic_open: '<'
    ignored_parents: []
  python:
    separator: '.'
    ast_fields: [extends_type]
    parent_separator: ','
    generic_open: '['
    ignored_parents: [object]

# 외부 산출물 연결의 구조 지식. 코드에는 이름·형식별 분기를 두지 않는다.
# resolver 값은 외부 주소 key가 들어오는 0-based 인자 위치다.
external_linking:
  resolvers:
    fopen: [0]
    open: [0]
    getResourceAsStream: [0]
    getResource: [0]
    FOPEN: [0, 1]
    lookup: [0]
    getBean: [0]
    getString: [0]
    selectOne: [0]
    selectList: [0]
    queryForObject: [0]
    queryForList: [0]
    insert: [0]
    update: [0]
    delete: [0]
    runSync: [0]
    runSyncIgnore: [0]
    runAsync: [0]
  addressable_attributes:
    bean: [id]
    alias: [alias]
    select: [id]
    insert: [id]
    update: [id]
    delete: [id]
    statement: [id]
    procedure: [id]
    sql: [id]
    resultmap: [id]
    parametermap: [id]
    service: [name]
    operation: [name]
  addressable_child_text:
    session: [ejb-name]
    entity: [ejb-name]
    message-driven: [ejb-name]
    servlet: [servlet-name]
    filter: [filter-name]
    listener: [listener-class]
  addressable_kinds: [properties_entry, ini_entry]

# Scan Agent 탐색 힌트의 형식 표. 파일명·확장자 추가는 이 데이터만 바꾼다.
scanner_hints:
  manifests:
    - pom.xml
    - build.gradle
    - build.gradle.kts
    - package.json
    - pyproject.toml
    - setup.py
    - requirements.txt
    - Cargo.toml
    - go.mod
    - Makefile
    - CMakeLists.txt
  categories:
    SQL: [sql, ddl]
    Entity: [java, kt]
    Config: [xml, yaml, yml, properties, toml, ini]
    DOCS: [md, rst, txt]

# 외부 프로젝트의 일반 text 파일 분류. 실제 binary document parser 보유 여부는 adapter
# registry가 소유하며, 여기에는 parser 코드 없이 확장 가능한 inventory category만 둔다.
external_file_categories:
  artifact_xml:
    suffixes: [xml]
    exact_names: []
  config:
    suffixes: [json, jsonl, toml, ini, cfg, conf, properties, env, csv, tsv, yaml, yml]
    exact_names: []
  document:
    suffixes: [md, markdown]
    exact_names: []

# DBMS 플랫폼의 내장 패키지. 호출 텍스트의 식별자 한 세그먼트와 정확히
# 일치할 때만 builtin 으로 분류한다. prefix 패턴은 application package 를
# 조용히 버리므로 금지한다. dialect key 는 parser 지원 확장 시 독립 확장점이다.
dbms_builtin_packages:
  oracle:
    - DBMS_APPLICATION_INFO
    - DBMS_ASSERT
    - DBMS_CRYPTO
    - DBMS_LOB
    - DBMS_LOCK
    - DBMS_METADATA
    - DBMS_OUTPUT
    - DBMS_RANDOM
    - DBMS_SCHEDULER
    - DBMS_SESSION
    - DBMS_SQL
    - DBMS_STATS
    - DBMS_UTILITY
    - HTF
    - HTP
    - OWA_UTIL
    - STANDARD
    - UTL_FILE
    - UTL_HTTP
    - UTL_RAW
    - UTL_SMTP
    - UTL_TCP

# ───────────────────────────────────────────────
# 3. stereotype 풀 — analyze_function 의 SummaryOutput.stereotype 검증.
#    LLM 이 자유롭게 작성 X. 이 풀에서만 선택. 풀에 없으면 빈 문자열로 강제.
# ───────────────────────────────────────────────

# stereotype 결정 보조 (spec 116 7단계) — 정의 중복으로 정답이 미결정일 때의 계약.
#   priority       : 복수 정의가 동시에 성립할 때의 동점 해소 순서(상위 우선) —
#                    프롬프트에 데이터로 주입된다({stereotype_priority}).
#   write_forbidden: 결정론 쓰기(writes) 근거가 있는 함수에 붙을 수 없는 값 —
#                    위반은 빈 값으로 강제하고 표면화한다(사람 검토).
stereotype_rules:
  priority: [Command, Adapter, Query, Validator, Translator, Helper]
  write_forbidden: [Query, DataQuery, MetadataLookup]
framework:
  # OOP 일반 — Java / Kotlin / Python / Go / C++
  ApplicationService: 외부 유스케이스의 진입점에서 여러 협력자를 조정하고 결과를 반환한다.
  DomainService: 특정 객체 하나에 속하지 않는 응집된 도메인 규칙이나 정책을 수행한다.
  Repository: 저장소 조회·저장·변경·삭제가 주된 책임이다.
  Factory: 객체나 구성 결과의 생성·조립이 주된 책임이다.
  Command: 호출 후 업무 상태를 변경하는 것이 주된 책임이다.
  Query: 상태를 변경하지 않고 정보나 계산 결과를 반환하는 것이 주된 책임이다.
  Validator: 입력·상태·계약의 허용 여부나 정합성을 판정하는 것이 주된 책임이다.
  Translator: I/O 자체보다 표현 형식·모델·메시지 사이의 변환이나 매핑이 주된 책임이다.
  Adapter: 외부 시스템·프로토콜·프레임워크 경계를 내부 호출 규약에 연결한다.
  Strategy: 교체 가능한 알고리즘이나 정책 구현을 캡슐화한다.
  EventHandler: 이벤트나 메시지를 수신하는 진입점에서 반응 처리를 시작한다.
  Scheduler: 시간·주기 조건으로 작업을 시작하거나 예약한다.
  Helper: 특정 상위 흐름에 종속된 좁은 보조 단계를 수행하며 독립된 범용 원시 연산은 아니다.
  Router: 입력 유형·상태에 따라 처리 대상이나 경로를 선택해 전달한다.
  Utility: 시간·검사합·초기화·정리처럼 시스템 자원이나 횡단 운영을 보조한다.
  Util: 도메인 정책과 외부 I/O 없이 여러 곳에서 재사용 가능한 저수준 원시 연산을 수행한다.
  Controller: HTTP·RPC·API 같은 외부 요청의 진입점에서 입력과 응답 흐름을 조정한다.
  Initializer: 시작·로딩 시점에 한 번 수행되는 설정이나 상태 구성을 책임진다.

dbms:
  # PL/SQL 전용
  DataMutator: 데이터 삽입·변경·삭제가 주된 책임이다.
  DataQuery: 데이터를 변경하지 않고 조회 결과를 반환하는 것이 주된 책임이다.
  BatchProcessor: 다수 레코드를 정기·일괄 단위로 처리하는 것이 주된 책임이다.
  Validator: 데이터 값·상태·관계의 정합성이나 허용 여부를 판정한다.
  MetadataLookup: 코드·마스터·설정 등 참조 메타데이터 조회가 주된 책임이다.
  EventTrigger: 데이터베이스 이벤트에 반응해 처리를 시작한다.
  Aggregator: 여러 행이나 값을 집계·요약해 계산 결과를 만든다.
  ReportGenerator: 조회·집계 결과를 사용자용 보고 형식으로 구성한다.
  DataMigrator: 기존 데이터의 구조·값·저장 위치를 다른 형태로 이관한다.
  CursorLooper: 커서나 결과 집합을 순회하며 행별 처리를 수행한다.
  PackageInitializer: 패키지 로딩 시 한 번 수행되는 상태나 설정 구성을 책임진다.
  Helper: 상위 프로시저 흐름에 종속된 좁은 보조 단계를 수행한다.

# 모듈·파일·클래스 종합 역할. 함수 역할과 의미 축이 다르므로 별도 폐쇄 목록이지만,
# prompt와 parser가 이 파일 하나를 함께 읽는다.
module_framework:
  - Module
  - Service
  - Repository
  - Controller
  - Util
  - Config
  - Scheduler
  - Client
  - Gateway
  - Entity
  - DTO
  - DataStructure
  - Enum

module_dbms:
  - BatchProcessing
  - MetadataService
  - TriggerLogic
  - ReportGenerator
  - DataMigration
  - Validation
  - Aggregation
  - Cleanup
  - Utility
