## Framework 분할 1 — 전체 semantic frame + 역할 분류.
extends: _common
inherit_inputs: false
structured_output_method: function_calling
shared_values:
  summary_grounding_contract: ../common/summary_grounding_contract.md
  function_summary_contract: ../common/function_summary_contract.md
user_template_specific: |
  # [TASK — TARGET의 전체 요약]

  SOURCE와 parser/linker가 확정한 구조 사실을 종합해 호출자가 TARGET의 실제 흐름을 이해할 수 있는
  하나의 자연스러운 요약을 작성한다.
  Rule·TABLE/COLUMN 설명·질문은 만들지 않는다.

  {summary_grounding_contract}

  {function_summary_contract}

  ## [OUTPUT CONTRACT — frame summary concern]

  최상위에는 response_format이 required로 지정한 `summary`, `stereotype`만 각각 정확히 한 번 출력한다.

  `summary`는 코드 한 줄씩 번역한 목록이 아니다. 입력과 선행 검증,
  결과를 바꾸는 조건별 처리, 직접 CALL/RW, 반환·외부 상태 변화를 실행 순서와 소유 범위를
  보존한 자연스러운 전체 설명이다. SOURCE에 없는 정책·코드값 뜻·callee 내부 절차를 만들지
  않는다. 확정할 수 있는 동작만 쓰되, 현재 TARGET의 직접 동작은 빠뜨리지 않는다.

  ## [DECISION — stereotype 역할 분류]

  아래 ontology 값 중 target의 최종 관측 책임에 맞는 하나를 글자 그대로 선택한다:
  {stereotype_options}

  둘 이상이면 다음 우선순위를 적용한다:
  {stereotype_priority}

  - 이름·호출 수·분기 수가 아니라 호출자가 얻는 최종 책임으로 판정한다.
  - 외부·지속 상태를 바꾸지 않고 정보가 산출물이면 `Query`, 상태 변경이 목적이면 `Command`다.
  - 직접 검사 종합은 `Validator`, 입력별 전문 처리 계약 선택은 `Router`다.
  - I/O 계약을 다른 모듈 계약으로 변환하고 결과를 되돌리면 `Adapter`, 단순 위임은 `Helper`다.
  - 여러 업무 단계를 조정해 유스케이스를 완성할 때만 `ApplicationService`다.
  - 저수준 자료구조·문자열 연산은 `Util`, 횡단 시스템 기능은 `Utility`다.
  - 결정론 writes가 있는 target에 조회 전용 역할을 선택하지 않는다.

user_template_dynamic_inputs: |
  # [INPUT — SUMMARY meaning packet]

  response_locale: {response_locale}
  자연어 의미 값만 이 언어로 작성한다. 원문 리터럴과 물리 식별자는 번역하지 않는다.

  {summary_context}

  ## [SOURCE]
  각 줄은 `절대 파일 줄번호 | 원문`이다. 줄번호는 근거를 맞추는 좌표일 뿐 실행 코드가 아니다.
  줄 번호와 원문을 의미 출력에 복사하지 않는다.
  ```text
  {code_body}
  ```
