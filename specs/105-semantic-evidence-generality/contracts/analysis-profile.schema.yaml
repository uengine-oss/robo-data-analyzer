$schema: "https://json-schema.org/draft/2020-12/schema"
title: Analyzer analysis profile
type: object
additionalProperties: false
required:
  - data_dir
  - strategy
  - neo4j_database
  - locale
  - run_output
properties:
  name:
    type: string
    minLength: 1
    description: Optional human label; never used for product branching.
  data_dir:
    type: string
    minLength: 1
    description: Reference to a corpus root containing source/ and optional ddl/.
  strategy:
    enum: [framework, dbms]
  neo4j_database:
    type: string
    minLength: 1
    not:
      enum: [system, SYSTEM, System]
  locale:
    type: string
    pattern: "^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$"
  run_output:
    type: string
    minLength: 1
    description: Parent directory under which unique immutable run IDs are created.
