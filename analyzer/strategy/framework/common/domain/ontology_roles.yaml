roles:
  module:           # MODULE 역할 (Neo4j 라벨: MODULE) — 메서드/함수/필드를 품는 컨테이너 (파일·클래스 등)
    # 분류 기준: "함수를 품을 수 있는 코드 단위" 만 module 로 분류.
    # C 의 STRUCT/UNION/ENUM 은 메서드 못 가지므로 data_type 역할로 분리 (의미 정확성).
    java:    [CLASS, INTERFACE, ENUM, RECORD]
    c:       [FILE]
    python:  [CLASS, FILE]
    go:      [STRUCT, INTERFACE]

  data_type:        # DATATYPE 역할 (Neo4j 라벨: DATATYPE) — 함수 못 품는 데이터/상수 타입 컨테이너
    # 사실상 C 전용. 다른 메이저 언어의 struct/enum/record 는 모두 메서드 가질 수 있어 module 에 들어감.
    # 새 언어 추가 시 그 언어가 "함수 못 품는 타입 정의" 가지면 여기 추가.
    java:    []
    c:       [STRUCT, UNION, ENUM]
    python:  []
    go:      []

  function:         # FUNCTION 역할 (Neo4j 라벨: FUNCTION) — 메서드/함수/생성자
    java:    [METHOD, CONSTRUCTOR]
    c:       [FUNCTION]
    python:  [METHOD, FUNCTION]
    go:      [FUNCTION, METHOD]

  variable:         # VARIABLE 역할 (Neo4j 라벨: VARIABLE) — 값이 변할 수 있는 데이터
    # VARIABLE: 함수 내 로컬 변수도 그래프 저장 대상.
    #   상수·식별자로 초기화되는 경우 INIT_BY (VARIABLE → CONSTANT/VARIABLE) 관계 형성에 필수.
    #   internal 로 두면 source 노드 부재로 INIT_BY 빌더가 작동 불가능 (dead 기능 됨).
    # PARAMETER: 함수/메서드 파라미터. variable_linker 의 name_index 에 자동 등록되어
    #   변수↔파라미터 INIT_BY 매칭이 작동.
    java:    [VARIABLE, FIELD, PARAMETER]
    c:       [VARIABLE, FIELD, MEMBER, GLOBAL_VARIABLE, PARAMETER]
    python:  [VARIABLE, FIELD, PARAMETER]
    go:      [VARIABLE, FIELD, PARAMETER]

  constant:         # CONSTANT 역할 (Neo4j 라벨: CONSTANT) — 값이 고정된 데이터
    java:    [CONSTANT_FIELD]
    c:       [DEFINE, CONSTANT_FIELD]
    python:  [CONSTANT_FIELD]
    go:      []

  silent:           # 수집되지만 로그 안 남기는 노드 (variable 역할로 옮긴 후 미사용)
    java:    []
    c:       [ENUM_CONSTANT, TYPEDEF]
    python:  []

  internal:         # Neo4j 미저장, 분석 중에만 사용
    java:    [METHOD_CALL, NEW_INSTANCE, IMPORT, FILE, ASSIGNMENT]
    c:       [FUNCTION_CALL, INCLUDE, TYPEDEF, ENUM_CONSTANT]
    python:  [IMPORT, FILE, ASSIGNMENT]

  call:             # 호출 참조 노드 (ref_candidates 수집 대상)
    java:    [METHOD_CALL, NEW_INSTANCE]
    c:       [FUNCTION_CALL]
    python:  [METHOD_CALL]

  import:           # 의존성 참조 노드
    java:    [IMPORT]
    c:       [INCLUDE]
    python:  [IMPORT]

paradigm:           # 언어별 패러다임 분류 (UML 관계 추출 분기용)
  oop:        [java, python, kotlin, scala]
  procedural: [c]
  mixed:      [go]

stereotypes:        # 언어별 허용 스테레오타입 (Neo4j 라벨로 추가)
  common:     [Init, Query, Command, Handler, Validation]
  oop:        [Endpoint, Getter, Setter, Lifecycle, Scheduled, Transactional]
  # common + oop 언어는 common + oop, procedural 언어는 common만

extensions:         # 언어별 소스 확장자
  java:    [".java"]
  c:       [".c", ".h"]
  python:  [".py"]
  go:      [".go"]
  kotlin:  [".kt"]
  scala:   [".scala"]
  rust:    [".rs"]
