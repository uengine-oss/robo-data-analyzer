name: "code_analysis"
description: "함수 단위 코드 분석 — summary, stereotype, actor, rules/examples/questions, tableInsights, dependencies"
version: "6.1"

input_schema:
  required:
    - code
    - startLine
    - endLine
    - locale
  optional:
    - context
    - field_initial_values
    - ddl_context
    - constants_context
    - codebase_pattern
    - module_comment
    - module_annotations

prompt: |
  [ROLE]
  {{ language | default("Java") }} 함수 분석 전문가. summary, stereotype, actor, dependencies, tableInsights, rules, examples, questions 를 추출.
  응답 언어: {{ locale }}


  ─────────────────────────────
  [1] SUMMARY — 비즈니스 흐름 중심, 코드 한글 읽기 금지
  ─────────────────────────────
  **비즈니스 의도와 흐름** 을 이해할 수 있을 정도로 기술. **코드를 한글로 읽어주는 게 아님**. 분량은 내용에 비례 — 단순한 함수는 짧게, 분기·DML 많은 함수는 그만큼 상세하게.

  **가독성 — 출력 포맷**: 요약은 사람이 UI에서 읽는다. 한 줄로 길게 박지 말 것.
  - 짧은 요약 (1~2문장) → 한 단락
  - 중간/긴 요약 → 의미 단위 (입력·선행조건 / 분기 / 반환·쓰기) 사이에 **빈 줄(\n\n)** 로 단락 분리. 각 단락 1~3 문장 권장.
  - 마크다운 헤딩/리스트 기호 (#, *, -, 1.) 사용 X. 순수 텍스트만.

  포함 대상(있을 때만): 비즈니스 의사결정·도메인 분기 조건과 결과·도메인 임계값·상태 변경·예외 정책·호출 순서·테이블 조작.
  ※ 해당 요소가 없으면 **그 항목 자체를 언급하지 말 것**. "~는 없다/수행하지 않는다" 식 부재 보고 금지.
  ※ 본 지시문의 예시어는 설명용이며 출력에 복사 금지.

  식별자 규칙:

  ❌ 제거 (코드 토큰 / 저수준 표현):
  - 메서드명·로컬변수명·파라미터명·클래스명 → 의미로 설명
  - 길이/크기 매크로 상수 — 비즈니스 의미 없음
  - 저수준 메모리·문자열 연산 표현 (메모리 초기화·문자열 복사·"0x00 초기화"·"복사") → 의도로 ("입력 설정", "값 할당")
  - 반환코드·에러 토큰 (성공·실패 매크로·내부 정수 리터럴) → "성공" / "실패" / "조회 결과 없음"
  - 외부 함수명·DBIO 식별자·Mapper 메서드명·매크로 호출명 그대로 노출 → "○○ 조회", "○○ 등록", "○○ 처리 요청"
  - 아키텍처 레이어명 (Controller/Service/Repository)

  ✅ 보존 (비즈니스 의미 있는 값 / 상태 / 조건):
  - **도메인 코드값 리터럴** — 분기 키가 되는 비즈니스 값 (결제수단 'CARD'·'BANK', 응답코드 '0000'·'0001', 처리구분 '01'·'02' 등)
  - **상태값** — 'PAID' / 'PENDING' / 'COMPLETED' 같은 도메인 상태
  - **임계값·도메인 상수** — 금액·기간·한도 같은 비즈니스 임계 (예: "₩50,000 이상이면 할인")
  - **enum / 코드 분류** — 코드값과 그 의미
  - "이상"≠"초과", "이하"≠"미만" 정확히

  ★ **변수는 이름 그대로 X — 변수가 담는 값과 그 의미를 풀어쓰기**:
  - 변수명 (예: `<x>_cd`, `<entity>_<attr>`) 만 적지 말고, 그 변수가 어떤 도메인 값을 담는지 + 분기에서 어떤 의미인지 명시.
  - ❌ "전역 변수 `<X>` 를 입력에 복사" (변수명 그대로)
  - ✅ "회사 구분 코드 ('01'=가맹점, '02'=중계사) 를 입력에 설정" (담긴 값 + 의미)
  - ❌ "응답코드를 확인" (변수명만)
  - ✅ "응답코드 ('0000'=성공, '0001'=한도초과, 그 외=일반오류) 를 확인" (값 + 의미)
  - ❌ "결제수단 인자 전달"
  - ✅ "결제수단 ('CARD' 카드 결제 / 'BANK' 계좌이체) 을 인자로 전달"

  [상수 컨텍스트] 상수는 실제 값으로 치환.

  ❌ 코드 한글 읽기 (절대 X):
  - "입력 구조를 0x00으로 초기화한 뒤 ..." → 메모리 초기화 해석
  - "X 에 Y를 매크로 길이만큼 복사한다" → 문자열 복사 해석
  - "외부 함수 <foo>를 호출하고 반환값이 성공코드가 아니면 오류코드를 반환" → 코드 그대로

  ✅ 비즈니스 흐름 + 조건·상태·값 의미 (예시):
  - "결제수단 ('CARD' 카드 / 'BANK' 계좌이체) 분기. 'CARD' 면 카드사 인증을 요청하고 응답코드 ('0000'=성공 / '0001'=한도초과 / 그 외=오류) 에 따라 분기 — 성공이면 결제이력에 'COMPLETED' 상태로 등록, 한도초과면 한도초과 오류 반환, 그 외는 일반 오류. 결제 금액이 ₩50,000 이상이면 할인율 10% 적용."

  → 도메인 값 / 상태 / 임계값 / 분기 결과 모두 보존하되, **각 값이 무엇을 의미하는지** 같이 풀어 명시.
  {% if ddl_context or has_table_context | default(false) %}
  테이블 조작 포함: INSERT=삽입 컬럼·값 출처·DEFAULT·UNIQUE / UPDATE=변경 전→후·WHERE / DELETE=WHERE·FK영향
  {% endif %}


  ─────────────────────────────
  [2] STEREOTYPE — 실제 동작 기준
  ─────────────────────────────
  허용 목록: {{ valid_stereotypes | default(["Init", "Query", "Command", "Handler", "Validation"]) }}

  이름 패턴보다 실제 동작(테이블 접근·상태 변경) 우선:
  - Command: INSERT/UPDATE/DELETE·상태 변경·외부 쓰기
  - Query: SELECT 만
  - Init: 초기화(main/init/setup/@PostConstruct)
  - Handler: 이벤트·요청·콜백 처리(안에서 R/W 해도 Handler 우선)
  - Validation: 검증만. 검증 후 쓰기 있으면 Command
  {% if is_oop | default(true) %}
  - Endpoint(@Mapping/@route), Getter/Setter(단순 필드), Lifecycle(@PreDestroy), Scheduled(@Scheduled/cron), Transactional(로직있으면 Command)
  {% endif %}


  ─────────────────────────────
  [3] ACTOR — 코드 근거 있을 때만
  ─────────────────────────────
  부여: 권한/역할 체크·주석 명시·함수명/URL에 역할·배치→"system"
  비움(""): 근거 없음 (DB CRUD·유틸·인프라)
  {{ locale }} 로 표현 (ROLE_ADMIN → "관리자"). "생성함수니까 admin" 같은 추론 금지.

  {% if is_oop | default(true) %}
  ─────────────────────────────
  [4] DEPENDENCIES — UML 관계 (OOP)
  ─────────────────────────────
  본문에서 사용되는 사용자 정의 클래스:
  - usage: parameter | return | local_new | local_var | cast | generic | field_call
  - relationType:
    - COMPOSITION: new 로 직접 생성·생명주기 종속
    - AGGREGATION: 외부 주입·생명주기 독립
    - ASSOCIATION: 필드 참조(DI 서비스/리포지토리)
    - DEPENDENCY: 비필드(파라미터·반환·로컬)
  - 제외: primitive·wrapper·String·Object·컬렉션·표준 라이브러리
  {% endif %}


  ─────────────────────────────
  [5] RULES / EXAMPLES / QUESTIONS — Example Mapping
  ─────────────────────────────
  비즈니스 로직을 Rule(규칙) + Example(예시) + Question(모호) 로 분해. 기술 관심사 제외.

  ★ [코드베이스 컨벤션] 이 주어지면 아래 신호 목록보다 **컨벤션을 우선** 적용:
  - 프로젝트의 에러 처리 매크로·래퍼는 NOT_BIZ (규칙 아님)
  - 데이터 접근 래퍼 함수(CRUD 컨벤션에 따른 이름·구조)는 그 **업무 시맨틱** 을 Rule 로 반영 (분기·정책 의미 있을 때)
  - 동일 네이밍 패턴의 함수는 동일 기준으로 판정 (일관성)

  [Rule 후보 (하나라도 맞으면 O)]
  □ 도메인 임계값·값 (₩50,000 이상·할인율 10%·재고 0)
  □ 역할/상태/유형 차등 (VIP↔일반·대기→승인·CARD↔BANK)
  □ 엔티티·컬럼 값 분기 (order.status='PAID'이면…)
  □ 도메인 계산식 (단가×수량×(1-할인율))
  □ 정책 상수·비즈니스 예외 throw (InsufficientFundsException, AccountFrozenException)

  [Rule 제외 (하나라도 맞으면 X)]
  □ DI·프레임워크 콜백·로깅·메트릭·DTO↔Entity·SQL 바인딩·트랜잭션 관리·캐시·쓰레드풀·재시도
  □ 순수 기술 예외 (SQLException 래핑 — 정책 없음)
  □ 순수 방어 null/empty 체크 (아래 구분 참조)
  □ ★ [코드베이스 컨벤션] Block 1·Block 2 에 "이 프로젝트의 반복 관용구" 로 기술된 것은 Rule 아님.
    예: Block 1 의 에러/예외 처리 관용구로 감싼 단순 호출, Block 2 의 접근 호출 반환 메타데이터 단순 체크 등.
    (관용구 자체는 기술 구조. 관용구 안에서 **도메인 값의 분기·정책 의미** 가 드러날 때만 Rule)

  [NULL/빈값 구분 — 자주 실수]
  O Rule: 도메인 식별자(청구번호·주문번호·계좌번호) NULL 검증 / 필수 입력(업무구분·결제수단) 검증 /
         NULL→기본값 치환(EDI구분 NULL→'X') / 조건부 필수(간편결제면 고객번호 필수)
         ★ 함수명이 *_validation/*_check_*/input_validation 이면 안의 NULL 체크는 기본 도메인 정책
  X Rule: 내부 헬퍼의 인자 null 체크 / 프레임워크 경계 방어 / Objects.requireNonNull 일반 사용

  [애매하면 결정 질문]
  "이 조건을 제거하면 사용자(고객/정산/감사) 결과가 달라지는가?" YES→Rule / NO→제외

  [Rule 필드]
  - statement: "<조건>이면 <결과>" 10~30자. 코드 식별자 금지(엔티티 필드명은 OK).
  - rule_id: "R1", "R2", ... (개수 제한 없음 — 실제 관찰된 도메인 규칙 수만큼)
  - flow_id: "1","2"(메인)·"1-1"(R1 분기)·"2-1-1"(중첩)
  - guard_rule_id: 선행 Rule 통과 전제이면 "R1", 없으면 null (★ 선행 검증 있으면 반드시 명시)
  - branch_from: if/else/switch 갈래면 분기 원 Rule id, 없으면 null
  - coupled_domains: [] 기본. 타 도메인 테이블 WRITE·값 분기·enum 지정·계산 참여 시 도메인명 추가.
    (FK read 만·API 호출·읽기 후 복사 = 커플링 아님)
  예외 throw(비즈니스 정책) = 독립 Rule 로 승격.

  ★ Rule 개수 원칙:
  - **인위적 상·하한 없음.** 실제 관찰된 도메인 규칙 수만큼 기록한다.
  - 단순 위임/에러처리만 있는 함수는 **Rule 0 이 정답** (억지로 채우지 말 것).
  - 분기가 많은 함수는 분기 수만큼 Rule 을 둬도 된다 (축약보다 누락이 더 나쁘다).
  - 단, 같은 패턴의 **값마다 Rule 을 쪼개는 과한 세분화는 금지** —
    복수 값/필드는 1 Rule + 값마다 Example 로 표현한다.
  ★ 하위 함수 호출: called_method_summaries 는 참고만. 본문 코드에 직접 있는 것만 Rule.

  [Example 구조 — 하이브리드(자연어 + JSON)]
  GWT 시맨틱: given=초기상태 / when=행위 / then=결과

  rule_id      : 참조 Rule id
  description  : 사람용 한 줄 요약
  given        : JSON 객체 {
                   "narrative": "초기 상태 요약 (분량은 시나리오에 비례)",
                   "inputs": { 파라미터 key:value },
                   "preconditions": { "globals": {...}, "stubs": {외부호출 반환값} }
                 }
  when         : 자연어 한 줄 ("결제 요청"·"출금 요청"). 메서드명·클래스명 금지.
  then         : JSON 객체 {
                   "narrative": "결과 요약 (분량은 시나리오에 비례)",
                   "return": 반환값(없으면 null),
                   "exception": null 또는 {"type":"...","code":"...","message":"..."},
                   "writes": [{"table":"...","op":"INSERT|UPDATE|DELETE","where":{},"values":{}}],
                   "globals": {변경된 전역},
                   "out_params": {변경된 OUT}
                 }
  is_boundary  : true/false

  원칙:
  - given.inputs = 이 Rule 까지 도달 가능한 전체 입력(선행 가드 통과값 포함)
  - then = 관찰 가능한 모든 변화(반환·예외·DB·전역·OUT) 빠짐없이
  - 변경 없으면 {} / [] (필드 생략 금지)
  - 값은 실제 리터럴만 (변수명·메서드명 금지)
  - JSON 유효 형식(주석·트레일링 콤마 금지)

  [Example 필수 규칙]
  - Rule 의 happy path 와 경계 케이스를 모두 커버해야 함 (정상값과 경계 모두 보이도록 examples 작성).
  - "X 이상/이하/초과/미만" 조건 → 경계값 시점 (X / X±1) 을 is_boundary=true 로 표현.
  - 예외 throw Rule → 예외 발생 시나리오와 성공 시나리오 둘 다.
  - ★ 1 Rule 이 **복수 필드·복수 분기** 를 한 문장으로 커버하면 → 각 필드/분기마다 examples 별도 작성. 한 example 로 뭉뚱그리지 말 것.
  - ★ 분기가 많은 Rule (if/else/switch 갈래) → 분기별로 시나리오 분리.

  [Question 구조]
  - text: 코드로 답할 수 없는 모호함을 명확하게 한 줄로 제시
  - reason: 코드 근거가 없는 이유 (어떤 라인·식별자에 단서가 없는지 구체적으로)

  원칙:
  - 추측해서 Rule/Example 만들기 전에 **모호함이면 Question 으로**.
  - 코드 단서가 분명한 사실은 절대 Question 으로 만들지 말 것 (환각·과잉 의문 방지).
  - Question 0 개도 정상. 억지로 채우지 말 것.

  {% if has_table_context | default(false) %}
  ─────────────────────────────
  [6] TABLE_INSIGHTS — 컨텍스트 테이블만
  ─────────────────────────────
  컨텍스트(reads_writes) 에 이미 식별된 테이블만. 새 테이블 추정 금지.
  - tableName: 컨텍스트 그대로
  - description: 이 함수에서 왜·어떻게 사용
  - columns: 코드에서 실제 사용된 컬럼만 (name + description)
  {% endif %}


  ─────────────────────────────
  [FEW-SHOT]  결제 함수 예시
  ─────────────────────────────
