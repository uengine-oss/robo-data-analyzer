name: "code_analysis"
description: "함수 단위 코드 분석 — summary, stereotype, actor, scenarios, tableInsights, dependencies"
version: "5.0"

input_schema:
  required:
    - code
    - startLine
    - endLine
    - locale
  optional:
    - context
    - field_initial_values
    - table_sample_data
    - constants_context

prompt: |
  [ROLE]
  당신은 {{ language | default("Java") }} 코드 분석 전문가입니다.
  주어진 함수 코드를 분석하여 summary, stereotype, actor, scenarios, tableInsights, dependencies를 추출합니다.
  응답 언어: {{ locale }}


  [INPUT]
  아래 섹션들이 분석 재료로 주어집니다. 각 섹션의 의미와 활용 방법은 다음과 같습니다.
  필수 입력은 [분석 대상 코드]와 startLine/endLine/locale뿐이며, 나머지는 주어질 때만 표시됩니다.
  주어진 모든 섹션은 summary/stereotype/scenarios/tableInsights 작성의 근거로 반드시 활용하고,
  주어지지 않은 섹션의 내용은 절대 추측하지 마세요.

  {% if context %}
  ── [부모 컨텍스트] ──
  분석 대상 함수가 속한 클래스의 주석/어노테이션, 그리고 이 함수와 연결된 아키텍처 노드 정보입니다.
  활용: 함수의 역할과 호출 맥락을 파악하여 stereotype 판단과 summary 맥락화에 사용.
    - [연결된 SQL]: 함수가 호출하는 SQL 문 일부와 대상 테이블·연산(SELECT/INSERT/UPDATE/DELETE).
      → 테이블 접근이 있으면 Query/Command 판별, tableInsights 작성의 근거.
    - [연결된 Config]: 함수가 참조하는 설정 키와 값.
      → 하드코딩처럼 보이는 리터럴의 실제 출처(설정 값)를 파악.
    - [연결된 Class]: 이 함수가 사용하는 다른 클래스의 식별자, 설명, 필드 목록.
      → dependencies 관계 판별과 파라미터/반환 타입의 의미 해석.

  {{ context }}
  {% endif %}
  {% if field_initial_values %}
  ── [필드 초기값] ──
  분석 대상 함수가 속한 클래스의 인스턴스/정적 필드의 선언 시 초기값입니다.
  활용: 함수 내에서 필드를 참조할 때 그 값의 출발점을 파악.
    - 필드가 null로 초기화되는지, 특정 리터럴/컬렉션으로 초기화되는지 확인.
    - summary에서 필드 상태 변경을 기술할 때 "null → 값X"처럼 전/후 상태를 명확히 표현.
    - 필드가 DI 주입(AGGREGATION/ASSOCIATION)인지 new 생성(COMPOSITION)인지 dependencies 판단 근거.

  {{ field_initial_values }}
  {% endif %}
  {% if table_sample_data %}
  ── [테이블 샘플 데이터] ──
  함수가 접근하는 테이블의 실제 샘플 행(row) 데이터입니다.
  활용: 컬럼의 실제 값 도메인과 코드값(예: status='A'/'P'/'C') 의미를 파악.
    - scenarios의 Given/Then에 구체적 값을 넣을 때 현실적인 샘플 값을 사용.
    - INSERT/UPDATE 시 어떤 컬럼이 어떤 값 패턴으로 쓰이는지 tableInsights의 columns 설명에 반영.
    - 분기 조건의 리터럴("type='A'")이 실제 데이터상 어떤 의미를 갖는지 summary에 녹여넣기.

  {{ table_sample_data }}
  {% endif %}
  {% if constants_context %}
  ── [상수 컨텍스트] ──
  프로젝트 전역에서 참조 가능한 불변 상수 목록 (이름과 실제 값).
  활용: 코드가 상수를 참조하면 summary/scenarios에서 반드시 실제 값으로 치환.
    - ❌ "상태를 STATUS_COMPLETED로 변경" → ✅ "상태를 'C'로 변경"
    - 상수 네이밍 규칙이 보여도 변수명이 아닌 값으로만 기술.

  {{ constants_context }}
  {% endif %}

  ── [분석 대상 코드] ──
  아래가 이번 분석의 주 대상입니다. L{{ startLine }}-{{ endLine }} 범위의 {{ language | default("Java") }} 코드이며,
  이 범위에 대해 summary/stereotype/actor/scenarios/tableInsights/dependencies를 모두 산출해야 합니다.
  위의 모든 컨텍스트 섹션은 이 코드를 더 정확히 해석하기 위한 보조 자료입니다.

  {{ code }}


  [RULES]

  ★★★ 1. SUMMARY — 절대 규칙: 디테일 유지 ★★★

  이 summary만 읽고 원본 코드를 다시 작성할 수 있을 정도로 구체적이어야 합니다.
  3~5문장으로 작성하되, 아래 정보를 절대 생략하지 마세요:
  - 계산 공식: 구체적 조건과 값 (예: "price * quantity - discount")
  - 분기 조건: IF/switch의 비교 값과 결과 (예: "type='A'이면 X, 'B'이면 Y")
  - 하드코딩 값: 상수, 코드값, 임계값 등 모든 리터럴
  - NULL/예외 처리: fallback 조건과 대체 로직
  - 호출 체인: 각 단계가 뭘 하는지 순서대로
  요약이 길어져도 괜찮습니다. 디테일을 줄이는 것은 절대 허용되지 않습니다.

  식별자 규칙:
  - 제거: 메서드명, 로컬 변수명, 파라미터명, 클래스명 → 의미로 설명
  - 보존: 엔티티 필드명(orderStatus, acnt_num), enum 값, 상태값, 상수값
  - 상수: [CLASS_CONSTANTS_AND_FIELDS]에 정의된 상수는 실제 값으로 해석
  - 비교 연산자: "이상"과 "초과", "이하"와 "미만" 정확히 구분
  - 임시/확정: "검증용으로 준비" vs "등록 정보를 구성하고 저장" 명확히

  주석/어노테이션이 있으면 우선 활용. 없으면 코드 흐름에서 추론.
  summary에서 Controller, Service, Repository 등 아키텍처 레이어명을 직접 적지 마세요.

  {% if table_sample_data or has_table_context | default(false) %}
  테이블 조작(INSERT/UPDATE/DELETE) 시 필수 포함:
  - INSERT: 삽입되는 모든 컬럼명과 값의 출처, DEFAULT 값, UNIQUE 제약
  - UPDATE: 변경 전 → 변경 후 상태, WHERE 조건
  - DELETE: WHERE 조건, FK 참조 무결성 영향
  {% endif %}


  ★★★ 2. STEREOTYPE — 실제 동작 기준 판단 ★★★

  허용 목록: {{ valid_stereotypes | default(["Init", "Query", "Command", "Handler", "Validation", "BusinessLogic"]) }}

  이름 패턴보다 실제 동작(테이블 접근, 상태 변경)이 우선:
  - Command: INSERT/UPDATE/DELETE 수행, 상태 변경, 트랜잭션 커밋, 외부 쓰기
  - Query: SELECT만, 데이터 변경 없음, 결과 반환만
  - Init: 초기화 (main, init, setup, @PostConstruct, __init__)
  - Handler: 이벤트/신호/요청/콜백 처리. 안에서 읽기/쓰기 해도 Handler 우선.
  - Validation: 검증 (validate, check, verify). 검증 후 테이블 쓰면 Command.
  - BusinessLogic: Command도 Query도 아닌 순수 계산/변환. 테이블 접근 없음.
  {% if is_oop | default(true) %}
  - Endpoint: REST API 엔드포인트 (@GetMapping, @PostMapping, @app.route)
  - Getter: 단순 필드 반환 (getXxx, @property). 반환만.
  - Setter: 단순 필드 설정 (setXxx). 설정만.
  - Lifecycle: 라이프사이클 (@PreDestroy, __del__)
  - Scheduled: 스케줄 메서드 (@Scheduled, cron, @celery.task)
  - Transactional: 트랜잭션 관리 (@Transactional). 비즈니스 로직 있으면 Command 우선.
  {% endif %}


  ★★★ 3. ACTOR — 코드에 근거 있을 때만 ★★★

  부여: 권한/역할 체크 로직, 주석에 호출 주체 명시, 함수명/URL에 역할 포함, 배치/스케줄러 → "system"
  비움 (""): 코드에 호출자 역할 구분 근거 없음 (DB CRUD, 유틸리티, 인프라 등)
  명칭: 코드에서 드러나는 역할을 {{ locale }}로 표현 (예: ROLE_ADMIN → "관리자")
  추측 금지: "생성 함수니까 admin" 같은 역할 추론 절대 금지


  {% if is_oop | default(true) %}
  ★★★ 4. DEPENDENCIES — UML 관계 추출 (OOP 전용) ★★★

  메서드 본문에서 사용되는 사용자 정의 클래스의 UML 관계:
  - usage: parameter, return, local_new, local_var, cast, generic, field_call
  - relationType:
    - COMPOSITION: 직접 new로 생성, 생명주기 종속
    - AGGREGATION: 외부에서 주입, 생명주기 독립
    - ASSOCIATION: 필드로 참조, 전체-부분 아님 (DI 서비스/리포지토리)
    - DEPENDENCY: 비필드 기반 (파라미터, 반환, 로컬 변수 등)
  - 제외: primitive, wrapper, String, Object, 컬렉션 자체, 표준 라이브러리
  {% endif %}


  ★★★ 5. SCENARIOS — Given-When-Then 비즈니스 로직 ★★★

  핵심 질문: "이 분기/조건이 비즈니스 의사결정인가, 기술적 구현인가?"

  비즈니스 로직 ✅ (시나리오 생성):
  - 비즈니스 규칙 분기 (유형별 차등 처리, 상태별 허용/거부)
  - 비즈니스 계산 (금액 산정, 할인율 적용, 집계)
  - 비즈니스 검증 (자격 확인, 중복 방지, 한도 초과)
  - 비즈니스 상태 전이 (대기→승인, 미처리→완료)
  - 비즈니스 기본값/보정 (미입력 시 대체값)

  기술적 구현 ❌ (빈 배열 []):
  - DB CRUD 실행 (INSERT/SELECT 자체)
  - 기술적 에러 핸들링 (테이블 full, not found, SQL 에러)
  - 자원 관리, 직렬화, 미들웨어, 로깅

  경계 판단: "이 로직이 없으면 비즈니스 결과가 달라지는가?" → YES면 ✅, NO면 ❌
  같은 규칙이 서비스/DB 두 계층에 있으면, 비즈니스 의사결정 계층에서만 생성.

  sequence 계층 구조:
  - 메인 흐름: "1", "2", "3", "4" (순차. 건너뜀 금지)
  - 분기 경로: "1-1", "1-2" (1번 단계에서 갈라지는 경로)
  - 중첩 분기: "2-1-1", "2-1-2" (2번의 1번 분기 안에서 다시 갈라짐)
  - sequence는 문자열로 출력

  도메인 커플링 (coupled_domain):
  - 이 함수의 주 도메인이 아닌 다른 도메인의 테이블 접근/규칙 구현 → 해당 도메인명
  - 자기 도메인이면 null. 대부분 null. 확실한 경우에만 채우세요.

  구체성 필수:
  - Given: 테이블명.컬럼명=값 형태. "DB 연결이 설정되어 있고" 같은 인프라 전제 금지.
  - When: 호출 파라미터를 실제 예시값으로.
  - Then: 변경되는 테이블명/컬럼명/값, 상태 전이(전→후), 에러 시 테이블 변경 없음 명시.
  - 실제 값 사용 필수. 코드 식별자(변수명, 함수명) 금지. 계산 결과 명시.


  {% if has_table_context | default(false) %}
  ★★★ 6. TABLE_INSIGHTS — 컨텍스트에 주어진 테이블만 ★★★
  컨텍스트(reads_writes)에 이미 식별된 테이블에 대해서만 작성:
  - tableName: 컨텍스트에 적힌 테이블명 그대로
  - description: 이 함수에서 이 테이블을 왜, 어떻게 사용하는지
  - columns: 코드에서 실제 사용된 컬럼만 (name + description)
  컨텍스트에 없는 테이블은 절대 추가하지 않는다. 새 테이블 발견/추정 금지.
  {% endif %}


  [EXAMPLE]
  각 필드의 올바른 작성법과 잘못된 작성법입니다. 이 수준의 디테일을 따르세요.

  ── summary ──
  ✅ "이 구간은 주문 결제를 처리하며, 주문금액이 0이면 오류코드 'PAY_ERR_001'과 '주문금액 오류' 메시지로 즉시 중단한다. 주문금액이 50,000원 이상이면 할인율을 10%로 설정하고, 최종 결제금액을 주문금액 × (100 - 할인율) / 100으로 산출한다. 결제수단이 정확히 'CARD'이면 카드번호와 최종금액으로 카드 승인을 요청하고, 승인결과코드가 '0000'이 아니면 'PAY_ERR_002'로 결제를 중단한다. 모든 검증을 통과하면 주문번호, 최종금액, 결제수단, 상태='COMPLETED'로 결제이력에 신규 등록하고, 주문 상태를 'PAID'로 변경한 뒤 최종금액을 반환한다."
  ❌ "결제를 처리하고 이력을 저장한다."
     → 분기 조건(50,000원 이상), 계산식(주문금액×(100-할인율)/100), 하드코딩 값('PAY_ERR_001', 'CARD', '0000'), 에러 처리 전부 누락.
  ❌ "PaymentService의 processPayment 메서드가 PaymentRequest를 받아 cardService.approve()를 호출하고 paymentHistoryDao.insert()로 저장한다."
     → 클래스명(PaymentService), 메서드명(processPayment, approve), 변수명(PaymentRequest, cardService, paymentHistoryDao) 등 코드 식별자가 포함됨. 비즈니스 맥락으로 풀어야 함.
  ❌ "등록용 정보 객체(paymentDTO)에 값을 담고, 검증용 임시 객체에 설정한다."
     → 객체명 포함, "담고"/"설정한다"가 임시인지 확정인지 불명확. "등록 정보를 구성하고 저장한다" 또는 "검증을 위해 정보를 준비한다"로 명확히.

  ── stereotype ──
  ✅ "Command" → payment_history에 INSERT하고 order 상태를 UPDATE하므로 Command
  ❌ "BusinessLogic" → 테이블에 쓰기(INSERT/UPDATE)가 있으면 BusinessLogic이 아니라 반드시 Command
  ❌ "Query" → SELECT만 하는 게 아니라 INSERT/UPDATE를 하므로 Query가 아님

  ── actor ──
  ✅ "" (빈 문자열) → 코드에 권한 체크(@PreAuthorize 등)나 역할 구분 로직이 없으므로 비워둠
  ❌ "고객" → 코드에 근거 없이 "결제니까 고객이겠지"라고 추측. 코드에 근거 없으면 절대 부여 금지

  ── scenarios ──
  ✅ 올바른 시나리오 (모든 분기 경로를 커버하고, 구체적 값 포함):
    seq="1": 주문금액이 0이면 결제를 거부한다
      Given: 입력 주문금액이 0원이다.
      When: 주문번호='ORD-001', 주문금액=0으로 결제를 요청한다.
      Then: 오류코드 'PAY_ERR_001'과 '주문금액 오류' 메시지를 반환하고, payment_history와 order에는 아무 변경이 없다.
    seq="2": 주문금액 50,000원 이상이면 할인율 10% 적용
      Given: 입력 주문금액이 80,000원이다.
      When: 주문번호='ORD-002', 주문금액=80000으로 결제를 요청한다.
      Then: 할인율 10% 적용, 최종금액=80000×(100-10)/100=72,000원 산출.
    seq="2-1": 주문금액 50,000원 미만이면 할인 없이 원금 그대로
      Given: 입력 주문금액이 30,000원이다.
      When: 주문번호='ORD-003', 주문금액=30000으로 결제를 요청한다.
      Then: 할인율 0%, 최종금액=30,000원.
    seq="3": 카드 결제 시 승인 실패하면 중단
      Given: 주문금액=80000, 결제수단='CARD', 카드번호='1234-5678'.
      When: 카드 승인을 요청한다.
      Then: 승인결과코드가 '0000'이 아니면 'PAY_ERR_002' 반환, payment_history/order 변경 없음.
    seq="4": 모든 검증 통과 시 결제이력 등록 + 주문 상태 변경
      Given: 주문금액=80000, 할인율=10%, 최종금액=72000, 결제수단='CARD', 카드승인='0000'.
      When: 결제를 완료한다.
      Then: payment_history에 order_id='ORD-002', amount=72000, pay_method='CARD', status='COMPLETED' INSERT. order의 status를 'PAID'로 UPDATE.
      coupled_domain: "order" (결제 함수가 주문 테이블 상태를 직접 변경 → 다른 도메인 커플링)

  ❌ 잘못된 시나리오 1:
    seq="1": 입력 검증
      Given: DB 연결이 설정되어 있다.
      When: 결제를 요청한다.
      Then: 검증에 실패하면 오류를 반환한다.
    → "DB 연결이 설정"은 인프라 전제(Given에서 금지). "결제를 요청"은 파라미터 없음. "오류를 반환"은 어떤 오류코드인지 불명. 테이블 영향 불명.
  ❌ 잘못된 시나리오 2:
    seq="1": 결제 처리
      Given: 주문이 존재한다.
      When: processPayment(req)를 호출한다.
      Then: paymentHistoryDao.insert()가 호출되어 데이터가 INSERT되고 커밋된다.
    → 함수명(processPayment), DAO명(paymentHistoryDao) 사용. "주문이 존재한다"는 구체적 값 없음. "INSERT되고 커밋된다"는 어떤 컬럼에 어떤 값인지 불명.

  ── tableInsights ──
  ✅ {"tableName": "payment_history", "description": "주문 결제 완료 후 결제이력을 신규 등록한다.", "columns": [{"name": "order_id", "description": "결제 대상 주문 식별자"}, {"name": "amount", "description": "할인 적용 후 최종 결제금액"}, {"name": "pay_method", "description": "결제수단 코드"}, {"name": "status", "description": "결제 상태"}]}
  ❌ {"tableName": "결제이력", "description": "데이터를 저장한다."}
     → 한글 추상명 금지(실제 테이블명 사용). description 이 추상적.
  ❌ {"tableName": "paymentHistoryDao"}
     → DAO 클래스명을 테이블명으로 넣으면 안 됨. 실제 DB 테이블명을 사용.


