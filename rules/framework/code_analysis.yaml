name: "code_analysis"
description: "함수 단위 코드 분석 — summary, stereotype, actor, rules/examples/questions, tableInsights, dependencies"
version: "6.1"

input_schema:
  required:
    - code
    - startLine
    - endLine
    - locale
  optional:
    - context
    - field_initial_values
    - table_sample_data
    - constants_context
    - codebase_conventions

prompt: |
  [ROLE]
  {{ language | default("Java") }} 함수 분석 전문가. summary, stereotype, actor, dependencies, tableInsights, rules, examples, questions 를 추출.
  응답 언어: {{ locale }}


  [INPUT]  주어진 섹션만 활용. 없는 내용은 추측 금지.

  {% if context %}── [부모 컨텍스트] ── 연결된 SQL/Config/Class + called_method_summaries(참고용)
  {{ context }}
  {% endif %}
  {% if field_initial_values %}── [필드 초기값] ── 선언 시 초기값
  {{ field_initial_values }}
  {% endif %}
  {% if table_sample_data %}── [테이블 정보] ── 이 함수가 접근하는 테이블의 제약조건·컬럼·샘플
  {{ table_sample_data }}
  {% endif %}
  {% if constants_context %}── [상수 컨텍스트] ── 상수명→실제값 (summary/examples 에서 실제 값으로 치환)
  {{ constants_context }}
  {% endif %}
  {% if codebase_conventions %}── [코드베이스 컨벤션] ── 이 프로젝트의 반복 관찰 패턴 (프레임워크 관용구·데이터 접근 관용구·네이밍/이디엄). 아래 [Rule 후보/제외] 판정 시 일반 원칙보다 **이 컨벤션을 우선 참조**.
  {{ codebase_conventions }}
  {% endif %}
  ── [분석 대상 코드] ── (L{{ startLine }}-{{ endLine }} {{ language | default("Java") }})
  {{ code }}


  ─────────────────────────────
  [1] SUMMARY — 있는 것만, 있는 만큼
  ─────────────────────────────
  함수 본문에 **실제 존재하는 요소만** 원본 코드를 재작성할 수 있을 정도로 구체적으로 기술. 분량은 내용에 비례(짧은 함수는 1~2문장도 가능, 복잡하면 5문장 이상도 가능).

  포함 대상(있을 때만): 계산식·분기 조건과 결과·하드코딩 값·상수·NULL/예외 처리·호출 순서·테이블 조작.
  ※ 해당 요소가 없으면 **그 항목 자체를 언급하지 말 것**. "~는 없다/수행하지 않는다" 식 부재 보고 금지.
  ※ 본 지시문의 예시어는 설명용이며 출력에 복사 금지.

  식별자 규칙:
  - 제거: 메서드명·로컬변수명·파라미터명·클래스명 → 의미로 설명
  - 보존: 엔티티 필드명·enum·상태값·상수값 (실제 코드에 나타난 것만)
  - [상수 컨텍스트] 상수는 실제 값으로 치환
  - "이상"≠"초과", "이하"≠"미만" 정확히
  - 아키텍처 레이어명(Controller/Service/Repository) 금지
  {% if table_sample_data or has_table_context | default(false) %}
  테이블 조작 포함: INSERT=삽입 컬럼·값 출처·DEFAULT·UNIQUE / UPDATE=변경 전→후·WHERE / DELETE=WHERE·FK영향
  {% endif %}


  ─────────────────────────────
  [2] STEREOTYPE — 실제 동작 기준
  ─────────────────────────────
  허용 목록: {{ valid_stereotypes | default(["Init", "Query", "Command", "Handler", "Validation"]) }}

  이름 패턴보다 실제 동작(테이블 접근·상태 변경) 우선:
  - Command: INSERT/UPDATE/DELETE·상태 변경·외부 쓰기
  - Query: SELECT 만
  - Init: 초기화(main/init/setup/@PostConstruct)
  - Handler: 이벤트·요청·콜백 처리(안에서 R/W 해도 Handler 우선)
  - Validation: 검증만. 검증 후 쓰기 있으면 Command
  {% if is_oop | default(true) %}
  - Endpoint(@Mapping/@route), Getter/Setter(단순 필드), Lifecycle(@PreDestroy), Scheduled(@Scheduled/cron), Transactional(로직있으면 Command)
  {% endif %}


  ─────────────────────────────
  [3] ACTOR — 코드 근거 있을 때만
  ─────────────────────────────
  부여: 권한/역할 체크·주석 명시·함수명/URL에 역할·배치→"system"
  비움(""): 근거 없음 (DB CRUD·유틸·인프라)
  {{ locale }} 로 표현 (ROLE_ADMIN → "관리자"). "생성함수니까 admin" 같은 추론 금지.

  {% if is_oop | default(true) %}
  ─────────────────────────────
  [4] DEPENDENCIES — UML 관계 (OOP)
  ─────────────────────────────
  본문에서 사용되는 사용자 정의 클래스:
  - usage: parameter | return | local_new | local_var | cast | generic | field_call
  - relationType:
    - COMPOSITION: new 로 직접 생성·생명주기 종속
    - AGGREGATION: 외부 주입·생명주기 독립
    - ASSOCIATION: 필드 참조(DI 서비스/리포지토리)
    - DEPENDENCY: 비필드(파라미터·반환·로컬)
  - 제외: primitive·wrapper·String·Object·컬렉션·표준 라이브러리
  {% endif %}


  ─────────────────────────────
  [5] RULES / EXAMPLES / QUESTIONS — Example Mapping
  ─────────────────────────────
  비즈니스 로직을 Rule(규칙) + Example(예시) + Question(모호) 로 분해. 기술 관심사 제외.

  ★ [코드베이스 컨벤션] 이 주어지면 아래 신호 목록보다 **컨벤션을 우선** 적용:
  - 프로젝트의 에러 처리 매크로·래퍼는 NOT_BIZ (규칙 아님)
  - 데이터 접근 래퍼 함수(CRUD 컨벤션에 따른 이름·구조)는 그 **업무 시맨틱** 을 Rule 1개 이상으로 반영
  - 동일 네이밍 패턴의 함수는 동일 기준으로 판정 (일관성)

  [Rule 후보 (하나라도 맞으면 O)]
  □ 도메인 임계값·값 (₩50,000 이상·할인율 10%·재고 0)
  □ 역할/상태/유형 차등 (VIP↔일반·대기→승인·CARD↔BANK)
  □ 엔티티·컬럼 값 분기 (order.status='PAID'이면…)
  □ 도메인 계산식 (단가×수량×(1-할인율))
  □ 정책 상수·비즈니스 예외 throw (InsufficientFundsException, AccountFrozenException)

  [Rule 제외 (하나라도 맞으면 X)]
  □ DI·프레임워크 콜백·로깅·메트릭·DTO↔Entity·SQL 바인딩·트랜잭션 관리·캐시·쓰레드풀·재시도
  □ 순수 기술 예외 (SQLException 래핑 — 정책 없음)
  □ 순수 방어 null/empty 체크 (아래 구분 참조)
  □ ★ [코드베이스 컨벤션] Block 1·Block 2 에 "이 프로젝트의 반복 관용구" 로 기술된 것은 Rule 아님.
    예: Block 1 의 에러/예외 처리 관용구로 감싼 단순 호출, Block 2 의 접근 호출 반환 메타데이터 단순 체크 등.
    (관용구 자체는 기술 구조. 관용구 안에서 **도메인 값의 분기·정책 의미** 가 드러날 때만 Rule)

  [NULL/빈값 구분 — 자주 실수]
  O Rule: 도메인 식별자(청구번호·주문번호·계좌번호) NULL 검증 / 필수 입력(업무구분·결제수단) 검증 /
         NULL→기본값 치환(EDI구분 NULL→'X') / 조건부 필수(간편결제면 고객번호 필수)
         ★ 함수명이 *_validation/*_check_*/input_validation 이면 안의 NULL 체크는 기본 도메인 정책
  X Rule: 내부 헬퍼의 인자 null 체크 / 프레임워크 경계 방어 / Objects.requireNonNull 일반 사용

  [애매하면 결정 질문]
  "이 조건을 제거하면 사용자(고객/정산/감사) 결과가 달라지는가?" YES→Rule / NO→제외

  [Rule 필드]
  - statement: "<조건>이면 <결과>" 10~30자. 코드 식별자 금지(엔티티 필드명은 OK).
  - rule_id: "R1", "R2", ... (개수 제한 없음 — 실제 관찰된 도메인 규칙 수만큼)
  - flow_id: "1","2"(메인)·"1-1"(R1 분기)·"2-1-1"(중첩)
  - guard_rule_id: 선행 Rule 통과 전제이면 "R1", 없으면 null (★ 선행 검증 있으면 반드시 명시)
  - branch_from: if/else/switch 갈래면 분기 원 Rule id, 없으면 null
  - coupled_domains: [] 기본. 타 도메인 테이블 WRITE·값 분기·enum 지정·계산 참여 시 도메인명 추가.
    (FK read 만·API 호출·읽기 후 복사 = 커플링 아님)
  예외 throw(비즈니스 정책) = 독립 Rule 로 승격.

  ★ Rule 개수 원칙:
  - **인위적 상·하한 없음.** 실제 관찰된 도메인 규칙 수만큼 기록한다.
  - 단순 위임/에러처리만 있는 함수는 **Rule 0 이 정답** (억지로 채우지 말 것).
  - 분기가 많은 함수는 분기 수만큼 Rule 을 둬도 된다 (축약보다 누락이 더 나쁘다).
  - 단, 같은 패턴의 **값마다 Rule 을 쪼개는 과한 세분화는 금지** —
    복수 값/필드는 1 Rule + 값마다 Example 로 표현한다.
  ★ 하위 함수 호출: called_method_summaries 는 참고만. 본문 코드에 직접 있는 것만 Rule.

  [Example 구조 — 하이브리드(자연어 + JSON)]
  GWT 시맨틱: given=초기상태 / when=행위 / then=결과

  rule_id      : 참조 Rule id
  description  : 사람용 한 줄 요약
  given        : JSON 객체 {
                   "narrative": "초기 상태 1~2문장 요약",
                   "inputs": { 파라미터 key:value },
                   "preconditions": { "globals": {...}, "stubs": {외부호출 반환값} }
                 }
  when         : 자연어 한 줄 ("결제 요청"·"출금 요청"). 메서드명·클래스명 금지.
  then         : JSON 객체 {
                   "narrative": "결과 1~2문장 요약",
                   "return": 반환값(없으면 null),
                   "exception": null 또는 {"type":"...","code":"...","message":"..."},
                   "writes": [{"table":"...","op":"INSERT|UPDATE|DELETE","where":{},"values":{}}],
                   "globals": {변경된 전역},
                   "out_params": {변경된 OUT}
                 }
  is_boundary  : true/false

  원칙:
  - given.inputs = 이 Rule 까지 도달 가능한 전체 입력(선행 가드 통과값 포함)
  - then = 관찰 가능한 모든 변화(반환·예외·DB·전역·OUT) 빠짐없이
  - 변경 없으면 {} / [] (필드 생략 금지)
  - 값은 실제 리터럴만 (변수명·메서드명 금지)
  - JSON 유효 형식(주석·트레일링 콤마 금지)

  [Example 필수 규칙]
  - Rule 당 최소 2개 (일반값 1 + 경계값 1)
  - "X 이상/이하/초과/미만" 조건 → X / X±1 중 2개 is_boundary=true
  - 예외 throw Rule → 발생 Example + 성공 Example
  - ★ 1 Rule 이 **복수 필드·복수 분기** 를 한 문장으로 커버하면 → 각 필드/분기마다 **최소 Example 1개씩** 별도 작성.
    (예: "A·B·C 가 공백이면 거부" Rule → A 공백 / B 공백 / C 공백 3개 Example)
  - ★ 분기가 많은 Rule (if/else/switch 갈래) → 분기별 Example 1개 이상 필수. 1개로 뭉뚱그리지 말 것.

  [Question 구조]
  - text: 코드로 답할 수 없는 모호함
  - reason: 코드 근거가 없는 이유
  원칙: 추측 대신 Question. 0개도 OK, 최대 3개.

  {% if has_table_context | default(false) %}
  ─────────────────────────────
  [6] TABLE_INSIGHTS — 컨텍스트 테이블만
  ─────────────────────────────
  컨텍스트(reads_writes) 에 이미 식별된 테이블만. 새 테이블 추정 금지.
  - tableName: 컨텍스트 그대로
  - description: 이 함수에서 왜·어떻게 사용
  - columns: 코드에서 실제 사용된 컬럼만 (name + description)
  {% endif %}


  ─────────────────────────────
  [FEW-SHOT]  결제 함수 예시
  ─────────────────────────────
  ✅ summary: "이 구간은 주문 결제를 처리하며, 주문금액이 0이면 오류코드 'PAY_ERR_001'과 '주문금액 오류' 메시지로 즉시 중단한다. 주문금액 50,000원 이상이면 할인율을 10%로 설정하고 최종금액을 주문금액×(100-할인율)/100 으로 산출한다. 결제수단이 'CARD'이면 카드번호와 최종금액으로 승인을 요청하고 승인결과가 '0000'이 아니면 'PAY_ERR_002'로 중단한다. 검증 통과 시 주문번호·최종금액·수단·상태='COMPLETED'로 결제이력에 신규 등록하고 주문 상태를 'PAID'로 변경한 뒤 최종금액을 반환한다."
  ❌ "결제를 처리하고 이력을 저장한다." (분기·계산식 누락)
  ❌ "PaymentService.processPayment 가 ..." (클래스/메서드명 포함)

  ✅ stereotype: "Command" (payment_history INSERT + order UPDATE)
  ✅ actor: "" (코드에 역할 체크 없음)

  ```json
  "rules": [
    {"rule_id":"R1","flow_id":"1","guard_rule_id":null,"branch_from":null,
     "statement":"주문금액이 0이면 결제를 거부한다","coupled_domains":[]},
    {"rule_id":"R2","flow_id":"2","guard_rule_id":"R1","branch_from":null,
     "statement":"주문금액 50,000원 이상이면 10% 할인","coupled_domains":[]},
    {"rule_id":"R3","flow_id":"2-1","guard_rule_id":"R1","branch_from":"R2",
     "statement":"주문금액 50,000원 미만이면 할인 없음","coupled_domains":[]},
    {"rule_id":"R4","flow_id":"3","guard_rule_id":"R2","branch_from":null,
     "statement":"카드 승인코드가 '0000'이 아니면 결제 중단","coupled_domains":[]},
    {"rule_id":"R5","flow_id":"4","guard_rule_id":"R4","branch_from":null,
     "statement":"검증 통과 시 결제이력 등록 + 주문 상태 'PAID' 변경","coupled_domains":["order"]}
  ],
  "examples": [
    {
      "rule_id":"R1","is_boundary":true,
      "description":"주문금액 0원 — 경계값, 즉시 거부",
      "given":{
        "narrative":"주문번호·결제수단 유효, 금액은 정확히 0",
        "inputs":{"order_id":"ORD-001","order_amount":0,"payment_method":"CARD"},
        "preconditions":{"globals":{},"stubs":{}}
      },
      "when":"결제 요청",
      "then":{
        "narrative":"PAY_ERR_001 반환, 테이블 변경 없음",
        "return":"PAY_ERR_001","exception":null,"writes":[],
        "globals":{},"out_params":{"err_msg":"주문금액 오류"}
      }
    },
    {
      "rule_id":"R1","is_boundary":false,"description":"음수 입력도 거부",
      "given":{"narrative":"음수도 R1 에 부합","inputs":{"order_id":"ORD-002","order_amount":-500,"payment_method":"CARD"},"preconditions":{"globals":{},"stubs":{}}},
      "when":"결제 요청",
      "then":{"narrative":"PAY_ERR_001 반환","return":"PAY_ERR_001","exception":null,"writes":[],"globals":{},"out_params":{}}
    },
    {
      "rule_id":"R2","is_boundary":true,"description":"50,000원 — 경계값, 할인 적용",
      "given":{"narrative":"정확히 경계값, '이상' 포함 확인","inputs":{"order_id":"ORD-003","order_amount":50000,"payment_method":"CARD"},"preconditions":{"globals":{},"stubs":{}}},
      "when":"할인 계산",
      "then":{"narrative":"할인율 10%, 최종 45,000","return":null,"exception":null,"writes":[],"globals":{"discount_rate":10,"final_amount":45000},"out_params":{}}
    },
    { "rule_id":"R3","is_boundary":true,"description":"49,999원 — 경계값 바로 아래, 할인 없음",
      "given":{"...":"inputs.order_amount=49999, CARD"},
      "when":"할인 계산",
      "then":{"...":"discount_rate=0, final_amount=49999"}
    },
    { "rule_id":"R4","is_boundary":false,"description":"카드 승인 실패 — 중단",
