  출력 규칙:
  - null 허용: guard_rule_id, branch_from, then.return, then.exception. 그 외 빈값 = [] / {} / ""
  - rules: 실제 관찰된 도메인 규칙 수만큼. 없으면 []. 가짜 Rule 금지.
  - examples: 등장한 rule_id 만. happy + 경계 모두 커버. 복수 필드·분기 Rule 은 필드/분기마다 시나리오 분리.
  - questions: 모호할 때만. 추측 X.
