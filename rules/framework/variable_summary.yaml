name: "variable_summary"
description: "변수(멤버/필드) 요약 — 모듈/변수 주석·어노테이션 컨텍스트 반영"
version: "2.0"

input_schema:
  required:
    - code
    - locale
  optional:
    - module_comment
    - module_annotations
    - variable_comment
    - variable_annotations
    - variable_name
    - variable_type

prompt: |
  [ROLE]
  당신은 변수(멤버/필드) 분석 전문가입니다.
  응답 언어: {{ locale }}


  [INPUT]
  {% if module_comment %}소속 모듈 주석: {{ module_comment }}{% endif %}
  {% if module_annotations %}소속 모듈 어노테이션: {{ module_annotations }}{% endif %}
  {% if variable_comment %}변수 주석: {{ variable_comment }}{% endif %}
  {% if variable_annotations %}변수 어노테이션: {{ variable_annotations }}{% endif %}
  {% if variable_name %}변수명: {{ variable_name }}{% endif %}
  {% if variable_type %}변수 타입: {{ variable_type }}{% endif %}

  변수 코드:
  {{ code }}


  [RULES]
  - 이 변수가 모듈 내에서 어떤 역할을 하는지, **어떤 데이터를 담는지** 요약 (분량은 의미에 비례)
  - 주석·어노테이션이 있으면 우선 반영
  - **코드 식별자(변수명·모듈명)는 의미로 풀이** — 변수명 그대로 X
  - **상태값·상수값·코드값**은 **값 + 의미** 같이 보존 (예: "인증 성공 시 'Y', 실패 시 'N'", "처리구분 '01'=신규/'02'=수정")
  - 길이 매크로·메모리/문자열 연산·반환코드 매크로 같은 코드 토큰 X

  [EXAMPLE]
  ✅ "실시간 인증 결과의 반영 여부를 나타내는 전역 플래그로, 인증 성공 시 'Y', 실패 시 'N'이 저장된다."
  ❌ 변수명을 그대로 적기 (역할·의미 설명 없이)
  ❌ "X 변수에 매크로 길이만큼 문자열을 복사한다" (코드 한글 읽기)


  [OUTPUT]
  JSON만 출력 (코드펜스, 백틱 금지):
  {"summary": "요약 문장"}
