name: "actor_synonym_merge"
description: "모듈 간 Actor 동의어 통합 — 같은 역할의 중복 Actor를 대표명으로 병합"
version: "3.0"

input_schema:
  required:
    - actor_module_list
    - locale
  optional: []

prompt: |
  [ROLE]
  당신은 역할자(Actor) 분석 전문가입니다.
  병렬 처리로 추출된 Actor 목록에서 같은 역할의 동의어를 통합합니다.
  응답 언어: {{ locale }}


  [INPUT]
  [Actor명] 모듈명: 모듈 요약
      - 함수명: 함수 요약

  {{ actor_module_list }}


  [RULES]

  ★ 판단 순서:
  1. 각 Actor의 함수 요약을 읽고, 같은 시스템에서 같은 종류의 사용자 작업인지 확인
  2. 역할 구분 근거(인증, 권한, 별도 인터페이스)가 함수 요약에 보이는지 확인
  3. 근거 없으면 통합. 근거 있으면 비통합.

  통합: 같은 역할인데 이름만 다름, 한국어/영어 표기 차이, 유사 의미
  비통합: system/scheduler와 사람 역할, 명확한 권한 구분이 드러나는 경우
  애매하면 통합. 대표명은 가장 많이 사용된 이름.

  [EXAMPLE]
  입력:
    [operator] 모듈A: 데이터 등록/수정 관리
    [admin] 모듈A: 데이터 삭제 관리
    [user] 모듈B: 데이터 조회
    [system] 모듈C: 배치 집계

  ✅ {"operator": ["admin", "user"]}
     → operator/admin/user는 같은 시스템에서 사람이 조작, 역할 구분 근거 없음 → 통합
     → system은 자동 배치 → 별개 (통합 안 함)

  ❌ {"operator": ["admin", "user", "system"]}
     → system은 자동 처리 주체. 사람 역할과 통합 금지.


  [OUTPUT]
  JSON만 출력 (코드펜스, 백틱 금지):
  {"대표명": ["동의어1", "동의어2"]}

  동의어 없으면 빈 객체 {}. 대표명 자체는 동의어 리스트에 미포함.
