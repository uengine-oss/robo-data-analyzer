name: "actor_synonym_merge"
description: "모듈 간 Actor 동의어 통합 — 같은 역할의 중복 Actor를 하나의 대표명으로 병합"
version: "2.0"

input_schema:
  required:
    - actor_module_list
    - locale
  optional: []

prompt: |
  [ROLE]
  당신은 소프트웨어 시스템의 역할자(Actor) 분석 전문가입니다.
  레거시 코드 분석에서 추출된 Actor 목록을 검토하여, 같은 역할을 의미하는 동의어를 통합합니다.
  이 작업은 코드를 분석하는 파이프라인의 후처리 단계이며, 병렬 처리로 인해 같은 역할이 여러 이름으로 추출된 것을 정리하는 것이 목적입니다.

  [LANGUAGE_SETTING]
  응답 언어: {{ locale }}

  [INPUT_DATA]
  다음은 각 모듈에서 추출된 Actor와 해당 모듈/함수의 요약입니다.

  형식:
  [Actor명] 모듈명: 모듈 요약
      - 함수명: 함수 요약 (이 Actor가 트리거하는 함수)

  {{ actor_module_list }}

  [TASK]
  위 목록에서 **같은 역할을 의미하는 Actor**를 찾아 하나의 대표명으로 통합하세요.
  같은 모듈 내 동의어는 이전 단계에서 이미 처리되었으므로, 여기서는 **서로 다른 모듈에 걸쳐 있는 동의어**를 처리합니다.

  ★★★ 판단 체계 (이 순서대로 판단하세요) ★★★

  Step 1: 각 Actor가 어떤 함수를 트리거하는지 함수 요약을 읽으세요.

  Step 2: 서로 다른 Actor의 함수들이 "같은 시스템에서 같은 종류의 사용자가 수행하는 작업"인지 판단하세요.
    판단 기준:
    - 같은 시스템의 같은 인터페이스(콘솔, 웹, API 등)를 사용하는가?
    - 함수들이 CRUD(생성/조회/수정/삭제) 패턴으로 같은 도메인 대상을 다루는가?
    - 함수 요약에서 역할을 구분하는 근거(인증, 권한 체크, 별도 인터페이스)가 보이는가?

  Step 3: 판단 결과에 따라 처리하세요.

  ● 통합해야 하는 경우 (동의어):
    - 같은 시스템에서 같은 사용자가 수행하는 작업인데 이름만 다른 경우
    - 한국어/영어 표기 차이 (같은 의미의 다른 언어 표현)
    - 유사한 의미의 다른 표현 (같은 역할을 다르게 부르는 것)
    - 함수 요약에서 역할 구분 근거(인증, 권한, 별도 인터페이스)가 보이지 않는 경우
      → 구분할 근거가 없으면 통합이 안전합니다

  ● 통합하지 않는 경우 (별개의 역할):
    - 자동 처리 주체(system/scheduler/batch)와 사람이 직접 조작하는 역할 → 근본적으로 다른 주체
    - 함수 요약에서 명확히 다른 인터페이스/진입점을 사용하는 것이 드러나는 경우
    - 함수 요약에서 인증/권한 체크가 있어 역할이 구분되는 경우

  ● 애매한 경우:
    → 통합하세요. 불필요하게 세분화하는 것보다 하나로 합치는 것이 안전합니다.
    → 진짜 다른 역할이었다면 코드에 분명한 구분 근거가 있었을 것입니다.

  ★★ 대표명 선택 원칙:
  - 가장 많은 함수에서 사용된 Actor명을 대표명으로 선택하세요.
  - 빈도가 같으면 더 명확하고 일반적인 이름을 선택하세요.
  - 한국어와 영어가 섞여있으면 입력 데이터에서 더 많이 사용된 언어로 통일하세요.

  ★★ 예시:
  입력:
    [operator] 모듈A: 데이터를 등록하고 수정하는 관리 서비스
    [admin] 모듈A: 데이터를 삭제하는 관리 서비스
    [user] 모듈B: 데이터를 조회하는 서비스
    [system] 모듈C: 배치로 데이터를 집계하는 서비스

  판단:
    - "operator"와 "admin" → 같은 모듈에서 관리 작업 → 통합
    - "operator"와 "user" → 모듈이 다르지만 같은 시스템에서 사람이 조작 → 통합
    - "system" → 자동 배치 처리 → 별개

  출력: {"operator": ["admin", "user"]}

  [OUTPUT]
  다음 JSON만 출력하세요 (코드펜스, 백틱 금지):
  {"대표명": ["동의어1", "동의어2"], "대표명2": ["동의어3"]}

  통합할 동의어가 없으면 빈 객체 {} 출력.
  대표명 자체는 동의어 리스트에 포함하지 마세요.
