  ★★ 테이블 조작(INSERT/UPDATE/DELETE) 시 필수 포함 사항 ★★
  [테이블 스키마 정보]가 제공된 경우, 반드시 아래 정보를 summary에 포함하세요:

  INSERT 시:
  - 삽입되는 모든 컬럼명과 각 값의 출처(파라미터/기본값/계산값) 명시
  - DEFAULT 값이 있는 컬럼이면 기본값을 명시 (예: "status는 기본값 'AVAILABLE'로 설정된다")
  - UNIQUE 제약 컬럼이면 중복 시 동작을 명시 (예: "isbn은 UNIQUE 제약으로 중복 시 오류 발생")
  - AUTO_INCREMENT/SEQUENCE가 있으면 명시

  UPDATE 시:
  - 변경 전 → 변경 후 상태를 반드시 명시 (예: "status를 'AVAILABLE'에서 'LOANED'로 변경")
  - WHERE 조건에 사용되는 컬럼과 값 명시

  DELETE 시:
  - WHERE 조건 명시
  - FK 제약이 있는 테이블이면 참조 무결성 영향 명시


