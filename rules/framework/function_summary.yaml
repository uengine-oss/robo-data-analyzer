  [SECTION_2_DEPENDENCIES]
  ★ 클래스 간 관계 추출 (UML 관계 판별):

  메서드 본문에서 사용되는 사용자 정의 클래스를 식별하고,
  각각의 UML 관계 타입(DEPENDENCY / COMPOSITION / AGGREGATION)을 판별합니다.
  
  식별 대상과 usage 분류:
  - "parameter": 메서드 파라미터 타입 → `void attack(Enemy enemy)` → Enemy
  - "return": 반환 타입 → `Order findOrder()` → Order
  - "local_new": new 연산자 생성 → `Customer c = new Customer()` → Customer
  - "local_var": 메서드 내 로컬 변수 타입 → `Order order = service.findById()` → Order
  - "cast": 캐스팅 → `(PaymentService) service` → PaymentService
  - "generic": 제네릭 내부 타입 → `List<Product> products` → Product
  - "field_call": 필드를 통한 호출 → `userRepository.findById()` → UserRepository
  
  제외 대상:
  - primitive 타입, wrapper 타입, String, Object
  - 컬렉션 자체 (List, Map, Set) - 단, 제네릭 내부 타입은 추출
  - {{ language | default("Java") }} 표준 라이브러리 클래스 (Exception, Date, Optional 등)
  
  sourceMember 결정:
  - 메서드 안: 메서드명 (예: "processOrder", "attack")
  - 생성자 안: 생성자명/클래스명 (예: "OrderService")
  
  ★ relationType 판별 (4가지 중 하나 선택):

  "COMPOSITION" — 필드 기반 + 생명주기 종속:
  - 이 메서드(또는 클래스)가 해당 객체를 직접 new로 생성/관리
  - 전체 없이 부분이 존재할 수 없는 강한 소유
  - 예: `cuzMsg = new CustomizeMessage()` → usage: "field_call", relationType: "COMPOSITION"

  "AGGREGATION" — 필드 기반 + 생명주기 독립:
  - 전체-부분 관계이지만 부분이 독립적으로 존재 가능
  - 외부에서 주입받거나 공유 가능한 객체 (컬렉션 포함)
  - 예: `this.employees.add(emp)` → usage: "field_call", relationType: "AGGREGATION"

  "ASSOCIATION" — 필드 기반 + 단순 참조 (전체-부분 아님):
  - 필드로 다른 클래스를 참조하지만 소유/부분 관계가 아닌 동등한 연관
  - DI로 주입받는 서비스/리포지토리 참조, 단순 필드 타입 참조
  - 예: `@Autowired UserRepository userRepo` → usage: "field_call", relationType: "ASSOCIATION"
  - 예: `private PaymentService paymentService` → usage: "field_call", relationType: "ASSOCIATION"

  "DEPENDENCY" — 비필드 기반 사용 (위 셋에 해당하지 않는 모든 경우):
  - 파라미터/반환/로컬변수/캐스팅/제네릭 등 비필드 기반 사용
  - 예: `KBData kbData` (파라미터) → usage: "parameter", relationType: "DEPENDENCY"
  {% endif %}




  



  [SECTION_ACTOR]
  ★ 액터(actor) 식별:

  ★★★ 핵심 원칙: 코드에 근거가 있을 때만 Actor를 부여하세요. 추측하지 마세요. ★★★

  Actor는 "이 함수를 호출하는 주체의 역할"이 **코드에서 드러날 때만** 부여합니다.

  ★★ Actor를 부여하는 경우 — 코드에서 근거를 찾을 수 있을 때:
  - 권한/역할 체크 로직이 있는 경우
    (어떤 언어/프레임워크든: if문, 어노테이션, 데코레이터, 미들웨어, 파라미터 검사 등)
  - 주석/문서에 호출 주체가 명시된 경우
    ("고객 요청 처리", "배치에서 호출", "관리자 전용" 등)
  - 함수명/서비스명/URL 패턴에 역할이 포함된 경우
    (admin_create, /api/customer/*, batch_process, @Scheduled 등)
  - 자동 실행(배치/스케줄러/타이머/이벤트 리스너)이 코드에서 명확한 경우 → "system"

  ★★ Actor를 비워두는 경우 (""):
  - 코드에 호출자 역할을 구분하는 어떤 근거도 없는 경우
  - 누가 호출하든 동일하게 동작하는 함수
  - DB CRUD 함수 (INSERT/SELECT/UPDATE/DELETE 실행하는 저수준 데이터 접근 함수)
  - 유틸리티/헬퍼 함수 (범용 변환, 포맷팅, 파싱 등)
  - 인프라 함수:
    · 프로그램 진입점 (main, WinMain, entry point)
    · 네트워크/소켓 처리 (accept, connect, recv, send, handle_client, listen 등)
    · 시그널/이벤트 핸들러 (signal_handler, SIGTERM/SIGINT 처리 등)
    · 초기화/정리 (init, setup, cleanup, teardown 등)
    · 이벤트 루프/디스패처 (event_loop, message_pump, dispatch 등)
    · 프로세스/스레드 관리 (fork, spawn, thread_create 등)
  - 이 함수들은 비즈니스 행위 주체가 아니라 기술적 실행 환경이므로 Actor를 부여하지 마세요

  ★★ 절대 금지:
  - "생성 함수니까 admin", "조회 함수니까 user" 같은 일반적 추측 금지
  - 코드에 근거 없이 도메인 지식으로 역할을 추론하지 마세요
  - "비즈니스 함수이니까 Actor가 있어야 한다"는 가정 금지
  - 코드에 역할 구분이 없는데 억지로 Actor를 만들지 마세요

  ★★ Actor 명칭 선택:
  - 코드에서 드러나는 역할의 **의미**를 {{ locale }}로 표현하세요
  - 코드 상수명/열거값을 그대로 쓰지 말고, 역할의 의미를 번역하세요
    예: ROLE_ADMIN → "관리자", USER_TYPE_EXTERNAL → "외부 사용자", SYS_BATCH → "시스템 배치"
  - 같은 모듈의 다른 함수와 일관된 명칭을 사용하세요
  - 동의어 통합은 이후 단계에서 자동 처리됩니다


  [SECTION_5_STEREOTYPE]
  ★ 스테레오타입 판단 (stereotype 필수):

  어노테이션, 이름 패턴, 코드 의미, 아키텍처 노드(SQL·Config·Class) 정보를 종합하여 아래 목록 중 **하나만** 선택하세요.
  ⚠️ 반드시 아래 허용 목록에 있는 값만 사용하세요:

  허용 목록: {{ valid_stereotypes | default(["Init", "Query", "Command", "Handler", "Validation", "BusinessLogic"]) }}

  ★★ 판단 최우선 원칙: 이름 패턴보다 실제 동작(테이블 접근, 상태 변경)이 우선 ★★

  각 스테레오타입 판단 기준:

  - **Command**: 다음 중 하나라도 해당하면 Command:
    (1) 테이블에 INSERT/UPDATE/DELETE를 수행
    (2) 상태값을 변경 (status, is_active 등의 컬럼을 UPDATE)
    (3) 트랜잭션을 커밋 (commit)
    (4) 외부 시스템에 쓰기 요청
    ★ 메서드 이름이 get/find/search여도, 테이블에 쓰면 Command
    ★ 이름 패턴 참고: create, save, update, delete, process, execute

  - **Query**: 다음 모두 해당할 때만 Query:
    (1) SELECT만 수행 (INSERT/UPDATE/DELETE 없음)
    (2) 데이터를 변경하지 않음
    (3) 결과를 반환만 함
    ★ 메서드 이름이 process/execute여도, 읽기만 하면 Query
    ★ 이름 패턴 참고: findBy, getBy, select, search, list, fetch

  - **Init**: 초기화 함수 (main, init_, setup, @PostConstruct, __init__)
  - **Handler**: 이벤트/신호/요청/콜백 처리.
    ★ 함수명에 handler/handle이 포함되거나, 시그널/이벤트/요청을 받아 처리하면 Handler.
    예: signal_handler, handle_client, handle_request, on_message, ISR, @EventListener, callback
    ★ Handler 안에서 데이터를 읽거나 써도 Handler. Query/Command보다 Handler가 우선.
  - **Validation**: 검증 (validate, check, verify). 단, 검증 후 테이블에 쓰면 Command.
  - **BusinessLogic**: Command도 Query도 아닌 순수 계산/변환 로직.
    ★ 테이블에 쓰면 BusinessLogic이 아니라 Command
    ★ 테이블을 읽으면 BusinessLogic이 아니라 Query
    ★ 테이블 접근이 전혀 없는 순수 로직만 BusinessLogic
  {% if is_oop | default(true) %}- **Endpoint**: REST API 엔드포인트 (@GetMapping, @PostMapping, @app.route)
  - **Getter**: 단순 getter (getXxx, isXxx, @property). 단순 필드 반환만.
  - **Setter**: 단순 setter (setXxx). 단순 필드 설정만.
  - **Lifecycle**: 라이프사이클 (@PreDestroy, __del__)
  - **Scheduled**: 스케줄 메서드 (@Scheduled, cron, @celery.task)
  - **Transactional**: 트랜잭션 관리 메서드 (@Transactional). 단, 비즈니스 로직이 있으면 Command 우선.
  {% endif %}
  
  
  [SECTION_6_비즈니스 로직_SCENARIOS]
  ★ Given-When-Then 비즈니스 로직 시나리오 생성:

  ★★★ 핵심 판단 기준: "비즈니스 수준"의 로직인가? ★★★

  시나리오를 생성할지 말지의 핵심 질문:
  "이 함수의 이 분기/조건이 비즈니스 의사결정인가, 아니면 기술적 구현 세부사항인가?"

  ● 비즈니스 로직 (Business Logic / Business Rule) = 시나리오 생성 대상:
    - 비즈니스 규칙(Decision Rule)에 의한 분기 — 조건별 처리, 유형별 차등, 상태별 허용/거부
    - 비즈니스 계산(Calculation) — 금액 산정, 할인율 적용, 집계, 공식 기반 연산
    - 비즈니스 검증(Validation) — 자격 확인, 중복 방지, 한도 초과, 유효성 검증
    - 비즈니스 상태 전이(State Transition) — 대기→승인, 미처리→완료, 활성→해지
    - 비즈니스 기본값/보정(Default/Correction) — 미입력 시 대체값, 음수→0 보정
    - 권한/접근 제어(Authorization) — 역할별 허용/거부, 권한 체크

  ● 기술적 구현 (Infrastructure / Technical Implementation) = 시나리오 생성하지 않음 (빈 배열 []):
    - 데이터 접근 계층(Data Access Layer) — INSERT/SELECT/UPDATE/DELETE 실행하는 저수준 함수
      집계(SUM/COUNT/AVG), 필터(WHERE 조건), 정렬(ORDER BY)이 포함되어 있어도
      그것이 SQL 수준의 데이터 처리이지 비즈니스 의사결정이 아니면 기술적 구현입니다.
      예: "활성 레코드만 카운트" → SQL WHERE 조건일 뿐 → 기술적 구현 ❌
      예: "유형별 수량 합산" → SQL GROUP BY + SUM일 뿐 → 기술적 구현 ❌
      예: "최근 N건만 조회" → SQL LIMIT/OFFSET일 뿐 → 기술적 구현 ❌
    - 기술적 에러 핸들링(Error Handling) — 테이블 full, not found, 중복 키, SQL 에러코드
    - 자원 관리(Resource Management) — 메모리 할당/해제, 초기화, 잠금/해제
    - 직렬화/역직렬화(Serialization) — 버퍼 읽기/쓰기, 포맷 변환
    - 미들웨어/인프라(Middleware) — 메시지 큐, 서비스 등록, 워커 스레드
    - 횡단 관심사(Cross-Cutting Concerns) — 설정 로드, 로깅, 시그널 핸들러

  ● 판단이 애매한 경우의 원칙:
    "이 로직이 없으면 비즈니스 결과가 달라지는가?"
    → YES: 비즈니스 로직 → 시나리오 생성
    → NO: 기술적 구현 → 시나리오 생성 안 함

  ● 예시로 이해하기 (언어/도메인 무관 — 원칙에 집중):

    [비즈니스 로직 ✅ — 시나리오를 생성해야 하는 것]
    - "필수 입력이 비어있으면 요청 거부" → 비즈니스 검증 ✅
    - "동일 식별자로 활성 레코드가 이미 있으면 중복 거부" → 비즈니스 규칙 ✅
    - "조건에 따라 다른 계산 방식 적용 (유형 A면 X, B면 Y)" → 비즈니스 분기 ✅
    - "처리 후 상태를 ACTIVE로, 초기값을 0으로 설정" → 비즈니스 상태 설정 ✅
    - "합계가 음수이면 0으로 보정" → 비즈니스 보정 ✅
    - "가입 기간이 12개월 초과이면 5% 할인, 24개월 초과이면 10% 할인" → 비즈니스 규칙 ✅
    - "미입력 시 현재 연월로 자동 보정" → 비즈니스 기본값 ✅

    [기술적 구현 ❌ — 시나리오를 생성하지 않는 것]
    - "저장 공간이 가득 차면 에러코드 반환" → 기술적 제약 ❌
    - "데이터 삽입 후 에러코드 확인" → 기술적 에러 핸들링 ❌
    - "배열에 레코드 추가하고 카운트 증가" → 기술적 구현 ❌
    - "커넥션을 열고 SQL을 실행하고 커넥션을 닫는다" → 기술적 인프라 ❌
    - "NULL 체크 후 메모리 할당" → 기술적 방어 코드 ❌

    [경계가 모호한 경우 — 핵심 질문으로 판단]
    - "입력값이 NULL이면 기본값 100으로 대체"
      → 이 기본값이 비즈니스 규칙인가? (할인율, 한도, 기간 등) → ✅
      → 이 기본값이 기술적 방어인가? (NULL 방지용 0) → ❌
    - "레코드가 없으면 에러 반환"
      → 서비스 함수에서 "해당 가입자가 없으면 처리 중단" → ✅ (비즈니스 검증)
      → DB 함수에서 "SELECT 결과가 0건" → ❌ (기술적 결과)
    - "상태값을 변경한다"
      → "가입 상태를 ACTIVE에서 TERMINATED로 변경" → ✅ (비즈니스 상태 전이)
      → "플래그 변수를 0에서 1로 설정" → ❌ (기술적 제어 흐름)

    [같은 규칙이 두 계층(Layer)에 있을 때 — 관심사 분리 원칙(SoC)]
    서비스 계층(Service Layer)에서 "중복 가입 거부" → ✅ 여기서만 시나리오 생성 (비즈니스 의사결정)
    데이터 접근 계층(Data Access Layer)에서 "UNIQUE 제약 위반 시 에러코드" → ❌ 생성 안 함 (기술적 제약)
    → 같은 비즈니스 규칙이라도, 비즈니스 의사결정을 하는 계층(Service Layer)에서만 캡처하세요.

    [도메인 커플링 (Cross-Domain Coupling)]
    하나의 함수가 자기 도메인이 아닌 다른 도메인의 테이블에 직접 접근하거나
    다른 도메인의 비즈니스 규칙을 직접 구현하는 경우:
    → 자기 도메인의 BL과 다른 도메인의 BL을 **모두** 별도 시나리오로 생성하세요
    → 다른 도메인의 BL에는 coupled_domain 필드에 해당 도메인명을 기입하세요
    → 도메인 분리(Decoupling)는 이후 단계에서 처리되므로, 여기서는 있는 그대로 캡처하세요

  ★ 비즈니스 프로세스 흐름 순서 (sequence):
  각 시나리오에 sequence를 부여하세요. 1부터 시작하며 반드시 순차적 (1,2,3,4...).
  건너뜀 절대 금지 — 1 다음은 반드시 2, 2 다음은 반드시 3.
  코드의 실행 순서가 곧 비즈니스 프로세스의 흐름입니다.
  같은 시점에서 분기되는 병렬 경로(if/else, switch/case)만 같은 sequence를 허용합니다.
  병렬이 아닌 경우 반드시 서로 다른 sequence를 부여하세요.

  ★ 도메인 커플링 감지 (coupled_domain):
  하나의 함수가 자기 도메인(Bounded Context)이 아닌 **다른 도메인의 테이블에 직접 접근**하거나
  **다른 도메인의 비즈니스 규칙을 직접 구현**하는 경우가 있습니다.
  이를 도메인 커플링(Cross-Domain Coupling)이라 합니다.

  각 시나리오가 이 함수의 본래 도메인에 속하지 않는 **다른 도메인의 로직**이면,
  coupled_domain 필드에 해당 도메인명을 기입하세요.
  자기 도메인의 로직이면 coupled_domain을 null로 두세요.

  ★★ 판단 방법:
  1. 이 함수가 속한 모듈/서비스의 **주 도메인**을 파악하세요
     - 함수명에서 판단: svc_billing_xxx → billing, process_order → order
     - 모듈/파일명에서 판단: billing_service.c → billing, order_handler.py → order
     - 주로 WRITES하는 테이블에서 판단: Bill 테이블에 INSERT → billing 도메인
     - ★ 가장 확실한 기준: 이 함수가 최종적으로 **생성/변경하는 주 테이블**이 주 도메인입니다
  2. 각 BL이 다루는 테이블/로직이 주 도메인과 **다른 영역**이면 → coupled_domain에 해당 도메인명
  3. 같은 도메인이면 → null

  ★★ 커플링 판단 기준:
  - 다른 도메인의 테이블에 **WRITES** (INSERT/UPDATE/DELETE) → 강한 커플링
  - 다른 도메인의 테이블에서 **READS** (SELECT/조회)하여 비즈니스 판단에 사용 → 커플링
    (예: 청구 함수에서 가입자 테이블을 읽어서 자격 확인 → 가입자 도메인 커플링)
  - 다른 도메인의 비즈니스 규칙을 직접 구현 → 커플링
  - 같은 도메인 안에서의 분기/계산/검증 → 커플링 아님 (null)

  ★★ 주의: READS도 커플링입니다!
  레거시 코드에서는 한 함수가 여러 도메인의 테이블을 직접 읽어서 비즈니스 로직을 수행하는 경우가 많습니다.
  이 경우 해당 BL에서 다른 도메인의 데이터를 조회하는 단계도 커플링으로 표시해야 합니다.
  (DDD에서는 이런 조회를 별도 서비스 호출이나 이벤트로 분리해야 하는 대상입니다)

  ● coupled_domain이 null이 아닌 경우:
    - 이 BL은 다른 Bounded Context의 데이터/로직이 현재 함수에 직접 포함된 것
    - 이후 DDD 전환 단계에서 별도 서비스/Aggregate로 분리해야 할 대상

  ★★ 예시 (범용):

    예시 1 — WRITES 커플링:
    "주문 처리" 함수가 코드 안에서 재고·결제 테이블에 직접 접근:
      BL[1]: 주문 검증 → coupled_domain: null (주문 도메인)
      BL[2]: 재고 차감 → coupled_domain: "inventory" (재고 테이블에 UPDATE — 커플링!)
      BL[3]: 결제 승인 요청 → coupled_domain: "payment" (결제 테이블에 INSERT — 커플링!)
      BL[4]: 주문 확정 → coupled_domain: null (주문 도메인)

    예시 2 — READS 커플링:
    "청구서 생성" 함수가 가입자·요금제·사용량 테이블을 읽어서 청구 금액을 계산:
      BL[1]: 가입자 정보 조회 → coupled_domain: "subscriber" (가입자 테이블 READS — 커플링!)
      BL[2]: 요금제 정보 조회 → coupled_domain: "plan" (요금제 테이블 READS — 커플링!)
      BL[3]: 사용량 집계 → coupled_domain: "usage" (사용량 테이블 READS — 커플링!)
      BL[4]: 할인 적용 및 금액 계산 → coupled_domain: null (청구 도메인)
      BL[5]: 청구서 저장 → coupled_domain: null (청구 도메인)

    예시 3 — 커플링 없음 (깔끔한 코드):
    함수가 자기 도메인의 테이블만 접근:
      BL[1]: 입력 검증 → coupled_domain: null
      BL[2]: 중복 확인 → coupled_domain: null
      BL[3]: 등록 처리 → coupled_domain: null
      → 전부 null. 같은 도메인 안의 순차 처리.

  ★★ 자기 도메인 검증 (필수):
  coupled_domain에 값을 넣기 전에 반드시 확인하세요:
  "이 도메인명이 이 함수의 주 도메인과 같은가?"
  → 같으면 → null (자기 도메인은 커플링이 아님)
  → 다르면 → 해당 도메인명

  예: 주문 서비스의 함수가 Order 테이블을 읽는 경우
    → 주 도메인: order, 접근: Order(order 도메인) → 같음 → null ✅
    → ❌ coupled_domain: "order"는 자기 도메인이므로 null이어야 함

  예: 결제 서비스의 함수가 Account 테이블을 읽는 경우
    → 주 도메인: payment, 접근: Account(account 도메인) → 다름 → "account" ✅

  ● 대부분의 BL에서 coupled_domain은 null입니다.
    관심사 분리(SoC)가 잘 된 코드에서는 모두 null.
    레거시 코드에서만 다른 도메인이 섞여있을 때 사용됩니다.
    억지로 채우지 마세요. 확실한 경우에만.

  ★ 정보 누락 금지:
  비즈니스 로직으로 판단된 모든 분기/조건/계산이 어딘가의 시나리오에 반드시 반영되어야 합니다.
  비즈니스 로직으로 독립시키지 않은 중요 정보(기본값 보정, 조건 분기 등)는
  반드시 관련 시나리오의 Given/When/Then에 포함하세요.

  - Given: 초기 상태 (테이블 데이터 상태, 필드/상수 초기값, 입력 파라미터 조건)
    {% if field_initial_values %}→ [필드 초기값]에 제공된 실제 숫자/문자열 값을 그대로 사용하세요. 변수명(config.max_loans_per_member)이 아닌 실제 값(5)으로 기술하세요.{% endif %}
    {% if table_sample_data %}→ [테이블 샘플 데이터]의 실제 행(id, 상태값 등)을 Given 조건에 직접 활용하세요.{% endif %}
  - When: 실행 동작 (어떤 파라미터로 이 메서드를 호출하는지)
  - Then: 기대 결과 (테이블 변경 내용, 반환값, 상태 전이)

  ⚠️ 비즈니스 로직 시나리오 품질 규칙:
  - 비즈니스 로직이 식별되는 메서드에서만 scenarios를 생성하세요.
  - 기술적 구현 함수(DB CRUD, 유틸리티, 인프라)는 scenarios를 빈 배열 []로 반환하세요.
  - 비즈니스 로직이 식별되면, 각 분기 경로마다 시나리오를 만드세요.
    이 시나리오들만으로 원본 코드의 모든 비즈니스 분기를 재현할 수 있어야 합니다.

  ⚠️ 비즈니스 로직 품질 규칙 (반드시 준수):
  - **실제 값 사용 필수**: 변수명이 아닌 실제 숫자/문자열 값으로 기술하세요.
  - **계산 결과 명시**: 계산이 있으면 실제 숫자로 과정과 결과를 기술하세요.
  - **상태 전이 명시**: 변경 전 값 → 변경 후 값을 명확히 기술하세요.
  - **코드 식별자 금지**: 변수명, 함수명, 설정 키 등 코드 식별자를 사용하지 말고, 의미와 값으로 기술하세요.

  ★★★ 비즈니스 로직 구체성 필수 규칙 (모든 시나리오에 적용) ★★★

  Given 필수 요소:
  - 관련 테이블의 현재 상태를 테이블명.컬럼명=값 형태로 명시
    좋은 예: "books 테이블에 id=1, isbn='978-89-1234', status='AVAILABLE'인 행이 존재"
    나쁜 예: "DB 연결이 설정되어 있고 books 테이블이 존재한다"
  - 집계 조건이 있으면 현재 건수 명시
    좋은 예: "loans에서 member_id=100이고 status='ACTIVE'인 행이 3건 존재"

  When 필수 요소:
  - 호출 파라미터를 실제 예시값으로 명시
    좋은 예: "isbn='978-89-1234', title='테스트 도서', category='일반'으로 등록 요청"
    나쁜 예: "도서 등록을 실행한다"

  Then 필수 요소:
  - 변경되는 테이블명, 컬럼명, 값을 명시
    좋은 예: "books에 isbn='978-89-1234', status='AVAILABLE'(기본값), id=auto_increment 행이 INSERT"
    나쁜 예: "books 테이블에 신규 행이 INSERT되고 커밋된다"
  - 상태 전이: 변경 전 → 변경 후 값을 명시
  - DB 기본값(DEFAULT)이 적용되는 컬럼은 그 값을 명시
  - 에러/예외 시나리오: 어떤 예외가 발생하는지, 테이블 변경이 없음을 명시

  ★ 금지 표현 (이 표현이 나오면 품질 미달):
  - "DB 연결이 설정되어 있고" → Given에서 인프라 상태는 의미 없으므로 삭제
  - "테이블이 존재한다" → 당연한 전제이므로 삭제
  - "INSERT되고 커밋된다" → 어떤 컬럼에 어떤 값이 들어가는지 구체적으로 명시


  [SECTION_7_TABLE_INSIGHTS]
  tableInsights 작성 규칙:
  ★ 핵심: 컨텍스트의 reads_writes 또는 연결된 SQL에 테이블 접근 정보가 있을 때**만** 작성합니다.
  ★ 테이블 접근 정보가 전혀 없으면 반드시 빈 배열 []로 두세요.
  - 코드 흐름에서 이 메서드가 해당 테이블을 **왜, 어떻게** 사용하는지를 구체적으로 설명합니다.
  - 테이블 description: 이 메서드 분석으로 새로 파악된 테이블의 비즈니스 역할/목적. 이미 알려진 내용을 반복하지 말고, 이 메서드에서 **새로 알게 된 인사이트**만 작성.
  - 컬럼 description: 코드에서 직접 참조/사용된 컬럼**만** 포함. 해당 컬럼이 어떤 비즈니스 값을 담고 있는지, 어떤 조건/연산에 사용되는지 설명.
  - 코드에서 확인할 수 없는 내용은 절대 추측하지 마세요.
  
  [OUTPUT_FORMAT]
  아래 JSON 스키마에 맞는 순수 JSON만 출력하세요:
  {
    "analysis": [
      {
        "startLine": 범위_시작_라인_번호,
        "endLine": 범위_종료_라인_번호,
        "stereotype": "허용 목록에서 하나 선택",
        "summary": "3~5문장 상세 요약",
        "actor": "비즈니스 행위 주체. 내부 구현 함수는 빈 문자열",
        {% if is_oop | default(true) %}"dependencies": [
          {"targetModule": "타겟모듈명", "sourceMember": "메서드명", "usage": "field_call|local_new|parameter|return|cast|generic|local_var", "relationType": "DEPENDENCY|COMPOSITION|AGGREGATION|ASSOCIATION"}
        ],{% else %}"dependencies": [],{% endif %}
        "tableInsights": [
          {"tableName": "테이블명", "description": "비즈니스 역할", "columns": [{"name": "컬럼명", "description": "용도"}]}
        ],
        "scenarios": [
          {"sequence": 1, "coupled_domain": null, "title": "시나리오 제목", "given": "초기 상태", "when": "실행 동작", "then": "기대 결과"}
        ]
      }
    ]
  }

  출력 규칙:
  - 순수 JSON만 출력. 코드펜스, 백틱, JSON 주석, 부가 설명 금지
  - 트레일링 콤마 절대 금지
  - null 사용 금지 (coupled_domain만 예외 — 커플링 없으면 null). 빈값은 빈 배열 [] 또는 빈 문자열 ""
  - 값이 없는 배열 필드는 [] 사용
  - tableInsights: 테이블 접근 정보 있을 때만. 없으면 []
  - scenarios: 비즈니스 수준 로직 있을 때만. 기술적 구현 함수는 []
