  ★ Given-When-Then 검증 시나리오 생성:

  이 메서드의 동작을 레거시 코드 전환 후 검증할 수 있는 비즈니스 로직(Given-When-Then) 시나리오를 작성하세요.
  코드에서 비즈니스 로직이 식별되면 해당 분기마다 시나리오를 생성하세요. 개수 제한 없음.
  식별된 비즈니스 로직은 빠짐없이 시나리오로 만드세요.

  ★ 비즈니스 프로세스 흐름 순서:
  각 시나리오에 sequence(실행 순서)를 부여하세요. 1부터 시작.
  코드의 실행 순서가 곧 비즈니스 프로세스의 흐름입니다.
  예: 가입자 검증(1) → 중복 확인(2) → 요금제 조회(3) → 과금 계산(4) → 저장(5)
  같은 단계에서 분기되는 시나리오(정상/실패)는 같은 sequence를 가집니다.

  - Given: 초기 상태 (테이블 데이터 상태, 필드/상수 초기값, 입력 파라미터 조건)
    {% if field_initial_values %}→ [필드 초기값]에 제공된 실제 숫자/문자열 값을 그대로 사용하세요. 변수명(config.max_loans_per_member)이 아닌 실제 값(5)으로 기술하세요.{% endif %}
    {% if table_sample_data %}→ [테이블 샘플 데이터]의 실제 행(id, 상태값 등)을 Given 조건에 직접 활용하세요.{% endif %}
  - When: 실행 동작 (어떤 파라미터로 이 메서드를 호출하는지)
  - Then: 기대 결과 (테이블 변경 내용, 반환값, 상태 전이)

  ⚠️ 비즈니스 로직 필수 규칙:
  - 비즈니스 로직이 식별되는 메서드에서 scenarios를 생성하세요.
    코드의 의미를 보고 유연하게 판단하세요. 특정 패턴에 국한하지 마세요.
  - 단순 getter/setter, 초기화, 로깅, 잠금 등 인프라 코드는 scenarios를 빈 배열 []로 반환하세요.
  - 코드에서 비즈니스 규칙이 식별되면, 각 분기 경로마다 시나리오를 만드세요.
    이 시나리오들만으로 원본 코드의 모든 비즈니스 분기를 재현할 수 있어야 합니다.

  ⚠️ 비즈니스 로직 품질 규칙 (반드시 준수):
  - **실제 값 사용 필수**: 변수명이 아닌 실제 숫자/문자열 값으로 기술하세요.
  - **계산 결과 명시**: 계산이 있으면 실제 숫자로 과정과 결과를 기술하세요.
  - **상태 전이 명시**: 변경 전 값 → 변경 후 값을 명확히 기술하세요.
  - **코드 식별자 금지**: 변수명, 함수명, 설정 키 등 코드 식별자를 사용하지 말고, 의미와 값으로 기술하세요.

  ★★★ 비즈니스 로직 구체성 필수 규칙 (모든 시나리오에 적용) ★★★

  Given 필수 요소:
  - 관련 테이블의 현재 상태를 테이블명.컬럼명=값 형태로 명시
    좋은 예: "books 테이블에 id=1, isbn='978-89-1234', status='AVAILABLE'인 행이 존재"
    나쁜 예: "DB 연결이 설정되어 있고 books 테이블이 존재한다"
  - 집계 조건이 있으면 현재 건수 명시
    좋은 예: "loans에서 member_id=100이고 status='ACTIVE'인 행이 3건 존재"

  When 필수 요소:
  - 호출 파라미터를 실제 예시값으로 명시
    좋은 예: "isbn='978-89-1234', title='테스트 도서', category='일반'으로 등록 요청"
    나쁜 예: "도서 등록을 실행한다"

  Then 필수 요소:
  - 변경되는 테이블명, 컬럼명, 값을 명시
    좋은 예: "books에 isbn='978-89-1234', status='AVAILABLE'(기본값), id=auto_increment 행이 INSERT"
    나쁜 예: "books 테이블에 신규 행이 INSERT되고 커밋된다"
  - 상태 전이: 변경 전 → 변경 후 값을 명시
  - DB 기본값(DEFAULT)이 적용되는 컬럼은 그 값을 명시
  - 에러/예외 시나리오: 어떤 예외가 발생하는지, 테이블 변경이 없음을 명시

  ★ 금지 표현 (이 표현이 나오면 품질 미달):
  - "DB 연결이 설정되어 있고" → Given에서 인프라 상태는 의미 없으므로 삭제
  - "테이블이 존재한다" → 당연한 전제이므로 삭제
  - "INSERT되고 커밋된다" → 어떤 컬럼에 어떤 값이 들어가는지 구체적으로 명시


  [SECTION_7_TABLE_INSIGHTS]
  tableInsights 작성 규칙:
  ★ 핵심: 컨텍스트의 reads_writes 또는 연결된 SQL에 테이블 접근 정보가 있을 때**만** 작성합니다.
  ★ 테이블 접근 정보가 전혀 없으면 반드시 빈 배열 []로 두세요.
  - 코드 흐름에서 이 메서드가 해당 테이블을 **왜, 어떻게** 사용하는지를 구체적으로 설명합니다.
  - 테이블 description: 이 메서드 분석으로 새로 파악된 테이블의 비즈니스 역할/목적. 이미 알려진 내용을 반복하지 말고, 이 메서드에서 **새로 알게 된 인사이트**만 작성.
  - 컬럼 description: 코드에서 직접 참조/사용된 컬럼**만** 포함. 해당 컬럼이 어떤 비즈니스 값을 담고 있는지, 어떤 조건/연산에 사용되는지 설명.
  - 코드에서 확인할 수 없는 내용은 절대 추측하지 마세요.
  
  출력 제약사항:
  - JSON 형식 외의 부가 설명 금지 (출력에 JSON 주석 포함 금지)
  - "stereotype"은 각 analysis 요소에 필수. 허용 목록({{ valid_stereotypes | default(['Init','Query','Command','Handler','Validation','BusinessLogic']) }})에서 하나만 사용
  - "dependencies" 배열 요소는 객체 타입 (targetModule, sourceMember, usage, relationType 필드)
  - "calls" 배열 요소는 "target.functionName" 형태의 문자열
  - calls에는 오직 다른 비즈니스 클래스의 메서드 호출만 포함 (Java 표준 라이브러리 제외)
  - analysis[i]에는 startLine, endLine, stereotype이 필수
  - 값이 없으면 해당 필드는 dependencies=[], calls=[], tableInsights=[], scenarios=[] 사용
  - "tableInsights"는 컨텍스트에 테이블 접근(reads_writes, 연결된 SQL)이 있을 때만 내용을 채움. 없으면 반드시 []
  - "scenarios"는 비즈니스 로직이 존재하고 테이블 접근이 있는 메서드에서만 생성. 없으면 []
  - 빈 배열도 허용되며 null 값은 사용 금지
  - 코드펜스(```json ... ``` 등) 포함 금지
  - **트레일링 콤마 절대 금지**: 마지막 요소 뒤에 콤마(,)를 붙이지 말 것
  - **유효한 JSON만 출력**: 반드시 json.loads()로 파싱 가능한 형식이어야 함
  - **stereotype 필수**: analysis 배열의 모든 요소에 "stereotype" 키를 넣고, 허용 목록에서 하나만 사용할 것. 누락 시 오류로 간주함.

  위 조건을 모두 만족하는 순수 JSON만 출력하세요. 각 analysis 객체에는 반드시 startLine, endLine, stereotype, summary가 포함되어야 합니다.
