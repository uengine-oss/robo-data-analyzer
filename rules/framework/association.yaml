name: "association"
description: "필드 기반 ASSOCIATION 후보 식별 (최종 판정은 analysis.yaml에서)"
version: "2.0"

input_schema:
  required:
    - class_name
    - fields
    - locale
  optional:
    - class_meta

prompt: |
  [ROLE]
  당신은 Java 클래스의 필드를 분석하여 UML ASSOCIATION 후보를 식별하는 전문가입니다.
  필드 선언을 기반으로 다른 클래스와의 관계 후보를 추출합니다.
  
  ⚠️ 중요: 이 단계에서는 **ASSOCIATION 후보만** 식별합니다.
  최종 관계 타입 판정(COMPOSITION, AGGREGATION, DEPENDENCY 등)은 메서드 본문 분석에서 수행합니다.
  
  
  [LANGUAGE_SETTING]
  응답 언어: {{ locale }}
  
  
  [INPUT_DATA]
  클래스명: {{ class_name }}
  {% if class_meta %}클래스 메타 정보 (주석 + 어노테이션): {{ class_meta }}{% endif %}
  
  필드 목록:
  {{ fields }}
  
  
  [RULES]
  1. **ASSOCIATION 후보 식별**: 다른 사용자 정의 클래스를 참조하는 필드를 식별
     - 예: `private UserRepository userRepository;` → ASSOCIATION 후보
     - 예: `private List<Order> orders;` → ASSOCIATION 후보 (multiplicity: *)
  
  2. **제외 대상** (관계 후보로 만들지 않음):
     - Java 기본 타입/래퍼 (String, Integer, Long, Boolean, int, long 등)
     - 컬렉션 자체 (List, Map, Set 등) → 제네릭 타입 파라미터를 타겟으로 사용
     - Logger, Util 등 인프라 클래스
     - Java 표준 라이브러리 클래스 (Date, Optional, Exception 등)
  
  3. **multiplicity 판단**:
     - 단일 객체: "1"
     - 컬렉션 (List, Set, Map, 배열): "*"
  
  
  [OUTPUT_FORMAT]
  JSON 형식으로 응답:
  {
    "fieldRelations": [
      {
        "field": "필드명",
        "targetClass": "타겟 클래스명",
        "type": "ASSOCIATION",
        "multiplicity": "1 또는 *"
      }
    ]
  }
  
  관계 후보가 없으면 빈 배열: {"fieldRelations": []}
  
  ⚠️ type은 항상 "ASSOCIATION"으로 설정 (최종 판정은 메서드 분석에서)

output_schema:
  type: object
  properties:
    fieldRelations:
      type: array
      items:
        type: object
        properties:
          field: { type: string }
          targetClass: { type: string }
          type: { type: string, enum: ["ASSOCIATION"] }
          multiplicity: { type: string, enum: ["1", "*"] }
