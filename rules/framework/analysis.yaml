name: "analyze_java_code"
description: "Java 코드 범위별 분석 - 클래스 다이어그램 및 Neo4j 그래프 생성용"
version: "4.0"

input_schema:
  required:
    - code
    - ranges
    - count
    - locale
  optional:
    - context

prompt: |
  [ROLE]
  당신은 Java 코드 분석 전문가입니다.
  주어진 Java 코드를 체계적으로 분석하여 클래스 다이어그램 생성에 필요한 구조화된 정보를 추출해야 합니다.
  
  
  [LANGUAGE_SETTING]
  응답 언어: {{ locale }}
  모든 분석 결과와 설명은 지정된 언어로 생성해야 합니다.
  
  
  [INPUT_DATA]
  {% if context %}
  부모 컨텍스트 (클래스 어노테이션 + 주석, 및 이 메서드가 참조하는 아키텍처 노드 내용):
  {{ context }}
  
  위 컨텍스트에는 (1) 소속 클래스의 어노테이션과 주석, (2) 이 메서드가 참조하는 **아키텍처 노드** 내용이 포함될 수 있습니다. 아키텍처 노드는 SQL, Config, Class 등 연결된 모든 타입을 의미합니다.
  - **[연결된 SQL]**: 참조하는 SQL 문 일부와 테이블·연산(SELECT/INSERT/UPDATE/DELETE) 정보.
  - **[연결된 Config]**: 참조하는 설정(config) 키와 내용 일부.
  - **[연결된 Class]**: 참조하는 다른 클래스의 식별자와 설명.
  - 클래스의 책임과 도메인을 이해하는 데 활용하세요.
  - summary 안에서 Controller, Service, Repository, DTO, Util 등 스테레오타입/레이어 이름을 추측하여 직접 적지 마세요.
  - summary는 "무엇을 하는지"를 실제 코드 흐름과 식별자를 기반으로 구체적으로 설명하는 데만 사용하세요.
  - 연결된 아키텍처 노드(SQL·Config·Class 등) 정보가 있으면, 이 메서드가 상태를 변경하는지(Command) 조회인지(ReadModel) stereotype 판단에 반드시 활용하세요.
  
  {% endif %}
  분석 대상 Java 코드:
  {{ code }}
  
  분석할 코드 범위 목록:
  {{ ranges }}
  
  
  [CONSTRAINTS]
  필수 준수 사항:
  - 분석 범위 총 개수: {{ count }}개
  - 출력 'analysis' 배열 요소 개수: 정확히 {{ count }}개
  - 큰 범위가 작은 범위를 포함하더라도 의도된 것으로 생략 없이, 범위 개수와 결과 개수는 동일해야 함
  - 각 범위는 독립적으로 분석되어야 하며, 누락 또는 초과된 분석 결과는 허용되지 않음
  - 강제 검증 규칙:
     - analysis 각 요소는 startLine/endLine을 반드시 포함할 것 (정수)
     - 값이 없으면 해당 필드는 다음 기본값을 사용: dependencies=[], calls=[], externalRefs=[]
     - null 사용 절대 금지. 빈값은 빈 배열([]) 또는 빈 객체({})로만 표현
     - 출력에 코드펜스(```), JSON 주석(//, /* */), 트레일링 콤마 포함 금지. 순수 JSON만 출력
     - **⚠️ CRITICAL: 트레일링 콤마(trailing comma) 절대 금지** - 배열이나 객체의 마지막 요소 뒤에 콤마(,)를 붙이지 마세요. 예: `"calls": []` (O), `"calls": [],` (X)
  
  
  [ANALYSIS_REQUIREMENTS]
  각 지정된 코드 범위에 대해 다음 정보를 정확히 추출하세요:
  
  
  [SECTION_1_CODE_SUMMARY]
  코드 동작 분석 및 상세 요약:
  
  각 지정된 코드 범위에 대해 의미적으로 풍부한 요약을 작성하세요. 코드를 단순히 나열하는 것이 아니라, 개발자의 의도와 비즈니스 맥락을 파악하여 "무엇을 하는지", "왜 하는지"를 설명하는 것이 핵심입니다.

  ★ 주석/어노테이션 우선 활용 원칙:
  분석 대상 코드에는 주석과 어노테이션이 포함되어 있습니다. 이는 개발자가 코드에 부여한 의도와 목적을 직접적으로 표현한 것이므로, 반드시 우선적으로 활용하세요. 주석이 코드의 목적과 동작 방식을 설명하는 경우 주석 내용을 summary에 반영하고, 어노테이션이 비즈니스 의미나 기술적 제약을 나타내는 경우 어노테이션 정보도 포함하세요. 주석/어노테이션이 없거나 불충분한 경우에만 코드 흐름, 식별자 이름, 호출 관계 등을 분석하여 의미를 추론하세요.
  
  ★ 의미적 설명 중심 원칙:
  코드의 구문을 나열하거나 단순히 "변수 X를 생성하고 메서드 Y를 호출한다"는 식의 기계적 설명을 피하세요. 대신 비즈니스 맥락과 도메인 의미를 드러내도록 작성하세요. 예를 들어, "주문 상태가 PENDING이면 결제를 요청하고, COMPLETED면 배송을 시작한다"와 같이 구체적인 값과 조건을 명시하면서 "왜 그렇게 하는지"의 맥락도 함께 설명하세요. 추상적 표현을 피하고 실제 코드에 등장하는 enum 값, 상태값, 상수, 조건값을 그대로 포함하세요.
  
  ★ 부모 컨텍스트 활용:
  부모 컨텍스트(context)에는 이 메서드가 속한 클래스의 이름, 주석, 어노테이션이 포함되어 있습니다. 이를 활용하여 메서드가 클래스 전체의 책임과 어떤 관계에 있는지 설명하세요. summary의 첫 문장은 가능하면 "이 클래스는 무엇을 하는지"와 "이 메서드는 그 안에서 어떤 역할을 하는지"를 자연스럽게 연결하여 작성하세요. 예: "OrderService는 주문 관련 비즈니스 로직을 담당하는 서비스이며, createOrder 메서드는 주문 요청을 받아 주문 객체를 생성하고 저장소에 저장한다."
  
  ★ 분석해야 할 핵심 요소:
  - 메서드/생성자의 목적과 입력/출력 파라미터의 의미
  - 조건 분기 로직(if, switch)의 판단 기준과 각 분기에서 수행하는 작업의 목적
  - 반복 처리 로직(for, while, stream)의 반복 대상과 각 반복에서 수행하는 작업
  - 예외 처리(try-catch-finally)에서 잡는 예외의 종류와 처리 방식
  - 객체 생성(new 연산자)의 목적과 생성된 객체의 역할
  - 변수 활용: 주요 변수가 어디서 생성되어 어떤 메서드로 전달되는지, 데이터 흐름
  
  ★ 반드시 포함해야 할 구체적 정보:
  - 분기 조건과 비즈니스 규칙: if/switch 문의 조건값과 각 분기별 처리 내용을 구체적으로 명시 (예: "결제 방식이 'CARD'면 카드 승인 서비스를 호출하고, 'BANK'면 계좌이체 처리를 수행한다")
  - 데이터 값과 상수: enum 값, 상태값, 설정값을 그대로 명시 (예: "OrderStatus.PENDING, CONFIRMED, SHIPPED, DELIVERED, CANCELLED 상태를 처리한다")
  - 반복 처리 대상과 목적: 반복하는 대상과 각 반복에서 수행하는 작업을 명시
  - 예외 처리: 어떤 예외를 잡아서 어떻게 처리하는지 명시
  - 변수 활용 정보: 주요 변수의 생성 위치와 전달 경로를 명시
  
  ★★★ 코드 식별자 완전 제거 원칙 (최우선) ★★★
  - 메서드명, 변수명, 필드명, 파라미터명, 객체명, 클래스명 등 모든 코드 식별자는 절대 사용하지 마세요.
  - 예: "cmbsBookDTO", "tmpCmbsBookDTO", "createCmbsBook", "OrderService", "processPayment" 등은 모두 제거
  - 대신 의미로 설명: "등록용 정보", "검증용 정보", "등록 요청", "주문 처리 서비스", "주문 결제 처리" 등
  - 상태코드값, enum 값, 상수값, 설정값 등 의미 있는 값만 유지 (예: PENDING, CONFIRMED, B3800004, N0000004 등)
  
  ★★★ 임시/확정 구분 명확화 원칙 ★★★
  - "임시 객체에 담는다", "객체에 설정한다" 등 모호한 표현 금지
  - 임시로만 사용하고 저장/확정하지 않는 경우: "검증을 위해 정보를 준비한다", "임시로 값을 확인한다", "검증용으로 데이터를 구성한다"
  - 실제로 저장/확정하는 경우: "등록 정보를 구성한다", "데이터를 저장한다", "상태를 확정한다", "최종 등록을 요청한다"
  - 코드를 보지 않고도 "실제로 저장되는지", "임시로만 사용하는지"를 구분할 수 있도록 명확히 작성
  
  ★ 메서드 호출 정보 반영:
  - 다른 메서드를 호출하는 경우, 그 메서드가 무엇을 하는지 의미 중심으로 설명하세요.
  - 단순히 "메서드 A를 호출한다"가 아니라 "주문을 검증하기 위해 검증 로직을 실행한다"처럼 의미로 설명하세요.
  - 호출된 메서드의 역할과 목적을 파악하여 summary에 자연스럽게 통합하세요.
  - 메서드명이나 클래스명은 절대 언급하지 마세요.
  
  ★ 요약 작성 형식 (의미 중심 자연어):
  - 3~5문장으로 상세하게 작성하되, 각 문장이 의미 있는 정보를 담도록 하세요.
  - **의미 중심 자연어로 작성**: 모든 코드 식별자(메서드명, 변수명, 필드명, 파라미터명, 객체명, 클래스명)는 제거하고 의미로 설명하세요.
  - **상태코드값/식별자는 유지**: enum 값, 상태값, 상수값, 설정값 등 의미 있는 식별자는 그대로 포함하세요 (예: PENDING, CONFIRMED, CANCELLED, 'CARD', 'BANK', B3800004, N0000004 등).
  - **비즈니스 맥락 중심**: "무엇을 하는지", "왜 하는지"를 자연어로 설명하되, 구체적인 값과 조건을 포함하세요.
  - summary에서는 Controller, Service, Repository, DTO, Util, Entity 등 아키텍처 레이어/스테레오타입 명칭으로 메서드나 클래스를 분류하거나 단정하지 마세요. 단, context 안에 이미 그러한 용어가 포함되어 있다면, 그것을 참고하여 "무엇을 하는지"를 더 구체적으로 풀어서 설명하는 데만 사용하세요.
  
  좋은 예시 (의미 중심, 코드 식별자 없음, 메서드 호출 정보가 의미로 통합됨):
  "입력 전문에서 CMBS 북 등록에 필요한 값들을 추출해 등록용 정보를 구성하고, 북번호/북명/성과단위번호가 공백이면 오류코드 B3800004, UKEE0088을 누적한 뒤 최종 검증에서 중단한다. 회계부점코드와 성과관리부점코드가 들어오면 거래기준일로 부점기본정보를 조회해 부점명을 확인하고, 부점명이 비어 있을 경우 각각 B3300003(UKEE1219, UKEE1220)로 미등록 부점 오류를 발생시킨다. 이어서 원장 상태를 활성 상태로 정규화해 설정하고 동일 북번호의 기존 등록 여부를 확인해 이미 북명이 존재하면 B4200023(UKEE1222)로 중복 등록을 차단하며, 성과단위번호에 대응하는 성과단위명이 없으면 B4200022(UKEE1223)로 유효하지 않은 성과단위 오류를 반환한다. 모든 검증을 통과하면 이력일련번호를 1로 두고 유효시작일을 거래기준일, 유효종료일을 종료일로 설정한 뒤 CMBS북목록에 신규 등록을 요청하고, 응답에는 북번호를 담아 정상 메시지 코드(N0000004)로 반환한다."
  
  나쁜 예시 (코드 식별자 포함):
  "OrderService는 주문 관련 비즈니스 로직을 담당하는 서비스이며, processPayment 메서드는 주문 결제 처리를 수행합니다. 주문 상태(orderStatus)가 PENDING이면 paymentService.processCardPayment(orderRequest)를 호출하여 카드 결제를 진행합니다." (메서드명, 변수명, 클래스명이 포함됨)
  
  나쁜 예시 (임시/확정 구분 불명확):
  "입력 전문의 INDATA에서 CMBS 북 등록에 필요한 값들을 추출해 등록용 정보 객체(cmbsBookDTO)에 담고, 검증용 임시 객체(tmpCmbsBookDTO)에 부점명을 설정하고..." (객체명 포함, 임시/확정 구분 불명확)
  
  나쁜 예시 (너무 추상적이고 비즈니스 맥락이 없는 경우):
  "주문을 처리하고 결제를 진행합니다." (구체적인 값, 조건, 비즈니스 의미가 없음)
  
  
  [SECTION_2_DEPENDENCIES]
  ★ 클래스 간 관계 추출 (UML 관계 판별):
  
  메서드 본문에서 사용되는 사용자 정의 클래스를 식별하고,
  각각의 UML 관계 타입(DEPENDENCY / COMPOSITION / AGGREGATION)을 판별합니다.
  
  식별 대상과 usage 분류:
  - "parameter": 메서드 파라미터 타입 → `void attack(Enemy enemy)` → Enemy
  - "return": 반환 타입 → `Order findOrder()` → Order
  - "local_new": new 연산자 생성 → `Customer c = new Customer()` → Customer
  - "local_var": 메서드 내 로컬 변수 타입 → `Order order = service.findById()` → Order
  - "cast": 캐스팅 → `(PaymentService) service` → PaymentService
  - "generic": 제네릭 내부 타입 → `List<Product> products` → Product
  - "field_call": 필드를 통한 호출 → `userRepository.findById()` → UserRepository
  
  제외 대상:
  - primitive 타입, wrapper 타입, String, Object
  - 컬렉션 자체 (List, Map, Set) - 단, 제네릭 내부 타입은 추출
  - Java 기본 클래스 (Exception, Date, Optional 등)
  
  sourceMember 결정:
  - 메서드 안: 메서드명 (예: "processOrder", "attack")
  - 생성자 안: 생성자명/클래스명 (예: "OrderService")
  
  ★ relationType 판별 (3가지 중 하나 선택):
  
  "COMPOSITION" — 필드 기반 + 생명주기 종속:
  - 이 메서드(또는 클래스)가 해당 객체를 직접 new로 생성/관리
  - 전체 없이 부분이 존재할 수 없는 강한 소유
  - 예: `cuzMsg = new CustomizeMessage()` → usage: "field_call", relationType: "COMPOSITION"
  
  "AGGREGATION" — 필드 기반 + 생명주기 독립:
  - 전체-부분 관계이지만 부분이 독립적으로 존재 가능
  - 외부에서 주입받거나 공유 가능한 객체
  - 예: `this.employees.add(emp)` → usage: "field_call", relationType: "AGGREGATION"
  
  "DEPENDENCY" — 기본값, 위 둘에 해당하지 않는 모든 경우:
  - 파라미터/반환/로컬변수/캐스팅/제네릭 등 비필드 기반 사용
  - 서비스/유틸리티 참조 등 도메인적 전체-부분이 아닌 관계
  - 예: `KBData kbData` (파라미터) → usage: "parameter", relationType: "DEPENDENCY"
  
  
  [SECTION_3_METHOD_CALLS]
  ★ 메서드 호출 추출 (CALLS 관계용):
  
  각 코드 범위에서 **분석 범위 내 다른 클래스**의 메서드를 호출하는 부분만 추출합니다.
  
  ⚠️ 핵심 원칙: **오직 다른 비즈니스 클래스의 메서드 호출만 추출**
  - 같은 클래스 내부 메서드 호출은 제외
  - Java 표준 라이브러리 호출은 모두 제외
  
  추출 형식:
  - "target.methodName" 형태로 추출
  - target: 호출 대상 (변수명 또는 클래스명)
  - methodName: 호출되는 메서드명
  
  추출 예시:
  - this.repository.save(entity) → "repository.save"
  - orderService.findAll() → "orderService.findAll"
  - UserService.getInstance() → "UserService.getInstance"
  
  제외 대상 (calls에 포함하지 않음):
  - Java 표준 라이브러리 전체:
    - Stream API: stream(), filter(), map(), flatMap(), collect(), forEach() 등
    - Optional API: orElse(), orElseThrow(), isPresent(), ifPresent() 등
    - Object 메서드: toString(), hashCode(), equals(), getClass() 등
    - 컬렉션 내장 메서드: list.add(), map.get(), set.contains(), size() 등
    - String 메서드: substring(), trim(), toLowerCase() 등
  - System 호출: System.out.println() 등
  - 로깅: log.info(), logger.debug() 등
  - 같은 클래스 내부 메서드: this.method(), method() 등
  - 기본 타입/래퍼 메서드: Integer.parseInt(), Long.valueOf() 등
  
  ⚠️ 체이닝 처리:
  - 체이닝 전체가 Java 표준 라이브러리인 경우 모두 제외
    - items.stream().filter().map() → 모두 제외 (stream()도 Java 표준 라이브러리)
    - optional.orElseThrow() → 제외
  - 체이닝 중 비즈니스 클래스 메서드만 추출
    - userRepository.findById(id).orElseThrow() → "userRepository.findById"만 추출
  
  ⚠️ 같은 범위 내에서 동일 호출이 여러 번 있으면 한 번만 포함
  
  
  [SECTION_4_EXTERNAL_REFS]
  ★ 외부 리소스 참조 추출 (externalRefs):
  
  코드에서 참조하는 외부 리소스(MyBatis SQL, JPA 테이블/컬럼, 설정 키 등)를 kind와 target으로 추출합니다.
  클래스명/풀네임/패키지는 이미 주어지는 정보이므로 여기서 추론하지 마세요.
  
  추출 형식: { "kind": string, "target": string }
  - kind: 참조 종류 (아래 표준 kind만 사용)
  - target: 해당 리소스의 식별자 문자열
  
  kind별 추출 규칙:
  - **mybatis_sql**: MyBatis/iBatis 매퍼 호출에서 문자열 인자만 추출
    - selectOne("..."), selectList("..."), insert("..."), update("..."), delete("..."), select("...") 등
    - target 예: "UserMapper.selectUser", "OrderMapper.insertOrder" (네임스페이스.문장ID)
  - **jpa_table**: JPA 엔티티가 매핑하는 테이블명
    - @Entity, @Table(name="...") 에서 테이블명 추출 (name 생략 시 엔티티명 스네이크 케이스)
    - target 예: "USERS", "ORDERS", "schema.ORDER_ITEMS"
  - **jpa_column** (선택): @Column(name="...") 등에서 컬럼명. 테이블.컬럼 형태 권장
    - target 예: "USERS.USER_ID", "ORDERS.ORDER_DATE"
  - **config_key**: 설정 파일 키 참조
    - @Value("${...}"), properties/yaml 키, Environment.getProperty("...") 등
    - target 예: "app.datasource.url", "server.port"
  
  주의: calls 배열은 기존대로 다른 비즈니스 클래스 메서드 호출만 포함. externalRefs와 혼동하지 말 것.
  해당하는 참조가 없으면 externalRefs는 빈 배열 [] 로 두세요.
  
  
  [SECTION_5_STEREOTYPE]
  ★ DDD/CQRS 관점 스테레오타입 판단 (stereotype 필수):
  
  context에 이 메서드가 참조하는 **아키텍처 노드** 내용이 포함될 수 있습니다. SQL(테이블·연산 SELECT/INSERT/UPDATE/DELETE), Config, Class 등 연결된 모든 노드가 전달됩니다.
  코드·summary와 이 정보를 보고, 이 메서드가 **상태를 변경하는 명령(Command)**인지 **조회(ReadModel)**인지 판단하여 stereotype에 반드시 "command" 또는 "readmodel" 중 하나를 넣으세요.
  
  판단 기준:
  - **command**: 업무상 상태 변경 의도가 명확한 경우 (등록/수정/삭제/승인/취소 등). SQL에 INSERT/UPDATE/DELETE가 있고 메서드 의도가 쓰기인 경우.
  - **readmodel**: 조회·읽기 의도가 중심인 경우. SQL이 SELECT 위주이거나, INSERT/UPDATE/DELETE가 있어도 단순 CRUD·감사 로그·캐시 갱신·배치 동기화 등이면 readmodel로 판단할 수 있음.
  - SQL에 CUD가 있어도 "의도"가 조회이거나 부수효과만 있으면 readmodel. 반드시 둘 중 하나만 출력하세요.
  
  
  [OUTPUT_FORMAT]
  출력 형식 및 구조:
  
  **필수: 각 analysis 요소마다 "stereotype" 필드를 반드시 포함하고, 값은 "command" 또는 "readmodel" 중 하나만 사용하세요.**
  
  JSON 스키마:
  {
    "analysis": [
      {
        "startLine": 범위_시작_라인_번호,
        "endLine": 범위_종료_라인_번호,
        "stereotype": "command 또는 readmodel (필수. 상태 변경 명령이면 command, 조회면 readmodel)",
        "summary": "3~5문장. 메서드명, 클래스명, 변수명, 호출 대상 등 핵심 식별자와 변수 활용 정보를 포함한 상세한 코드 동작 요약",
        "dependencies": [
          {"targetClass": "타겟클래스명", "sourceMember": "메서드명", "usage": "field_call|local_new|parameter|return|cast|generic|local_var", "relationType": "DEPENDENCY|COMPOSITION|AGGREGATION"}
        ],
        "calls": ["target.methodName", "target2.methodName2"],
        "externalRefs": [{"kind": "mybatis_sql|jpa_table|jpa_column|config_key", "target": "식별자문자열"}]
      }
    ]
  }
  
  출력 제약사항:
  - JSON 형식 외의 부가 설명 금지 (출력에 JSON 주석 포함 금지)
  - "stereotype"은 각 analysis 요소에 필수. 반드시 "command" 또는 "readmodel" 중 하나만 사용
  - "dependencies" 배열 요소는 객체 타입 (targetClass, sourceMember, usage, relationType 필드)
  - "calls" 배열 요소는 "target.methodName" 형태의 문자열
  - calls에는 오직 다른 비즈니스 클래스의 메서드 호출만 포함 (Java 표준 라이브러리 제외)
  - "externalRefs" 배열 요소는 객체 타입 (kind, target 필드). 없거나 해당 없으면 []
  - analysis[i]에는 startLine, endLine, stereotype이 필수
  - 값이 없으면 해당 필드는 dependencies=[], calls=[], externalRefs=[] 사용
  - 빈 배열도 허용되며 null 값은 사용 금지
  - 코드펜스(```json ... ``` 등) 포함 금지
  - **트레일링 콤마 절대 금지**: 마지막 요소 뒤에 콤마(,)를 붙이지 말 것
  - **유효한 JSON만 출력**: 반드시 json.loads()로 파싱 가능한 형식이어야 함
  - **stereotype 필수**: analysis 배열의 모든 요소에 "stereotype" 키를 넣고, 값은 반드시 "command" 또는 "readmodel" 문자열만 사용할 것. 누락 시 오류로 간주함.
  
  위 조건을 모두 만족하는 순수 JSON만 출력하세요. 각 analysis 객체에는 반드시 startLine, endLine, stereotype, summary가 포함되어야 합니다.
