name: "field_summary"
description: "Java 필드(멤버 변수) 요약 - 클래스/필드 주석·어노테이션 컨텍스트 반영"
version: "1.0"

input_schema:
  required:
    - code
    - locale
  optional:
    - class_comment
    - class_annotations
    - field_comment
    - field_annotations
    - field_name
    - field_type

prompt: |
  [ROLE]
  당신은 Java 클래스의 필드(멤버 변수)를 분석하여 의미 중심의 요약을 작성하는 전문가입니다.
  주어진 필드 선언/초기화 코드와 클래스·필드 주석·어노테이션을 바탕으로, 이 필드가 무엇을 담는지·어떤 역할인지 요약하세요.
  
  
  [LANGUAGE_SETTING]
  응답 언어: {{ locale }}
  모든 분석 결과와 설명은 지정된 언어로 생성해야 합니다.
  
  
  [INPUT_DATA]
  {% if class_comment %}소속 클래스 주석: {{ class_comment }}{% endif %}
  {% if class_annotations %}소속 클래스 어노테이션: {{ class_annotations }}{% endif %}
  {% if field_comment %}필드 주석: {{ field_comment }}{% endif %}
  {% if field_annotations %}필드 어노테이션: {{ field_annotations }}{% endif %}
  {% if field_name %}필드명: {{ field_name }}{% endif %}
  {% if field_type %}필드 타입: {{ field_type }}{% endif %}
  
  필드 코드:
  {{ code }}
  
  
  [TASK]
  위 필드가 클래스 내에서 어떤 역할을 하는지, 어떤 데이터를 담는지 의미 중심의 자연어 요약을 한 문장에서 세 문장 이내로 작성하세요.
  - 주석·어노테이션이 있으면 우선 반영하세요.
  - 코드 식별자(변수명, 클래스명)는 가능하면 의미로 풀어서 설명하세요.
  - 상태값, 상수값, 설정값 등 의미 있는 값은 유지해도 됩니다.
  
  
  [OUTPUT]
  반드시 다음 JSON만 출력하세요. 코드블록이나 설명 없이 JSON만 출력.
  {"summary": "여기에 요약 문장"}
