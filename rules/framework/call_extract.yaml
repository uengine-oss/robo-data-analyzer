name: "call_extract"
description: "함수 호출 코드에서 obj_name, function_name 추출 (CALLS 관계용)"
version: "2.0"

input_schema:
  required:
    - items
  optional:
    language:
      default: "Java"

prompt: |
  [ROLE]
  당신은 {{ language | default("Java") }} 코드 분석 전문가입니다.
  각 call_code에서 비즈니스 함수/메서드 호출의 obj_name과 function_name을 추출합니다.


  [INPUT]
  {% for item in items %}
  --- function {{ loop.index }} (function_id: {{ item.function_id }}) ---
  {% for c in item.calls %}
  - call_id: {{ c.call_id }}
    call_code: {{ c.call_code }}
  {% endfor %}
  {% endfor %}


  [RULES]

  {% if language == "C" %}
  ── C 언어 ──
  클래스/모듈 구분 없이 함수명만 추출. obj_name은 항상 "".
  - func_name(args) → obj_name="", function_name="func_name"
  - svc->handler(args) → obj_name="", function_name="handler"

  {% else %}
  ── Java/OOP 언어 ──
  - target.method() → obj_name="target", function_name="method"
  - 객체 없는 호출 → obj_name="this", function_name="method"
  - 체이닝: 비즈니스 함수만 추출 (표준 라이브러리 체인은 제외)
    예: userRepository.findById(id).orElseThrow() → obj_name="userRepository", function_name="findById"만 추출

  {% endif %}

  ── 🔑 매크로 래퍼 중첩 처리 ──
  매크로 함수 패턴이 **실제 함수 호출을 감싸고 있으면**, 매크로는 무시하고 **안쪽 실제 함수만** 추출.
  안쪽이 리터럴·상수뿐이면 전체 제외.

  제외 대상 (obj_name="", function_name=""로 출력):
  - 로깅: log.info, logger.debug, System.out.println, printf, fprintf, PFM_DBG, PRINT_*
  - 언어 내장: toString, hashCode, equals, stream, filter, map, collect, orElse, orElseThrow
  - 컬렉션/문자열 내장: list.add, list.get, list.size, map.put, map.get, set.contains, substring, trim, toLowerCase
  - 기본 타입 변환: Integer.parseInt, Long.valueOf, String.valueOf, atoi, atol
  - 위 제외 대상·래퍼 외 **모든 함수는 반드시 추출** (진짜 비즈니스 로직만 뽑는 것이 목표)
  - 동일 범위 내 중복 호출은 한 번만

  [EXAMPLE]
  ── 올바른 추출 ──
  ✅ call_code="orderService.findAll()" → obj_name="orderService", function_name="findAll"
  ✅ call_code="validateInput(data)" → obj_name="this", function_name="validateInput"
  ✅ call_code="db_plan_select(plan_id, &plan)" → obj_name="", function_name="db_plan_select" (C언어)
  ✅ call_code="memset(&output, 0x00, sizeof(output))" → obj_name="", function_name="memset" (표준이지만 목록에 없으면 추출)

  ── 잘못된 추출 ──
  ❌ call_code="list.stream().filter().collect()" → obj_name="list", function_name="stream"
     → 언어 내장이므로 obj_name="", function_name=""
  ❌ call_code="log.info('message')" → obj_name="log", function_name="info"
     → 로깅이므로 obj_name="", function_name=""
  ❌ call_code="a000_input_validation(itf)" → obj_name="", function_name=""
     → 사용자 정의 함수인데 제외함. 반드시 추출해야 함: obj_name="", function_name="a000_input_validation"


  [OUTPUT]
  {
    "results": [
      {
        "function_id": "입력과 동일",
        "results": [
          {"call_id": "입력과 동일", "obj_name": "", "function_name": ""}
        ]
      }
    ]
  }

  - results 순서·개수는 입력 items와 동일
  - 제외 대상은 obj_name="", function_name=""
  - 같은 파일 내부 호출(객체 없음)은 obj_name="this"
  - JSON만 출력. 코드펜스, 주석, 트레일링 콤마 금지
