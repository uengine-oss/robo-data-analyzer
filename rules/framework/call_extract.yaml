name: "call_extract"
description: "메서드 호출 코드에서 obj_name, method_name 추출 (CALLS 관계용). 같은 클래스 내부 호출 포함."
version: "1.4"

input_schema:
  required:
    - items
  optional: {}

prompt: |
  [ROLE]
  당신은 Java 코드 분석 전문가입니다. 아래 메서드(들)의 호출 코드가 번호 순서대로 나열되어 있습니다. 각 call_code에서 비즈니스 메서드 호출의 obj_name과 method_name을 추출하세요.

  [SECTION_METHOD_CALLS]
  ★ 메서드 호출 추출 (CALLS 관계용):

  각 코드 범위에서 **비즈니스 클래스의 메서드 호출**을 추출합니다.
  같은 클래스 내부 호출도 포함합니다.

  ⚠️ 핵심 원칙: **비즈니스 메서드 호출은 모두 추출 (같은 클래스 포함)**
  - Java 표준 라이브러리 호출만 제외

  추출 형식:
  - "target.methodName" 형태 → obj_name=target, method_name=methodName
  - target: 호출 대상 (변수명 또는 클래스명)
  - 객체 프리픽스 없는 호출 (같은 클래스 내부) → obj_name="this", method_name=메서드명

  추출 예시:
  - this.repository.save(entity) → obj_name=repository, method_name=save
  - orderService.findAll() → obj_name=orderService, method_name=findAll
  - UserService.getInstance() → obj_name=UserService, method_name=getInstance
  - getRepaymentHome() → obj_name=this, method_name=getRepaymentHome
  - this.generateId() → obj_name=this, method_name=generateId
  - validateInput(data) → obj_name=this, method_name=validateInput

  제외 대상 (이 경우 obj_name, method_name을 빈 문자열 "" 로 출력):
  - Java 표준 라이브러리 전체:
    - Stream API: stream(), filter(), map(), flatMap(), collect(), forEach() 등
    - Optional API: orElse(), orElseThrow(), isPresent(), ifPresent() 등
    - Object 메서드: toString(), hashCode(), equals(), getClass() 등
    - 컬렉션 내장 메서드: list.add(), map.get(), set.contains(), size() 등
    - String 메서드: substring(), trim(), toLowerCase() 등
  - System 호출: System.out.println() 등
  - 로깅: log.info(), logger.debug() 등
  - 기본 타입/래퍼 메서드: Integer.parseInt(), Long.valueOf() 등

  ⚠️ 체이닝 처리:
  - 체이닝 전체가 Java 표준 라이브러리인 경우 모두 제외 → obj_name="", method_name=""
    - items.stream().filter().map() → 제외
    - optional.orElseThrow() → 제외
  - 체이닝 중 비즈니스 클래스 메서드만 추출
    - userRepository.findById(id).orElseThrow() → obj_name=userRepository, method_name=findById 만 추출

  ⚠️ 같은 범위 내에서 동일 호출이 여러 번 있으면 한 번만 포함

  [INPUT] (순서대로 처리하세요)
  {% for item in items %}
  --- method idx {{ loop.index }} (method_id: {{ item.method_id }}) ---
  calls:
  {% for c in item.calls %}
  - call_id: {{ c.call_id }}
    call_code: {{ c.call_code }}
  {% endfor %}
  {% endfor %}

  [OUTPUT_FORMAT]
  아래 JSON 구조 하나만 출력하세요. results 배열의 순서와 개수는 입력 items와 동일합니다.

  {
    "results": [
      {
        "method_id": "입력과 동일한 method_id",
        "results": [
          {"call_id": "해당 call_id", "obj_name": "변수 또는 클래스명", "method_name": "메서드명"},
          ...
        ]
      }
    ]
  }

  [RULES]
  - results[i]는 입력의 i번째 메서드에 대한 결과. results[i].results 순서·개수는 해당 메서드의 calls와 동일.
  - **제외 대상(Java 표준 라이브러리, 로깅 등)은 반드시 obj_name="", method_name="" 로 출력.** call_id는 입력값 그대로.
  - **같은 클래스 내부 호출(객체 프리픽스 없음, this.method() 등)은 obj_name="this"로 출력.**
  - JSON만 출력. 코드펜스, 주석, 트레일링 콤마 금지.
