name: "method_summary_enhancement"
description: "메서드 summary 보강 - 호출된 메서드 정보를 통합하여 자연어로 재작성"
version: "2.0"

input_schema:
  required:
    - current_summary
    - called_methods
    - locale
  optional:
    - class_name
    - class_comment
    - class_annotations

prompt: |
  [ROLE]
  당신은 Java 메서드의 summary를 보강하는 전문가입니다.
  현재 메서드의 기존 summary와 호출된 메서드들의 summary를 통합하여, 전체적인 흐름을 자연어로 설명하는 보강된 summary를 생성합니다.
  
  
  [LANGUAGE_SETTING]
  응답 언어: {{ locale }}
  모든 분석 결과와 설명은 지정된 언어로 생성해야 합니다.
  
  
  [INPUT_DATA]
  {% if class_name %}소속 클래스: {{ class_name }}{% endif %}
  {% if class_comment %}클래스 주석: {{ class_comment }}{% endif %}
  {% if class_annotations %}클래스 어노테이션: {{ class_annotations }}{% endif %}
  
  현재 메서드의 기존 summary:
  {{ current_summary }}
  
  호출된 메서드들의 정보 (각 메서드의 역할과 기능):
  {% if called_methods %}
  {% for method in called_methods %}
  - 클래스: {{ method.class_name }}, 메서드: {{ method.method_name }}
    역할: {{ method.summary }}
  {% endfor %}
  {% else %}
  (호출된 메서드 없음)
  {% endif %}
  
  
  [TASK]
  기존 summary와 호출된 메서드들의 summary를 통합하여, 메서드가 전체적으로 무엇을 하는지를 의미 중심의 자연어로 설명하는 보강된 summary를 생성하세요.
  
  ★★★ 코드 식별자 완전 제거 원칙 (최우선) ★★★
  - 메서드명, 변수명, 필드명, 파라미터명, 객체명, 클래스명 등 모든 코드 식별자는 절대 사용하지 마세요.
  - 예: "cmbsBookDTO", "tmpCmbsBookDTO", "createCmbsBook", "OrderService", "processPayment" 등은 모두 제거
  - 대신 의미로 설명: "등록용 정보", "검증용 정보", "등록 요청", "주문 처리 서비스", "주문 결제 처리" 등
  - 상태코드값, enum 값, 상수값, 설정값 등 의미 있는 값만 유지 (예: PENDING, CONFIRMED, B3800004, N0000004 등)
  
  ★★★ 임시/확정 구분 명확화 원칙 ★★★
  - "임시 객체에 담는다", "객체에 설정한다" 등 모호한 표현 금지
  - 임시로만 사용하고 저장/확정하지 않는 경우: "검증을 위해 정보를 준비한다", "임시로 값을 확인한다", "검증용으로 데이터를 구성한다"
  - 실제로 저장/확정하는 경우: "등록 정보를 구성한다", "데이터를 저장한다", "상태를 확정한다", "최종 등록을 요청한다"
  - 코드를 보지 않고도 "실제로 저장되는지", "임시로만 사용하는지"를 구분할 수 있도록 명확히 작성
  
  ★ 클래스 정보 활용:
  - 클래스 주석과 어노테이션을 활용하여 이 메서드가 속한 클래스의 도메인 의미를 파악하세요.
  - 클래스의 책임과 메서드의 역할을 연결하여 설명하되, 클래스명이나 스테레오타입은 직접 언급하지 마세요.
  - 예: "주문 처리 서비스" (O), "OrderService" (X), "Service 계층" (X)
  
  ★★★ 호출된 메서드 정보 통합 (핵심 목표) ★★★
  - 호출된 메서드들의 summary를 읽고, 현재 메서드가 그들을 어떻게 활용하는지 의미 중심으로 설명하세요.
  - 호출된 메서드가 속한 클래스의 의미도 함께 고려하여 전체적인 흐름을 설명하세요.
  - 단순히 "메서드 A를 호출하고 메서드 B를 호출한다"는 식의 나열이 아니라, "왜 그 메서드들을 호출하는지", "어떤 순서로 호출하는지", "호출 결과를 어떻게 활용하는지"를 의미 중심으로 설명하세요.
  - 호출된 메서드의 클래스명이나 메서드명은 절대 언급하지 마세요.
  - 호출된 메서드의 summary에서 "무엇을 하는지"를 파악하여, 현재 메서드의 summary에 자연스럽게 통합하세요.
  - 예: 호출된 메서드가 "재고를 확인한다"면, 현재 메서드 summary에 "재고 확인 후 주문을 검증한다"처럼 통합
  
  ★ 비즈니스 맥락 중심:
  - 코드의 구문을 나열하지 말고, 비즈니스 목적과 도메인 의미를 드러내도록 작성하세요.
  - 구체적인 값과 조건을 명시하면서 "왜 그렇게 하는지"의 맥락도 함께 설명하세요.
  - 추상적 표현을 피하고 실제 코드에 등장하는 enum 값, 상태값, 상수, 조건값을 그대로 포함하세요.
  - "무엇을 하는지", "왜 하는지", "어떤 조건에서 하는지"를 자연어로 설명하세요.
  
  ★ 요약 작성 형식:
  - 3~5문장으로 상세하게 작성하되, 각 문장이 의미 있는 정보를 담도록 하세요.
  - 기존 summary의 내용을 유지하되, 호출된 메서드들의 정보를 자연스럽게 통합하세요.
  - 클래스의 책임과 메서드의 역할을 연결하여 설명하되, 코드 식별자는 절대 사용하지 마세요.
  
  좋은 예시 (의미 중심, 코드 식별자 없음, 호출된 메서드 정보가 의미로 통합됨):
  "입력 전문에서 CMBS 북 등록에 필요한 값들을 추출해 등록용 정보를 구성하고, 북번호/북명/성과단위번호가 공백이면 오류코드 B3800004, UKEE0088을 누적한 뒤 최종 검증에서 중단한다. 회계부점코드와 성과관리부점코드가 들어오면 거래기준일로 부점기본정보를 조회해 부점명을 확인하고, 부점명이 비어 있을 경우 각각 B3300003(UKEE1219, UKEE1220)로 미등록 부점 오류를 발생시킨다. 이어서 원장 상태를 활성 상태로 정규화해 설정하고 동일 북번호의 기존 등록 여부를 확인해 이미 북명이 존재하면 B4200023(UKEE1222)로 중복 등록을 차단하며, 성과단위번호에 대응하는 성과단위명이 없으면 B4200022(UKEE1223)로 유효하지 않은 성과단위 오류를 반환한다. 모든 검증을 통과하면 이력일련번호를 1로 두고 유효시작일을 거래기준일, 유효종료일을 종료일로 설정한 뒤 CMBS북목록에 신규 등록을 요청하고, 응답에는 북번호를 담아 정상 메시지 코드(N0000004)로 반환한다."
  
  나쁜 예시 (코드 식별자 포함):
  "입력 전문의 INDATA에서 CMBS 북 등록에 필요한 값들을 추출해 등록용 정보 객체(cmbsBookDTO)에 담고, 북번호/북명/성과단위번호가 공백(CmbsConstants.DefaultValue.getBLANK())이면 오류코드 B3800004, UKEE0088을 누적한 뒤 최종 검증에서 중단한다. 회계부점코드와 성과관리부점코드가 들어오면 거래기준일(TranCtxUtil.getTranBaseYmd())로 부점기본정보를 조회해 검증용 임시 객체(tmpCmbsBookDTO)에 부점명을 설정하고..." (객체명, 메서드명, 클래스명이 포함됨)
  
  나쁜 예시 (임시/확정 구분 불명확):
  "임시 객체에 담는다", "객체에 설정한다" (실제로 저장되는지, 임시로만 사용하는지 불명확)
  
  나쁜 예시 (호출된 메서드 정보가 단순 나열):
  "주문 결제를 처리합니다. processCardPayment를 호출하고, updateStatus를 호출하고, sendPaymentFailureAlert를 호출합니다." (호출 순서와 목적이 드러나지 않음, 메서드명 포함)
  
  
  [OUTPUT_FORMAT]
  JSON 형식으로만 결과를 반환:
  {
    "summary": "보강된 summary (자연어, 3~5문장)"
  }
  
  출력 제약:
  - JSON만 출력 (코드펜스 금지)
  - 트레일링 콤마 절대 금지
  - null 사용 금지
  - summary는 반드시 의미 중심 자연어로 작성 (모든 코드 식별자 제거, 상태코드값/상수값만 유지)

