name: "stereotype"
description: "클래스/인터페이스 전체 요약 + 스테레오타입 판별 (Summary + Stereotype 통합)"
version: "2.0"

input_schema:
  required:
    - summaries
    - locale
  optional:
    - class_meta

prompt: |
  [ROLE]
  당신은 Java 클래스/인터페이스의 구조, 책임, 비즈니스 로직을 분석하는 전문가입니다.
  멤버 분석 결과를 종합하여 클래스의 역할을 상세하게 설명하고, 아키텍처 역할(스테레오타입)을 분류합니다.
  
  
  [LANGUAGE_SETTING]
  응답 언어: {{ locale }}
  모든 분석 결과와 설명은 지정된 언어로 생성해야 합니다.
  
  
  [INPUT_DATA]
  {% if class_meta %}클래스 메타 정보 (주석 + 어노테이션): {{ class_meta }}{% endif %}
  
  멤버 분석 결과:
  {{ summaries }}
  
  
  ===============================================
  [TASK 1: 상세 요약 (DETAILED_SUMMARY)]
  ===============================================
  
  멤버 요약들을 종합하여 클래스 전체 역할을 상세하게 설명하세요.
  
  ★ 필수 포함 사항:
  1. 핵심 책임 및 역할 (이 클래스가 어떤 도메인/기능을 담당하는지)
  2. 주요 분기 조건과 비즈니스 규칙 (enum, 상수, 상태값 명시)
  3. 데이터 값 및 상수 (모든 리터럴 값)
  4. 협력 객체 및 의존성 (주입받는 서비스/컴포넌트)
  5. 예외 처리 및 검증 규칙
  
  요약 작성 규칙:
  - 최소 10문장 이상으로 상세하게 작성
  - 멤버 요약에 있는 모든 중요 정보를 누락 없이 포함
  - 추상적 표현 금지, 구체적인 값과 조건 명시
  - 가능한 한 실제 코드에 등장하는 클래스명, 메서드명, 필드명, 상수/enum/상태값, 의존 객체 이름을 그대로 텍스트 안에 명시하세요.
  - summary 텍스트 안에서는 Controller, Service, Repository, DTO, Util, Entity 등 스테레오타입/레이어 이름으로 클래스를 분류하거나 단정하지 마세요.
  - 이 파일의 [TASK 2]에서 별도로 스테레오타입(classStereotype, methodStereotypes)을 선택하므로, summary는 오직 "무엇을 어떻게 하는지"를 구체적으로 설명하는 데만 집중하세요.
  
  
  ===============================================
  [TASK 2: 스테레오타입 분류 (STEREOTYPE)]
  ===============================================
  
  어노테이션 + 멤버 summary를 기반으로 아키텍처 역할을 분류하세요.
  
  [클래스 스테레오타입] (하나만 선택):
  - Controller: REST/MVC 컨트롤러 (@RestController, @Controller)
  - Service: 비즈니스 서비스 (@Service)
  - Repository: 데이터 액세스 (@Repository, JpaRepository 상속)
  - Entity: JPA 엔티티 (@Entity, @Table)
  - DTO: 데이터 전송 객체 (Request/Response/DTO)
  - Config: 설정 클래스 (@Configuration)
  - Component: 범용 컴포넌트 (@Component)
  - Aspect: AOP 관점 (@Aspect)
  - Filter: 필터/인터셉터
  - Listener: 이벤트 리스너
  - Mapper: 객체 매핑
  - Util: 유틸리티/헬퍼
  - ExceptionHandler: 예외 처리 (@ControllerAdvice)
  - Enum: 열거형
  
  [메서드 스테레오타입] (각 메서드별 하나만 선택):
  - Endpoint: REST API 엔드포인트 (@XxxMapping)
  - Query: 조회 메서드
  - Command: 변경 메서드 (생성/수정/삭제)
  - Getter: 단순 getter
  - Setter: 단순 setter
  - Lifecycle: 라이프사이클 (@PostConstruct, main)
  - Scheduled: 스케줄 메서드 (@Scheduled)
  - EventHandler: 이벤트 핸들러
  - Init: 초기화 메서드
  - Transactional: 트랜잭션 메서드
  - BusinessLogic: 기타 비즈니스 로직
  - Validation: 검증 메서드
  
  
  ===============================================
  [OUTPUT_FORMAT]
  ===============================================
  
  다음 JSON 형식으로만 결과를 반환하세요:
  
  {
    "summary": "최소 10문장 이상의 매우 상세한 클래스 요약",
    "classStereotype": "Service",
    "methodStereotypes": {
      "getUserById": "Query",
      "createUser": "Command"
    }
  }
  
  출력 제약사항:
  - JSON 형식 외의 부가 설명이나 주석 금지
  - null 값 사용 금지
  - 코드펜스 포함 금지
  - 트레일링 콤마 절대 금지
  - classStereotype: 위 목록에서 하나 선택
  - methodStereotypes: 메서드명을 키, 스테레오타입을 값으로

output_schema:
  type: object
  properties:
    summary: { type: string }
    classStereotype: { type: string }
    methodStereotypes:
      type: object
      additionalProperties: { type: string }

