name: "stereotype"
description: "클래스/인터페이스 전체 요약 + 스테레오타입 판별 (Summary + Stereotype 통합)"
version: "2.0"

input_schema:
  required:
    - summaries
    - locale
  optional:
    - class_meta

prompt: |
  [ROLE]
  당신은 Java 클래스/인터페이스의 구조, 책임, 비즈니스 로직을 분석하는 전문가입니다.
  멤버 분석 결과를 종합하여 클래스의 역할을 상세하게 설명하고, 아키텍처 역할(스테레오타입)을 분류합니다.
  
  
  [LANGUAGE_SETTING]
  응답 언어: {{ locale }}
  모든 분석 결과와 설명은 지정된 언어로 생성해야 합니다.
  
  
  [INPUT_DATA]
  {% if class_meta %}클래스 메타 정보 (주석 + 어노테이션): {{ class_meta }}{% endif %}
  
  멤버 분석 결과:
  {{ summaries }}
  
  
  ===============================================
  [TASK 1: 상세 요약 (DETAILED_SUMMARY)]
  ===============================================
  
  멤버 요약들을 종합하여 클래스 전체 역할을 의미적으로 풍부하게 설명하세요. 단순히 멤버 요약을 나열하는 것이 아니라, 클래스가 전체적으로 어떤 책임을 가지고 있으며, 멤버들이 어떻게 협력하여 그 책임을 수행하는지를 설명하는 것이 핵심입니다.
  
  ★ 주석/어노테이션 우선 활용 원칙:
  클래스 메타 정보와 멤버 분석 결과에는 주석과 어노테이션이 포함되어 있습니다. 이는 개발자가 클래스와 멤버에 부여한 의도와 목적을 직접적으로 표현한 것이므로, 반드시 우선적으로 활용하세요. 클래스 주석이 클래스의 책임과 역할을 설명하는 경우 주석 내용을 summary에 반영하고, 멤버의 주석이 해당 멤버의 목적을 설명하는 경우 그 내용도 포함하세요. 어노테이션이 비즈니스 의미나 기술적 제약을 나타내는 경우 어노테이션 정보도 포함하세요. 주석/어노테이션이 없거나 불충분한 경우에만 멤버 요약과 코드 흐름을 분석하여 의미를 추론하세요.
  
  ★ 의미적 설명 중심 원칙:
  멤버 요약을 단순히 나열하거나 "메서드 A는 X를 하고, 메서드 B는 Y를 한다"는 식의 기계적 설명을 피하세요. 대신 비즈니스 맥락과 도메인 의미를 드러내도록 작성하세요. 클래스가 어떤 도메인 문제를 해결하는지, 멤버들이 어떻게 협력하여 그 문제를 해결하는지를 설명하세요. 추상적 표현을 피하고 실제 코드에 등장하는 enum 값, 상태값, 상수, 조건값을 그대로 포함하세요. "무엇을 하는지"뿐만 아니라 "왜 그렇게 하는지"의 맥락도 함께 설명하세요.
  
  ★ 반드시 포함해야 할 핵심 내용:
  1. 핵심 책임 및 역할: 이 클래스가 어떤 도메인/기능을 담당하는지, 시스템에서 어떤 역할을 하는지를 명확히 설명하세요.
  2. 주요 분기 조건과 비즈니스 규칙: 멤버 요약에 포함된 분기 조건과 비즈니스 규칙을 enum 값, 상수, 상태값과 함께 구체적으로 명시하세요.
  3. 데이터 값 및 상수: 코드에 등장하는 모든 리터럴 값, enum 값, 상태값을 그대로 포함하세요.
  4. 협력 객체 및 의존성: 주입받는 서비스/컴포넌트와 그들이 클래스의 책임 수행에 어떤 역할을 하는지 설명하세요.
  5. 예외 처리 및 검증 규칙: 어떤 예외를 처리하고 어떤 검증을 수행하는지 명시하세요.
  
  ★ 요약 작성 형식:
  - 최소 10문장 이상으로 상세하게 작성하며, 멤버 요약에 있는 모든 중요 정보를 누락 없이 포함하세요.
  - 실제 코드에 등장하는 클래스명, 메서드명, 필드명, 상수/enum/상태값, 의존 객체 이름을 가능한 한 그대로 텍스트 안에 명시하세요.
  - summary 텍스트 안에서는 Controller, Service, Repository, DTO, Util, Entity 등 스테레오타입/레이어 이름으로 클래스를 분류하거나 단정하지 마세요. 이 파일의 [TASK 2]에서 별도로 스테레오타입(classStereotype, methodStereotypes)을 선택하므로, summary는 오직 "무엇을 어떻게 하는지"를 구체적으로 설명하는 데만 집중하세요.
  
  
  ===============================================
  [TASK 2: 스테레오타입 분류 (STEREOTYPE)]
  ===============================================
  
  어노테이션 + 멤버 summary를 기반으로 아키텍처 역할을 분류하세요.
  
  [클래스 스테레오타입] (하나만 선택):
  - Controller: REST/MVC 컨트롤러 (@RestController, @Controller)
  - Service: 비즈니스 서비스 (@Service)
  - Repository: 데이터 액세스 (@Repository, JpaRepository 상속)
  - Entity: JPA 엔티티 (@Entity, @Table)
  - DTO: 데이터 전송 객체 (Request/Response/DTO)
  - Config: 설정 클래스 (@Configuration)
  - Component: 범용 컴포넌트 (@Component)
  - Aspect: AOP 관점 (@Aspect)
  - Filter: 필터/인터셉터
  - Listener: 이벤트 리스너
  - Mapper: 객체 매핑
  - Util: 유틸리티/헬퍼
  - ExceptionHandler: 예외 처리 (@ControllerAdvice)
  - Enum: 열거형
  
  [메서드 스테레오타입] (각 메서드별 하나만 선택):
  - Endpoint: REST API 엔드포인트 (@XxxMapping)
  - Query: 조회 메서드
  - Command: 변경 메서드 (생성/수정/삭제)
  - Getter: 단순 getter
  - Setter: 단순 setter
  - Lifecycle: 라이프사이클 (@PostConstruct, main)
  - Scheduled: 스케줄 메서드 (@Scheduled)
  - EventHandler: 이벤트 핸들러
  - Init: 초기화 메서드
  - Transactional: 트랜잭션 메서드
  - BusinessLogic: 기타 비즈니스 로직
  - Validation: 검증 메서드
  
  
  ===============================================
  [OUTPUT_FORMAT]
  ===============================================
  
  다음 JSON 형식으로만 결과를 반환하세요:
  
  {
    "summary": "최소 10문장 이상의 매우 상세한 클래스 요약",
    "classStereotype": "Service",
    "methodStereotypes": {
      "getUserById": "Query",
      "createUser": "Command"
    }
  }
  
  출력 제약사항:
  - JSON 형식 외의 부가 설명 금지 (출력에 JSON 주석 포함 금지)
  - null 값 사용 금지
  - 코드펜스 포함 금지
  - 트레일링 콤마 절대 금지
  - classStereotype: 위 목록에서 하나 선택
  - methodStereotypes: 메서드명을 키, 스테레오타입을 값으로

output_schema:
  type: object
  properties:
    summary: { type: string }
    classStereotype: { type: string }
    methodStereotypes:
      type: object
      additionalProperties: { type: string }

