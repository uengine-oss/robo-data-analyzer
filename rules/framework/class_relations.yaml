name: "class_relations"
description: "Java 클래스의 관계 분석 - Association, Composition, Dependency, Calls 추출"
version: "1.0"

input_schema:
  required:
    - class_name
    - skeleton_code
    - locale
  optional: {}

prompt: |
  [ROLE]
  당신은 Java 코드에서 클래스 간 관계를 분석하는 전문가입니다.
  클래스 다이어그램에 표시할 모든 관계 정보를 추출합니다.
  
  ⚠️ 책임 범위:
  - 필드 관계: ASSOCIATION (연관), COMPOSITION (합성)
  - 의존 관계: DEPENDENCY (메서드 파라미터/반환/로컬 변수)
  - 호출 관계: CALLS (메서드 호출)
  
  
  [LANGUAGE_SETTING]
  응답 언어: {{ locale }}
  
  
  [INPUT_DATA]
  분석 대상 클래스: {{ class_name }}
  
  클래스 스켈레톤 (필드, 생성자, 메서드 시그니처, 객체생성, 메서드호출):
  {{ skeleton_code }}
  
  
  [SECTION_1_FIELD_RELATIONS]
  ★ 필드 관계 분석 (Association/Composition):
  
  대상: FIELD 노드에서 사용자 정의 타입만
  
  제외 대상 (관계 생성하지 않음):
  - primitive 타입, wrapper 타입, String, Logger
  - 값 객체(Value Object): Money, Address, Email 등
  - enum 타입
  - 식별자 전용 타입: OrderId, UserId 등
  
  판단 기준: "이 객체를 떼어낼 수 있느냐"
  
  질문 ①: "이건 저 객체의 '부품'이라고 말해도 자연스러운가?"
  - 도메인 개념상 전체-부분 관계인가?
  - ✘ NO → ASSOCIATION
  - ✔ YES → 다음 질문
  
  질문 ②: "주인 객체가 없어지면, 이 객체는 의미가 남는가?"
  - ✔ YES → ASSOCIATION (독립 존재)
  - ✘ NO → 다음 질문
  
  질문 ③: "이 객체를 다른 객체로 옮겨도 말이 되는가?"
  - ✔ YES → ASSOCIATION
  - ✘ NO → COMPOSITION
  
  한 줄 공식: 못 떼면 합성, 떼면 연관, 애매하면 연관
  
  ⚠️ 코드 패턴은 힌트일 뿐:
  - new로 생성했다고 합성 아님 (도메인 의미로 판단)
  - 생성자/세터로 주입받았다고 연관 아님 (도메인 의미로 판단)
  - List<T>라고 연관 아님 (도메인 의미로 판단)
  
  다중성:
  - "1": 단일 객체 참조
  - "*": 배열/컬렉션 (List, Set, Map 등)
  
  
  [SECTION_2_DEPENDENCIES]
  ★ 의존 관계 분석:
  
  식별 대상:
  - 메서드 파라미터 타입 (usage: "parameter")
  - 메서드 반환 타입 (usage: "return")
  - 로컬 변수 타입 (usage: "local")
  - 캐스팅 타입 (usage: "cast")
  - 제네릭 내부 타입 (usage: "generic")
  
  sourceMember: 발생 위치 (메서드명 또는 생성자명)
  
  제외 대상:
  - primitive, wrapper, String, Object
  - Java 기본 클래스 (Exception, Date, Optional)
  - 이미 필드로 존재하는 타입 (Association/Composition으로 처리됨)
  
  
  [SECTION_3_CALLS]
  ★ 메서드 호출 분석:
  
  METHOD_CALL 노드에서 추출:
  - target: 호출 대상 (변수명 또는 클래스명)
  - method: 호출 메서드명
  - targetClass: 호출 대상의 클래스 타입 (FIELD에서 추론)
  
  추론 규칙:
  - orderService.findAll() → target="orderService"
    - FIELD에서 "OrderService orderService"가 있으면 → targetClass="OrderService"
  
  제외 대상:
  - this 메서드 호출 (자기 자신)
  - super 메서드 호출
  - 기본 타입 메서드: toString(), hashCode(), equals()
  - 컬렉션 내장 메서드: add(), get(), contains()
  - System, 로깅 호출
  
  
  [OUTPUT_FORMAT]
  JSON 형식으로만 결과를 반환:
  {
    "fieldRelations": [
      {
        "field": "필드명",
        "targetClass": "대상 클래스명",
        "type": "ASSOCIATION 또는 COMPOSITION",
        "multiplicity": "1 또는 *"
      }
    ],
    "dependencies": [
      {
        "targetClass": "타입명",
        "sourceMember": "발생위치 (메서드명/생성자명)",
        "usage": "parameter | return | local | cast | generic"
      }
    ],
    "calls": [
      {
        "target": "호출 대상 (변수명)",
        "method": "메서드명",
        "targetClass": "추론된 클래스명 또는 null"
      }
    ]
  }
  
  출력 제약:
  - JSON만 출력 (코드펜스 금지)
  - 빈 배열도 허용 (해당 관계가 없을 경우)
  - null 사용 금지 (targetClass 추론 불가 시 빈 문자열 "")
  - 트레일링 콤마 절대 금지
  - **⚠️ CRITICAL: 중복 제거** - 같은 관계는 한 번만 포함

