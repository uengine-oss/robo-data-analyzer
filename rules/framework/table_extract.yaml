name: "table_extract"
description: "SQL/엔티티 청크에서 테이블·컬럼·FK 추출"
version: "2.0"

input_schema:
  required:
    - sql_items
  optional: {}

prompt: |
  [ROLE]
  당신은 SQL 및 데이터베이스 스키마 분석 전문가입니다.
  각 SQL/엔티티 청크에서 테이블·컬럼·FK를 추출합니다.


  [INPUT]
  {% for item in sql_items %}
  --- SQL {{ loop.index }} (sql_key: {{ item.sql_key }}) ---
  {% if item.get('prev_summary') %}{{ item.prev_summary }}

  {% endif %}{{ item.sql_text }}
  {% endfor %}


  [RULES]

  ★ 1. 물리 테이블 vs 별칭 (최우선 규칙):
  - tables.name: FROM/JOIN에 직접 등장한 물리 테이블명만
  - alias_map: "테이블 AS 별칭" 패턴. 별칭은 절대 tables에 넣지 않음
  - 짧은 식별자(2~6자: A, B, T1, TR09 등)가 "식별자.컬럼"으로만 쓰이면 100% 별칭
  - 의심되면 별칭으로 간주. FROM/JOIN에 직접 없으면 tables에 넣지 않음
  - 시스템 테이블(DUAL, pg_catalog, sys.*, information_schema) 제외

  ★ 2. 입력 타입별 처리:
  - SQL문: FROM/JOIN에서 테이블, SELECT/WHERE에서 컬럼 추출
  - 엔티티 정의(XML/텍스트): 엔티티명→테이블명 (CamelCase→SCREAMING_SNAKE_CASE), 필드명→컬럼명
  - 엔티티 클래스: 테이블 매핑 어노테이션 있으면 해당 값, 없으면 필드명에서 추론
  - 필드 없는 엔티티도 tables는 반드시 생성 (columns=[] 허용)

  ★ 3. 컬럼 규칙:
  - columns[].table_name은 물리 테이블명만. 별칭이면 alias_map으로 치환
  - description: 역할 추론 가능하면 한 문장으로 반드시 채움
  - **컬럼 description 톤** — 비즈니스 흐름 + 담는 값/상태/조건 의미. ❌ "X 컬럼은 ... 변수에 복사된다" (코드 한글 읽기) / ✅ "결제수단 코드 ('CARD'=카드결제 / 'BANK'=계좌이체) 분기 키" (담긴 값 + 의미)
  - 코드 토큰 (메서드명·매크로·반환코드 매크로) 노출 X.

  ★ 4. FK 규칙:
  - JOIN ON/WHERE에서 두 테이블 컬럼이 = 비교 → FK 후보
  - 방향: FK 가진 쪽(many)이 from, PK 가진 쪽(one)이 to
  - 자기 자신 조인은 fks에 넣지 않음. 불확실하면 비워둠

  ★ 5. prev_summary:
  - alias_map 누적 유지 + 새 별칭 추가

  [EXAMPLE]
  ── 올바른 추출 ──
  SQL: SELECT TR09.코드, PK01.부점 FROM INST1.TSKEETR09 TR09, INST1.TSKEEPK01 PK01 WHERE TR09.키 = PK01.키
  ✅ tables: [{"name": "TSKEETR09", "relation": "SELECT"}, {"name": "TSKEEPK01", "relation": "SELECT"}]
  ✅ alias_map: [{"alias": "TR09", "physical_table": "TSKEETR09"}, {"alias": "PK01", "physical_table": "TSKEEPK01"}]
  ✅ fks: [{"from_table": "TSKEETR09", "from_column": "키", "to_table": "TSKEEPK01", "to_column": "키"}]

  ── 잘못된 추출 ──
  ❌ tables: [{"name": "TR09"}] → TR09는 별칭. 물리 테이블명 TSKEETR09를 써야 함
  ❌ tables: [{"name": "INST1"}] → INST1은 스키마명. 테이블이 아님


  [OUTPUT]
  {
    "results": [
      {
        "sql_key": "입력과 동일",
        "tables": [{"schema": "", "name": "물리테이블명", "relation": "SELECT|INSERT|UPDATE|DELETE", "description": "테이블 설명"}],
        "alias_map": [{"alias": "별칭", "physical_table": "물리테이블명"}],
        "columns": [{"table_schema": "", "table_name": "물리테이블명", "column_name": "컬럼명", "description": "컬럼 설명"}],
        "fks": [{"from_schema": "", "from_table": "", "from_column": "", "to_schema": "", "to_table": "", "to_column": ""}]
      }
    ]
  }

  - results 순서·개수는 입력 sql_items와 동일
  - description (테이블·컬럼) 은 반드시 한 문장 — 비즈니스 의미 + 담는 값/상태/조건 의미 (변수명·코드 토큰 X). 자세한 톤은 위 ★3 컬럼 규칙 참조.
  - JSON만 출력. 코드펜스, 주석, 트레일링 콤마 금지
