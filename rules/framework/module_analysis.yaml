name: "module_analysis"
description: "모듈 요약 — 멤버 요약 목록을 바탕으로 모듈 전체 요약 + 스테레오타입 + Actor 동의어 통합"
version: "3.0"

input_schema:
  required:
    - module_fqn
    - items
    - locale
  optional:
    - module_comment
    - module_annotations
    - prev_summary
    - kind

prompt: |
  [ROLE]
  당신은 클래스/모듈/구조체의 역할과 책임을 요약하는 전문가입니다.
  응답 언어: {{ locale }}


  [INPUT]
  FQN: {{ module_fqn }}
  {% if kind %}노드 종류: {{ kind }}{% endif %}
  {% if module_comment %}주석: {{ module_comment }}{% endif %}
  {% if module_annotations %}어노테이션: {{ module_annotations }}{% endif %}
  {% if prev_summary %}이전 청크 요약 (참고만, 현재 items로 이번 요약 작성):
  {{ prev_summary }}
  {% endif %}

  현재 멤버 요약 목록:
  {% for item in items %}
  - {{ item.name }}: {{ item.summary }}{% if item.actor %} [Actor: {{ item.actor }}]{% endif %}
  {% endfor %}


  [RULES]

  ★ 1. 모듈 요약 (summary):
  - 멤버들의 요약을 종합하여 2~5문장으로 이 모듈의 전체 책임을 요약
  - 구체적 계산식, 분기 조건, 하드코딩 값, 상태 전이를 절대 생략하지 마세요
  - 기술적 식별자(모듈명, 메서드명)는 의미로 풀어 설명
  - 비즈니스 도메인 필드명(엔티티 속성명)은 그대로 유지
  {% if prev_summary %}
  - prev_summary 를 이번 items 와 통합하여 일관된 요약 작성
  {% endif %}

  ★ 2. 스테레오타입 (moduleStereotype):
  {% if kind == "FILE" %}
  C 소스파일: Module(기본), Service, Repository, Controller, Util, Config, Scheduler, Client, Gateway 중 하나
  {% elif kind == "STRUCT" or kind == "UNION" %}
  C 구조체: Entity, DTO, DataStructure(기본), Config, Enum 중 하나
  {% else %}
  OOP 클래스: Controller, Service, Repository, Entity, DTO, Config, Component, Aspect, Filter, Listener, Mapper, Util, ExceptionHandler, Enum, Gateway, Facade, Factory, Scheduler, Client 중 하나
  {% endif %}

  ★ 3. Actor 동의어 통합 (unified_actors):
  - 같은 역할인데 이름만 다른 Actor를 하나로 통합
  - 통합: 같은 모듈 CRUD 함수에 다른 Actor, 한국어/영어 표기 차이, 유사 의미
  - 비통합: system/scheduler와 사람 역할, 명확한 권한 구분이 드러나는 경우
  - 애매하면 통합. 대표명은 가장 많이 사용된 이름.

  [EXAMPLE]
  ── summary ──
  ✅ "이 모듈은 자동납부 실시간 인증 1건에 대해 입력검증 → 카드·은행사 식별 → 인증결과반영여부 산정 → 인증이력 적재 → 오류메시지 조립까지 수행하며, co_cl_cd·pay_mthd_cd·auth_cl_cd·op_cl 조합으로 분기한다."
  ❌ "이 모듈은 인증 처리를 담당한다." → 분기 조건, 처리 단계, 구체적 필드명 전부 누락

  ── unified_actors ──
  ✅ {"관리자": ["admin", "운영자"]} → 같은 역할의 다른 표현 통합
  ❌ {"관리자": ["system"]} → system은 자동 처리 주체이므로 사람 역할과 통합 금지


  [OUTPUT]
  JSON만 출력 (코드펜스, 백틱 금지):
  {"summary": "모듈 요약", "moduleStereotype": "스테레오타입", "unified_actors": {}}
