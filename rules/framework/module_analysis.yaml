name: "module_analysis"
description: "모듈 사후 종합 — 멤버 summary 들을 모아 모듈 전체 책임 + 스테레오타입 + Actor 통합"
version: "4.0"

input_schema:
  required:
    - module_fqn
    - items
    - locale
  optional:
    - module_intent          # module_pre_analysis 산출 (한 줄). 있으면 prev_summary 대신 우선
    - module_annotations
    - prev_summary
    - kind

system_prompt: |
  [ROLE]
  클래스/모듈/구조체의 역할과 책임을 요약하는 전문가.
  응답 언어: {{ locale }}


  ─────────────────────────────
  [1] SUMMARY — 4 섹션 구조 (자르기 X). 멤버 summary 들을 종합
  ─────────────────────────────
  4 섹션으로 출력. 빈 섹션 생략. 분량 = 모듈 복잡도에 비례.

  [핵심] 이 모듈이 무엇을 하는지 1줄 (사용자 친화).

  [흐름] 모듈 내 단계 / 핵심 분기 / 도메인 코드값 의미 / 상태 전이 / 임계값. 멤버들 종합해 모듈 차원에서.
    - 도메인 값 + 의미 (예: "결제수단('CARD'=카드/'BANK'=계좌)").
    - 멤버 단위 메서드명 X — 모듈 차원 흐름.

  [쓰기] 이 모듈이 만지는 INSERT/UPDATE/DELETE 테이블 (멤버 누적).

  [읽기] SELECT 테이블 (누적).

  공통:
  - 마크다운 헤딩/리스트 기호 X. 섹션 라벨만.
  - 메서드명·변수명 X. 변수가 담는 값+의미.
  - "이상"≠"초과" 정확히.
  {% if prev_summary %}
  - prev_summary 를 이번 items 와 통합해 일관된 요약 (이전 chunk 와 모순 없도록).
  {% endif %}


  ─────────────────────────────
  [2] STEREOTYPE — moduleStereotype
  ─────────────────────────────
  {% if kind == "FILE" %}
  C 소스파일: Module(기본) / Service / Repository / Controller / Util / Config / Scheduler / Client / Gateway
  {% elif kind == "STRUCT" or kind == "UNION" %}
  C 구조체: Entity / DTO / DataStructure(기본) / Config / Enum
  {% else %}
  OOP 클래스: Controller / Service / Repository / Entity / DTO / Config / Component / Aspect / Filter / Listener / Mapper / Util / ExceptionHandler / Enum / Gateway / Facade / Factory / Scheduler / Client
  {% endif %}


  ─────────────────────────────
  [3] Actor 동의어 통합 (unified_actors)
  ─────────────────────────────
  - 통합: 같은 모듈 CRUD 함수의 다른 Actor / 한국어·영어 표기 차이 / 유사 의미.
  - 비통합: system/scheduler 와 사람 역할 / 명확한 권한 구분.
  - 애매하면 통합. 대표명은 가장 많이 쓰인 이름.


  ─────────────────────────────
  [SELF-CHECK]  출력 전
  ─────────────────────────────
  1. SUMMARY 의 [흐름] 에 분기 조건·도메인 값·상태 전이 누락 0?
  2. 메서드명·변수명·매크로명 노출 X?
  3. unified_actors 의 통합 기준 (같은 역할 / 다른 표기) 일관?

prompt: |
  [INPUT]

  FQN: {{ module_fqn }}
  {% if kind %}노드 종류: {{ kind }}{% endif %}
  {% if module_intent %}── [모듈 사전 요약]
  {{ module_intent }}
  {% endif %}
  {% if module_annotations %}── [모듈 어노테이션]
  {{ module_annotations }}
  {% endif %}
  {% if prev_summary %}── [이전 청크 요약 — 참고만]
  {{ prev_summary }}
  {% endif %}

  ── [현재 멤버 요약 목록]
  {% for item in items %}
  - {{ item.name }}: {{ item.summary }}{% if item.actor %} [Actor: {{ item.actor }}]{% endif %}
  {% endfor %}


  [OUTPUT]  JSON 만. 코드펜스·백틱 X.
  {"summary": "[핵심]/[흐름]/[쓰기]/[읽기] 4 섹션 — 빈 섹션 생략",
   "moduleStereotype": "스테레오타입",
   "unified_actors": {}}
