name: "neo4j_cypher"
description: "Neo4j Cypher 쿼리 실행 도구"
version: "1.0"

tool_definition:
  name: neo4j_cypher
  description: |
    Neo4j 그래프 데이터베이스에서 Cypher 쿼리를 실행합니다.
    검색, 조회, 관계 탐색에 사용합니다.
    
  parameters:
    query:
      type: string
      required: true
      description: |
        실행할 Cypher 쿼리.
        보안상 파라미터화된 쿼리 권장.
        예: "MATCH (n:CLASS) WHERE n.name = $name RETURN n"
        
    params:
      type: object
      required: false
      description: |
        쿼리 파라미터 (선택).
        예: {"name": "OrderService"}
        
  returns:
    type: array
    description: 쿼리 결과 레코드 리스트
    
  examples:
    - description: "클래스 노드 조회"
      input:
        query: "MATCH (n:CLASS) WHERE n.class_name = $name RETURN n"
        params: {"name": "OrderService"}
      output: [{"n": {"class_name": "OrderService", "summary": "..."}}]
      
    - description: "테이블 사용처 찾기"
      input:
        query: |
          MATCH (t:Table {name: $table_name})
          MATCH (n)-[:FROM|WRITES]->(t)
          RETURN n.name AS code_name, labels(n)[0] AS type
        params: {"table_name": "ORDER_HEADER"}
      output: [{"code_name": "processOrder", "type": "PROCEDURE"}]
      
    - description: "USES 관계로 흐름 추적"
      input:
        query: |
          MATCH (m:METHOD)-[:USES {role: 'write'}]->(s:SymbolRef {name: $symbol})
          MATCH (m2:METHOD)-[:USES {role: 'read'}]->(s)
          RETURN m.name AS writer, m2.name AS reader
        params: {"symbol": "cfg"}
      output: [{"writer": "initConfig", "reader": "processOrder"}]
      
  error_handling:
    - error: "SyntaxError"
      action: "쿼리 문법 확인 후 재시도"
    - error: "NodeNotFound"
      action: "노드 레이블/속성 확인"
    - error: "Timeout"
      action: "쿼리 최적화 (LIMIT 추가, 인덱스 활용)"

