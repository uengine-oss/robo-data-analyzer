name: "semantic_search_summary"
description: "summary 임베딩 기반 의미 검색 도구"
version: "1.0"

tool_definition:
  name: semantic_search_summary
  description: |
    노드의 summary 임베딩을 기반으로 의미적으로 유사한 노드를 검색합니다.
    Neo4j 벡터 인덱스 또는 외부 벡터 DB를 사용합니다.
    후보를 빠르게 줄이는 용도로 사용하며, 최종 확정은 그래프 관계로 검증합니다.
    
  parameters:
    query:
      type: string
      required: true
      description: |
        검색 질문/쿼리 텍스트.
        자연어 질문 또는 키워드 조합.
        예: "주문 기본 통화 설정"
        
    top_k:
      type: integer
      required: false
      default: 30
      description: |
        반환할 최대 결과 수.
        권장: 30~50 (너무 크면 느려짐)
        
    filters:
      type: object
      required: false
      description: |
        필터 조건 (선택).
        예: {"label": "CLASS", "file_name": "Order*.java"}
        
  returns:
    type: array
    description: |
      유사도 순으로 정렬된 노드 참조 리스트.
      각 항목: {node_id, score, type, summary}
      
  examples:
    - description: "설정 관련 노드 검색"
      input:
        query: "데이터베이스 연결 설정"
        top_k: 20
        filters: {"label": "NONTARGET_BLOCK"}
      output:
        - {"node_id": "4:abc:123", "score": 0.92, "type": "NONTARGET_BLOCK", "summary": "MySQL 연결 설정..."}
        - {"node_id": "4:abc:124", "score": 0.85, "type": "NONTARGET_BLOCK", "summary": "PostgreSQL 설정..."}
        
    - description: "주문 처리 메서드 검색"
      input:
        query: "주문 상태 변경 처리"
        top_k: 30
        filters: {"label": "METHOD"}
      output:
        - {"node_id": "4:xyz:456", "score": 0.88, "type": "METHOD", "summary": "주문 상태를 변경하는 메서드..."}
        
  notes:
    - "score가 0.7 미만이면 관련성이 낮을 수 있음"
    - "결과는 후보일 뿐, 그래프 관계로 최종 검증 필요"
    - "summary_vec이 없는 노드는 검색되지 않음"

