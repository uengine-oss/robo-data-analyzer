name: "lex_search_node_code"
description: "node_code에서 정확 문자열 검색 도구"
version: "1.0"

tool_definition:
  name: lex_search_node_code
  description: |
    노드의 node_code 속성에서 정확한 문자열/토큰을 검색합니다.
    Neo4j CONTAINS 또는 fulltext 인덱스를 사용합니다.
    키워드, 상수, 테이블명 등 정확한 매칭이 필요할 때 사용합니다.
    
  parameters:
    substr:
      type: string
      required: true
      description: |
        검색할 문자열.
        예: "order.default-currency", "ORDER_HEADER"
        
    top_k:
      type: integer
      required: false
      default: 50
      description: |
        반환할 최대 결과 수.
        
    filters:
      type: object
      required: false
      description: |
        필터 조건 (선택).
        예: {"label": "METHOD", "file_name": "Order*.java"}
        
  returns:
    type: array
    description: |
      일치하는 노드 참조 리스트.
      각 항목: {node_id, type, file_name, start_line, matched_context}
      
  examples:
    - description: "설정 키 사용처 찾기"
      input:
        substr: "order.default-currency"
        top_k: 30
        filters: {"label": "METHOD"}
      output:
        - {"node_id": "4:abc:123", "type": "METHOD", "file_name": "OrderConfig.java", "start_line": 15, "matched_context": "@Value(\"${order.default-currency:USD}\")"}
        
    - description: "테이블명 참조 찾기"
      input:
        substr: "ORDER_HEADER"
        top_k: 50
      output:
        - {"node_id": "4:xyz:456", "type": "PROCEDURE", "file_name": "order_proc.sql", "start_line": 10, "matched_context": "SELECT * FROM ORDER_HEADER"}
        
  notes:
    - "대소문자 구분됨 (필요시 toLower 사용)"
    - "부분 문자열 매칭 (CONTAINS)"
    - "특수문자 이스케이프 필요할 수 있음"
    - "결과가 많으면 filters로 범위 좁히기"

