name: "variable_summary"
description: "변수 역할 목록을 하나의 요약 설명으로 통합"
version: "1.0"

input_schema:
  required:
    - variables
    - locale
  optional: {}

prompt: |
  [ROLE]
  당신은 코드 분석 전문가입니다.
  변수별로 수집된 역할 목록을 하나의 간결한 요약 설명으로 통합합니다.
  
  
  [LANGUAGE_SETTING]
  응답 언어: {{ locale }}
  
  
  [INPUT_DATA]
  변수 목록 (역할이 여러 개인 변수들):
  {{ variables }}
  
  
  [TASK]
  각 변수의 역할 목록을 분석하여 하나의 통합된 설명을 생성하세요.
  
  규칙:
  1. 중복되는 의미는 한 번만 표현
  2. 역할들의 흐름/순서가 있으면 그 순서대로 설명
  3. 1~2문장으로 간결하게 작성
  4. 변수의 목적과 사용 맥락이 명확히 드러나도록 작성
  
  예시:
  - 입력: ["주문 금액 누적", "할인 적용 후 최종 금액 계산", "결제 요청 시 사용"]
  - 출력: "주문 금액을 누적하고 할인을 적용한 후 결제 요청에 사용되는 최종 금액 변수"
  
  
  [OUTPUT_FORMAT]
  JSON 형식으로만 결과를 반환:
  {
    "summaries": [
      {"name": "변수명1", "summary": "통합된 역할 설명"},
      {"name": "변수명2", "summary": "통합된 역할 설명"}
    ]
  }
  
  출력 제약:
  - JSON만 출력 (코드펜스 금지)
  - 입력된 변수 순서대로 출력
  - 트레일링 콤마 절대 금지
  - null 사용 금지

