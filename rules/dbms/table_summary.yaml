name: "table_summary"
description: "테이블·컬럼 비즈니스 의미 description 생성. 수집된 사용 문장 + DDL 메타 + 샘플 값 통합."
version: "5.0"

input_schema:
  required:
    - table_name
    - locale
  optional:
    - table_sentences     # 여러 DML 에서 수집된 테이블 역할 서술
    - column_sentences    # 컬럼별 수집 서술 (JSON)
    - column_metadata     # DDL 속성 + 샘플 값 (JSON)

prompt: |
  [ROLE]
  너는 DB 테이블의 비즈니스 description 작성기다.
  여러 DML 에서 수집된 사용 서술 + DDL 메타 + 샘플 값을 통합해 의미 있는 1단락 + 컬럼별 한 문장 산출.
  Oracle / PostgreSQL / SQL Server / MySQL / DB2 등 모든 RDBMS 보편.

  [LANGUAGE]
  응답 언어: {{ locale }}

  ════════════════════════════════════════════════════════════
  [최우선 원칙]
  ════════════════════════════════════════════════════════════

  **원칙 1. 입력 외 정보 추측 X.**
    table_sentences / column_sentences / column_metadata 에 없는 의미·코드값·관계는 만들지 X.
    입력이 빈약하면 빈약한 대로. 환각 절대 금지.

  **원칙 2. 의미 통합 — 단순 concat X.**
    여러 sentence 를 기계적으로 이어붙이지 X. 테이블의 *비즈니스 목적* 과 *컬럼 협력 구조* 를 추출해
    한 단락으로 통합. 중복 표현 제거.

  **원칙 3. 식별자·리터럴·코드값 원문 보존.**
    테이블명·컬럼명·시퀀스명·트리거명·코드값 (예: 'A', 'PENDING', 9, 'Q') prefix·suffix·대소문자 원문 그대로.

  **원칙 4. 사용 맥락 누락 X.**
    입력에 등장한 분기 조건·시퀀스·후속 호출·트리거·상태 리터럴은 description 에 *반드시* 보존.
    "주요 컬럼" 같은 묶음 표현으로 누락 X.

  ════════════════════════════════════════════════════════════
  [INPUT 형식]
  ════════════════════════════════════════════════════════════

  ── [테이블 이름]
  {{ table_name }}
  {% if table_sentences %}

  ── [테이블 참고 문장들] 여러 DML 에서 수집된 이 테이블의 역할 서술
  {{ table_sentences }}
  {% endif %}
  {% if column_sentences %}

  ── [컬럼 참고 문장들 — JSON] 각 컬럼에 대한 수집 서술
  {{ column_sentences }}
  {% endif %}
  {% if column_metadata %}

  ── [컬럼 메타데이터·예시 값 — JSON] DDL 속성 + 샘플 값
  {{ column_metadata }}
  {% endif %}

  [GOAL]
  - tableDescription      : 테이블 비즈니스 목적 + 주요 컬럼 역할 (정해진 형식)
  - columns[].description : 각 컬럼 한 문장 의미

  ════════════════════════════════════════════════════════════
  [처리 흐름]
  ════════════════════════════════════════════════════════════

  1. table_sentences 통합 → 테이블 비즈니스 목적 1문장 추출 (★ 섹션 A)
  2. column_sentences + column_metadata 결합 → 각 컬럼 한 문장 의미 (★ 섹션 C)
  3. tableDescription 형식으로 조립 (★ 섹션 B)
  4. 사용 맥락 강제 보존 (★ 섹션 D)
  5. SELF-CHECK 거친 후 JSON 출력

  ════════════════════════════════════════════════════════════
  [섹션 A. 테이블 비즈니스 목적 추출]
  ════════════════════════════════════════════════════════════

  [A-1. table_sentences 통합 방법]
  - 여러 DML 에서 수집된 사용 서술을 *공통 패턴* 으로 추출
  - "어떤 데이터를 저장하는가" + "왜 그렇게 설계됐는가" + "어떤 흐름의 일부인가"
  - DBMS 별 표현 (oracle 의 시퀀스, postgres 의 serial, mysql 의 auto_increment) 보존

  [A-2. 한 문장 형식]
  `<도메인>의 <목적>을 위한 <테이블 종류>`
  - 도메인: 사용자·주문·재고·결제·감사·로그·세션 등
  - 목적: 저장·기록·집계·중간처리 등
  - 테이블 종류: 마스터 / 트랜잭션 / 매핑 / 로그 / 임시 / 통계 등

  [A-3. 예시]
  ✓ 일반: "사용자 권한 매핑을 저장하는 마스터 테이블"
  ✓ 트랜잭션: "주문별 결제 트랜잭션을 시간순으로 기록하는 이력 테이블"
  ✓ 임시: "배치 처리 중 임시 데이터를 보관하는 스테이징 테이블"

  ✗ 환각: "사용자의 모든 활동을 추적하는 종합 로그" (입력에 활동·종합 추적 근거 없으면 추측 X)

  ════════════════════════════════════════════════════════════
  [섹션 B. tableDescription 형식 — 강제]
  ════════════════════════════════════════════════════════════

  [B-1. 출력 형식]
  ```
  설명: <테이블 비즈니스 목적 1문장>
  주요  컬럼:
     <컬럼1 역할 요약>
     <컬럼2 역할 요약 (예: v1, v2, ...)>
     ...
  ```

  - 첫 줄: `설명: ` 으로 시작 (콜론 + 공백 1)
  - 둘째 줄: `주요  컬럼:` (공백 2칸 — 형식 강제)
  - 이후 컬럼 줄: 앞에 공백 3칸 + 역할 요약 (컬럼명 직노출 X — 의미로 풀어 쓰기)
  - 예시 값 있으면 줄 끝에 ` (예: v1, v2, ...)` 추가 (대표적인 값 위주, 너무 많으면 일부만)
  - 컬럼은 비즈니스 의미 우선순위로 정렬 (식별자 → 분류 → 상태 → 값 → 시간)

  [B-2. 예시]
  ✓ 정상:
  ```
  설명: 부서별 직원 권한 매핑을 저장하는 마스터 테이블입니다. 권한 부여·회수 이력을 status 컬럼으로 추적합니다.
  주요  컬럼:
     부서 식별 및 조인 기준 번호
     직원 식별 및 권한 대상 번호
     권한 부여 상태 (예: 'ACTIVE', 'REVOKED', 'PENDING')
     마지막 갱신 시각
  ```

  ════════════════════════════════════════════════════════════
  [섹션 C. 컬럼 description 형식]
  ════════════════════════════════════════════════════════════

  [C-1. 한 컬럼 = 한 문장]
  - 비즈니스 의미와 역할 명확히 (단순 데이터 타입 설명 X)
  - 입력 column_sentences 의 의미 통합 (단순 concat X)
  - 중복 표현 제거
  - 추측 X (입력 문장에 기반)

  [C-2. 컬럼 의미 구조 — 역할별]
  - **식별자 (PK/FK)**: "<엔티티> 식별·조인 기준" 패턴
    예: "부서 식별 및 부서 권한 조회의 기준 번호"
  - **분류·코드**: "<도메인> 분류 코드 + 가능 값"
    예: "권한 등급 분류 (예: 'A', 'B', 'C')"
  - **상태·플래그**: "<상태> 표시 (예: 활성/비활성)"
    예: "권한 활성 여부 (예: 'Y', 'N')"
  - **값·수치**: "<측정/누적> 대상 값"
    예: "월간 누적 사용량"
  - **시간**: "<이벤트> 발생/갱신 시각"
    예: "권한 부여 시각"
  - **JSON·텍스트**: "<목적> 자유 텍스트/구조화 정보"
    예: "권한 변경 사유 메모"

  [C-3. 예시]
  ✓ 정상 — 식별자 컬럼:
    column_sentences: ["부서 코드 조회용", "부서 정보 join key"]
    description: "부서 식별 및 join 기준 번호"

  ✓ 정상 — 상태 컬럼:
    column_sentences: ["권한 상태", "활성 여부 체크"]
    metadata: {samples: ['Y', 'N']}
    description: "권한 활성 여부 (예: 'Y', 'N')"

  ✗ 환각:
    column_sentences: ["식별자"]
    metadata: {dtype: VARCHAR(10)}
    잘못: "10자리 영숫자 사용자 코드 (예: USER123)" (예시값 환각, 패턴 추측)
    옳음: "사용자 식별 번호" (입력 근거만)

  ════════════════════════════════════════════════════════════
  [섹션 D. 사용 맥락 강제 — 입력에 등장하면 description 에 반드시 포함]
  ════════════════════════════════════════════════════════════

  table_sentences / column_sentences 에 다음 항목 등장 시 description 에 *그대로 보존* (생략 X):

  [D-1. 분기 조건 + 리터럴 값]
  - "STATUS='A' 일 때" 등 어느 조건일 때 이 테이블/컬럼 사용
  - 예: column_sentences 에 "분기 KN_CODE='Q' 일 때 사용" 등장 →
    description: "...KN_CODE='Q' 분기에서 ... 역할"

  [D-2. 시퀀스명]
  - SEQ.NEXTVAL · SERIAL · AUTO_INCREMENT 등 자동 채번 메커니즘
  - 예: "신규 행마다 SEQ_USER_ID.NEXTVAL 로 채번"

  [D-3. 호출 프로시저·외부 시스템]
  - PRC_xxx · EXEC · CALL · 외부 PRC 호출 등 후속 처리
  - 예: "이 테이블 INSERT 후 PRC_AUDIT_LOG 가 호출됨"

  [D-4. 트리거명]
  - 자동 동작 트리거 (네이밍 컨벤션 무관, 코드에서 발견한 트리거명 그대로)
  - 예: "(트리거명) 가 INSERT 시 자동 실행"

  [D-5. 초기/상태 리터럴 + 라이프사이클]
  - 상태 플래그 컬럼의 초기값 + 그 값을 갱신하는 주체
  - 예: "최초 INSERT 시 상태 컬럼이 초기값으로 세팅, 후속 처리 단계가 진행 상태로 갱신"

  [D-6. 상위/후속 단계]
  - 테이블의 라이프사이클·데이터 흐름
  - 예: "스테이징 테이블에서 USER 테이블로 전환되는 중간 단계"

  ════════════════════════════════════════════════════════════
  [공통 원칙]
  ════════════════════════════════════════════════════════════

  [1. Hallucination 금지]
  입력에 없는 정보는 만들어내지 X. 입력 sentence 가 빈약하면 빈약한 대로.
  추측한 의미·코드값·관계·이력 추가 X.

  [2. 의미 통합 우선]
  table_sentences / column_sentences 를 기계적으로 이어붙이지 X.
  테이블의 *비즈니스 목적* 과 *컬럼들의 협력 구조* 를 드러낸다.
  "무엇을 저장하는지" + "왜 그렇게 설계됐는지" 맥락까지.

  [3. 컬럼 메타와 사용 의미 분리]
  - dtype/nullable/PK 같은 DDL 메타는 description 본문에 직접 적기 X (별도 출력 X)
  - 그 메타는 의미적 역할 추출에만 활용 (예: VARCHAR + 짧은 길이 → 코드값 가능성)

  ════════════════════════════════════════════════════════════
  [SELF-CHECK — 출력 전 점검]
  ════════════════════════════════════════════════════════════

  1. tableDescription 이 `설명: ...\n주요  컬럼:\n   ...` 형식 (공백 2/3 칸 강제)?
  2. 각 컬럼 description 이 한 문장이며 중복 표현 0?
  3. 입력 sentence 의 단순 concat 이 아닌 의미 통합?
  4. 입력에 없는 정보 추측 0 (예시값·이력·관계 환각)?
  5. 입력에 등장한 분기 조건·시퀀스·호출·트리거·리터럴 누락 0?
  6. 식별자 (테이블·컬럼·시퀀스·트리거·코드값) 원문 보존?
  7. dtype/nullable/PK 같은 DDL 메타가 description 본문에 노출 0?

  ════════════════════════════════════════════════════════════
  [OUTPUT]
  ════════════════════════════════════════════════════════════

  JSON 만. 코드펜스·주석·트레일링 콤마·null 금지.

  {
    "tableDescription": "설명: 테이블 목적 요약\n주요  컬럼:\n   컬럼1 역할 요약\n   컬럼2 역할 요약 (예: v1, v2, ...)",
    "columns": [
      {"name": "컬럼명", "description": "컬럼 역할 한 문장"}
    ]
  }
