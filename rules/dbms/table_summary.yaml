name: "table_summary"
description: "테이블·컬럼 비즈니스 의미 description 생성 (수집된 사용 문장 + DDL 메타 통합)"
version: "4.0"

input_schema:
  required:
    - table_name
    - locale
  optional:
    - table_sentences     # 여러 DML 에서 수집된 테이블 역할 서술
    - column_sentences    # 컬럼별 수집 서술 (JSON)
    - column_metadata     # DDL 속성 + 샘플 값 (JSON)

prompt: |
  [ROLE]
  데이터베이스 테이블의 비즈니스 의미를 담은 description 생성. 여러 DML 에서 수집된 사용 서술 + DDL 메타 + 샘플 값을 통합.

  [LANGUAGE]
  응답 언어: {{ locale }}

  [INPUT]
  ── [테이블 이름]
  {{ table_name }}
  {% if table_sentences %}

  ── [테이블 참고 문장들] 여러 DML 에서 수집된 이 테이블의 역할 서술
  {{ table_sentences }}
  {% endif %}
  {% if column_sentences %}

  ── [컬럼 참고 문장들 — JSON] 각 컬럼에 대한 수집 서술
  {{ column_sentences }}
  {% endif %}
  {% if column_metadata %}

  ── [컬럼 메타데이터·예시 값 — JSON] DDL 속성 + 샘플 값
  {{ column_metadata }}
  {% endif %}

  [GOAL]
  - tableDescription   : 테이블 비즈니스 목적 + 주요 컬럼 역할 (정해진 형식)
  - columns[].description : 각 컬럼 한 문장 의미

  ════════════════════════════════════════════════════════════
  [섹션 A. 처리 흐름]
  ════════════════════════════════════════════════════════════

  1. table_sentences 통합 → 테이블 비즈니스 목적 1문장 추출
  2. column_sentences + column_metadata 결합 → 각 컬럼 한 문장 의미 작성
  3. tableDescription 형식으로 조립 → ★ 섹션 B
  4. 입력에 없는 정보 추측 X (★ 공통 원칙 1)

  ════════════════════════════════════════════════════════════
  [섹션 B. tableDescription 형식 (엄격)]
  ════════════════════════════════════════════════════════════

  - 첫 줄: `설명: ` 으로 시작. 테이블 목적 1문장 (비즈니스 의미 + 왜 그렇게 설계됐는지 맥락)
  - 둘째 줄: `주요  컬럼:` (공백 2칸)
  - 이후 각 컬럼 줄: 앞에 공백 3칸 + 역할 요약 (컬럼명 직노출 X)
  - 예시 값 있으면 줄 끝에 ` (예: v1, v2, ...)` 추가, 최대 20개 코드값

  ════════════════════════════════════════════════════════════
  [섹션 C. 컬럼 description 형식]
  ════════════════════════════════════════════════════════════

  - 한 문장. 비즈니스 의미와 역할 명확히
  - 기계적 결합 X (단순 sentence concat 금지) — 의미 통합
  - 중복 표현 X
  - 추측 X (입력 문장에 기반)

  ════════════════════════════════════════════════════════════
  [섹션 D. 사용 맥락 강제 — 입력에 등장하면 description 에 반드시 포함]
  ════════════════════════════════════════════════════════════

  table_sentences / column_sentences 에 다음 항목 등장 시 description 에 그대로 포함 (생략 금지):

  - **분기 조건 + 리터럴 값** (예: `KN_CODE = 'Q'`, `DATA_PROCESS = 'A'`) — 어느 조건일 때 이 테이블/컬럼 사용
  - **시퀀스명** (예: `SEQ_TRAN2FA_RDITAG_TRSNO.NEXTVAL`) — 자동 채번 메커니즘
  - **호출 프로시저** (예: `PRC_INSERT_RDRTAGSUNSI`) — 트리거/SP 흐름의 후속 처리
  - **트리거명** (예: `TRG_INS_RDITAG_TB`) — 이 테이블에 자동 동작 트리거
  - **초기/상태 리터럴** (예: `PROCESS_YN='N'`, `'Y'` 갱신 주체) — 컬럼 초기 상태 + 갱신 흐름
  - **상위/후속 단계** (예: "후속 배치가 'Y' 갱신") — 테이블의 라이프사이클

  ════════════════════════════════════════════════════════════
  [공통 원칙]
  ════════════════════════════════════════════════════════════

  [1. Hallucination 금지]
  입력에 없는 정보는 만들어내지 X. 입력 문장이 빈약하면 빈약한 대로. 추측한 의미·코드값·관계 추가 X.

  [2. 의미적 설명 우선]
  table_sentences / column_sentences 를 기계적으로 이어붙이지 X. 테이블의 **비즈니스 목적** 과 **컬럼들의 협력 구조** 를 드러낸다. "무엇을 저장하는지" + "왜 그렇게 설계됐는지" 맥락까지.

  ════════════════════════════════════════════════════════════
  [SELF-CHECK]
  ════════════════════════════════════════════════════════════

  - tableDescription 이 `설명: ...\n주요  컬럼:\n   ...` 형식?
  - 각 컬럼 description 이 한 문장이며 중복 표현 0?
  - 입력 문장의 단순 concat 이 아닌 의미 통합?
  - 입력에 없는 정보 추측 0?
  - 입력에 등장한 분기 조건·시퀀스·호출·리터럴 누락 0?

  ════════════════════════════════════════════════════════════
  [OUTPUT]
  ════════════════════════════════════════════════════════════

  JSON 만. 코드펜스·주석·트레일링 콤마 금지.

  {
    "tableDescription": "설명: 테이블 목적 요약\n주요  컬럼:\n   컬럼1 역할 요약\n   컬럼2 역할 요약 (예: v1, v2, ...)",
    "columns": [
      {"name": "컬럼명", "description": "컬럼 역할 한 문장"}
    ]
  }
