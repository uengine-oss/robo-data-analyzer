name: "table_summary"
description: "테이블·컬럼 설명 문서 생성"
version: "2.0"

input_schema:
  required:
    - table_name
    - locale
  optional:
    - table_sentences
    - column_sentences
    - column_metadata

prompt: |
  [ROLE]
  데이터베이스 테이블 문서를 작성합니다.


  [LANGUAGE]
  응답 언어: {{ locale }}


  [INPUT]
  ── [테이블 이름] 역할: 대상 테이블 식별자
  {{ table_name }}

  {% if table_sentences %}
  ── [테이블 참고 문장들] 역할: 여러 DML 에서 수집된 이 테이블의 역할 서술
  {{ table_sentences }}
  {% endif %}

  {% if column_sentences %}
  ── [컬럼 참고 문장들 (JSON)] 역할: 각 컬럼에 대한 수집 서술
  {{ column_sentences }}
  {% endif %}

  {% if column_metadata %}
  ── [컬럼 메타데이터·예시 값 (JSON)] 역할: DDL 속성 + 샘플 값
  {{ column_metadata }}
  {% endif %}


  [GOAL]
  tableDescription 과 columns[].description 을 생성해 JSON 으로 반환.


  [RULES]

  ★★★ 의미적 설명
  제공된 문장들을 기계적으로 결합하지 않는다. 테이블이 가진 비즈니스 목적과 컬럼들의 협력 구조를 드러낸다.
  "무엇을 저장하는지" + "왜 그렇게 설계됐는지" 맥락까지 담는다.

  ★★ tableDescription 형식
  - 첫 줄: "설명: " 으로 시작. 테이블 목적을 1문장으로 요약.
  - 둘째 줄: "주요  컬럼:" (공백 2칸)
  - 이후 각 컬럼 줄: 앞에 공백 3칸 + 역할 요약 (컬럼 name 출력 X).
  - 예시 값이 있으면 줄 끝에 " (예: v1, v2, ...)" 추가. 최대 20개 코드값 포함.

  ★★ 컬럼 description
  - 한 문장. 비즈니스 의미와 역할 명확히.
  - 중복 표현 금지. 추측 금지 (입력 문장에 기반).


  [SELF-CHECK]
  - tableDescription 이 "설명: ..." 형식을 따르는가?
  - 각 컬럼 설명이 한 문장이며 중복 표현 없는가?
  - 입력에 없는 정보를 추측해 넣지 않았는가?


  [OUTPUT]
  JSON 만 출력. 코드펜스·주석·설명 금지. 트레일링 콤마 금지.

  {
    "tableDescription": "설명: 테이블 목적 요약\n주요  컬럼:\n   컬럼1 역할 요약 (예: v1, v2, ...)\n   컬럼2 역할 요약",
    "columns": [
      {"name": "컬럼명", "description": "컬럼 역할 요약"}
    ]
  }
