name: "dml_extract"
description: "DML range 별 테이블·R/W·컬럼·FK·DB링크 추출. ddl_context 유무로 흐름 분기"
version: "4.0"

input_schema:
  required:
    - code
    - ranges
    - locale
  optional:
    - context             # 부모 컨텍스트 (참고만)
    - ddl_context         # 결정론 매칭된 테이블·컬럼 메타 (있으면 식별 skip)

prompt: |
  [ROLE]
  SQL DML 코드를 분석해 각 range 의 테이블 사용·accessMode·컬럼·FK·DB링크 메타를 산출.

  [LANGUAGE]
  응답 언어: {{ locale }}

  [INPUT]
  ── [분석 대상 DML 코드]
  {{ code }}

  ── [분석 범위 목록] 각 range 는 startLine~endLine 안에서만 독립 분석
  {{ ranges }}
  {% if context %}

  ── [부모 컨텍스트] 상위 구조·별칭 매핑 참고용 (현재 range 결과에 중복 X)
  {{ context }}
  {% endif %}
  {% if ddl_context %}

  ── [DDL 컨텍스트] 코드에 사용되는 테이블·컬럼 — 이미 식별 완료 (식별 작업 X)
  {{ ddl_context }}
  {% endif %}

  [GOAL]
  각 range 별 산출:
  - tables       : 사용 테이블 + accessMode + 컬럼별 역할
  - fkRelations  : JOIN/WHERE 의 테이블 간 컬럼 비교
  - dbLinks      : '@' 패턴 외부 링크

  ════════════════════════════════════════════════════════════
  [섹션 A. 처리 흐름 (per range)]
  ════════════════════════════════════════════════════════════

  1. range 의 코드 라인 추출 (startLine~endLine 안만)
  2. accessMode 판정 → ★ 섹션 B
  3. tables 의 columns 채움 → ★ 섹션 C (ddl_context 유무로 분기)
  4. fkRelations 추출 → ★ 섹션 D
  5. dbLinks 추출 → ★ 섹션 E

  ════════════════════════════════════════════════════════════
  [섹션 B. accessMode 판정 (r/w)]
  ════════════════════════════════════════════════════════════

  - INSERT INTO / UPDATE / DELETE FROM / MERGE INTO 의 대상 → `w`
  - SELECT FROM / JOIN / WHERE 서브쿼리 source → `r`
  - 한 range 에 r·w 모두면 `w` 우선 (대표 모드)
  - 여러 테이블은 각자 독립 판정

  ════════════════════════════════════════════════════════════
  [섹션 C. tables 추출 (ddl_context 분기)]
  ════════════════════════════════════════════════════════════
  {% if ddl_context %}

  [ddl_context 있음 — 사용 의미 + R/W 만, 식별 X]
  - tables 결과는 이 range 에 실제 등장하는 항목만
  - tableDescription: 이 SP 에서 해당 테이블이 어떻게 쓰이는지 1~2 문장
  - columns 배열: 이 range 에서 실제 사용된 컬럼 + 역할이 명확한 것만 (모호 컬럼 생략)
  - columns[].description: 이 DML 에서 컬럼이 하는 역할 한 문장
  - ddl_context 목록에 없는 테이블/컬럼명 만들지 X (환각 금지)
  - 제외: DUAL, 시퀀스, 시스템 카탈로그 (pg_catalog · information_schema), CTE 별칭, WITH 임시 결과명 — ddl_context 에 있어도 tables 결과에 포함 X
  {% else %}

  [ddl_context 없음 — 식별 + 사용 의미]
  - 식별 대상: INSERT INTO / UPDATE / DELETE FROM / SELECT FROM / MERGE INTO / JOIN / EXECUTE IMMEDIATE 의 대상, 변수에 저장된 SQL, 동적 SQL, CTE 내부 실제 테이블
  - 형식: 스키마 있으면 `"SCHEMA.TABLE"`, 없으면 `"TABLE"`. 따옴표 제거. 별칭 제거. 대소문자 원문
  - 제외: CTE 별칭, WITH 임시 결과명, DUAL, 시퀀스, 시스템 카탈로그 (pg_catalog · information_schema)
  - columns 추출: SELECT 명시 컬럼 (* · 집계 제외), INSERT 컬럼 목록, UPDATE SET, WHERE/JOIN 조건, GROUP BY/ORDER BY, RETURNING
  - Positional INSERT (컬럼 리스트 없는 `INSERT INTO T VALUES(...)`):
    · `:NEW.X` / `:OLD.X` → 컬럼 `X`
    · `<src>.<COL>` alias 참조 → 컬럼 `COL`
    · 시퀀스 (`SEQ.NEXTVAL`) · 함수 호출 · 리터럴은 컬럼 추출 불가 → 생략
  - columns[].description: 역할 명확한 것만, 모호하면 columns 에서 생략
  {% endif %}

  [컬럼 출력 공통]
  - dtype, nullable 필드 출력 X (메타는 DDL 이 정답)
  - 역할 모호한 컬럼은 columns 에서 생략 (추측 X)

  ════════════════════════════════════════════════════════════
  [섹션 D. fkRelations 추출]
  ════════════════════════════════════════════════════════════

  [수집 대상]
  - JOIN 조건 / WHERE 의 테이블 간 컬럼 비교
  - 다중 컬럼은 sourceColumns·targetColumns 배열 (순서 맞춰)

  [제외 — 하나라도 맞으면 FK 아님]
  - 자기조인
  - INSERT...SELECT 의 단순 값 복사
  - 측정값 컬럼 (VAL · AMOUNT · QUANTITY · COUNT)
  - 양방향 중복
  - IN 서브쿼리의 단순 필터
  - MERGE ON 의 자기 매칭

  [방향]
  - sourceTable = FK 보유 (자식)
  - targetTable = 참조 대상 (부모)
  - sourceColumns·targetColumns 길이 동일 필수

  ════════════════════════════════════════════════════════════
  [섹션 E. dbLinks 추출]
  ════════════════════════════════════════════════════════════

  - 패턴: `@` 등장 (Table@DBLINK 또는 Schema.Table@DBLINK)
  - 위치: 문자열 리터럴·변수 값·프로시저 인자·동적 SQL
  - 제외: 주석 내 등장
  - r/w 판정:
    · 외부 SELECT/JOIN/EXISTS = `r`
    · 외부 INSERT/UPDATE/DELETE/MERGE = `w`
    · 외부 read → 내부 write 케이스 = `r`
    · 모호하면 `r`
  - name 에 `@` 필수, 원문 케이스 유지, range 내 한 번만

  ════════════════════════════════════════════════════════════
  [공통 원칙]
  ════════════════════════════════════════════════════════════

  [1. 범위 독립성]
  각 range 는 startLine~endLine 안에서만 식별. 다른 range 결과 혼합·누적·참조 0.

  [2. 죽은 코드 주석 무시]
  주석 (`--`, `/* */`) 에 SQL 문법 키워드 포함 줄은 죽은 코드. 결과에 반영 X.
  반영 가능: 자연어 처리 의도·헤더 (description 보강용 최우선).
  {% if context %}

  [3. 부모 컨텍스트 활용 (대상 테이블 해석 예외만)]
  부모 DML 의 내부 절 (WHEN MATCHED THEN UPDATE 등) 이 현재 range 일 때, range 내 대상 테이블 식별 불가하면 부모 context 의 "MERGE INTO TABLE_X" 같은 정보로 보강. 빈 테이블명 출력 X.
  부모 context 의 테이블·호출·변수는 현재 range 결과에 **중복 포함 X** (실제 range 등장한 것만).
  {% endif %}

  ════════════════════════════════════════════════════════════
  [SELF-CHECK]
  ════════════════════════════════════════════════════════════

  - ranges 길이·순서가 입력과 동일?
  - 각 range 결과가 startLine~endLine 안에서만? (다른 range 혼입 0)
  - 별칭을 실제 테이블명으로 오인 0?
  - FK 제외 규칙 위반 0?
  - dbLinks `@` 패턴이 실제 range 내 등장?
  - columns 에 dtype/nullable 출력 0?
  - 역할 모호한 컬럼이 columns 에 들어가지 않았는지?
  {% if context %}
  - 부모 context 의 테이블·컬럼이 현재 range 결과에 중복 0?
  {% endif %}
  {% if ddl_context %}
  - ddl_context 목록에 없는 테이블/컬럼명 만들지 0?
  {% endif %}

  ════════════════════════════════════════════════════════════
  [OUTPUT]
  ════════════════════════════════════════════════════════════

  JSON 만. 코드펜스·주석·트레일링 콤마 금지. null 금지 (빈 값은 `[]` 또는 `""`).

  {
    "ranges": [
      {
        "startLine": 정수,
        "endLine": 정수,
        "tables": [
          {
            "table": "SCHEMA.TABLE_NAME",
            "accessMode": "r|w",
            "tableDescription": "이 SP 에서의 사용 역할 1~2 문장",
            "columns": [
              {"name": "컬럼명", "description": "이 DML 에서 컬럼이 하는 역할"}
            ]
          }
        ],
        "fkRelations": [
          {
            "sourceTable": "SCHEMA.CHILD",
            "sourceColumns": ["COL1"],
            "targetTable": "SCHEMA.PARENT",
            "targetColumns": ["ID"]
          }
        ],
        "dbLinks": [
          {"name": "SCHEMA.TABLE@DBLINK", "mode": "r"}
        ]
      }
    ]
  }
