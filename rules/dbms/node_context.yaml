name: "node_context"
description: "부모 노드의 자기 한 줄 + 직전 형제 한 줄 — 디렉토리 트리 형식. 자식이 누적해 트리 자동 완성."
version: "6.0"

input_schema:
  required:
    - node_label         # "<TYPE>[start-end]" — 자기 식별자
    - skeleton_code      # 자기 코드 스켈레톤 (자식 구간 ... 압축)
    - locale
  optional:
    - ancestor_tree      # 디렉토리 트리 (조상들 + ★ 현재) — 자기 위치 인지용
    - sibling_brief      # 직전 형제 한 줄 ("<TYPE>[s-e]: 한 줄") — 없으면 ""

prompt: |
  [ROLE]
  너는 SQL 프로시저·함수의 한 노드(자기) 의 핵심을 *한 줄 디렉토리 항목* 으로 작성한다.
  자식 노드들이 이걸 받아 트리에 들여쓰기로 쌓아 부모 트리를 자동 완성한다.
  Oracle / PostgreSQL / SQL Server / MySQL / DB2 등 모든 RDBMS 패턴 대응.

  [LANGUAGE]
  응답 언어: {{ locale }}

  ════════════════════════════════════════════════════════════
  [최우선 원칙]
  ════════════════════════════════════════════════════════════

  **원칙 1. 출력은 정확히 한 줄.**
    parent_context 는 한 줄 (`<TYPE>[s-e]: <한 문장 요약>`).
    여러 줄·구분자·줄바꿈 X.

  **원칙 2. 자기 행위만, 자식 추측 X.**
    자기 raw 코드 (스켈레톤) 의 행위를 한 문장으로 압축.
    자식 구간 (`...code...` 으로 표시) 의 내용은 추측 X — "(자식 구간 압축됨)" 으로만 표기.

  **원칙 3. 조상 정보 자기 줄에 다시 적지 X.**
    조상은 input 의 ancestor_tree 에 이미 표시됨. 자식이 그 위에 자기 줄을 들여쓰기로 쌓아 트리 완성.
    자기 줄에 조상 흐름·조건 다시 옮겨 적기 X.

  **원칙 4. 식별자·리터럴 원문 보존.**
    테이블·컬럼·변수·시퀀스명 prefix·suffix·대소문자 원문 그대로. 추측·축약·일반화 X.

  ════════════════════════════════════════════════════════════
  [INPUT 형식]
  ════════════════════════════════════════════════════════════

  ── [자기 식별자]
  {{ node_label }}

  ── [자기 코드 스켈레톤] (자식 구간은 ... 로 압축됨)
  {{ skeleton_code }}
  {% if ancestor_tree %}

  ── [조상 트리 — ★ 현재 위치]
  {{ ancestor_tree }}
  {% endif %}
  {% if sibling_brief %}

  ── [직전 형제 한 줄]
  {{ sibling_brief }}
  {% endif %}

  [GOAL]
  - parent_context  : 자기 한 줄 디렉토리 항목 (자식이 부모 트리에 쌓아 사용)
  - sibling_context : 직전 형제가 남긴 상태 한 줄 (없으면 "")

  ════════════════════════════════════════════════════════════
  [섹션 A. parent_context 형식 — 강제]
  ════════════════════════════════════════════════════════════

  [A-1. 형식]
  `<TYPE>[<startLine>-<endLine>]: <자기 행위 한 문장>`

  [A-2. TYPE 사용]
  - 자기 식별자 ({{ node_label }}) 의 TYPE/start/end 그대로 사용
  - 흔한 TYPE: PROCEDURE / FUNCTION / TRIGGER / IF / ELSIF / ELSE / CASE / LOOP / WHILE / FOR /
    CURSOR / SELECT / INSERT / UPDATE / DELETE / MERGE / UNION_ALL / UNION / INTERSECT / EXCEPT /
    JOIN / CTE / DECLARE / BEGIN / EXCEPTION / RAISE / RETURN / ASSIGN / CALL / EXEC

  [A-3. 한 문장 요약 — 자기 행위만]
  - 자기 분기 조건 / 키 / 별칭 매핑 / 상태 변화 / DML 대상 1줄로 압축
  - 자식 있는 경우 "(자식 구간 압축됨)" 으로 표기 (자식 추측 X)
  - 변수명은 의미로 풀어 쓰되 테이블·컬럼·리터럴은 원문 보존
  - DBMS 별 표현 보존: NVL/COALESCE/DECODE/CASE/MERGE 등 원문 그대로

  [A-4. 노드 타입별 작성 가이드 + 예시]

  [A-4-1. PROCEDURE / FUNCTION / TRIGGER]
  ✓ `FUNCTION[1-55]: 입력 (param1, param2) 받아 결과 TABLE 반환 (자식 구간 압축됨)`
  ✓ `PROCEDURE[1-100]: tenant_id 별 사용자 권한 갱신 (자식 구간 압축됨)`
  ✓ `TRIGGER[1-30]: BEFORE INSERT ON ORDER — 신규 주문 검증·로깅 (자식 구간 압축됨)`

  [A-4-2. IF / ELSIF / ELSE — 분기]
  ✓ `IF[35-55]: STATUS='A' / 'B' / 그 외 분기 처리 (자식 구간 압축됨)`
  ✓ `ELSIF[41-44]: 2번째 ELSIF — STATUS='B' 분기 (자식 구간 압축됨)`
  ✓ `ELSE[45-54]: 모든 앞 분기 미충족 시 — 기본 처리 (자식 구간 압축됨)`
  ★ ELSIF/ELSE 는 분기 위치 (몇 번째 ELSIF / ELSE) 를 명시. 형제 IF 조건을 자기 줄에 옮기지 X.

  [A-4-3. CASE / LOOP / WHILE / FOR / CURSOR — 반복·다중분기]
  ✓ `CASE[20-30]: GRADE 별 가중치 산출 (A/B/C 분기, 자식 구간 압축됨)`
  ✓ `LOOP[20-30]: 커서 결과 행마다 반복 (자식 구간 압축됨)`
  ✓ `FOR[15-25]: 각 부서마다 권한 부여 (자식 구간 압축됨)`
  ✓ `WHILE[40-60]: 잔여 큐 비울 때까지 반복 (자식 구간 압축됨)`

  [A-4-4. SELECT — 단일 / outer wrapper]
  ✓ `SELECT[10-20]: ORDER 테이블 active 행 추출 — 인라인 뷰 X`
  ✓ `SELECT[6-36]: 자식 X · Y 결과를 X.id = Y.id 로 조인 (자식 구간 압축됨)`
  ✓ `SELECT[40-50]: FROM DUAL — 스칼라 두 자식의 VAL1·VAL2 추출 (자식 구간 압축됨)`

  [A-4-5. UNION ALL / UNION / INTERSECT / EXCEPT — 결합]
  ✓ `UNION_ALL[38-51]: 두 SELECT 결과 결합 (자식 구간 압축됨)`
  ✓ `UNION[10-30]: 두 SELECT 결과 중복 제거 결합 (자식 구간 압축됨)`
  ✓ `INTERSECT[5-25]: 두 SELECT 결과 교집합 (자식 구간 압축됨)`

  [A-4-6. INSERT / UPDATE / DELETE / MERGE — DML 단일]
  ✓ `INSERT[15-20]: ORDER 테이블에 신규 주문 등록 (id, status='PENDING')`
  ✓ `UPDATE[30-35]: USER 테이블 last_login 갱신 (id=current_user_id)`
  ✓ `DELETE[40-42]: SESSION 테이블 만료 행 제거 (expiry < NOW)`
  ✓ `MERGE[50-65]: TARGET ← SOURCE upsert (id 일치 시 update, 없으면 insert)`

  [A-4-7. CTE / WITH]
  ✓ `CTE[5-15]: ranked AS (window 함수로 ORDER 별 순위 계산)`
  ✓ `WITH[5-30]: ranked + filtered 두 CTE 정의 후 outer SELECT 사용`

  [A-4-8. ASSIGN / RETURN / RAISE / CALL]
  ✓ `ASSIGN[10]: var_count := 0 초기화`
  ✓ `RETURN[55]: 누적 합계 호출자에게 반환`
  ✓ `RAISE[40]: APPLICATION_ERROR(-20001, '재고부족') 발생`
  ✓ `CALL[20]: PRC_LOG_AUDIT(emp_id, 'CREATE') 호출`

  [A-4-9. DECLARE / BEGIN / EXCEPTION — 구조 래퍼]
  ✓ `DECLARE[3-10]: 지역 변수 선언 (tenant_id, error_code) — 입력 파라미터 별칭`
  ✓ `BEGIN[15-100]: 메인 처리 블록 (자식 구간 압축됨)`
  ✓ `EXCEPTION[80-95]: WHEN OTHERS / WHEN NO_DATA_FOUND 예외 처리 (자식 구간 압축됨)`

  ════════════════════════════════════════════════════════════
  [섹션 B. sibling_context 형식]
  ════════════════════════════════════════════════════════════

  [B-1. 형식 — 한 줄 또는 ""]
  - 직전 형제가 있으면: `<TYPE>[<s>-<e>]: <남긴 상태 한 줄>`
  - 직전 형제 없으면: ""

  [B-2. 무엇을 적나]
  - 직전 형제가 *남긴 상태 변화* — 자기가 진입할 시점에 이미 발생한 사실
  - 변수에 할당된 값, 테이블에 INSERT/UPDATE 된 사실, OPEN 된 커서 등
  - 형제의 분기 조건 자체가 아니라 *결과 상태*

  [B-3. 예시]
  ✓ `DECLARE[3-4]: tenant_id, user_id 변수에 입력 파라미터 할당`
  ✓ `SELECT[30-33]: USER_PROFILE 에서 dept_id, role_code 변수에 할당`
  ✓ `INSERT[20-25]: ORDER_AUDIT 에 신규 감사 행 추가됨`
  ✓ `IF[10-15]: priority='HIGH' 분기 시 status='URGENT' 으로 갱신됨`

  ✗ 잘못 — 형제 진입 조건만 적기:
    `IF[10-15]: priority='HIGH' 분기` (조건만, 결과 상태 누락)
    옳음: `IF[10-15]: priority='HIGH' 일 때 status='URGENT' 갱신됨`

  ════════════════════════════════════════════════════════════
  [섹션 C. 분기 자기 위치 명시 — ELSIF/ELSE 일 때 필수]
  ════════════════════════════════════════════════════════════

  [C-1. 자기가 ELSIF / ELSE 분기일 경우]
  - 자기 진입은 *앞 분기 미충족 + 자기 조건* (ELSIF) 또는 *모든 앞 분기 미충족* (ELSE)
  - parent_context 한 줄에 "n번째 ELSIF" 또는 "ELSE 분기" 명시

  [C-2. 형제 분기 조건을 자기 조건으로 옮기지 X]
  IF·ELSIF·ELSE 는 mutually exclusive. 자기 진입 시점에 형제 조건은 false.
  ★ 절대 금지 — 형제 분기 조건을 AND 로 자기 조건에 결합 (모순 prefix)
  ★ 절대 금지 — 자기 줄에 형제 IF/ELSIF 조건 적기

  [C-3. 정상/환각 예시]

  ✓ 정상:
    `ELSIF[41-44]: 2번째 ELSIF — IN_DATAKIND='15' 분기 (자식 구간 압축됨)`
  ✗ 환각 (mutually exclusive 위반):
    잘못: `ELSIF[41-44]: IN_DATAKIND='60' AND IN_DATAKIND='15' 분기`
    원인: 형제 IF (IN_DATAKIND='60') 조건과 AND 결합 → 동시 만족 불가능 모순

  ✓ 정상:
    `ELSE[45-54]: 모든 앞 분기 미충족 시 — fallback 처리 (자식 구간 압축됨)`
  ✗ 환각:
    잘못: `ELSE[45-54]: IN_DATAKIND NOT IN ('60', '15') 일 때 — ...`
    원인: 묵시 부정을 명시화 시 가능하지만, 보통 "모든 앞 분기 미충족" 표현이 더 명확하고 안전

  ════════════════════════════════════════════════════════════
  [공통 원칙]
  ════════════════════════════════════════════════════════════

  [1. 자기 한 줄만]
  - parent_context 는 정확히 자기 한 줄. 조상 정보를 자기 출력에 다시 적지 X
    (조상은 input 의 ancestor_tree 에 이미 있음. 자식이 그 위에 자기 한 줄 쌓아 트리 완성)
  - 자기 자식 정보도 적지 X — "자식 구간 압축됨" 으로 표기

  [2. 죽은 코드 주석 무시]
  주석 (`--`, `/* */`) 에 SQL 키워드 (SELECT/INSERT/UPDATE/DELETE/MERGE/VALUES/FROM/INTO/WHERE/JOIN/IF/BEGIN/END/EXEC/:NEW./:OLD.) 포함 줄 = 죽은 코드. 결과 반영 0.
  반영 가능: 자연어 처리 의도·헤더 (예: "신규 주문 검증").

  [3. 뭉뚱그림 금지]
  "상황에 따라"·"적절히"·"필요시"·"등등" 같은 표현 X. 구체적 조건·값·테이블·컬럼 명시.

  [4. 식별자 원문 보존]
  테이블·컬럼·변수·시퀀스명 prefix·suffix·대소문자 원문 그대로. 추측·축약·일반화 X.

  ════════════════════════════════════════════════════════════
  [SELF-CHECK — 출력 전 점검]
  ════════════════════════════════════════════════════════════

  1. parent_context 가 정확히 한 줄 (`<TYPE>[s-e]: ...` 형식)?
  2. 조상/자식 정보를 자기 한 줄에 다시 적지 X?
  3. 자식 있는 경우 "(자식 구간 압축됨)" 표기 포함?
  4. ELSIF/ELSE 면 분기 위치 (n번째 ELSIF / ELSE) 명시?
  5. 형제 분기 조건을 자기 조건으로 옮겨 적지 X (mutually exclusive)?
  6. 죽은 코드 주석 반영 0?
  7. 식별자 환각 0 (원문 케이스 보존)?
  8. 뭉뚱그림 표현 0?
  {% if sibling_brief %}
  9. sibling_context 가 직전 형제의 *결과 상태* 한 줄 (조건만 X)?
  {% endif %}

  ════════════════════════════════════════════════════════════
  [OUTPUT]
  ════════════════════════════════════════════════════════════

  JSON 만. 코드펜스·주석·트레일링 콤마·null 금지.

  {
    "parent_context": "<TYPE>[<s>-<e>]: <한 줄>",
    "sibling_context": "<TYPE>[<s>-<e>]: <한 줄> 또는 \"\""
  }
