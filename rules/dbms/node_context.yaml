name: "node_context"
description: "부모 스켈레톤 + 직전 형제 원문 → 자식 노드 분석용 컨텍스트 2종 생성"
version: "4.0"

input_schema:
  required:
    - skeleton_code
    - locale
  optional:
    - ancestor_context    # 상위 조상 누적 정보 (참고만)
    - sibling_code        # 직전 형제 원문 (없으면 sibling_context = "")

prompt: |
  [ROLE]
  SQL 프로시저·함수의 부모 구조와 직전 형제를 분석해, 자식 노드 분석에서 재사용할 컨텍스트 두 줄 (parent_context, sibling_context) 을 생성한다.

  [LANGUAGE]
  응답 언어: {{ locale }}

  [INPUT]
  ── [부모 스켈레톤] 자식 구간이 "..." 로 압축된 부모 구조
  {{ skeleton_code }}
  {% if ancestor_context %}

  ── [조상 컨텍스트] 상위 조상 누적 정보 (참고만)
  {{ ancestor_context }}
  {% endif %}
  {% if sibling_code %}

  ── [직전 형제 원문] 같은 레벨에서 바로 앞 실행된 형제 노드의 전체 코드
  {{ sibling_code }}
  {% endif %}

  [GOAL]
  - parent_context  : 이 부모가 무엇을 하며, 어떤 조건에서 어떤 상태 변화를 만드는지 (자체 완결)
  - sibling_context : 직전 형제가 어떤 조건에서 어떤 상태를 남기고 끝났는지 (없으면 "")

  ════════════════════════════════════════════════════════════
  [섹션 A. 처리 흐름]
  ════════════════════════════════════════════════════════════

  1. 부모 스켈레톤의 헤더·DML 키워드 식별 → 부모 종류 (SELECT/INSERT/UPDATE/MERGE/IF/LOOP/CURSOR/...) 판단
  2. 부모의 별칭 매핑 / JOIN 조건 / WHERE 조건 / 매칭 키 추출
  3. 부모가 만드는 상태 변화 (변수 대입·테이블 쓰기·OUT·트랜잭션 경계) 추출
  4. parent_context 한 줄 작성 → ★ 섹션 B
  5. 직전 형제 있으면 → sibling_context 작성 → ★ 섹션 C
  6. 직전 형제 없으면 → sibling_context = ""

  ════════════════════════════════════════════════════════════
  [섹션 B. parent_context 작성]
  ════════════════════════════════════════════════════════════

  - 자체 완결 — 자식이 이것만 읽고 부모 맥락 파악 가능해야 함
  - "조건 → 상태 변화" 쌍 명시
    · ✓ "IN_DATAKIND='60' 이면 V_FLAG 를 'N' → 'Y'"
    · ✗ "상황에 따라 V_FLAG 갱신"
  - 부모의 별칭 매핑 / JOIN / WHERE / MATCH 키 포함
  - 자식 구간은 "자식 구간 압축됨" 으로 표기 (절대 추측 X)
  - 빈 문자열 금지 (최소 부모 구조 유형이라도 기술)

  [★ ELSIF/ELSE 분기 명시 — mutually exclusive]
  parent 가 ELSIF/ELSE 분기일 때 parent_context 는 명시:
  - "IF c1 ... ELSIF c2 (현재 분기) ..." 형식으로 → 자식이 자기 진입 조건이
    "c2 만, c1 은 NOT (앞 분기 미충족)" 임을 명확히 인식하도록.
  - 자기 분기가 ELSE 면 "IF c1 ... ELSIF c2 ... ELSE (현재 분기)" 로 → "c1·c2 모두 미충족" 명시.
  - 자식이 형제 분기 (c1) 의 조건을 자기 조건으로 오인하지 않도록 "현재 분기만" 표시.

  ════════════════════════════════════════════════════════════
  [섹션 C. sibling_context 작성]
  ════════════════════════════════════════════════════════════

  - 직전 형제가 남긴 상태 델타 한 줄
  - 변수 값·테이블 쓰기·OUT·트랜잭션 경계
  - 형제 없으면 ""

  ════════════════════════════════════════════════════════════
  [공통 원칙]
  ════════════════════════════════════════════════════════════

  [1. 추측 금지]
  부모 스켈레톤의 "..." 안 내용은 절대 추측 X. 모르면 "자식 구간 압축됨" 표기.

  [2. 죽은 코드 주석 무시]
  주석 (`--`, `/* */`) 에 SQL 문법 키워드 (SELECT/INSERT/UPDATE/DELETE/MERGE/VALUES/FROM/INTO/WHERE/JOIN/IF/BEGIN/END/EXEC/:NEW./:OLD.) 포함 줄은 죽은 코드. 결과에 0건 반영.
  반영 가능: 자연어 처리 의도·헤더.

  [3. 뭉뚱그림 금지]
  "상황에 따라"·"적절히"·"필요시" 같은 표현 금지. 구체적인 조건·값을 명시.

  ════════════════════════════════════════════════════════════
  [SELF-CHECK]
  ════════════════════════════════════════════════════════════

  - parent_context 가 자체 완결? 자식이 이것만 읽고 부모 맥락 파악 가능?
  - 상태 변화가 "조건 → 변화" 쌍으로 명시?
  {% if sibling_code %}
  - sibling_context 에 직전 형제가 남긴 상태 델타 포함?
  {% endif %}
  - "..." 안 내용을 추측하지 않았는지?
  - 뭉뚱그리는 표현 0?
  - 죽은 코드 주석 (SQL 문법 포함 `--`) 에서 가져온 내용 0?

  ════════════════════════════════════════════════════════════
  [OUTPUT]
  ════════════════════════════════════════════════════════════

  JSON 만. 코드펜스·주석·트레일링 콤마 금지. null 금지.

  {
    "parent_context": "부모 맥락 + 상태 변화 (자체 완결, 최소 1문장)",
    "sibling_context": "직전 형제가 남긴 상태 (없으면 \"\")"
  }
