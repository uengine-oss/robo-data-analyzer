name: "node_context"
description: "부모 컨텍스트 + 이전 형제 컨텍스트 통합 추출"
version: "1.0"

input_schema:
  required:
    - skeleton_code
    - locale
  optional:
    - ancestor_context
    - sibling_code

prompt: |
  [ROLE]
  당신은 SQL/PL-SQL 코드 구조 분석 전문가입니다.
  주어진 부모 코드 스켈레톤과 이전 형제 노드 코드에서 자식 노드 분석에 필요한 핵심 컨텍스트를 추출합니다.
  
  
  [LANGUAGE_SETTING]
  응답 언어: {{ locale }}
  
  
  [INPUT_DATA]
  {% if ancestor_context %}
  === 조상 컨텍스트 (상위 노드들의 누적 정보) ===
  {{ ancestor_context }}
  
  {% endif %}
  === 부모 코드 스켈레톤 (자식 구간은 .... 로 압축됨) ===
  {{ skeleton_code }}
  
  {% if sibling_code %}
  === 이전 형제 노드 코드 (동일 레벨의 바로 직전 노드 원문) ===
  {{ sibling_code }}
  
  {% endif %}
  
  [TASK]
  위 입력에서 두 가지 컨텍스트를 추출하세요:
  
  ★ 주석 최우선 활용 원칙:
  부모 스켈레톤과 이전 형제 코드에 주석(-- 또는 /* */)이 포함되어 있다면, 이는 개발자가 코드의 의도와 목적을 직접 표현한 것이므로 반드시 최우선으로 활용하여 컨텍스트에 반영하세요. 주석에 비즈니스 규칙, 처리 목적, 테이블 역할 등이 설명되어 있다면 그 내용을 컨텍스트의 핵심 정보로 포함하세요.
  
  1. **부모 컨텍스트 (parent_context)**: 부모 스켈레톤에서 추출
     - 주석에 명시된 처리 목적 및 비즈니스 규칙 (최우선)
     - DML 유형 및 타겟 (SELECT/INSERT/UPDATE/DELETE/MERGE, FROM/INTO 테이블)
     - 별칭 매핑 (테이블/서브쿼리 별칭 → 원본)
     - 조인/매칭 조건 (ON, WHERE 절의 주요 조건)
     - 핵심 변수/파라미터명
     - 구조 유형 및 목적 (DML, 조건문, 반복문, 예외처리 등)
  
  2. **형제 컨텍스트 (sibling_context)**: 이전 형제 원문 코드에서 추출 (있는 경우만)
     - 이전 형제의 주석에 명시된 처리 목적 (최우선)
     - 직전에 수행된 작업 내용
     - 설정된 변수값이나 상태 변화
     - 현재 노드 분석에 영향을 줄 수 있는 정보
  
  
  [OUTPUT_FORMAT]
  JSON 형식:
  {
    "parent_context": "부모 스켈레톤에서 추출한 컨텍스트 (100단어 이내)",
    "sibling_context": "이전 형제에서 추출한 컨텍스트 (50단어 이내, 형제 없으면 빈 문자열)"
  }
  
  예시:
  {
    "parent_context": "MERGE INTO RDD01DD_TB. 별칭 A=RDF01HH_TB, B=서브쿼리. 조인: A.LOG_TIME=B.LOG_TIME. 변수: TAGSN, VAL1. 목적: 태그 데이터 병합",
    "sibling_context": "직전에 V_COUNT 변수에 조회 건수 저장. 조건 분기를 위한 카운트 체크 완료"
  }
  
  
  [CONSTRAINTS]
  - 반드시 JSON 형식
  - 코드펜스(```) 금지
  - **⚠️ CRITICAL: 트레일링 콤마(trailing comma) 절대 금지**
  - 자식 코드(...code..., ....) 내용은 추측 금지
  - ⚠️ parent_context는 빈 문자열 금지 - 최소한 구조 유형이라도 기술
  - ⚠️ sibling_context는 이전 형제가 없으면 빈 문자열 ""
  - ⚠️ DML이 있으면 반드시 DML 유형, FROM/INTO 테이블, 별칭 정보 포함

