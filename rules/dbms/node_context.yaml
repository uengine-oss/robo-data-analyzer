name: "node_context"
description: "부모 스켈레톤 + 직전 형제 원문에서 자식 분석용 컨텍스트 추출"
version: "2.0"

input_schema:
  required:
    - skeleton_code
    - locale
  optional:
    - ancestor_context
    - sibling_code

prompt: |
  [ROLE]
  SQL 프로시저·함수의 부모 구조와 직전 형제를 분석해, 자식 노드 분석에서 쓸 컨텍스트를 생성합니다.


  [LANGUAGE]
  응답 언어: {{ locale }}


  [INPUT]
  {% if ancestor_context %}
  ── [조상 컨텍스트] 역할: 상위 조상들의 누적 정보 (참고용)
  {{ ancestor_context }}

  {% endif %}
  ── [부모 스켈레톤] 역할: 현재 부모의 구조. 자식 구간은 "..." 로 압축되어 보임
  {{ skeleton_code }}

  {% if sibling_code %}

  ── [직전 형제 원문] 역할: 같은 레벨에서 바로 앞에 실행된 형제 노드의 전체 코드
  {{ sibling_code }}
  {% endif %}


  [GOAL]
  자식 노드가 참고할 수 있도록 두 개의 자체 완결된 컨텍스트 문자열을 생성:
  - parent_context: 이 부모가 무엇을 하며 어떤 조건에서 어떤 상태 변화를 만드는지
  - sibling_context: 직전 형제가 어떤 조건에서 어떤 상태를 남기고 끝났는지


  [RULES]

  ★★★ 자체 완결 (최우선)
  이 출력은 자식 노드 분석에서 참고용으로 재사용된다. 자식은 여기 나온 테이블·변수·호출을 다시 분석하지 않는다.
  따라서 자식이 중복 분석 없이도 맥락을 파악할 수 있도록 완결된 상태·구조 요약으로 쓴다.

  ★★★ 상태 변화 보존
  각 상태 변화는 "조건 → 변화" 쌍으로 기술. 뭉뚱그림 금지.
  - 좋은 예: "IN_DATAKIND='60' 이면 V_FLAG 를 'N' → 'Y' 로 변경"
  - 나쁜 예: "상황에 따라 V_FLAG 를 갱신한다"

  ★★ parent_context 에 담을 것
  - **자연어 헤더 주석**(처리 목적·요약 설명) 만 활용. **SQL 문법이 포함된 주석은 죽은 코드로 간주해 무시**
    (예: `-- VALUES(...)`, `-- SELECT ...`, `-- INSERT INTO ...`, `-- IF ...` 같은 주석은 보지 않는다)
  - DML 유형 및 타겟 (SELECT/INSERT/UPDATE/DELETE/MERGE, FROM·INTO 테이블) — **실제 활성 코드 기반**
  - 별칭 매핑 (별칭 → 실제 테이블·서브쿼리)
  - 조인·매칭 조건
  - 이 부모가 만드는 상태 변화 (변수 대입·테이블 쓰기·OUT·트랜잭션 경계)
  - 자식 구간이 "..." 로 압축됐어도 부모 구조·키워드로 파악 가능한 범위까지

  {% if sibling_code %}
  ★★ sibling_context 에 담을 것
  - 직전 형제의 **자연어 헤더 주석** 만 활용 (SQL 문법 주석은 죽은 코드, 무시)
  - 직전 형제가 만든 상태 (변수 값·테이블 쓰기·OUT 파라미터·트랜잭션 상태) — 활성 코드 기반
  - 현재 노드가 실행되는 시점의 "초기 상태" 를 재구성할 수 있도록
  {% endif %}

  ★ 추측 금지
  부모 스켈레톤의 "..." 안의 내용은 절대 추측해서 쓰지 않는다.

  ★ 죽은 코드 주석 식별
  주석 라인에 다음 키워드가 포함되면 **죽은 코드** 로 간주하고 parent_context/sibling_context 에 절대 반영하지 않는다:
  `SELECT`, `INSERT`, `UPDATE`, `DELETE`, `MERGE`, `VALUES`, `FROM`, `INTO`, `WHERE`, `JOIN`,
  `IF ... THEN`, `BEGIN`, `END;`, `EXEC ...`, `:NEW.`, `:OLD.`.
  반영 가능한 주석: 자연어로만 쓰인 처리 의도·헤더 (예: "주문 마스터 검증").


  [SELF-CHECK]
  - parent_context 가 자체 완결인가? 자식이 이것만 읽고 부모 맥락 파악 가능한가?
  - 상태 변화가 "조건 → 변화" 쌍으로 명시됐는가?
  {% if sibling_code %}
  - sibling_context 에 직전 형제가 남긴 상태 델타가 포함됐는가?
  {% endif %}
  - "..." 안을 추측해서 쓴 내용은 없는가?
  - 뭉뚱그리는 표현("상황에 따라", "적절히") 사용했는가? 있으면 삭제.


  [OUTPUT]
  JSON 만 출력. 코드펜스·주석·설명 금지. 트레일링 콤마 금지.

  {
    "parent_context": "부모 맥락 + 상태 변화 요약 (자체 완결)",
    "sibling_context": "직전 형제가 남긴 상태 요약. 형제 없으면 빈 문자열"
  }

  제약:
  - parent_context 는 빈 문자열 금지 (최소한 부모 구조 유형이라도 기술)
  - sibling_context 는 형제 없으면 빈 문자열 ""
  - null 금지
