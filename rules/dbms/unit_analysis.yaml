name: "unit_analysis"
description: "프로시저·함수 하위 블록 요약들을 통합해 unit summary 한 편 생성"
version: "8.0"

input_schema:
  required:
    - summaries
    - locale
  optional:
    - variable_declarations       # 변수 선언·초기값
    - constants_context           # 전역 상수 (상수명 → 실제 값)
    - called_procedure_summaries  # 호출된 프로시저 요약 (참고만)

prompt: |
  [ROLE]
  프로시저·함수의 하위 블록 요약들을 통합해 **상위 호출 프로시저가 재사용할 수 있는** unit summary 한 편을 작성한다.

  [LANGUAGE]
  응답 언어: {{ locale }}

  [INPUT]
  ── [하위 블록 요약] summary 통합의 뼈대
  {{ summaries }}
  {% if variable_declarations %}

  ── [변수 선언·초기값] 상태 변화 서술의 근거
  {{ variable_declarations }}
  {% endif %}
  {% if constants_context %}

  ── [전역 상수] 상수명 → 실제 값. summary 에서 실제 값으로 치환
  {{ constants_context }}
  {% endif %}
  {% if called_procedure_summaries %}

  ── [호출된 프로시저 요약] 참고만 — 하위 프로시저 내부는 내 summary 에 재작성 X
  {{ called_procedure_summaries }}
  {% endif %}

  [GOAL]
  프로시저·함수 전체 summary 한 편 산출. 상위 호출 프로시저가 "이 프로시저 호출 시 어떤 조건에서 어떤 상태 변화" 를 이 텍스트만 읽고 파악 가능해야 함.

  ════════════════════════════════════════════════════════════
  [섹션 A. 처리 흐름]
  ════════════════════════════════════════════════════════════

  1. 하위 블록 요약을 흐름 순서대로 정렬
  2. 각 분기마다 "조건 → 상태 변화" 쌍을 별도 문장으로 풀어 작성 → ★ 섹션 B
  3. 변수명을 의미로 풀고, 전역 상수는 실제 값으로 치환 → ★ 섹션 C
  4. 죽은 코드 주석 0건 반영 (★ 공통 원칙 2)
  {% if called_procedure_summaries %}
  5. 하위 호출은 "어느 단계에 무엇을 호출해 무엇을 얻는지" 한 줄로만 (내부 재작성 X) → ★ 섹션 D
  {% endif %}

  ════════════════════════════════════════════════════════════
  [섹션 B. summary 작성 (자기 완결)]
  ════════════════════════════════════════════════════════════

  [자기 완결 원칙]
  상위 입장에서 이 텍스트만 읽고 호출 결과 (조건별 상태 변화) 를 파악 가능해야 함.

  [상태 변화 보존]
  - 자식 요약을 통합할 때 "조건 → 상태 변화" 쌍을 흐름 순서대로 이어 기술
  - 각 분기마다 별도 문장 — 뭉뚱그림 ("상황에 따라"·"적절히") 금지

  [담을 것 — 실제 존재할 때만]
  - 입력·선행조건 → 분기 로직 → 반환·쓰기 흐름
  - 분기 조건 (IF/CASE): 비교 값과 결과 모두
  - 계산식 (DECODE/TRUNC/NVL/CASE): 구체 조건·값
  - 하드코딩 리터럴 (TAG 번호·코드값·임계값): 그대로 보존
  - NULL/0/음수 처리·fallback
  - 반복 처리 (CURSOR/FOR): 대상·목적
  - EXCEPTION 블록 / OUT result_code 값의 의미
  - COMMIT/ROLLBACK 시점
  - 테이블 조작: INSERT 컬럼·값 / UPDATE·MERGE WHERE·전→후 / DELETE WHERE
  - **사용 테이블 모두 보존**: 자식 summary 들에 등장한 모든 테이블명을 누락 없이 나열.
    중첩 서브쿼리·JOIN·UNION·CTE 안쪽 테이블도 빠짐없이 — 자식 요약에 N 개 테이블이 등장했다면 unit summary 도 N 개 모두 언급.
    "주요 테이블만" / "관련 테이블들" 식의 묶음 표현 X — 실제 이름 모두 명시.

  ════════════════════════════════════════════════════════════
  [섹션 C. 식별자 규칙]
  ════════════════════════════════════════════════════════════

  - 제거: 변수명·파라미터명 → 의미로 풀어 설명 (변수명 직노출 X)
  - 보존: 테이블명·컬럼명·상태값·코드값·상수값 (원문 그대로)
  - 전역 상수는 실제 값으로 치환
  - "이상" ≠ "초과", "이하" ≠ "미만" 정확히 구분
  {% if called_procedure_summaries %}

  ════════════════════════════════════════════════════════════
  [섹션 D. 하위 호출 처리]
  ════════════════════════════════════════════════════════════

  [참고만 — 내부 재작성 X]
  [호출된 프로시저 요약] 의 하위 프로시저 **내부 분기·테이블·컬럼** 은 내 summary 에 재작성 X.

  [한 줄로만 녹임]
  "어느 단계에 무엇을 호출해 무엇을 얻는지" 만 한 줄로 표현.
  예: "PRC_INSERT_RDRTAGSUNSI (주파수 태그 후속 처리) 호출"
  {% endif %}

  ════════════════════════════════════════════════════════════
  [공통 원칙]
  ════════════════════════════════════════════════════════════

  [1. Hallucination 금지 (식별자 원문 보존)]
  - 원문에 없는 테이블·컬럼·시퀀스·변수·프로시저명 만들어내거나 추측·축약·일반화 X
  - 모든 식별자는 prefix·suffix·대소문자까지 원문 그대로
  - Positional INSERT 에서 컬럼명 만들지 X — 명시 안 됐으면 위치 표현 ("위치 n번째 값")

  [2. 죽은 코드 주석 무시]
  summaries 의 자식 텍스트에 SQL 키워드 (SELECT/INSERT/UPDATE/DELETE/MERGE/VALUES/FROM/INTO/WHERE/:NEW./:OLD.) 포함된 주석 줄 (`--` 또는 `/* */`) 은 죽은 코드. summary 에 0 반영.
  반영 가능: 자연어 처리 의도·헤더.

  [3. 책임 분리]
  rules / examples / questions 는 본 프롬프트 책임 X — node_analysis 의 누적 결과를 phase_summary 가 그대로 사용.

  ════════════════════════════════════════════════════════════
  [SELF-CHECK]
  ════════════════════════════════════════════════════════════

  - 모든 주요 분기에 조건+상태변화 쌍 명시?
  - 뭉뚱그림 ("상황에 따라"·"적절히") 0?
  - 변수명 대신 의미로 풀어서?
  - 테이블·컬럼·상태값·코드값 원문 보존?
  - 죽은 코드 주석에서 가져온 내용 0?
  - 식별자 환각 (축약·일반화·신규 작성) 0?
  {% if called_procedure_summaries %}
  - 하위 프로시저 내부 분기·테이블이 내 summary 에 재작성되지 않았는지?
  {% endif %}

  ════════════════════════════════════════════════════════════
  [OUTPUT]
  ════════════════════════════════════════════════════════════

  JSON 만. 코드펜스·주석·설명 금지.

  {
    "summary": "프로시저 전체 요약 — 입력 → 분기 → 반환 흐름과 테이블 조작을 조건+상태변화 쌍으로 1~5 문장"
  }
