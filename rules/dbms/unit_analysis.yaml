name: "unit_analysis"
description: "프로시저·함수 하위 블록 요약들을 통합해 unit summary 한 편 생성. 모든 RDBMS 보편."
version: "9.0"

input_schema:
  required:
    - summaries
    - locale
  optional:
    - variable_declarations       # 변수 선언·초기값
    - constants_context           # 전역 상수 (상수명 → 실제 값)
    - called_procedure_summaries  # 호출된 프로시저 요약 (참고만)

prompt: |
  [ROLE]
  너는 프로시저·함수의 하위 블록 요약들을 통합해 *상위 호출자가 재사용할 수 있는*
  unit summary 한 편을 작성한다.
  Oracle / PostgreSQL / SQL Server / MySQL / DB2 등 모든 RDBMS 보편.

  [LANGUAGE]
  응답 언어: {{ locale }}

  ════════════════════════════════════════════════════════════
  [최우선 원칙]
  ════════════════════════════════════════════════════════════

  **원칙 1. 자기 완결.**
    상위 호출자 입장에서 이 unit summary 만 읽고 *조건별 상태 변화* 를 파악할 수 있어야 함.
    "이 프로시저 호출 시 어떤 입력 → 어떤 결과·쓰기·반환이 발생" 한 단락에 담는다.

  **원칙 2. 식별자·리터럴·표현식 원문 보존.**
    테이블·컬럼·시퀀스·트리거명 prefix·suffix·대소문자 원문 그대로.
    DECODE/CASE/NVL/COALESCE 의 unmatched=NULL 규칙 정확히 (★ 섹션 D).

  **원칙 3. 변수명 의미로 풀고 상수 실제 값으로 치환.**
    변수명을 그대로 노출 X — 변수 init_value 활용해 의미로 풀어 설명.
    constants_context 의 상수명은 실제 값으로 치환.

  **원칙 4. 죽은 코드 주석·하위 호출 내부 모두 무시.**
    summaries 의 자식 텍스트에 SQL 키워드 포함 주석 (`--`, `/* */`) = 죽은 코드, 0 반영.
    called_procedure_summaries 는 "어디에 무엇을 호출해 무엇을 얻는지" 한 줄로만 (내부 분기·테이블 재작성 X).

  **원칙 5. 책임 분리 — rules/examples/questions 은 phase_summary 책임.**
    unit_analysis 는 summary 한 편 + 누적된 rules dedupe (★ 섹션 H) 만.
    examples / questions 는 본 프롬프트 책임 X — node_analysis 누적 결과를 phase_summary 가 그대로 사용.

  ════════════════════════════════════════════════════════════
  [INPUT 형식]
  ════════════════════════════════════════════════════════════

  ── [하위 블록 요약] summary 통합의 뼈대
  {{ summaries }}
  {% if variable_declarations %}

  ── [변수 선언·초기값] 상태 변화 서술의 근거
  {{ variable_declarations }}
  {% endif %}
  {% if constants_context %}

  ── [전역 상수] 상수명 → 실제 값. summary 에서 실제 값으로 치환
  {{ constants_context }}
  {% endif %}
  {% if called_procedure_summaries %}

  ── [호출된 프로시저 요약] 참고만 — 하위 프로시저 내부는 내 summary 에 재작성 X
  {{ called_procedure_summaries }}
  {% endif %}

  [GOAL]
  프로시저·함수 전체 summary 한 편 산출. 상위 호출자가 *이 텍스트만 읽고* 조건별 상태 변화·반환·쓰기를
  파악 가능해야 함.

  ════════════════════════════════════════════════════════════
  [처리 흐름]
  ════════════════════════════════════════════════════════════

  1. 하위 블록 요약을 흐름 순서대로 정렬
  2. 각 분기마다 "조건 → 상태 변화" 쌍을 별도 문장으로 풀어 작성 → 섹션 A·B
  3. 변수명을 의미로 풀고, 전역 상수는 실제 값으로 치환 → 섹션 C
  4. 표현식 정확성 보존 → 섹션 D
  5. DML 종류별 표현 가이드 적용 → 섹션 E
  6. 사용 테이블 모두 보존 → 섹션 F
  7. 죽은 코드 주석 무시 → 섹션 G
  {% if called_procedure_summaries %}
  8. 하위 호출은 한 줄로만 → 섹션 G-2
  {% endif %}

  ════════════════════════════════════════════════════════════
  [섹션 A. summary 작성 — 자기 완결 원칙]
  ════════════════════════════════════════════════════════════

  [A-1. 자기 완결]
  상위 입장에서 이 텍스트만 읽고 호출 결과 (조건별 상태 변화) 를 파악 가능해야 함.
  "이 함수 호출 시 ... 분기 따라 ... 반환·쓰기" 한 단락에 모두.

  [A-2. 길이]
  - 코드 복잡도에 비례. 강제 최소·최대 X — 의미 있는 만큼만.
  - 단순 SELECT·계산 함수는 핵심 동작만 짧게.
  - 다중 분기·여러 DML 함수는 분기와 효과를 모두 풀어 상세하게.

  [A-3. 작성 시점·인칭]
  - 현재 시제 평서문 ("...한다", "...반환한다", "...갱신한다")
  - "함수가" / "프로시저가" 같은 주어 생략 (호출자 관점)

  ════════════════════════════════════════════════════════════
  [섹션 B. 분기·상태 변화 보존]
  ════════════════════════════════════════════════════════════

  [B-1. 자식 요약을 흐름 순서대로 통합]
  - "조건 → 상태 변화" 쌍을 흐름 순서대로 이어 기술
  - 각 분기마다 별도 문장 — 뭉뚱그림 ("상황에 따라"·"적절히"·"필요시") 금지

  [B-2. 담을 것 — 실제 존재할 때만]
  - **입력·선행조건** → **분기 로직** → **반환·쓰기 흐름**
  - 분기 조건 (IF/CASE/DECODE): 비교 값과 결과 모두
  - 계산식 (DECODE/TRUNC/NVL/CASE/COALESCE): 구체 조건·값
  - 하드코딩 리터럴 (코드값·임계값·매직 넘버): 그대로 보존
  - NULL/0/음수 처리·fallback
  - 반복 처리 (CURSOR/FOR/WHILE/LOOP): 대상·목적
  - EXCEPTION 블록 / OUT result_code 값의 의미
  - COMMIT/ROLLBACK/SAVEPOINT 시점
  - 테이블 조작:
    · INSERT 컬럼·값 (positional 이면 "위치 n번째 값")
    · UPDATE WHERE·SET (전→후 상태)
    · DELETE WHERE
    · MERGE WHEN MATCHED / NOT MATCHED 각각

  [B-3. 예시]
  ✓ 정상 — IF·ELSIF·ELSE 분기 함수:
    "STATUS='A' 인 경우 ORDER 테이블에 신규 행을 PENDING 상태로 INSERT 하고,
     STATUS='B' 인 경우 기존 행을 CONFIRMED 로 UPDATE 하며,
     그 외에는 AUDIT_LOG 에 거부 사유를 기록한다.
     처리 결과 ORDER_ID 를 반환한다."

  ✗ 환각 — 뭉뚱그림:
    "STATUS 에 따라 적절한 처리를 수행하고 결과를 반환한다."
     (조건과 결과 명시 누락)

  ════════════════════════════════════════════════════════════
  [섹션 C. 식별자 규칙]
  ════════════════════════════════════════════════════════════

  [C-1. 변수명 직노출 X — 의미로 풀기]
  - 변수명 그대로 적기 X. variable_declarations 의 init_value 로 의미 풀이.
  - 예: `tagNo NUMBER := tagsn` 변수가 코드에서 사용 →
    summary 에 "tagNo" 가 아니라 "입력 받은 태그 번호" 로 풀어 쓰기

  [C-2. 테이블·컬럼·코드값 원문 보존]
  - 테이블·컬럼·상태값·코드값·상수값 (예: 'A', 'PENDING', 9, 'Q') 원문 그대로
  - prefix·suffix 보존 (예: SEQ_USER_ID 를 USER_ID 로 축약 X)

  [C-3. 전역 상수 → 실제 값 치환]
  - constants_context 의 상수명을 summary 에 그대로 적기 X.
  - 실제 값으로 치환 (예: 상수 `STATUS_ACTIVE = 'A'` → summary 에서 'A' 로)

  [C-4. 어휘 정확성]
  - "이상" ≠ "초과", "이하" ≠ "미만" 정확히 구분
  - "AND" / "OR" 의미 정확히 (자식 분기 조건 결합 시)

  ════════════════════════════════════════════════════════════
  [섹션 D. ★ 표현식 정확성 — DECODE / CASE / NVL / COALESCE / IFNULL]
  ════════════════════════════════════════════════════════════

  명시된 case 만 정확히 보존. unmatched 케이스를 임의로 다른 case 와 묶거나 일반화 X.
  이건 LLM 이 가장 흔히 환각하는 영역.

  [D-1. DECODE (Oracle)]
  형식: `DECODE(X, v1, r1, v2, r2, ...[, default])`
  - 짝 맞는 인자만 (default 없음) → unmatched = NULL
  - 짝 안 맞는 마지막 인자 (홀수 위치 마지막) → 그것이 default

  ✓ 정상 — `DECODE(STATUS, 'A', 1, 'B', 2)`:
    "STATUS 가 A 이면 1, B 이면 2 산출 (그 외 NULL)"

  ✓ 정상 — `DECODE(STATUS, 'A', 1, 'B', 2, 9)`:
    "STATUS 가 A 이면 1, B 이면 2, 그 외엔 9 산출"

  ✗ 환각 — 같은 `DECODE(STATUS, 'A', 1, 'B', 2)`:
    잘못: "STATUS 가 A 이면 1, 아니면 2"  ('아니면' 으로 B 와 unmatched 합치기 — 절대 금지)
    잘못: "STATUS 에 따라 1 또는 2 산출"  (모호화)

  [D-2. CASE WHEN ... THEN ... [ELSE ...] END]
  - ELSE 없음 → unmatched = NULL
  - ELSE x 있음 → unmatched = x

  ✓ 정상 — `CASE WHEN A>=10 THEN 'HIGH' END`:
    "A 가 10 이상이면 HIGH (그 외 NULL)"

  ✓ 정상 — `CASE WHEN A>=10 THEN 'HIGH' ELSE 'LOW' END`:
    "A 가 10 이상이면 HIGH, 그 외엔 LOW"

  ✗ 환각:
    잘못: "A 에 따라 HIGH 또는 LOW" (조건·값 누락)

  [D-3. NVL / COALESCE / IFNULL / ISNULL]
  - NVL(A, B) (Oracle) / COALESCE(A, B, ...) / IFNULL(A, B) (MySQL) / ISNULL(A, B) (SQL Server)
  - 의미: A 가 NULL 이면 B (COALESCE 는 첫 NULL 아닌 값)

  ✓ 정상 — `NVL(MID_NAME, 'N/A')`:
    "중간 이름이 NULL 이면 'N/A' 로 치환"

  ✗ 환각:
    잘못: "중간 이름이 비어있거나 잘못된 값이면 'N/A'" ('잘못된 값' 환각)

  ════════════════════════════════════════════════════════════
  [섹션 E. DML 종류별 표현 가이드]
  ════════════════════════════════════════════════════════════

  - **SELECT** : WHERE 컬럼·비교값 + JOIN 대상·조건 + 집계·정렬
  - **INSERT** : 대상 테이블 + 컬럼 + 값 출처 (리터럴·다른 테이블·시퀀스)
  - **UPDATE** : SET 컬럼=값 + WHERE 조건 + 상태 전이 (전→후)
  - **DELETE** : 대상 테이블 + WHERE 컬럼=값
  - **MERGE**  : USING source + ON 조건 + WHEN MATCHED / NOT MATCHED 각각 처리
  - **TRUNCATE**: 대상 테이블 (전체 삭제 명시)
  - **DBMS 별 확장**:
    · Oracle: NVL · DECODE · CONNECT BY · ROLLUP / CUBE / GROUPING SETS · MODEL · MERGE
    · PostgreSQL: COALESCE · ON CONFLICT · LATERAL · FILTER · WINDOW · GENERATED
    · SQL Server: ISNULL · OUTPUT · MERGE · CTE · APPLY
    · MySQL: IFNULL · ON DUPLICATE KEY UPDATE · REPLACE INTO · LIMIT

  ════════════════════════════════════════════════════════════
  [섹션 F. 사용 테이블 모두 보존 — 누락 금지]
  ════════════════════════════════════════════════════════════

  자식 summary 들에 등장한 모든 테이블명을 누락 없이 나열.
  중첩 서브쿼리·JOIN·UNION·CTE 안쪽 테이블도 빠짐없이.

  [F-1. 누락 금지 — 자식 N 개 테이블 등장하면 unit summary 도 N 개 모두]
  ✗ "주요 테이블만" / "관련 테이블들" 같은 묶음 표현 X
  ✗ 일부 테이블 생략 X — 모두 명시
  ✗ 같은 테이블이 여러 자식에서 등장하면 한 번만 (중복 X) — 단 사용 맥락이 다르면 각각

  [F-2. 예시]
  자식 summary 에 ORDER · ORDER_ITEM · CUSTOMER · AUDIT_LOG 4 개 등장 →
  ✓ unit summary: "ORDER 와 ORDER_ITEM 을 CUSTOMER 와 조인하여 ... AUDIT_LOG 에 기록"
  ✗ unit summary: "주요 테이블에서 정보 조회 후 로그 테이블에 기록" (이름 누락)

  ════════════════════════════════════════════════════════════
  [섹션 G. 죽은 코드 주석 무시 + 하위 호출 처리]
  ════════════════════════════════════════════════════════════

  [G-1. 죽은 코드 주석 무시]
  summaries 의 자식 텍스트에 SQL 키워드
  (SELECT/INSERT/UPDATE/DELETE/MERGE/VALUES/FROM/INTO/WHERE/JOIN/IF/BEGIN/END/EXEC/:NEW./:OLD./RAISE/RETURN)
  포함된 주석 줄 (`--` 또는 `/* */`) 은 죽은 코드. summary 에 0 반영.
  반영 가능: 자연어 처리 의도·헤더.
  {% if called_procedure_summaries %}

  [G-2. 하위 호출 처리 — 한 줄로만]
  [호출된 프로시저 요약] 의 하위 프로시저 *내부 분기·테이블·컬럼* 은 내 summary 에 재작성 X.
  "어느 단계에 무엇을 호출해 무엇을 얻는지" 만 한 줄로 표현.

  ✓ 정상: "신규 행 INSERT 후 PRC_INSERT_AUDIT (감사 로그 기록) 호출"
  ✗ 환각: PRC_INSERT_AUDIT 의 내부 컬럼·로직을 자기 summary 에 풀어쓰기
  {% endif %}

  ════════════════════════════════════════════════════════════
  [섹션 H. ★ 누적 rules dedupe — 의미적 중복 제거 (선택적, 고품질 요구 시)]
  ════════════════════════════════════════════════════════════

  자식 batch 들의 rule 누적 시 *의미적으로 동일한* rule 이 여러 표현으로 중복될 수 있음.
  같은 inner subquery 패턴이 X 측·Y 측 두 위치에 등장하면 LLM 이 별도 분석해 두 다른 표현 emit.

  [H-1. dedupe 판단 기준]
  의미적으로 동일하면 한 rule 로 통합:
  - 같은 테이블·같은 컬럼 셋·같은 변환 로직 (예: NVL(COM_UNIT,1) 적용)
  - 같은 분기 조건·같은 상태 변화

  [H-2. dedupe 절대 금지]
  다음은 의미가 다름 → 별개로 보존:
  - 입력 변수 출처가 다른 rule (예: tagsn 입력 vs DUAL 결과)
  - 다른 분기 조건에서 같은 테이블 변경
  - 같은 statement 지만 다른 테이블

  [H-3. dedupe 결과 출력]
  자식 rules 가 의미적 중복이면 가장 정보 풍부한 표현 하나로 병합.
  단순 표현 (예: "추출한다") 보다 컬럼·조건 명시한 표현 우선.

  ════════════════════════════════════════════════════════════
  [공통 원칙]
  ════════════════════════════════════════════════════════════

  [1. Hallucination 금지 (식별자 원문 보존)]
  - 원문에 없는 테이블·컬럼·시퀀스·변수·프로시저명 만들어내거나 추측·축약·일반화 X
  - 모든 식별자는 prefix·suffix·대소문자까지 원문 그대로
  - Positional INSERT (컬럼 명시 X) 에서 컬럼명 만들지 X — "위치 n번째 값"

  [2. 죽은 코드 주석 무시]
  (섹션 G-1 참조)

  [3. 책임 분리 — rules/examples/questions 본 프롬프트 책임 X]
  rules / examples / questions 는 node_analysis 의 누적 결과를 phase_summary 가 그대로 사용.
  본 프롬프트는 summary 한 편만 산출 (+ 선택적 rules dedupe — 섹션 H).

  ════════════════════════════════════════════════════════════
  [SELF-CHECK — 출력 전 점검]
  ════════════════════════════════════════════════════════════

  1. summary 가 자기 완결 (상위 호출자가 이것만 읽고 결과 파악 가능)?
  2. 모든 주요 분기에 조건+상태변화 쌍 명시?
  3. 뭉뚱그림 ("상황에 따라"·"적절히"·"필요시") 0?
  4. 변수명 대신 의미로 풀어서 (변수명 직노출 0)?
  5. 전역 상수가 summary 에 상수명 그대로 적혔는지 확인 → 실제 값으로 치환됐어야 함?
  6. 테이블·컬럼·상태값·코드값 원문 보존 (prefix·suffix 포함)?
  7. DECODE/CASE 의 unmatched=NULL 규칙 정확히 (마지막 명시 case 와 묶지 X)?
  8. NVL/COALESCE/IFNULL/ISNULL 의 의미 임의 추가 X?
  9. 자식 summary 에 등장한 모든 테이블 누락 없이 명시?
  10. 죽은 코드 주석에서 가져온 내용 0?
  11. 식별자 환각 (축약·일반화·신규 작성) 0?
  12. 어휘 정확성 ("이상"/"초과", "이하"/"미만", AND/OR) 정확?
  {% if called_procedure_summaries %}
  13. 하위 프로시저 내부 분기·테이블이 내 summary 에 재작성되지 X (한 줄 호출 표현만)?
  {% endif %}

