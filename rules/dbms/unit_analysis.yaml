name: "unit_analysis"
description: "프로시저·함수 전체 요약 생성"
version: "6.0"

input_schema:
  required:
    - summaries
    - locale
  optional:
    - variable_declarations
    - constants_context
    - called_procedure_summaries

prompt: |
  [ROLE]
  프로시저·함수의 하위 블록 요약들을 통합해 전체 summary 를 한 편 작성합니다.


  [LANGUAGE]
  응답 언어: {{ locale }}


  [INPUT]
  ── [하위 블록 요약] 역할: summary 통합의 뼈대
  {{ summaries }}

  {% if variable_declarations %}
  ── [변수 선언·초기값] 역할: 상태 변화 서술 근거
  {{ variable_declarations }}
  {% endif %}

  {% if constants_context %}
  ── [전역 상수] 역할: 상수명 → 실제 값. summary 에서 실제 값으로 치환
  {{ constants_context }}
  {% endif %}

  {% if called_procedure_summaries %}
  ── [호출된 프로시저 요약] 역할: 참고만. 하위 프로시저 내부는 내 summary 에 재작성 금지.
  {{ called_procedure_summaries }}
  {% endif %}


  [GOAL]
  프로시저·함수 전체 summary 한 편을 JSON 으로 반환.


  [RULES]

  ★★★ 상태 변화 보존 (최우선 — summary 는 상위 호출 프로시저에서 재사용됨)
  - 자식 요약들을 통합할 때 **조건 → 상태 변화 쌍을 뭉개지 말고** 흐름 순서대로 이어서 기술
  - 각 분기마다 "이 조건이면 → 변수·테이블·OUT·트랜잭션이 이렇게 바뀐다" 별도 문장
  - 뭉뚱그림 금지: "상황에 따라", "적절히 처리"

  ★★★ 자기완결
  상위 프로시저 입장에서 "이 프로시저 호출 시 어떤 조건에서 어떤 상태 변화가 일어나는지" 를
  이 텍스트만 읽고 파악 가능해야 함.

  {% if called_procedure_summaries %}
  ★★★ 하위 호출 맥락 — 중복 포함 금지
  [호출된 프로시저 요약] 은 참고만. 하위 프로시저 내부 분기·테이블·컬럼은 내 summary 에 재작성 금지.
  단 "어떤 단계에 무엇을 호출해 무엇을 얻는지" 한 줄로 녹여 넣는다.
  {% endif %}

  ★★ 담을 것 (실제 존재할 때만)
  - 입력·선행조건 → 분기 로직 → 반환·쓰기 흐름
  - 분기 조건(IF/CASE): 비교 값과 결과 모두
  - 계산식(DECODE/TRUNC/NVL/CASE): 구체 조건·값
  - 하드코딩 리터럴(태그번호·코드값·임계값): 그대로 보존
  - NULL/0/음수 처리·fallback
  - 반복 처리(CURSOR/FOR): 대상·목적
  - EXCEPTION 블록 · OUT result_code 값의 의미
  - COMMIT/ROLLBACK 시점
  - 테이블 조작: INSERT 컬럼·값 / UPDATE·MERGE WHERE·전→후 / DELETE WHERE

  ★★ 식별자 규칙
  - 제거: 변수명·파라미터명 → 의미로 풀어 설명
  - 보존: 테이블명·컬럼명·상태값·코드값·상수값
  - [전역 상수] 는 실제 값으로 치환
  - "이상"≠"초과", "이하"≠"미만" 정확히


  [SELF-CHECK]
  - 모든 주요 분기에 조건+상태변화 쌍이 명시됐는가?
  - 뭉뚱그림("상황에 따라"·"적절히") 없는가?
  - 변수명 대신 의미로 풀어서 썼는가?
  - 테이블명·컬럼명·상태값은 원문 그대로인가?


  [OUTPUT]
  JSON 만. 코드펜스·주석·설명 금지.

  {
    "summary": "프로시저 전체 요약 — 입력→분기→반환 흐름과 테이블 조작을 조건+상태변화 쌍으로"
  }
