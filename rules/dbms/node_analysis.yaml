name: "node_analysis"
description: "SQL 프로시저 코드 범위별 분석 — summary·actor + Bottom-up Rule/Example/Question 생성"
version: "6.0"

input_schema:
  required:
    - code
    - ranges
    - count
    - locale
  optional:
    - context
    - has_dml
    - is_unit_root
    - node_metadata      # [{"node_category": "meaningful|leaf", "child_rules": [...], "child_questions": [...]}, ...]

prompt: |
  [ROLE]
  SQL 저장 프로시저·함수 코드의 각 범위를 분석해:
  - summary (조건+상태변화 쌍)
  - actor (실행 주체)
  - rules (Bottom-up Rule — 각 Rule 안에 examples nested)
  - questions (모호점)
  를 산출합니다.

  Bottom-up 원칙: 리프는 자기 결과만, 부모(의미 노드)는 자식 것 받아 자기 조건 합침.


  [LANGUAGE]
  응답 언어: {{ locale }}


  [INPUT]
  {% if context %}
  ── [부모·형제 컨텍스트] 역할: 실행 흐름 이해 + 참고용
  {{ context }}

  {% endif %}
  ── [분석 대상 코드] 역할: 각 범위별 산출 대상
  {{ code }}

  ── [분석 범위 목록] 각 범위 독립 분석. 개수 정확히 {{ count }}개
  {{ ranges }}

  {% if node_metadata %}
  ── [노드별 메타] i 번째 범위 = i 번째 메타 (node_category / child_rules / child_questions)
  {{ node_metadata }}
  {% endif %}


  [GOAL]
  각 범위마다:
  {
    "startLine": ...,
    "endLine": ...,
    "summary": "...",
    "actor": "...",
    "rules": [
      {
        "condition": "조건 또는 null(리프)",
        "result": "결과 원문",
        "result_kind": "write|assign|return|exception",
        "examples": [
          {"description":"...", "given":{...}, "when":"...", "then":{...}, "is_boundary": true|false}
        ]
      }
    ],
    "questions": [
      {"text":"...", "reason":"..."}
    ]
  }


  [RULES — 공통]

  ★★★ summary 작성
  - 조건 → 상태변화 쌍 명시. 뭉뚱그림 금지("상황에 따라", "적절히").
  - 실제 값(테이블·컬럼·상태값·리터럴) 원문 그대로. 변수명은 의미로 풀어 설명.

  ★★★ 주석 활용
  코드 주석에 목적·비즈니스 규칙이 있으면 summary 와 Rule 에 반영.

  {% if context %}
  ★★★ context 중복 금지
  [부모·형제 컨텍스트] 에 이미 나온 것은 summary 상태변화에 중복 포함 금지.
  {% endif %}


  [RULES — rules + examples (Bottom-up)]

  각 범위 i 에 대해 node_metadata[i].node_category 로 분기:

  ────────────────────────────────────────────────────
  ■ node_category == "meaningful" (의미 부모: IF/CASE/LOOP/EXCEPTION/CURSOR 등)
    - child_rules 의 각 Rule 의 **condition** 에 자기 분기 조건만 AND 로 합침.
    - child_rules 의 각 Rule 의 **examples.given.preconditions** 에 자기 조건 만족값 추가.
    - result, result_kind 는 수정 X.
    - 자기 자체로 새 Rule 생성 금지.
    - child_questions 그대로 전달 + 자기 범위 모호점 있으면 추가.

    예시:
      자기 IF 조건: "V_TODAY > TODAY_DD"
      child_rules: [{"condition":"TAG_CNT>=1", "result":"T INSERT", "result_kind":"write",
                     "examples":[{"given":{"preconditions":{"globals":{"TAG_CNT":1}}},...}]}]
      출력 rules: [{"condition":"TAG_CNT>=1 AND V_TODAY>TODAY_DD", "result":"T INSERT", "result_kind":"write",
                    "examples":[{"given":{"preconditions":{"globals":{"TAG_CNT":1,"V_TODAY":"20260401"}}},...}]}]

  ────────────────────────────────────────────────────
  ■ node_category == "leaf" (DML / ASSIGN / RETURN / EXCEPTION 실행 등)
    - 자기 원문이 **실제 business 결과** (DML 쓰기·상태 변화·RETURN·OUT·예외) 일 때만:
        rules = [{"condition": null, "result": "자기 결과", "result_kind": "...",
                  "examples": [경계값 1~2개]}]
    - 단순 기술 동작 (CURSOR OPEN/CLOSE, FOR LOOP 제어, DBMS_OUTPUT, 기술 예외) → rules = []
    - 억지로 채우지 말 것. 없으면 없는 대로.
    - condition 은 null (조상이 합쳐 줌)
    - 자기 범위 모호점 있으면 questions 에, 없으면 []

    result_kind 값: "write" | "assign" | "return" | "exception"
  ────────────────────────────────────────────────────

  ★ Rule / Example / Question 공통 원칙
  - 억지로 채우지 않기. 없으면 빈 배열.
  - 원문 값 그대로 보존 (의역·요약 금지).
  - PROCEDURE/FUNCTION/BEGIN 같은 구조 래퍼 언급 금지.

  ★ Example (rule 안 nested) 원칙
  - 리프에서 Rule 생성 시, 그 Rule 에 대한 example 1~2개 (경계값 위주).
  - given = {narrative, inputs, preconditions: {tables, globals, stubs}}
  - when = 자연어 한 줄 (비즈니스 행위)
  - then = {narrative, return, out_params, exception, writes, commit}
  - 값은 실제 리터럴 (변수명·프로시저명 금지)

  ★ Question 원칙
  - 코드만으로 답 안 되는 모호점만
  - PL/SQL 문법 관용구는 Question 아님
  - 0개 OK

  ★ 죽은 코드 주석 무시
  code 입력에 `주석: <line>: --...` 형태로 SQL 문법(`SELECT`/`INSERT`/`UPDATE`/`DELETE`/`MERGE`/
  `VALUES`/`FROM`/`INTO`/`WHERE`/`:NEW.`/`:OLD.`)을 포함한 주석 줄이 prepend 돼 있을 수 있음.
  이런 줄은 **죽은 코드** 로 간주, summary·rules·examples·questions 에 절대 반영 금지.
  실제 활성 코드 (`<line>: ...` 형태로 주석 없이 시작) 만 분석 대상.

  ★ Hallucination 절대 금지 (식별자 원문 보존)
  - 원문에 없는 **테이블명·컬럼명·시퀀스명·변수명·프로시저명**을 만들어내거나 추측·축약·일반화 금지
  - 모든 식별자는 prefix·suffix·대소문자까지 원문 그대로 (예: `SEQ_X` 를 `X` 로 줄이지 말 것)
  - 시퀀스 / 함수 호출에서 호출 이름은 도트(`.`) 앞 토큰을 그대로
  - Positional INSERT (컬럼 리스트 없음) 에서 어느 컬럼에 어떤 값이 들어가는지 모름 → 추측 금지.
    컬럼명 명시 안 됐으면 해당 위치 값(시퀀스/리터럴) 만 언급, 컬럼명 만들지 말 것
  - 원문에 없는 명사를 일반화·유추로 만들지 말 것 — 모르면 "위치 n번째 값", "이름 미지정 컬럼" 처럼
    위치·메타 표현으로 대체


  {% if is_unit_root %}
  [RULES — actor (실행 주체) — 코드 근거 있을 때만]
  - 부여: 권한·역할 체크 / 주석 명시 / 자동 실행(배치·스케줄러) → "system"
  - 비움(""): 근거 없음
  {% endif %}


  {% if has_dml %}
  [RULES — DML summary 구체성]
  - SELECT: WHERE 컬럼·비교값 + JOIN + 집계 명시
  - INSERT: 대상 테이블 + 모든 컬럼 + 값 출처
  - UPDATE: SET 컬럼=값 + WHERE + 상태 전이
  - DELETE: WHERE 컬럼=값
  - MERGE: MATCHED/NOT MATCHED 각각 컬럼=값
  - 별칭은 "(별칭 X)" 표기, 실제 테이블명 우선
  {% endif %}


  [SELF-CHECK]
  - analysis 배열 길이 = {{ count }}
  - 각 요소 startLine/endLine 정수
  - summary 에 조건+상태변화 쌍
  - meaningful: rules 개수 ≤ child_rules 개수 (개수 증가 금지)
  - leaf: rules 개수 0 또는 1
  - rules 에 PROCEDURE/BEGIN 언급 0건
  - 억지로 채우지 않음 (없으면 빈 배열)


  [OUTPUT]
  JSON 만. 코드펜스·주석 금지. 트레일링 콤마 금지.

  {
    "analysis": [
      {
        "startLine": 범위_시작,
        "endLine": 범위_끝,
        "summary": "5~8문장",
        "actor": "" 또는 "system",
        "rules": [
          {"condition": "... 또는 null", "result": "...", "result_kind": "...",
           "examples": [{"description":"...","given":{...},"when":"...","then":{...},"is_boundary":false}]}
        ],
        "questions": [{"text":"...","reason":"..."}]
      }
    ]
  }
