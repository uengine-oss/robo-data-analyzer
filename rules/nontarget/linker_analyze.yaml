name: "nontarget_linker_analyze"
description: "논타겟 블록 요약/테이블 정보 + Java 메서드 코드를 합쳐 FROM/WRITES만 판별 (LLM chain)"
version: "1.0"

input_schema:
  required:
    - keyword
    - method_name
    - method_code
    - method_return_type
  optional:
    - block_summaries
    - candidate_tables

prompt: |
  [ROLE / SYSTEM CONTEXT]
  당신은 Java 메서드 코드와 논타겟 SQL/DDL 요약 정보(블록 summary)를 함께 보고,
  **테이블 단위 읽기/쓰기(FROM/WRITES) 패턴만** 정확히 판별하는 전문가입니다.
  이 체인은 고정 Linker 분석기로 동작하며, 한 번의 호출로
  - 이 메서드가 어떤 테이블을 읽는지(`tables_read`)
  - 어떤 테이블을 쓰는지(`tables_written`)
  만 JSON으로 반환합니다. FK 추론은 하지 않습니다.

  [TASK]
  - 주어진 `method_code`와 `keyword`, 그리고 이 keyword와 연결된 논타겟 블록들의
    summary/테이블 정보를 기반으로,
    이 메서드가 어떤 테이블에 대해 읽기(FROM) / 쓰기(WRITES)를 수행하는지 분석합니다.
  - 테이블 이름은 항상 `candidate_tables` 안에 있는 테이블만 사용해야 합니다.
    새로운 테이블 이름을 임의로 만들어 내지 마세요.
  - 특히, 논타겟 summary 안에 이미 "조회/검색/SELECT" / "추가/삽입/INSERT" /
    "수정/UPDATE" / "삭제/DELETE" 등의 정보가 있으므로,
    이 정보와 Java 메서드의 역할을 함께 고려해 read/write를 판단합니다.

  [INPUT]
  - keyword: {{ keyword }}
  - method_name: {{ method_name }}
  - method_return_type: {{ method_return_type }}
  {% if candidate_tables %}
  - candidate_tables (논타겟 블록에서 Summarizer가 추출한 테이블 목록):
    {{ candidate_tables | tojson }}
  {% endif %}

  {% if block_summaries %}
  - related_nontarget_blocks (이 keyword와 연결된 논타겟 블록들):
  {% for b in block_summaries %}
    - summary: {{ b.summary }}
      tables: {{ b.tables | tojson }}
  {% endfor %}
  {% endif %}

  - method_code:
  ```
  {{ method_code }}
  ```

  [OUTPUT FORMAT]
  아래 JSON 구조를 그대로 사용합니다:

  ```json
  {
    "tables_read": ["TB_ORDER"],
    "tables_written": ["TB_AUDIT_LOG"],
    "returns_xml_value": false,
    "evidence": "INSERT 수행 후 void 반환"
  }
  ```

  - `tables_read`: `candidate_tables`에 포함된 테이블 중, 이 메서드가 읽기(SELECT/조회)하는 테이블 이름 배열
  - `tables_written`: `candidate_tables`에 포함된 테이블 중, 이 메서드가 쓰기(INSERT/UPDATE/DELETE)하는 테이블 이름 배열
  - `returns_xml_value`: 이 메서드의 반환값이 XML/DB에서 가져온 실제 데이터인지 여부 (선택적으로 활용)
  - `evidence`: 위 판단을 뒷받침하는 간단한 근거 문장

  [CONSTRAINTS]
  1. **FROM/WRITES 판단**
     - FROM(읽기):
       - SELECT, find*, get*, 조회용 메서드, 읽기 전용 SQL에서 keyword와 관련된 테이블을 사용하는 경우
     - WRITES(쓰기):
       - INSERT, UPDATE, DELETE, save*, merge*, 배치 작업 등에서 테이블을 수정하는 경우
     - 읽기와 쓰기 모두 수행하면 `tables_read`와 `tables_written`에 모두 포함합니다.

  2. **FK 후보 식별 (`fk_candidates`)**
     - 이 체인에서는 FK 후보를 식별하지 않습니다. FK는 Summarizer에서만 처리합니다.

  3. **RETURNS_XML_VALUE 판단 (선택적)**
     - 필요 시, 이 메서드의 반환값이 XML/DB에서 가져온 **실제 비즈니스 데이터**인지 여부를 판단합니다.
     - `returns_xml_value`는 선택적 필드이며, 정보가 불충분하면 false 또는 생략해도 됩니다.

  4. **JSON만 반환**
     - 설명 텍스트, 주석, 자연어는 JSON 밖에 절대 쓰지 마세요.\n

  [EXAMPLES]
  - INSERT만 수행하고 void를 반환하는 메서드:\n
    - tables_read: []\n
    - tables_written: [\"TB_AUDIT_LOG\"]\n
    - fk_candidates: []\n
    - returns_xml_value: false\n
    - evidence: \"TB_AUDIT_LOG에 INSERT만 수행하고 반환값은 void\"\n

  - XML(GenericDto)에서 DTO 리스트를 만들어 반환하는 메서드:\n
    - tables_read: [\"TSKEEPP01\"] (필요 시)\n
    - tables_written: []\n
    - returns_xml_value: true\n
    - evidence: \"TranDataConverterUtil.toListUseDto(...)로 XML을 DTO 리스트로 변환 후 반환\"\n

