## function_summary — 분할 1: summary + stereotype + logical_name
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실.
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할별 다름 (캐시 미스 시작)
  # ════════════════════════════════════════════════════════════════

  이번 호출에서 추출할 것: **summary + stereotype + logical_name** 3 필드.

  ## logical_name — 함수의 도메인 한 줄 표시명

  형제 함수 (같은 모듈의 다른 함수) 와 옆에 놓였을 때 **문장만 보고도 역할이 갈려야**
  합니다. 같은 모듈 안 어떤 형제와도 문자열 전체가 동일하면 안 됨 — 한 글자라도 다르게.

  ### 형식 / 길이

  - 한 줄, 줄바꿈 X.
  - 너무 짧은 라벨 금지 — 두세 단어로 끝내지 말 것. 통상 22 자 전후 이상.
  - 문장 끝은 체언·명사형 ("갱신", "등록", "조회", "검증", "매핑", "결정", "반영").
    "처리한다 / 한다" 동사 어미 금지.

  ### 한 줄 안에 둘 이상 동시에 드러내기

  1. **무슨 행위** — 신규 등록 / 특정 컬럼만 갱신 / 단건 조회 / 외부 호출 / 오류 코드 결정.
  2. **무슨 업무 데이터** — 주문 이력 / 결제 결과 / 회원 마스터 / 안내 문구 등 좁힌 표현.
  3. **언제·어떤 분기** — 성공 경로만 / 오류 경로만 / 사전 점검 / 이미 확정 조회만.
  4. **쓰기면 무엇을 바꾸는지** — 결과 코드 컬럼만 / 안내 문구 컬럼만 / 승인번호+시각 동시.

  ### 좋은 예 (다양 도메인)

  - "결제 승인 결과를 인증 이력 테이블에 신규 등록"
  - "회원 등급 변경 시 누적 포인트 만료일 갱신"
  - "외부 인증 결과 코드에 따른 사용자 안내 문구 결정"
  - "주문 마감 후 미정산 건의 정산일자 일괄 확정"
  - "카드 결제 한도 초과 시 거절 사유 코드 매핑"
  - "재고 부족 발생 시 백오더 큐 등록 + 알림 발송"

  ### 금지 (고유성 파괴 + 잘못된 의미)

  - 메서드명·클래스명·외부 함수명 그대로 박기.
  - 형제들과 공통으로 쓸 광역 표현 단독 ("데이터 처리" / "인증 수행" 단독).
  - summary 복붙.
  - 빈 문자열 — 위임만 있어도 "어떤 서비스에 무엇을 넘겨 호출하는지" 까지.
  - **코드 주석에 끌려 잘못된 동사 박지 마라** — 코드 주석이 실제 DB 작업 종류와
    어긋나는 경우가 있음. codebase_notes 의 op 매핑 (예: SQL_KEY `_s0024` = SELECT) 이
    진실. 주석에 "Insert 처리" 라 적혀있어도 실제 op 가 SELECT 면 logical_name 동사는
    "조회·매핑" 계열. "등록" 박지 X.
  - **잘못된 안티패턴 예시**:
    - X: "공통코드 상세 데이터 신규 등록" (실제 = SELECT 조회 함수)
    - O: "공통코드 상세에서 인증결과 코드값 조회·매핑"
    - X: "사용자 정보 처리" (광역 표현, 형제와 구분 X)
    - O: "사용자 등급 변경 시 누적 포인트 만료일 갱신"

  ## summary — 핵심 한 줄 + 내용

  **형식**: 첫 줄 `핵심:` 한 줄 → 빈 줄 → 내용. 하위 섹션 라벨 (`[흐름]`/`[쓰기]` 등) 없음.

  ### `핵심:` (첫 줄)

  이 함수가 무엇을 하는지 한 줄. 사용자 친화 표현 (메서드명·DBIO 식별자 X). 비개발자가
  읽어도 이 함수의 역할을 한 줄로 파악 가능해야 함.

  ### 내용 (본문) — 반드시 지킬 것

  - **원문(코드) 보다 짧게** — 요약이지 확장이 아니다. 코드보다 길면 잘못된 것.
  - **핵심 키포인트 누락 0** — 이 summary 는 상위 (caller·부모) 분석에 그대로 전달.
    분기·조건·임계값·상태 전이·도메인 코드값을 빠뜨리면 상위가 정보를 잃는다.
    - 도메인 코드값 의미 — 예: "결제수단 '1'=계좌 / '2'=카드"
    - 임계값·계산식 — 예: "₩50,000 이상이면 10% 할인 → 최종금액=주문금액×0.9"
    - 상태 전이 — 예: "주문 상태를 'PAID' 로 변경"
    - "이상" ≠ "초과" / "이하" ≠ "미만" 정확히
  - **종료 경로 모두 반영** (공통 원칙 5):
    - 예: "정상 경로는 결과 코드를 반환. 외부 호출 실패면 안내 문구 갱신 후 에러 반환.
      조회 결과 없음 (NotFound) 인 경우 로그·에러 없이 그대로 통과."
  - **코드적이면 안 됨** — "변수 x 에 0 대입 / 매크로 길이만큼 복사" 식 X. 비즈니스
    로직으로 친숙하게 (예: "실시간 인증 요청을 외부 인증 게이트웨이에 송신").
  - **단순 위임 함수** 면 한두 문장으로 충분 — 억지로 늘리지 X.

  ### 좋은 예 (다양 도메인)

  예 1 (결제 승인):
  > 핵심: 카드 결제 승인 요청을 검증한 뒤 외부 PG 사에 송신하고 결과를 거래 이력에 기록한다.
  >
  > 입력 카드번호·금액의 유효성을 먼저 점검하고, 한도 초과면 안내 코드 'OVER_LIMIT'
  > 으로 거절. 정상이면 PG 사 호출 후 응답 코드를 거래 이력 테이블에 'APPROVED' /
  > 'DECLINED' 로 기록. PG 응답 시간 초과 시 'TIMEOUT' 으로 기록하고 재시도 큐에 적재.

  예 2 (단순 조회):
  > 핵심: 회원 ID 로 회원 마스터에서 등급과 누적 포인트를 단건 조회해 반환한다.

  예 3 (silent pass 분기 포함):
  > 핵심: 공통코드 상세에서 인증결과 코드값에 대응하는 정상전화여부 또는 횟수제한제외
  > 코드를 조회해 호출자에 반영한다.
  >
  > iFlag 분기로 조회 키를 결정: 0 이면 정상전화여부 코드 'A001', 그 외면 횟수제한제외
  > 코드 'B002'. 조회 키와 인증결과 코드값을 입력으로 단건 조회 호출. 조회 결과 없음
  > (NotFound) 인 경우 로그·에러 없이 그대로 통과 (해당 코드값이 마스터에 없으면
  > 정상). DB 오류 시 오류 코드 'DB_ERR' 로그 + 실패 반환.

  예 4 (검증 후 분기 + 도메인 코드값):
  > 핵심: 주문 결제 요청을 결제수단별로 검증한 뒤 한도 초과면 거절, 정상이면 결제
  > 트랜잭션 시작.
  >
  > 결제수단 ('CARD' = 카드 / 'BANK' = 계좌 / 'POINT' = 포인트) 별로 한도 정책이 다름.
  > 카드는 1회 ₩500,000 초과 시 거절 코드 'CARD_OVER', 계좌는 ₩1,000,000 초과 시
  > 'BANK_OVER', 포인트는 잔액 부족 시 'POINT_INSUFFICIENT'. 정상이면 결제 트랜잭션
  > 시작 + 처리 큐에 적재.

  예 5 (외부 호출 + 비즈니스 분기):
  > 핵심: 카드사 코드로 외부 인증 모듈을 호출해 카드 정보를 받아 호출자 출력에 매핑한다.
  >
  > 부분 카드번호와 외국카드 여부, 회사 구분코드를 묶어 외부 모듈 호출. 정상이면
  > 응답에서 은행카드사·매입카드사 코드를 호출자 출력 구조체에 매핑. 호출 실패 시
  > 오류 코드 즉시 반환.

  ## stereotype — 실제 동작 기준의 함수 역할 라벨

  허용 풀 (이 풀에서만 선택 — 다른 값 X):

  `ApplicationService` / `DomainService` / `Repository` / `Factory` / `Command` /
  `Query` / `Validator` / `Translator` / `Adapter` / `Strategy` / `EventHandler` /
  `Scheduler` / `Helper` / `Controller` / `Initializer`

  ### 결정 기준 (본문 동작이 기준 — 이름·annotation 으로 단정 X)

  - **Command** — INSERT/UPDATE/DELETE 가 본질 / 상태 변경 / 외부 쓰기.
  - **Query** — SELECT 만. 읽은 값을 분기·검증·계산·안내에 사용. 쓰기 없음.
  - **Validator** — 검증만. 검증 결과를 호출자에게 반환. 검증 후 쓰기 있으면 Command.
  - **Repository** — DAO / DB 접근의 일관 추상화 (read·write 모두 추상화).
  - **Factory** — 객체 생성·조립 (생성된 객체 반환).
  - **EventHandler** — 이벤트·콜백 처리 (안에서 R/W 해도 Handler 우선).
  - **Translator** / **Adapter** — 형식 변환·외부 표현 ↔ 내부 표현 매핑.
  - **Strategy** — 분기 알고리즘 선택·실행.
  - **Initializer** — 초기화·setup (main, init, @PostConstruct, 모듈 시작 블록).
  - **Controller** — 진입점 (HTTP endpoint, route, @Mapping).
  - **Scheduler** — 주기 실행·트리거.
  - **Helper** — 위 어디에도 안 맞는 유틸성.
  - **ApplicationService** / **DomainService** — 비즈니스 흐름 조립 (여러 단계 합산).

  ### 결정 시 reads / writes 와 codebase_notes 우선

  reads 만 있고 writes 없음 + codebase_notes 의 op 가 SELECT 계열 → **Query** 후보.
  writes 있음 + codebase_notes op 가 INSERT/UPDATE/DELETE → **Command** 후보.

  코드 주석이 op 와 어긋나면 reads/writes + codebase_notes 가 진실. 주석에 끌려
  Command 로 잘못 판단하지 X (실제 잦은 오류).

