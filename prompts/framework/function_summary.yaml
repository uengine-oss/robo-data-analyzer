## function_summary — 분할 1: summary + stereotype + logical_name
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실.
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 1: 함수 의미 종합
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드

  - **이 분할이 하는 일**: `summary` + `stereotype` + `logical_name` 3 필드 채움
  - **이 분할이 안 하는 일**: 테이블별 컬럼 의미(→분할 2) / 비즈니스 규칙·시나리오·질문(→분할 3)
  - **출력 미리보기** (type + 값 예시):
    ```
    SummaryOutput {
      logical_name: "한 줄 도메인 표시명 (22자 전후, 체언 끝)",   // string
      summary:      "[핵심] ...\n\n내용 ...",                    // string ([핵심] 마커 필수)
      stereotype:   "Command" | "Query" | "Validator" | ...      // 허용 풀 15개 중
    }
    ```

  ---

  ## 0. 작성 절대 원칙 — 모든 3 필드 공통

  ### 0.1 코드 식별자 박멸 ([[_common]] 단계 1 참조)
  메서드명·변수명·클래스명·매크로명·DBIO 식별자 그대로 X. **이름이 아니라 의미**.
  단 도메인 코드값 리터럴 (`'CARD'` / `'PAID'`) / 임계값 (₩50,000) / 상태값은 보존 OK.

  ### 0.2 본문 주석 환각 차단 ([[_common]] 단계 7 참조)
  본문 주석은 코드 변경 잔재로 실제 동작과 어긋날 수 있는 신호.
  codebase_notes 의 결정론 매핑 (함수 식별자·키 → op) 이 항상 우선.

  - X: 본문 라인 위 `/* 데이터 신규 등록 */` 주석 + 실제 함수 키 = UPDATE
       → summary "신규 등록" / logical_name "신규 등록" 박음 (주석 환각)
    O: codebase_notes 의 UPDATE 매핑 보고 summary "갱신" / logical_name "갱신" 사용.
       본문 주석은 무시.

  ### 0.3 추측 X ([[_common]] 단계 2 참조)
  본문 코드에 등장한 사실만 결과로 출력. 본문에 근거 없는 의미 추가 X.

  ### 0.4 모호 단어 박멸 ([[_common]] 단계 6 참조)
  "적절히 / 필요시 / 상황에 따라" 같은 표현 X. 조건과 결과를 분리해 명시.
  비교 정확 — "이상" ≠ "초과", "이하" ≠ "미만".

  ---

  ## [1] logical_name — 함수의 도메인 한 줄 표시명

  형제 함수(같은 모듈 안 다른 함수) 와 옆에 놓였을 때 **문장만 보고도 역할이 갈려야**
  합니다. 같은 모듈 안 어떤 형제와도 문자열 전체가 동일하면 안 됨 — 한 글자라도 다르게.

  ### 1.1 형식 / 길이 강제

  - **한 줄, 줄바꿈 X**.
  - **통상 22자 전후 이상** — 두세 단어 라벨 금지.
  - **체언·명사형 어미** — "갱신", "등록", "조회", "검증", "매핑", "결정", "반영", "차단",
    "복원", "송신", "수신", "전이", "확정", "취소".
  - **금지 어미** — "처리한다 / 한다 / 함" 같은 동사 어미.

  ### 1.2 결정 트리 (4 요소 중 ≥ 2 동시 드러내기)

  1. **무슨 행위** — 신규 등록 / 특정 컬럼 갱신 / 단건 조회 / 외부 호출 / 코드 결정 등
  2. **무슨 업무 데이터** — 주문 이력 / 결제 결과 / 회원 마스터 / 안내 문구 / 정산 마감 등
  3. **언제·어떤 분기** — 성공 경로만 / 오류 경로만 / 사전 점검 / 이미 확정 조회만
  4. **쓰기면 무엇을 바꾸는지** — 결과 코드 컬럼만 / 승인번호+시각 동시 / 상태만 등

  ### 1.3 좋은 예 (다양 도메인 — 6쌍)

  - 결제 도메인: "결제 승인 결과를 인증 이력 테이블에 신규 등록"
  - 회원 도메인: "회원 등급 변경 시 누적 포인트 만료일 갱신"
  - 안내 결정: "외부 인증 결과 코드에 따른 사용자 안내 문구 결정"
  - 정산 일괄: "주문 마감 후 미정산 건의 정산일자 일괄 확정"
  - 거절 매핑: "카드 결제 한도 초과 시 거절 사유 코드 매핑"
  - 큐 적재: "재고 부족 발생 시 백오더 큐 등록 + 알림 발송"

  ### 1.4 ★ 형제 차별 패턴 표 (같은 모듈 형제 함수와 안 겹치게 — 9 쌍)

  같은 도메인 모듈의 형제 함수들이 의미 비슷해 보여도 ★ 한 글자라도 달라야 함.
  형제 흔한 패턴별로 "짧은 광역 표현 (X)" vs "차별 축 2+ 드러난 한 줄 (O)":

  | 형제 패턴 | ❌ 짧은 광역 표현 (형제와 구분 0) | ✅ 차별 축 2+ 동시 드러난 한 줄 |
  |---|---|---|
  | 검증·준비    | "입력 검증"          | "결제 요청 금액·계좌형식·기관코드 사전 검증 및 거절코드 매핑"   |
  | 메인 호출    | "메인 처리"          | "외부 인증 호출 파라미터 조립·송신·응답 타임아웃 분기"          |
  | 이력 INSERT  | "이력 등록"          | "실시간 인증 최초 요청분 신규 이력 INSERT 및 요청키 채번 반영"  |
  | 이력 SELECT  | "이력 조회"          | "동일 거래키 최종 인증 결과행 단건 조회 후 후속 분기용 코드 적재" |
  | UPDATE A     | "결과 갱신"          | "응답코드·사유코드 컬럼만 성공 분기 UPDATE"                     |
  | UPDATE B     | "결과 적용"          | "승인번호·승인시각·매입사코드 컬럼 반영 이력 확정 UPDATE"       |
  | UPDATE C     | "오류 메시지 갱신"   | "고객 노출용 오류문구·내부 오류코드 컬럼만 실패 분기 UPDATE"    |
  | 메시지 결정  | "오류 결정"          | "은행·카드사별 오류코드를 안내 문구 리스트에서 결정해 OUT 세팅" |
  | 코드 검증    | "기관 코드 검증"     | "요청 기관코드 마스터 등록 여부 조회 후 미등록 시 즉시 거절"    |

  → 표 오른쪽 열처럼 형제와 첫 두 단어 조합이 다르게 / 차별 축 2+ 동시 드러나게.

  ### 1.5 logical_name 금지 패턴 — 안티패턴/정답 쌍

  **a. 메서드명·클래스명 그대로 박기**
  - X: "ProcessOrderService 의 processOrder 실행"
    O: "주문 결제 요청을 결제 모듈에 위임 후 결과 응답"
  - X: "checkInputValidation()"
    O: "결제수단·계좌번호 형식 검증 후 통과여부 반환"

  **b. 형제와 공통 광역 표현 단독**
  - X: "데이터 처리" (형제와 구분 0)
    O: "회원 등급 변경 시 누적 포인트 만료일 갱신"
  - X: "인증 수행"
    O: "외부 PG 인증 응답을 거래 이력에 'APPROVED' 또는 'DECLINED' 로 기록"

  **c. 코드 주석에 끌려 잘못된 동사 (★ 0.2 적용)**
  주석이 실제 DB 작업과 어긋나는 경우가 잦음. `codebase_notes` 의 op 매핑이 진실.
  주석 "Insert 처리" 라 적혀있어도 실제 op = SELECT 면 동사는 **조회·매핑** 계열.

  - X: 주석 `// 공통코드 신규 등록` 에 끌려 logical_name = "공통코드 상세 데이터 신규 등록"
       (실제 함수 키 = SELECT 함수)
    O: "공통코드 상세에서 인증결과 코드값 조회·매핑"
  - X: 주석 `// 상태 등록` (실제 UPDATE)
    O: "주문 상태를 'PAID' 로 갱신"

  **d. 빈 문자열·단순 위임 후 침묵**
  단순 위임 함수도 "어떤 서비스에 무엇을 넘겨 호출하는지" 까지는 적어야 함.

  - X: "" (위임만 있다고 빈 값)
    O: "결제 검증 결과를 외부 PG 모듈에 전달 후 응답 회수"

  ---

  ## [2] summary — 2 섹션 구조 [핵심] + 내용

  ### 2.1 형식 강제

  ```
  [핵심] <한 줄 — 사용자 친화 표현, 메서드명·DBIO 식별자 X>

  <내용 — 비즈니스 로직 본문 자유 서술. 분기·조건·임계값·상태값·도메인 코드값 보존.
   단순 위임 함수는 [핵심] 한 줄로 끝 — 내용 생략 OK.>
  ```

  - 섹션 라벨은 `[핵심]` 한 가지만. 다른 어떤 섹션 라벨도 사용 X.
  - 마크다운 헤딩·리스트 기호 (`#` / `*` / `-` / `1.`) 사용 X.
  - `[핵심]` 다음 빈 줄 → 내용 (한두 문장 ~ 여러 문장 자유).
  - 단순 위임 / 단순 단건 SELECT 함수: `[핵심]` 한 줄로 충분 — 내용 섹션 생략 OK.

  ### 2.2 각 섹션 책임

  **[핵심]** — 첫 줄. 한 줄. 함수가 무엇을 하는지 (사용자 친화).
  메서드명·SQL 키워드·매크로명·외부 함수명 그대로 X.

  **내용** — 비즈니스 로직 본문 자유 서술. 필요한 만큼 (단순 위임은 생략).
  - 분기·조건·임계값·상태값·도메인 코드값 보존 — 누락 시 상위(caller/부모) 분석 손실.
  - 도메인 코드값 의미 — 예: "결제수단('CARD'=카드 / 'BANK'=계좌)",
    "응답코드('0000'=성공 / '0001'=한도초과)".
  - 임계값·계산식 — 예: "₩50,000 이상이면 10% 할인 → 최종금액 = 주문금액 × 0.9".
  - 상태 전이 — 예: "주문 상태를 'PAID' 로 변경".
  - 테이블 R/W — INSERT/UPDATE/DELETE/SELECT 의 테이블·핵심 컬럼·WHERE 도 같이
    풀어쓰기 (별도 섹션 X).
  - 모든 종료 경로 반영 ([[_common]] 단계 5 참조).

  ### 2.3 본문 작성 절대 규칙

  1. **원문(코드)보다 짧게** — 요약이지 확장이 아님. 코드보다 길면 잘못된 것.
  2. **코드적이면 안 됨** — "변수 x 에 0 대입 / 매크로 길이만큼 복사" 식 X.
     비즈니스 로직 표현으로 (예: "실시간 인증 요청을 외부 인증 게이트웨이에 송신").
  3. **단순 위임 함수** = [핵심] 1줄로 충분. 억지로 늘리지 X.
  4. **자식 끌어올림 X** ([[_common]] 단계 4 참조) — 자식의 [핵심] 한 줄은 summary
     에 맥락으로 반영 OK. 단 자식의 내부 분기·NULL 체크·검증을 부모 summary 의
     자세한 내용으로 끌어올림 X. 자기 본문 (호출 자체) 만 요약.

  ### 2.4 좋은 예 (5가지 도메인 패턴 — 2 섹션 적용)

  #### 예 1 — 외부 호출 + 결과 기록

  > [핵심] 카드 결제 승인 요청을 검증한 뒤 외부 PG 사에 송신하고 결과를 거래 이력에
  > 기록한다.
  >
  > 입력 카드번호·금액 유효성 점검. 한도 초과 → 'OVER_LIMIT' 거절. 정상 → PG 사 호출
  > 후 응답 코드를 거래 이력 (`transaction_history`) 에 'APPROVED' / 'DECLINED' 로
  > 기록 (응답코드·시각 컬럼 채움). 응답 타임아웃 → 'TIMEOUT' 기록 + 재시도 큐
  > (`retry_queue`) 적재.

  #### 예 2 — 단순 조회 (짧게)

  > [핵심] 회원 ID 로 회원 마스터에서 등급과 누적 포인트를 단건 조회해 반환한다.

  #### 예 3 — silent pass 분기 포함

  > [핵심] 공통코드 상세에서 인증결과 코드값에 대응하는 정상전화여부 또는 횟수제한제외
  > 코드를 조회해 호출자에 반영한다.
  >
  > iFlag 분기로 조회 키 결정: 0 = 'A001'(정상전화여부) / 그 외 = 'B002'(횟수제한제외).
  > 조회 키 + 인증결과 코드값으로 공통코드 상세 (`common_code_detail`) 단건 조회.
  > NotFound 인 경우 로그·에러 없이 그대로 통과 (해당 코드값이 마스터에 없으면 정상
  > 동작). DB 오류 → 'DB_ERR' 로그 + 실패 반환.

  #### 예 4 — 검증 후 분기 + 도메인 코드값

  > [핵심] 주문 결제 요청을 결제수단별로 검증한 뒤 한도 초과면 거절, 정상이면 결제
  > 트랜잭션 시작.
  >
  > 결제수단('CARD'=카드 / 'BANK'=계좌 / 'POINT'=포인트) 별 한도 정책.
  > 카드 1회 ₩500,000 초과 → 'CARD_OVER'. 계좌 ₩1,000,000 초과 → 'BANK_OVER'.
  > 포인트 잔액 부족 → 'POINT_INSUFFICIENT'. 정상 → 결제 트랜잭션 시작 +
  > 처리 큐 (`payment_queue`) 'PENDING' INSERT + 거래 로그 (`transaction_log`) 시작
  > 마커 INSERT.

  #### 예 5 — 단순 위임 entry point ([[_common]] 단계 4 (d) 적용)

  > [핵심] 자동납부 신청 시 입력 검증과 메인 처리를 자식 함수에 위임 / 자식 실패 시
  > 실패 코드 반환.

  ### 2.5 ★ codebase_notes 우선 — 본문 주석 환각 차단 ([[_common]] 단계 7 적용)

  본문 주석은 코드 변경 잔재로 실제 동작과 어긋날 수 있음. summary 의 동사 결정 시
  **codebase_notes 의 결정론 메타** (함수 식별자·키 → op) 가 항상 우선.

  - X: 본문 잔재 주석 `/* DBIO 단일 Insert처리 */` + 실제 함수 키 = UPDATE
       → [핵심] "신규 등록" / 내용 "INSERT 한다" 박음 (주석 환각)
    O: codebase_notes 의 UPDATE 매핑 보고 [핵심] "갱신" / 내용 "UPDATE 한다".
       본문 주석은 무시.

  - X: 본문에 모든 함수 공통 잔재 주석 박혀있음 → 모든 함수가 INSERT 처럼 보임
       (실제는 i/u/s/d 다양)
    O: 함수의 결정론 메타가 진실. 공통 잔재 주석 무시.

  ---

  ## [3] stereotype — 함수 역할 라벨

  실제 동작 기준 (이름·annotation 이 아니라 본문 동작). 허용 풀에서만 선택, 다른 값 X.

  ### 3.1 허용 풀 (15개)

  `ApplicationService` / `DomainService` / `Repository` / `Factory` / `Command` /
  `Query` / `Validator` / `Translator` / `Adapter` / `Strategy` / `EventHandler` /
  `Scheduler` / `Helper` / `Controller` / `Initializer`

  ### 3.2 결정 트리

  ```
  본문에 INSERT/UPDATE/DELETE 가 본질인가?
    → 예 → Command
    → 아니오 → 다음
  SELECT 만 + 결과 분기·계산·안내?
    → 예 → Query
    → 아니오 → 다음
  검증만 + 검증 결과 반환?
    → 예 → Validator (검증 후 쓰기 있으면 Command)
    → 아니오 → 다음
  DAO / DB 접근 일관 추상화?  → Repository
  객체 생성·조립 (생성된 객체 반환)?  → Factory
  이벤트·콜백 처리?  → EventHandler
  형식 변환·내외부 표현 매핑?  → Translator / Adapter
  분기 알고리즘 선택·실행?  → Strategy
  초기화·setup (main / init / @PostConstruct)?  → Initializer
  진입점 (HTTP / route / @Mapping)?  → Controller
  주기 실행·트리거?  → Scheduler
  비즈니스 흐름 조립 (여러 단계 합산)?  → ApplicationService / DomainService
  그 외 유틸성?  → Helper
  ```

  ### 3.3 reads / writes / codebase_notes 와 일관성

  - `reads` 만 있고 `writes` 없음 + `codebase_notes` op 가 SELECT 계열 → **Query** 후보.
  - `writes` 있음 + op 가 INSERT/UPDATE/DELETE → **Command** 후보.
  - 주석이 op 와 어긋나면 `reads`/`writes` + `codebase_notes` 가 진실. 주석에 끌려
    Command 로 잘못 판단하지 X (실제 잦은 오류 — 0.2 / 2.5 참조).

  ### 3.4 stereotype 안티패턴 — 안티패턴/정답 쌍

  - X: 함수명 `processOrder` 라서 **ApplicationService** 박음
    O: 본문이 단순 SELECT 뿐이면 **Query**, INSERT 가 본질이면 **Command**
  - X: try-catch 안 어찌됐든 어떤 처리 있으니 **EventHandler**
    O: 이벤트·콜백 시그니처가 아니면 EventHandler X

