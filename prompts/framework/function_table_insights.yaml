## function_table_insights — 분할 2: 테이블별 role + 컬럼 의미
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실.
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 2: 테이블별 사용 양상 분석
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드

  - **이 분할이 하는 일**: `table_insights` 배열 — `reads` / `writes` 의 각 테이블에 대해
    이 함수에서의 사용 역할(`role`) + 본문에 등장한 컬럼의 비즈니스 의미(`columns`).
  - **이 분할이 안 하는 일**: 함수 의미·역할(→분할 1) / 비즈니스 규칙·시나리오·질문(→분할 3)
  - **출력 미리보기**:
    ```
    TableInsightsOutput {
      table_insights: [
        {
          table_fqn: "db.schema.ORDER",
          role: "WRITE-then-READ",
          columns: [
            { name: "ORDER_STATUS", description: "...", usage: "set" },
            { name: "ORDER_ID",     description: "...", usage: "where" }
          ]
        },
        ...
      ]
    }
    ```

  ### 빈값 규칙

  - `reads` / `writes` 가 모두 비어있으면 `table_insights: []` (빈 배열 정답).
  - 어떤 테이블이 `reads` / `writes` 에는 있지만 본문에서 컬럼 등장이 0 이면 그 테이블
    엔트리는 `columns: []` 로 출력 (역할만 채움). 추측 컬럼 절대 X.

  ---

  ## [1] role — 테이블별 1개 분류

  이 함수가 해당 테이블을 어떻게 다루는지 한 단어로 분류. 허용 풀:

  - `READ-only`         — SELECT 만. 조회 후 분기 / 응답 조립.
  - `WRITE-only`        — INSERT / UPDATE / DELETE 만. 후속 SELECT 없음.
  - `WRITE-then-READ`   — 쓰고 같은 트랜잭션에서 다시 SELECT (시퀀스·자동컬럼 회수).
  - `append-only`       — INSERT 만. 갱신·삭제 X (이력 / 로그 성격).
  - `lookup`            — SELECT 후 코드 / 상태값을 결정에 씀 (단순 표시 X).
  - `upsert`            — INSERT-or-UPDATE (MERGE / ON CONFLICT).

  ### role 결정 트리

  ```
  본문에 INSERT 만, 같은 테이블 UPDATE/DELETE 없음?
    → 예 → append-only
    → 아니오 → 다음
  INSERT/UPDATE/DELETE 후 같은 트랜잭션에서 같은 테이블 SELECT?
    → 예 → WRITE-then-READ
    → 아니오 → 다음
  INSERT-or-UPDATE 패턴 (MERGE / ON CONFLICT)?
    → 예 → upsert
    → 아니오 → 다음
  SELECT 만 + 결과를 분기·계산·매핑에 사용?
    → 예 → lookup
    → 아니오 → 다음
  SELECT 만 + 결과 그대로 반환?
    → 예 → READ-only
    → 아니오 → 다음
  INSERT/UPDATE/DELETE 만 + 후속 SELECT 없음?
    → 예 → WRITE-only
  ```

  ### 안티패턴/정답 쌍

  - X: SELECT 한 번 + 반환 만 인데 `lookup` 박음 (분기 없음)
    O: `READ-only`
  - X: INSERT 만 있고 다시 안 읽는데 `WRITE-then-READ`
    O: `append-only` (이력성) 또는 `WRITE-only`
  - X: UPDATE 한 번 인데 `upsert` (MERGE 아님)
    O: `WRITE-only`

  ---

  ## [2] columns — 테이블별 N개

  본문에 직접 등장한 컬럼만. 추측 컬럼 절대 X. 본문 등장 위치:

  - raw SQL SELECT 절 / WHERE 절 / SET 절 / VALUES 절 / JOIN ON 절
  - annotation `@Column("...")`
  - setter / getter (예: `entity.setOrderStatus(...)`)
  - 명시적 컬럼 매핑 (mapper / ORM 호출 인자)

  ### 각 컬럼 필드 3개

  - `name` — DDL 컬럼명 정확히 (예: `ORDER_STATUS`). 추측 X. 대소문자 본문대로.
  - `description` — 비즈니스 의미 한 줄. **반드시 지킬 4가지**:
    1. DDL 타입 X (`VARCHAR2(20)` 같은 정의 적지 X)
    2. 메서드명 X (`getOrderStatus` 같은 코드 토큰 적지 X)
    3. 동어반복 X ("주문상태를 저장하는 컬럼" 식 금지)
    4. 의미 추론 불가 → 빈값 X / 등장 맥락만 기재 + 모호점은 분할 3 questions 가 담당
  - `usage` — 이 함수에서 어떻게 쓰는지. 허용 풀:
    - `read`    — SELECT 절에서 회수
    - `where`   — WHERE 절 조건
    - `set`     — UPDATE SET 절
    - `value`   — INSERT VALUES 절
    - `join_on` — JOIN ON 조건
    - `group_by`/ `order_by` — 집계·정렬 키

  ### description 좋은 예 (5가지 도메인)

  - 결제: `STATUS` → "주문 상태 코드 ('PAID' = 결제완료 / 'CANCEL' = 취소 / 'PENDING' = 대기)"
  - 안내: `ERR_MSG` → "고객 노출용 오류 안내 문구 (실패 분기에서만 갱신)"
  - 정산: `SETTLE_DATE` → "정산일자 (YYYYMMDD, 마감 처리 후 확정)"
  - 회원: `MEMBER_GRADE` → "회원 등급 ('VIP' / 'GOLD' / 'SILVER' / 'BRONZE')"
  - 로그: `RESPONSE_CODE` → "외부 PG 응답 코드 ('0000' = 성공 / '0001' = 한도초과)"

  ### 안티패턴/정답 쌍

  - X: description = "VARCHAR2(20) 컬럼"
    O: description = "주문 상태 코드 ('PAID' / 'CANCEL' / 'PENDING')"
  - X: description = "getOrderStatus 가 반환하는 값"
    O: description = "주문 상태 코드"
  - X: description = "주문 상태를 저장하는 컬럼" (동어반복)
    O: description = "주문 상태 코드 — 결제 흐름 분기에 사용"
  - X: SQL 에 안 등장한 `CREATED_AT` 추측 추가 ("자동 채워질 듯")
    O: 본문에 없는 컬럼은 출력 X. 의문은 분할 3 questions 로 이월

