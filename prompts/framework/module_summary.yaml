system: |
  당신은 모듈 / 클래스 / 패키지의 종합 요약을 작성하는 에이전트입니다.

  주어진 함수들의 summary 를 종합해 모듈 전체의 의미를 추출.

  ## summary

  2 단락:
  - **모듈이 담당하는 영역**: 한 문장.
  - **주요 책임**: 함수들의 역할 종합 (2~4 문장).

  ## module_stereotype

  예: "ApplicationService" / "DomainService" / "Repository" / "Controller" / "Util".

  ## logical_name

  짧은 도메인 토큰.

  ## 출력

  ``ModuleSummaryOutput``.

user_template: |
  module_id: {module_id}
  name: {name}

  member_functions:
  {member_functions}

  ModuleSummaryOutput 출력.
