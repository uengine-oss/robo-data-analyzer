## code_rules_examples — 분할 3: 비즈니스 규칙 + Example Mapping + Questions
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실 (extends).
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 3: 비즈니스 규칙·시나리오·질문 추출
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드
  - **이 분할이 하는 일**: `rules`(비즈니스 규칙) + `examples`(given/when/then 시나리오)
    + `questions`(모호점 검토 큐) 3 배열을 만든다.
  - **이 분할이 안 하는 일**: 함수 의미·역할(→분할 1) / 컬럼 의미(→분할 2)는 손대지 않는다.
  - **출력 스키마** (type + 값 예시 — 형식 안내용):
    ```
    RulesExamplesOutput {
      rules: [
        { rule_id: "R1",                       // string
          statement: "<조건>이면 <결과>",        // string
          flow_id: "1" | "1-1" | "1-1-1",      // string — NEXT/BRANCH 엣지 자동
          coupled_domains: ["..."] }           // list[string]
      ],
      examples: [
        { rule_id: "R1",                        // string
          description: "한 줄 요약",             // string
          given: "...",                         // ★ string 자연어 (공백·빈 영역 X)
          when:  "...",                         // ★ string 한 줄
          then:  "...",                         // ★ string 자연어 (공백·빈 영역 X)
          affected_tables: [ { table: "...", op: "READ"|"INSERT"|"UPDATE"|"DELETE"|"MERGE" } ] }
      ],
      questions: [ { text: "한 줄 질문", reason: "코드 근거 부재 사유" } ]
    }
    ```
  - **이 지침과 아래 모든 예시는 범용 설명용이다** — 실제 코드값·식별자가 아니라 패턴을 보여주는
    추상 예시다. 산출물에는 **네가 분석하는 그 함수의 본문에 실제 등장한 값만** 써라.

  # ════════════════════════════════════════════════════════════════
  # 0. 북극성 — 무엇을·왜 추출하나 (이 단원이 모든 판단의 기준)
  # ════════════════════════════════════════════════════════════════

  ## 0.1 목적
  `rules` + `examples` = 이 함수의 **비즈니스(도메인) 의도를 담은 명세**다. 궁극 목표는,
  **이 rules/examples 만 보고 코드를 다시 만들었을 때 원문과 똑같이 동작**하는 것이다.
  따라서 품질 기준은 단 하나: **"도메인 의도를 빠짐없이·정확히 담았는가."**

  ## 0.2 동시에 만족해야 할 두 축 — 서로 충돌하지 않는다
  - **(A) 완전성·정확도**: 동작에 영향을 주는 도메인 결정·코드값은 **하나도 빠뜨리지 않는다**.
    값은 **본문에 있는 그대로** 쓴다(지어내지 않는다).
  - **(B) 간결성·무폭주**: 가치 없는 노이즈·중복·"입력 조합을 다 채우는 변주"는 **0**으로 만든다.
  - **둘은 충돌이 아니다.** 경계는 오직 **"가치"**(이 조건/값이 사라지면 전환된 코드의 동작이
    달라지는가)다. → 달라지면 (A)로 빠짐없이, 안 달라지면 (B)로 버린다.

  ## 0.3 흔한 오해 3가지 — 미리 못박는다 (이게 그동안 누락·노이즈의 원인)
  - **오해①: "간결하게 = 코드값 집합을 줄인다"** → 틀렸다. 줄이는 대상은 **'입력 조합 변주'**(같은
    결과를 내는 행을 여러 개 만드는 것)뿐이다. **코드값 "집합"은 절대 줄이지 않는다**(다 나열).
  - **오해②: "통합 = 다른 결정도 한 룰로 합친다"** → 틀렸다. **같은 의미**의 다발만 합친다.
    **서로 다른 도메인 결정**은 합치면 누락이다.
  - **오해③: "이 함수는 래퍼/IO니까 전부 빈 배열"** → 틀렸다. 판단 단위는 **함수가 아니라
    '가지(branch)'**다. 한 함수 안에 기술 가지와 도메인 가지가 섞여 있으면 **도메인 가지는 살린다**.

  # ════════════════════════════════════════════════════════════════
  # 1. 절대 원칙 (모든 영역 공통 — 1.x/2.x/3.x 디테일보다 우선)
  # ════════════════════════════════════════════════════════════════

  ## 1.1 ★ 가지별 판단 (함수 단위가 아니라 분기 단위)
  한 함수 안에서 **분기마다** "이건 도메인 가치가 있나?"를 따로 묻는다.
  - 예(범용): 어떤 함수가 ① 외부 시스템 조회 1건(기술) ② 조회 결과 코드값으로 처리 분기(도메인)
    ③ 오류면 에러 반환(기술) 세 가지를 한다면 → **②만 Rule**. ①③은 버린다.
  - "조회 실패 시 에러 반환" 같은 표준 에러처리가 섞여 있다고 그 함수의 도메인 가지(②)까지
    버리면 = 누락. 반대로 ②가 없고 ①③뿐이면 = `rules:[]`.

  ## 1.2 ★ 분기 난사 절대 금지
  본문 if/else/switch 가지마다 Rule 을 만드는 건 최악의 사고다. 본문이 12 가지여도 **의미가 같은
  다발**은 한 Rule 로 수렴한다(값 차이는 example 로). 단 **의미가 다른** 결정은 1.2가 아니라 2.5(분리)다.

  ## 1.3 ★ 막무가내 채우기 = 환각의 시작
  "뭐라도 채워야 한다"는 충동이 환각이다. 본문에서 가치를 못 찾으면 빈 배열이 **정답**이다.
  rules 0 / examples 0 / questions 0 = 정상 결과.

  ## 1.4 ★ 순수 기술 가지/래퍼 = 빈 배열
  아래는 도메인 결정이 아니라 기술 관심사다 → Rule 로 만들지 않는다:
  - DI·프레임워크 콜백 / 로깅·메트릭 / DTO↔Entity 변환 / 트랜잭션·캐시·재시도 / 표준 래퍼 호출
  - 순수 기술 예외(NPE·캐스팅·OOM) / 순수 방어 null·empty 체크 / "오류면 에러 반환" / "호출 실패면 에러 반환"
  함수 전체가 이런 것뿐(+표준 에러처리)이고 도메인 분기·값 매핑·정책이 **하나도 없으면**
  `rules:[]`+`examples:[]`. (단 1.1에 따라 도메인 가지가 하나라도 있으면 그건 살린다.)

  ## 1.5 ★ 코드값 정확도 + 도메인 언어 (전환 시 동일 동작 + 깔끔함)
  - **도메인 코드 VALUE 는 본문 그대로 보존**: 상태·구분·결과 코드 리터럴, 임계값, 기본값.
    본문에 없는 값을 **지어내지 않는다**(환각 금지). 숫자면 숫자로, 문자면 그 문자로.
    대표값이 본문에 아예 없으면 값을 만들지 말고 **자연어로 서술**한다.
  - **★ 단, "코드 식별자"(변수명·구조체 경로·함수/메서드명)는 given/when/then 에 그대로 베끼지
    마라 — 도메인 언어로 바꾼다.** given/when/then 은 사람이 읽는 시나리오다.
    - ❌ "in.someFlag = 'Y' 이면 out.code = '3'"   (변수 경로를 그대로 베낌)
      ✅ "비활성 여부 = 'Y' 이면 처리구분 = '3'"     (도메인 언어 + 값은 보존)
    - ❌ "checkXxxStatus() 호출" / "doXxxService() 실행"  (메서드명)  →  ✅ "XX 여부를 조회"
    - 핵심: **무엇을 의미하는지(도메인) + 어떤 값인지(코드 VALUE)** 는 남기고,
      **어떻게 구현됐는지(변수·메서드 이름)** 는 뺀다.
    - ★★ 출력 직전 토큰 점검(놓치기 쉬움): given/when/then/statement 에 `객체.필드`·`접두사_변수`
      (전역/구조체 경로)·`이름()`·`*_proc`/`*_check`/`*_dbio_*` 같은 **코드 토큰이 하나라도** 보이면
      = 베끼기 = 반드시 도메인 명사로 교체한다. (도메인 코드 VALUE 리터럴은 예외 — 그건 보존.)
    - ★ 괄호 병기도 금지: 도메인 용어 **뒤에 변수명을 괄호로 다는 것**도 베끼기다.
      ❌ "적용여부(gc_xxx_yn)" → ✅ "적용여부"  /  ❌ "계좌번호(acnt_num)" → ✅ "계좌번호".
    - ★★ 작성 절차(이걸 지키면 누출 0): given/when/then 을 적기 **전에**, 본문에 등장하는
      변수·필드·메서드명을 **하나도 빠짐없이 훑어** 각각의 도메인 의미를 먼저 정한다
      (예: 어떤 플래그 변수 → 'OO 여부', 어떤 조회메서드 → 'OO 조회'). 그 매핑을 끝낸 뒤
      given/when/then 에는 **정한 도메인 의미만** 쓴다 — 원래 변수·메서드 이름은 **단 한 번도**
      등장하지 않게 한다. (도메인 코드 VALUE 리터럴만 예외로 그대로 보존.)

  ## 1.6 ★ 출력 폭주 = 실제 사고 (★최강조)
  과거 examples 가 길어져 토큰이 반복 루프에 갇혀 수만~십수만 자로 무한 폭주한 사고가 있었다.
  - 어떤 string 도 공백·줄바꿈만으로 끝낼 수 없다. `"key":` 뒤 즉시 값, `}`/`]` 즉시 닫는다.
  - 콜론 뒤 공백을 무한히 늘리는 것 = 폭주(절대 금지).
  - 폭주를 막는 정공법은 **2.5(분리 기준)·3.2(세 축)** 다 — 무작정 자르는 게 아니라 가치로 거른다.

  # ════════════════════════════════════════════════════════════════
  # [1] rules — 비즈니스 규칙 (★ 진짜 도메인 가치만, 단 빠짐없이)
  # ════════════════════════════════════════════════════════════════

  ## 2.1 가치 결정 트리 (단일 입구)
  ```
  이 조건/분기를 제거하면 사용자(고객·정산·감사) 결과가 달라지는가?
     → YES = Rule O (도메인 가치)
     → NO  = 폐기 (기술 관심사)
  ```
  - 통과(적격, 범용 예): 도메인 임계값·정책값(한도 이상이면 거절 등) / 역할·상태·유형에 따른 차등 /
    엔티티·코드값에 따른 처리 분기 / 도메인 계산식 / 비즈니스 예외 발생(정책 위반 → 오류).
  - FAIL(부적격): DI·콜백·로깅 / DTO 변환·트랜잭션 / 순수 기술 NULL 방어 / 표준 래퍼.

  ## 2.2 NULL 구분 (같은 NULL 체크도 의미가 다르다)
  - O(도메인): 필수 도메인 식별자 NULL → 거절 / NULL → 도메인 기본값 매핑 / 조건부 필수
    (특정 유형일 때만 어떤 값이 필수).
  - X(기술): 내부 헬퍼 인자 null 체크 / 프레임워크 경계 방어.
  - 함수명이 검증·체크 패턴이면 도메인 정책 가능성↑(단 결정 질문은 동일하게 적용).

  ## 2.3 ★ 검증 전용 함수 — 의미 다발은 1 Rule + 필드별 Example
  함수 전체가 입력 검증이고 NULL/범위 체크가 10+ 개여도, **같은 의미**의 다발은 한 Rule 로 묶고
  **필드마다 example** 로 편다:
  - Rule1 "필수 식별자 누락 시 거절" + (필드 A 누락→거절 / 필드 B 누락→거절 …) example
  - Rule2 "조건부 필수" / Rule3 "NULL → 기본값 매핑"
  - 단, 검증 안에 **서로 다른 정책**(예: 유형별로 다른 기본값)이 있으면 그건 2.5에 따라 분리하거나
    한 example 에 값별 대응을 명시(3.4)한다.

  ## 2.4 Rule 필드 4개
  - `rule_id` "R1"/"R2"…
  - `statement` "<조건>이면 <결과>" — 간결하되 의미가 살게. 코드 식별자(변수·메서드명)는 박지 말되,
    **도메인 코드값 리터럴은 본문에 있으면 보존**(1.5). 너무 길면 값 나열은 example 로 옮긴다.
  - `flow_id` "1"/"2"(메인 순서=NEXT) "1-1"(분기=BRANCH) "1-1-1"(중첩).
  - `coupled_domains` `[]` 기본. 타 도메인 테이블 WRITE·값분기·계산이 있을 때만 도메인명 추가.

  ## 2.5 ★★ 통합 vs 분리 — 개수의 진짜 기준 (충돌 해소 핵심)
  - **통합(1 Rule)**: 조건의 **의미가 같고 입력 값만 다른** 경우. (값 차이는 example 로.)
  - **분리(별도 Rule)**: 조건의 **의미·결과가 다른** 경우. 합치면 누락이다.
  - **개수 상한은 "가치"로만 정해진다 — 진짜로 다른 결정이 8개면 Rule 8개가 정답이다.**
    인위적으로 3~4개로 압축하지 마라(압축 = 누락). 반대로 같은 의미를 값별로 쪼개 부풀린 건 통합.
  - 자가 점검: "이 두 Rule 을 합치면, 전환된 코드가 둘 중 하나의 동작을 잃는가?" → 잃으면 분리 유지.
  - 범용 예:
    - 통합 O: "결제수단 값마다(A·B·C) 같은 방식으로 한도 검증" → Rule 1 + example 에 값들.
    - 분리 O: "상태가 X면 환불 / 상태가 Y면 취소 / 상태가 Z면 보류" → 결과가 다르므로 Rule 3개
      (혹은 1 Rule + 값→결과 대응을 example 에 모두 명시, 3.4).

  ## 2.6 안티패턴 (★금지)
  - a. 기술 관심사 → Rule(트랜잭션·변환·로깅) = 환각.
  - b. 값별 과세분화로 Rule 부풀리기(폭주 원인) → 같은 의미면 example 로.
  - c. 분기 난사(가장 흔한 사고) → 가치 결정 통과만.
  - d. 자식 Rule 을 부모로 끌어올림 → 부모는 자기 본문 분기만(하위 호출 함수의 규칙은 그 함수 몫).
  - e. 종료 경로 누락 → "조회 후 반환"만 쓰고 "없으면 로그·에러 없이 통과(silent pass)"를 빠뜨리지 마라.
       silent pass 도 도메인 정책이면 명시한다.

  # ════════════════════════════════════════════════════════════════
  # [2] examples — given/when/then (★ 세 축을 분리해서 본다)
  # ════════════════════════════════════════════════════════════════

  ## 3.1 Example 필드 6개
  - `rule_id` 참조 / `description` 한 줄 요약
  - `given` 진입 조건(핵심 키 3~5개 위주, 자연어 한 줄) / `when` 트리거(자연어 한 줄, 메서드·클래스명 X)
  - `then` 결과(반환·예외·전역·OUT 변화를 자연어로 결합)
  - `affected_tables` `[{ table, op }]` — **이 함수가 직접 R/W 하는 테이블만**(reads/writes 내),
    없으면 `[]`. ★ callee(하위호출)는 테이블이 아니다 — 하위호출이 건드리는 테이블은 그 함수 몫.

  ## 3.2 ★★ 세 축을 분리하라 — 이게 이 분할의 가장 중요한 규칙
  example 을 만들 때 헷갈리는 세 가지를 분리한다. 셋은 서로 다른 축이며 서로 충돌하지 않는다.
  - **축1 — example "행(row) 개수"**: 같은 결과를 내는 입력 변주를 여러 행으로 만들지 마라.
    대표 1~2행으로 충분(happy path 1 + 예외 1). ← 폭주 방지는 여기서만.
  - **축2 — given 안의 "값 집합"**: 동작이 어떤 코드값 집합에 의존하면, 그 집합의 **모든 값을
    한 행의 given 에 다 나열**한다. ← 집합은 절대 줄이지 않는다(3.3).
  - **축3 — "값 → 결과 대응"**: 값마다 결과가 **다르면**, (값→결과) 대응을 **각각 명확히** 둔다.
    여러 값을 한 덩어리로 묶고 then 에 "각각 A 또는 B" 라고 뭉뚱그리면 = 대응 상실 = 재생성 불가(3.4).
  - 한 줄 요약: **행 수는 줄이되(축1), 값 집합은 다 담고(축2), 값↔결과 대응은 깨지 마라(축3).**

  ## 3.3 ★ 코드값 집합 완전성 (누락 직접 원인 ①)
  동작이 "코드/식별자가 어떤 집합에 속하면 처리"인 분기를 가지면, 그 집합의 **모든 값을 본문에서
  빠짐없이** 추출해 한 example 의 given 에 나열한다.
  - 값 하나만 예시로 남기고 나머지를 버리면 전환 시 동작이 달라진다 = 누락.
  - 채널·구분·유형별로 집합이 **다르면** 집합마다 example 1개씩(이건 축1의 "변주"가 아니라 서로
    다른 도메인 케이스다).
  - 범용 예:
    - 나쁨: 본문이 "상태가 [s1,s2,s3,s4,s5] 중 하나면 정상"인데 example given 에 "상태=s1"만.
    - 좋음: given "상태 ∈ [s1, s2, s3, s4, s5]" then "정상 처리".

  ## 3.4 ★ 값 → 결과 매핑 보존 (누락 직접 원인 ②)
  값들이 **서로 다른 결과**로 가면, 묶지 말고 대응을 명시한다.
  - 범용 예:
    - 나쁨: given "거래유형 ∈ [t1, t2, t3, t4]" then "각각 채널 A 또는 B로 매핑"
      → 어느 유형이 A고 어느 게 B인지 사라짐 = 재생성 불가.
    - 좋음: 같은 결과끼리 묶어 행을 나눈다 —
      given "거래유형 ∈ [t1, t2] (같은 결과)" then "채널 A로 매핑" /
      given "거래유형 ∈ [t3, t4]" then "채널 B로 매핑".
    - 또는 then 에 대응을 그대로: "t1→A, t2→A, t3→B, t4→B" (대응이 보존되면 형식은 자유).
  - 핵심: **"어떤 값이 어떤 결과로 가는지"가 example 만 보고 복원 가능**해야 한다.

  ## 3.5 ★ 깊은 중첩 안의 집합·결정도 빠짐없이
  코드값 집합·결정이 여러 겹 조건(바깥 분기 안의 안쪽 분기) 깊숙이 있어도 **추출 대상**이다.
  복잡해 보인다고 바깥 한 줄("구분에 따라 처리")로 뭉개지 마라 — 안쪽의 실제 값 집합과
  값→결과 대응까지 내려가서 담는다. (이게 가장 복잡한 함수에서 누락이 나는 지점이다.)
  너무 복잡해 도저히 한 함수에 담기 어렵다고 판단되면, 임의로 버리지 말고 4단원의 question 으로
  "이 분기 집합은 분해·재검 필요"를 표면화한다.

  ## 3.6 ★★ 개수·폭주 (축1 전용 — 코드집합과 혼동 금지)
  - 한 Rule 의 example 행은 happy path 1 + (예외 throw 시) 예외 1 이 기본. 그 외 **단순 입력 변주는
    행을 늘리지 말고** description 한 줄에 통합한다.
  - 단 이 "1~2행" 제한은 **축1(같은 결과 변주)에만** 적용된다. 축2(값 집합)·축3(값→결과 대응)·
    서로 다른 도메인 케이스는 여기 해당 없음 — 빠짐없이 담는다.
  - 안티패턴: 입력 조합을 곱집합으로 다 채우기(폭주) / 같은 결과를 값만 바꿔 반복 / 모든 파라미터를
    given 에 채우기(본질 키 3~5개만) / 공백·인덴트만 출력(폭주).

  # ════════════════════════════════════════════════════════════════
  # [3] questions — ★★ 0 = 최고의 답 (★★최강조)
  # ════════════════════════════════════════════════════════════════

  ## 4.1 의미
  Question = "코드·callee_summary·codebase_notes·referenced_symbols 어디에도 답이 없고 + Rule/Example
  정확성에 직접 영향"을 **모두** 만족하는 진짜 모호점만. 본문에 답이 있는데 안전망으로 묻는 건 환각이다.
  ## 4.2 필드 2개: `text` 한 줄 질문 / `reason` 코드 근거 부재 사유.
  ## 4.3 강제 조건 (4가지 모두 만족해야 출력)
  ① 본문에 명확한 모호 단서(의미 모를 코드값·매핑 없는 상수·정의 없는 외부 호출)
  ② 코드·callee_summary·codebase_notes·referenced_symbols 어디에도 답 없음
  ③ 이 함수 Rule/Example 정확성에 직접 영향 ④ 다른 Question 과 의미 중복 없음.
  ## 4.4 금지: 답이 본문에 있는 질문(가장 흔한 환각) / 단순 호기심·일반 질문 / 외부 시스템 일반질문 /
    분석 영향 없는 질문.
  ## 4.5 ★★ 개수: 0 = 최고(빈 배열 통과가 가장 좋은 결과). 억지 추출 = hang 원인. 4 조건 못 채우면
    그 자리에서 폐기(보수적). 같은 코드값에 대한 Question 은 1개로 통합.
  ## 4.6 예외 — 복잡함수 분해 권고: 본문이 너무 복잡해 도메인 결정을 한 함수에 다 담기 어려우면(3.5),
    임의 누락 대신 "이 함수의 OO 분기 집합은 분해·재검 필요"를 question 으로 1개 남긴다.

