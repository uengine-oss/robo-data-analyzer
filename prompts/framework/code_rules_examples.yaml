## code_rules_examples — 분할 3: 비즈니스 규칙 + Example Mapping + Questions
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실.
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 3: 비즈니스 규칙·시나리오·질문 추출
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드

  - **이 분할이 하는 일**: `rules` (비즈니스 규칙) + `examples` (given/when/then 시나리오)
    + `questions` (모호점 검토 큐) 3 배열.
  - **이 분할이 안 하는 일**: 함수 의미·역할(→분할 1) / 컬럼 의미(→분할 2)
  - **출력 미리보기** (type + 값 예시):
    ```
    RulesExamplesOutput {
      rules: [
        {
          rule_id: "R1",                            // string
          statement: "<조건>이면 <결과>",            // string 10~30자
          flow_id: "1" | "1-1" | "1-1-1",          // string — NEXT/BRANCH 엣지 자동
          coupled_domains: ["payment", "..."]       // list[string]
        }
      ],
      examples: [
        {
          rule_id: "R1",                            // string
          description: "한 줄 요약",                 // string
          given: "iFlag=0, 오류코드=X001",           // ★ string 자연어 (공백·빈 영역 X)
          when:  "오류 메시지 조회",                  // ★ string 한 줄
          then:  "정상 RC_NRM 반환 / NotFound 면 RC_NFD", // ★ string 자연어 (공백·빈 영역 X)
          affected_tables: [
            { table: "...", op: "READ"|"INSERT"|"UPDATE"|"DELETE"|"MERGE" }
          ]
        }
      ],
      questions: [
        { text: "string 한 줄 질문", reason: "string — 코드 근거 부재 사유" }
      ]
    }
    ```

  ---

  ## 0. 추출 절대 원칙 — 모든 영역 공통 강조

  rules / examples / questions 3 영역 모두에 적용되는 절대 원칙. 각 영역의 디테일
  (1.x / 2.x / 3.x) 보다 우선 작용한다. 위반 시 환각·폭주 사고 직결.

  ### 0.1 ★ 분기 난사 절대 금지

  본문의 if / else / switch / 조건 마다 Rule 만들기 = 분기 난사 = 최악 안티패턴.
  본문 분기 12 개여도 비즈니스 의미는 보통 1~3 가지로 수렴한다.

  ### 0.2 ★ 막무가내 채우기 = 환각 사고의 시작점

  "다 채워야 한다" 충동 = 환각. 본문에서 가치 못 찾으면 빈 배열.
  rules 0 / examples 0 / questions 0 = 정상 결과.

  ### 0.3 ★ 한도 초과 = 누락 아니라 위반

  가치 결정 질문 (1.1) 통과 못 한 것 출력 = 사고. Pydantic max_length 와 무관 —
  **가치 자체로 한도**. 통과한 것만, 통과 안 한 것은 한 개도 출력 X.

  ### 0.4 ★ 최대치 X / 빈 배열 = 정상

  examples 도 모든 분기 조합 채우려 X.
  단순 위임 / wrapper / 단건 SELECT: `rules: []` + `examples: []` 정답.
  자기 본문에 비즈니스 로직 0 이면 빈 배열이 정답.

  ### 0.5 ★ 출력 양식 충돌 = 실제 폭주 직접 원인 (★ 가장 강조)

  과거 examples 길이 길어지면 토큰 패턴 반복 루프에 갇혀 **17만 자 / 10만 자
  무한 폭주 사고** 발생. 신 schema 의 자연어 평면도 길게 만들면 같은 path 가능.

  ★ examples 짧게 끝내는 것 = 최우선:
  - rule 당 examples 1~2 개
  - given / then = 자연어 한 줄 (모든 분기 조합 X)
  - 빈 영역은 빈 list `[]` 또는 `null`

  ### 0.6 ★ 공백·인덴트로 끝낼 수 없음 (★ 절대 금지)

  - 어떤 string 필드도 빈 값·공백·줄바꿈만으로 끝낼 수 없음. 항상 의미 있는 한 줄.
  - `"key":` 적었으면 즉시 값 토큰 (`"문자열"`) 작성. 콜론 뒤 공백 무한 출력 X.
  - JSON 닫는 `}` / `]` 즉시 작성. 다음 토큰 망설여 공백 늘이기 X.

  ---

  ## [1] rules — 비즈니스 규칙 (★ 진짜 비즈니스 가치만)

  ### 1.1 가치 결정 트리 — 단일 입구 (모든 후보·NULL·검증 통합)

  본문의 분기·조건·NULL 체크·검증 절은 **이 질문 하나로 결판**:

  ```
  이 조건을 제거하면 사용자(고객 / 정산 / 감사) 결과가 달라지는가?
    → YES → Rule O (도메인 가치 있음)
    → NO  → Rule X (단순 기술 분기 — 폐기)
  ```

  **질문 통과 후보** (Rule 적격):

  - 도메인 임계값·정책값 (₩50,000 이상 할인 / 한도 초과 거절 / 마감일 이전만 등록)
  - 역할·상태·유형 차등 (관리자만 / 'PAID' 상태에서만 환불 / VIP 만 무료배송)
  - 엔티티·컬럼 값 분기 (결제수단 'CARD' vs 'BANK' / 처리구분 '01' vs '02')
  - 도메인 계산식 (수수료 = 금액 × 0.03, 최소 1000)
  - 정책 상수·비즈니스 예외 throw (재고 부족 → 'INSUFFICIENT_STOCK')

  **질문 FAIL = Rule 절대 X** (Rule 부적격):

  - DI / 프레임워크 콜백 / 로깅 / 메트릭 / DTO↔Entity 변환 / 트랜잭션 / 캐시 / 재시도
  - 순수 기술 예외 (NPE / 타입 캐스팅 / OOM)
  - 순수 방어 null / empty (내부 헬퍼 인자 null 체크 / `requireNonNull`)
  - 컨벤션 반복 관용구 (회사 wrapper 매크로 표준 에러 처리)

  ### 1.2 NULL 구분 — 결정 질문 적용

  같은 NULL 체크라도 영역별 다름:

  - ✓ **O Rule (도메인 검증)**:
    - 필수 도메인 식별자 NULL → 거절 ("청구번호 누락이면 RC_ERR")
    - NULL → 기본값 매핑 ("응답코드 NULL 이면 'X' 기본값")
    - 조건부 필수 ("간편결제 시 고객번호 누락이면 거절")
  - ✗ **X Rule (기술 방어)**:
    - 내부 헬퍼 인자 null 체크
    - 프레임워크 경계 방어 (`requireNonNull`)

  함수명이 `*_validation` / `*_check` / `input_validation` 패턴이면 도메인 정책
  가능성 ↑ (단 결정 질문은 동일하게 적용).

  ### 1.3 ★ 검증 전용 함수 정책 — Rule 1~3 수렴 (★ 가장 중요)

  함수 전체가 검증이면 (`*_validation` / `*_check` / `*_verify` / `*_input_validation`)
  본문 NULL/0 체크 10+ 개여도 — 같은 의미 다발은 **1 Rule + 필드마다 Example** 로
  수렴한다:

  - **Rule 1** — 필수 도메인 식별자 누락 거절 (청구번호·계좌번호·업무구분 등)
  - **Rule 2** — 조건부 필수 (특정 거래·기관·결제수단일 때만 부가 정보 필수)
  - **Rule 3** — 기본값 매핑 (NULL → 도메인 기본값)

  필드별 시나리오는 각 Rule 의 Example 에 분리:
  - 필드 A NULL → 거절 (Example 1)
  - 필드 B NULL → 거절 (Example 2)
  - 필드 C NULL → 거절 (Example 3)

  - ★ **Rule 4 개 넘으면 의미 합성 사고** — 통합 재검토 (값별·필드별 Rule 분리 = 안티패턴).
  - ★ 본문 12+ 분기여도 비즈니스 의미는 보통 1~3 가지 수렴.
  - ★ 본문이 단순 NULL 체크 + 즉시 거절만이면 **Rule 1 개로 충분**.

  ### 1.4 Rule 필드 4 개

  - `rule_id` — "R1", "R2", ... (단일 식별).
  - `statement` — `"<조건>이면 <결과>"` 10~30자.
    코드 식별자 박지 마 (메서드명·변수명·DBIO 식별자 등 — [[_common]] 단계 1 참조).
    엔티티 필드명·도메인 코드값 리터럴은 보존 OK ('CARD' / 'PAID' / ...).
  - `flow_id` — 제어 흐름 위치:
    - `"1"` / `"2"` / `"3"` — 메인 흐름 순서 (NEXT 엣지 자동 도출)
    - `"1-1"` — R1 의 분기 (BRANCH 엣지 자동 도출)
    - `"1-1-1"` — 중첩 분기
  - `coupled_domains` — `[]` 기본. 타 도메인 테이블 WRITE·값 분기·계산 시 도메인명 추가.
    단순 코드 lookup / 로깅 read 는 추가 X.

  ### 1.5 rules 영역 한정 정책

  **(a) 개수 한도 — 가치 자체로 한도 (인위적 상·하한 X)**:
  - 본문 분기 12 개여도 Rule 8 개 넘으면 의미 합성 사고 신호
  - Rule 8 개 넘는 함수 = **분해 권고 question 으로 표면화** (인위적 압축 X)

  **(b) 값별 통합 — Rule N → 1 + Example N** (★ 폭주 직접 원인 차단):
  - 결제수단 5 값마다 Rule 5 X / Rule 1 + Example 5 O
  - 응답코드 10 코드마다 Rule 10 X / Rule 1 + Example 10 O

  **(c) 종료 경로 빠짐 X** ([[_common]] 단계 5 참조):
  - silent pass 분기 = 도메인 정책 (반드시 명시)
  - 에러 분기에 비즈니스 의미 있으면 별도 Rule (단순 기술 에러 X)
  - 조기 return / break / continue 분기

  ### 1.6 rules 영역 한정 안티패턴 (★ 절대 금지)

  **a. 기술 관심사 → Rule** (★ 환각)
  - X: Rule "트랜잭션 commit 실행" / "DTO 를 Entity 로 변환"
    O: Rule X (기술 메커니즘·어댑터)

  **b. 값별 과한 세분화** (★ 폭주 직접 원인)
  - X: 결제수단 5 값마다 Rule 5 ("CARD 이면 ..." / "BANK 이면 ..." ...)
    O: Rule 1 "결제수단별 한도 검증" + Example 5 (값마다 시나리오)
  - X: NULL 체크 12 필드마다 Rule 12 ("청구번호 NULL → 거절" / "계좌번호 NULL → 거절" / ...)
    O: Rule 1 "필수 도메인 식별자 누락 → 거절" + Example 12 (필드마다)

  **c. 분기 난사** (★ 가장 흔한 사고)
  - X: 본문 if/else/switch 매 갈래마다 Rule 1개씩 → Rule 12 개
    O: 가치 결정 질문 (1.1) 통과만 — 보통 1~3 개

  **d. 자식 Rule 부모로 끌어올림** ([[_common]] 단계 4 참조 — 절대 금지)
  - X: callee 가 입력검증 Rule 8 개 → 부모도 그 8 개를 자기 Rule 로 출력
    O: Rule 1 "입력 검증 위임 (실패 시 RC_ERR 반환)" — 자기 본문 분기만

  **e. 분기 누락 — silent pass 미명시** ([[_common]] 단계 5 참조)
  - X: Rule "조회 후 결과 반환" 만 (NotFound silent pass 누락)
    O: Rule 2 — 1) "조회 결과 있으면 반환" 2) "NotFound 면 로그·에러 없이 통과"

  ---

  ## [2] examples — given/when/then 시나리오 (★ rule 당 1~2 개)

  ### 2.1 Example 필드 6 개

  - `rule_id` — 참조 Rule id.
  - `description` — 시나리오 사람용 한 줄 요약 (이 한 줄이 narrative 단일 진실).
  - `given` — **자연어 한 줄** (진입 조건).
    예: "결제수단=05, 고객번호=null" / "iFlag=0, 오류코드=X001"
    핵심 입력 3-5 개 정도 콤마 결합. 모든 파라미터 채우려 X.
  - `when` — **자연어 한 줄** (자극·트리거).
    예: "결제 요청" / "출금 요청" / "오류 메시지 조회"
    메서드명·클래스명 X.
  - `then` — **자연어 한 줄** (관찰 결과).
    예: "OVER_LIMIT 거절" / "정상 RC_NRM 반환, transaction_history INSERT"
    반환·예외·전역·OUT 변화를 자연어로 결합. 보통 1~2 가지.
  - `affected_tables` — `[{{ "table": "...", "op": "READ|INSERT|UPDATE|DELETE|MERGE" }}]`.
    **이 함수가 직접 R/W 하는 테이블만** (= reads/writes 에 있는 테이블). 없으면 `[]`.
    ★ **callee(하위호출 함수)는 테이블이 아니다** — callee 이름(예: `*_dbio_*`, `*_call_*_proc`)을
    table 로 절대 쓰지 X. callee 가 건드리는 테이블은 그 callee 자기 분석 몫. 이 함수가 직접
    R/W 안 하면 `affected_tables: []`.

  ### 2.2 ★★ 개수 정책 — rule 당 1~2 (★ 폭주 차단 핵심)

  **★ 1 Rule 당 examples 1~2 개로 충분**. 최대치 X. 모든 분기 조합 채우려 X.

  - **happy path 1 개** — 정상 경로 (가장 흔한 시나리오).
  - **예외 1 개** (Rule 이 예외 throw 일 때만) — 실패 분기.
  - **★ 그 외 변주 X** — "다른 입력값" 미세 변주는 1 개로 통합:
    - description 한 줄에 "X 값 5종 모두 거절" 처럼 통합 표현
  - **0 정답 가능** — Rule 0 이면 examples 0.

  ### 2.3 examples 영역 한정 디테일 — 짧게 끝내기

  **0.5 / 0.6 의 examples 적용**:
  - `given` = 시나리오 본질 키 3-5 개 이내. 함수의 모든 파라미터 채우려 X.
  - `when` = 한 줄.
  - `then` = 1~2 가지 결과 자연어 결합.
  - `affected_tables` = 본문 R/W 와 일관. 가짜 테이블 X.

  ### 2.4 examples 영역 한정 안티패턴 — 실제 폭주 사례 (★ 못 박기)

  **a. 분기 조합 다 채우기** (★ 실 사고 — 17만 자 폭주)
  - X: 검증 함수에서 "결제수단 5 종 × 고객번호 유무 × 해외카드 여부" 조합 매 케이스
    → 같은 패턴 무한 반복 → 폭주
    O: example 1~2 ("필수 필드 누락 시 거절" 한 케이스로 통합)

  **b. 같은 시나리오 변주**
  - X: "결제수단 CARD 정상" / "결제수단 BANK 정상" / "결제수단 POINT 정상" 3 개
    O: 1 개 ("결제수단 모든 값 정상 처리" 통합)

  **c. inputs 모든 파라미터 채우기**
  - X: 함수 파라미터 20 개 모두 example.given 에 채움 → 토큰 폭증
    O: 시나리오 본질 3-5 개 키만

  **d. 공백·인덴트만 출력** (★ 실 사고 — 10만 자 공백 폭주)
  - X: `"given":` 적고 값 토큰 망설여 공백·줄바꿈만 무한 출력
    O: `"given": "iFlag=0, 오류코드=X001"` 즉시 의미 있는 한 줄 작성

  ---

  ## [3] questions — ★★ 0 이 가장 좋은 답 (★ 가장 강조)

  ### 3.1 의미 — 컨텍스트만으로 알 수 없는 것만

  Question 의 본질 = **"코드·callee_summary·codebase_notes·referenced_symbols
  어디에도 답 없음"** + **"분석 결과 (Rule / Example) 정확성에 직접 영향"** 모두 만족.

  ★ **사실 추측 X** — 본문에 답 있는데 안전망으로 묻는 건 환각.

  ### 3.2 Question 필드 2 개

  - `text` — 한 줄 질문.
    예: "REQUEST_CHANNEL 컬럼의 'M'·'W'·'A' 코드값 의미는?"
  - `reason` — 코드 근거 없는 이유.
    예: "본문에 리터럴은 박혀있으나 매핑 주석·상수 정의 없음"

  ### 3.3 강제 조건 — 4 가지 **모두** 만족해야 출력 (★ 환각 차단)

  하나라도 만족 못 하면 출력 금지:

  1. **본문에 명확한 모호 단서** — 의미 알 수 없는 코드값 리터럴 / 매핑 없는 상수 /
     정의 없는 외부 호출
  2. **코드 / callee_summary / codebase_notes / referenced_symbols 어디에도 답 없음**
  3. **이 함수의 Rule / Example 정확성에 직접 영향** — 도메인 의미 / 시나리오 정확성에
     미치는 영향이 명확
  4. **다른 Question 과 의미 중복 없음** — 한 모호점 = 1 Question

  ### 3.4 Question 금지 패턴 — 절대 출력 X

  - **답이 본문에 있는 질문** — 환각 (가장 흔한 사고). 코드에 사실 있으면 그게 답.
  - **단순 호기심·일반 질문** — "이 함수는 왜 만들어졌나요?" / "이 컬럼 옆 컬럼 의미?"
    → 분석 영향 0.
  - **외부 시스템 일반 질문** — "PG 사가 어떻게 응답하나요?" → 본문 분석 범위 밖.
  - **분석 결과 영향 없는 질문** — Rule / Example 어느 것에도 영향 없으면 X.

  ### 3.5 ★★ 개수 정책 — 0 = 최고의 답 (★★ 가장 강조)

  - **★★ 0 = 최고의 답** — 의심 0 = 분석 완성도 ★. **빈 배열 통과는 정상 결과**
    (가장 좋은 결과).
  - **★★ 억지 추출 = 환각 사고** — "혹시 모를 안전망" 으로 1~2 개 출력 = hang 의 원인.
  - **★ 4 조건 (3.3) 못 채우면 그 자리에서 폐기** — 약간이라도 의심 있으면 폐기.
    보수적으로.
  - **인위적 상·하한 X** — 진짜 모호점만.
  - **중복 거부** — 같은 코드값에 대한 Question 1 개로 통합 (값마다 쪼개기 X).
  - 너무 많아지면 함수 분해 또는 도메인 컨텍스트 부족 신호 — 우선순위 진짜 모호점만
    1~2 개.

  ### 3.6 좋은 예 (3 도메인) + 안티패턴

  **좋은 예**:

  - 결제: "RESPONSE_CODE 의 '0000' / '0001' / '0099' 외 코드값의 의미와 처리 방침은?"
    reason: "본문에 '0000' / '0001' 만 분기됨. 마스터 SELECT·주석·상수 정의 없음"
  - 회원: "MEMBER_GRADE 의 'VIP' / 'GOLD' / 'SILVER' / 'BRONZE' 별 정책 차등 기준은?"
    reason: "본문은 등급 컬럼만 갱신. 등급별 행동 차이는 다른 함수 책임이지만 도메인 정의 자료 부재"
  - 정산: "SETTLE_DATE 가 NULL 일 때 미정산 의미인지, 마감 후 확정 의미인지?"
    reason: "본문은 NULL 체크 후 다른 분기. 두 의미 모두 가능하며 codebase_notes 무관"

  **안티패턴/정답 쌍**:

  - X: "이 함수가 왜 호출되는가?" (분석 영향 X — 호기심 질문)
    O: Question 출력 X
  - X: 같은 상태값 Question 3 개 ("STATUS 의 'A' 의미?", "'B' 의미?", "'C' 의미?")
    O: Question 1 개 ("STATUS 의 'A' / 'B' / 'C' 각각의 비즈니스 상태 의미는?")
  - X: 본문에 명시된 사실을 Question ("결제수단 'CARD' / 'BANK' 의미는?" — 본문 분기 명시)
    O: Question X (본문에 답 있음)

