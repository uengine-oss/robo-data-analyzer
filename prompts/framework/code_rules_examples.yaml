## code_rules_examples — 분할 3: 비즈니스 규칙 + Example Mapping + Questions
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실 (extends).
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 3: 비즈니스 규칙·시나리오·질문 추출
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임
  - `rules`(비즈니스 규칙, 각 규칙 하위에 `examples` given/when/then 중첩) + `questions`(모호점) 를 만든다.
    함수 의미·역할(분할1)·컬럼 의미(분할2)는 손대지 않는다.
  - 출력 스키마:
    ```
    RulesExamplesOutput {
      rules:[ { statement:"<조건>이면 <결과>", coupled_domains:["..."],
                examples:[ { given:"...", when:"...", then:"...",
                             affected_tables:[ { table:"...", op:"READ"|"INSERT"|"UPDATE"|"DELETE"|"MERGE" } ] } ] } ],
      questions:[ { text:"한 줄 질문", reason:"코드 근거 부재 사유" } ] }
    ```
  - **아래 모든 예시는 범용 설명용**(패턴만) — 산출물엔 **네가 분석하는 그 함수 본문에 실제 등장한 값만** 써라.

  # ════════════════════════════════════════════════════════════════
  # 1. 목적·품질기준 (모든 판단의 기준)
  # ════════════════════════════════════════════════════════════════
  - `rules`+`examples` = 이 함수의 **도메인 의도 명세**. 궁극 목표: **이것만 보고 코드를 다시 만들면
    원문과 똑같이 동작**. 품질 기준 단 하나 = "도메인 의도를 빠짐없이·정확히 담았나."
  - 두 축(충돌 아님, 경계는 오직 "가치"):
    - **(A) 완전성**: 동작에 영향 주는 도메인 결정·코드값은 하나도 빠뜨리지 않는다(값은 본문 그대로).
    - **(B) 무폭주**: 가치 없는 노이즈·중복·"입력조합 다 채우는 변주"는 0.
  - **흔한 오해 3 (누락·노이즈 원인)**:
    - ❌"간결=코드값 집합을 줄인다" → 줄이는 건 '입력조합 변주'뿐. **코드값 집합은 절대 안 줄인다(다 나열)**.
    - ❌"통합=다른 결정도 한 룰로" → **같은 의미** 다발만 합친다. 서로 다른 결정 합치면 누락.
    - ❌"이 함수는 래퍼/IO니까 전부 빈 배열" → 판단 단위는 함수가 아니라 **가지(branch)**. 기술+도메인 섞이면 도메인 가지는 살린다.
  - **출력 폭주 금지**: 어떤 string 도 공백·줄바꿈만으로 끝낼 수 없다. `"key":` 뒤 즉시 값, `}`/`]` 즉시 닫는다.

  # ════════════════════════════════════════════════════════════════
  # 2. 무엇을 Rule 로 뽑나 — 가치 판단
  # ════════════════════════════════════════════════════════════════
  ## 2.1 가치 결정 트리 (단일 입구) — 가지(branch)마다 따로 묻는다
  ```
  이 조건/분기를 제거하면 사용자(고객·정산·감사) 결과가 달라지는가?
     → YES = Rule O (도메인 가치)   → NO = 폐기 (기술 관심사)
  ```
  - 통과: 도메인 임계값·정책값(한도 이상이면 거절) / 역할·상태·유형별 차등 / 코드값 처리 분기 / 도메인 계산식 / 비즈니스 예외(정책 위반→오류).
  - **폐기(기술 관심사 = Rule 로 만들면 환각)**: DI·콜백·로깅·메트릭 / DTO↔Entity 변환 / 트랜잭션·캐시·재시도 / 표준 래퍼 호출 /
    순수 기술 예외(NPE·캐스팅) / 순수 방어 null·empty 체크 / "오류면 에러 반환"·"호출 실패면 에러 반환".
  - 함수 전체가 이런 것뿐(+표준 에러처리)이면 `rules:[]`+`examples:[]` 가 정답. 억지로 채우지 마라. 단 도메인 가지가 하나라도 있으면 그건 살린다.

  ## 2.2 NULL 은 의미로 구분
  - O(도메인): 필수 도메인 식별자 NULL→거절 / NULL→도메인 기본값 매핑 / 조건부 필수(특정 유형일 때만 필수).
  - X(기술): 내부 헬퍼 인자 null 체크 / 프레임워크 경계 방어.

  ## 2.3 검증 전용 함수 — 의미 다발은 1 Rule + 필드별 example
  검증이 10+ 개여도 **같은 의미** 다발은 한 Rule + 필드마다 example:
  - Rule "필수 식별자 누락 시 거절" + example(필드 A 누락→거절 / 필드 B 누락→거절 …). 조건부 필수는 별 example(유형=T1 且 필드X 누락→거절).
  - 검증 안에 **서로 다른 정책**(유형별 다른 기본값)이 있으면 2.4 분리 또는 example 에 값별 대응 명시(§3).

  ## 2.4 통합 vs 분리 = 규칙 개수의 유일한 기준
  - **통합(1 Rule)**: 조건 **의미가 같고 값만 다름** → 값 차이는 example 로.
  - **분리(별도 Rule)**: 조건 **의미·결과가 다름** → 합치면 누락.
  - 개수 상한은 "가치"만이 정한다. 진짜 다른 결정이 8개면 Rule 8개(인위 압축=누락 / 같은 의미 값별 쪼개기=폭주).
  - 자가점검: "두 Rule 합치면 전환 코드가 둘 중 하나 동작을 잃나?" → 잃으면 분리.
  - 예: 통합 "결제수단 A·B·C 모두 같은 방식 한도검증"→Rule1+example값들 / 분리 "상태 X→환불 / Y→취소 / Z→보류"→Rule 3개.

  ## 2.5 종료 경로 누락 금지 (silent pass 포함)
  "조회 후 반환"만 쓰고 "대상 없으면 로그·에러 없이 통과(silent pass)"를 빠뜨리지 마라. silent pass 도 도메인 정책이면 명시.

  ## 2.6 Rule 필드
  - `statement` "<조건>이면 <결과>" — 코드 식별자 박지 말되 도메인 코드값 리터럴은 보존(§6).
  - `coupled_domains` `[]` 기본 — 타 도메인 테이블 WRITE·값분기·계산 있을 때만 도메인명 추가.
  - `examples` 이 규칙의 given/when/then(하위 중첩).

  # ════════════════════════════════════════════════════════════════
  # 3. examples — 세 축을 분리하라 (이 분할의 핵심)
  # ════════════════════════════════════════════════════════════════
  세 축은 서로 다르고 충돌하지 않는다: **행 수는 줄이되(축1), 값 집합은 다 담고(축2), 값↔결과 대응은 깨지 마라(축3).**
  - **축1 (example 행 수)**: 같은 결과 입력 변주를 여러 행으로 만들지 마라. happy path 1 + (예외 시)예외 1 이 기본.
    입력조합 곱집합·같은 결과 반복·모든 파라미터 나열(핵심 키 3~5개만)은 폭주.
  - **축2 (값 집합 완전성 — 누락 원인 ①)**: 동작이 "코드가 어떤 집합에 속하면 처리"면 집합의 **모든 값을 한 given 에 나열**.
    채널·유형별로 집합이 다르면 집합마다 example 1개.
    - ❌ 본문 "상태 ∈ [s1..s5] 면 정상"인데 given "상태=s1"만. ✅ given "상태 ∈ [s1,s2,s3,s4,s5]" then "정상 처리".
  - **축3 (값→결과 매핑 보존 — 누락 원인 ②)**: 값마다 결과가 다르면 뭉치지 말고 대응 명시(example 만 보고 복원 가능해야).
    - ❌ given "유형 ∈ [t1,t2,t3,t4]" then "각각 A 또는 B". ✅ given "유형 ∈ [t1,t2]" then "A" / given "유형 ∈ [t3,t4]" then "B". (또는 then "t1→A,t2→A,t3→B,t4→B".)
  - **깊은 중첩도 빠짐없이**: 바깥 분기 안의 안쪽 집합·값→결과까지 내려가 담는다. "구분에 따라 처리" 한 줄로 뭉개지 마라.
    너무 복잡해 못 담으면 임의 누락 말고 §7 question 으로 "분해·재검 필요" 표면화.
  - **affected_tables**: 이 함수가 **직접** R/W 하는 테이블만(reads/writes 내), op 정확히. 하위호출(callee) 테이블은 그 함수 몫. 없으면 `[]`. 없는 테이블명 지어내기 금지.

  # ════════════════════════════════════════════════════════════════
  # 4. 함수 형태별 판단 (★ 환각 최다 지점)
  # ════════════════════════════════════════════════════════════════
  ## 4.1 조회·저장(fetch) 함수 — 값을 전역/OUT 에 담기만 하는 함수
  함수가 ① 입력 키로 마스터 조회 ② 결과의 플래그·코드값을 전역/OUT 에 그대로 복사 ③ 대상 없으면 값 변경 없이 통과,
  오류면 에러 — 딱 이것만 하면: 그 플래그를 **가져다 놓을 뿐, 값('Y'/'N')에 따라 분기하지 않는다.** 분기는 나중에 값을 읽는 **호출자** 몫.
  - ✅ R1 "입력 키로 마스터 조회해 <여부 플래그>를 결과에 반영. 대상 없으면 값 변경 없이 통과(silent pass)."
    given "입력 키로 마스터 조회" then "<여부 플래그> 값을 결과에 반영" / given "마스터에 키 없음" then "값 변경 없이 정상 통과".
  - ❌ 대표 환각: "<여부>가 'Y'면 정상 처리 / 'N'이면 무시" — 이 함수엔 그 분기가 **없다**(호출자에 있다). 다운스트림 사용 로직을 끌어오지 마라.
  - ❌ 누락: 대상 없음=정상 통과(silent pass)를 빼고 "조회→반환"만.

  ## 4.2 표준 쓰기(writer)·변환·배관 함수
  입력을 채워 저장(INSERT/UPDATE) 1건 하고 도메인 분기가 하나도 없으면 → **rules:[]**(쓰기 "사실"은 다른 분할이 담음). 아래는 전부 기술:
  저장/조회 실패 시 오류 반환 / 시퀀스·일련번호 채번 / 값 암호화·마스킹·부분정보 생성 / 타입 변환·트림·포맷팅 / 로그 출력.
  - ❌ "저장 중 오류면 반환"·"일련번호 채번"·"계좌번호 암호화" 를 Rule 로. ✅ writer 본문에 도메인 분기(특정 유형일 때만 어떤 컬럼을 특정 값 세팅)가 섞이면 그 분기만 살린다.

  ## 4.3 위임(callee) 함수 — 하위 규칙·테이블을 부모로 끌어올리지 마라
  ★ "위임"은 부모 본문에 **자기 도메인 분기가 하나도 없고** 오직 자식 호출 + try/catch 뿐일 때만이다.
  **부모 본문에 직접 값 분기·정책·계산이 있으면 위임이 아니다 — 그 분기는 반드시 부모 자기 Rule 로 잡는다**
  (호출도 몇 개 하지만 자기 줄에 도메인 결정이 섞인 오케스트레이터를 "위임"이라 보고 rules:[] 로 비우면 = 큰 누락).
  - ❌ 규칙 끌어올림: 부모 본문이 순수 "자식 A·B 호출 + try/catch" 몇 줄인데 자식이 가진 검증·분기를 부모 Rule 로 재추출. → 부모는 rules:[] 또는 "입력검증·본처리를 자식에 위임" 1줄.
  - ❌ 과소추출: 부모 본문에 "결제수단/상태값에 따라 다른 처리·다른 호출을 고르는" 직접 분기가 있는데 "위임"으로 보고 rules:[] 로 비움. → 그 값→처리/호출 매핑은 부모 결정이니 규칙화.
  - ❌ 테이블 끌어올림: 부모 reads/writes 가 비었는데(직접 R/W 없음) 자식이 INSERT/UPDATE 하는 테이블을 부모 affected_tables 에 적음. → 부모 affected_tables = `[]`.
  - ✅ 자식이 반환한 값(코드·상태)을 부모 본문에서 받아 **부모가 직접 분기**하면 그건 부모 자기 Rule.

  # ════════════════════════════════════════════════════════════════
  # 5. 주석·식별자를 진실로 오독하지 마라 (실행 코드가 진실)
  # ════════════════════════════════════════════════════════════════
  ## 5.1 쓰기 방향(INSERT vs UPDATE) — 실행 식별자가 진실, 주석·어휘는 무시
  DB 작업 종류가 함수/키 식별자로 결정되는 관례(키 접미사 `_i`=INSERT, `_u`=UPDATE, `_s`=SELECT, `_d`=DELETE)가 있으면 그 식별자가 op 의 진실.
  - ★ 하드 게이트: statement/then 에 "INSERT/신규 등록/UPDATE/갱신" 을 쓰기 **직전에** 키 접미사(`_i`/`_u`/`_s`/`_d`)를 먼저 확인.
  - ❌ 키가 `..._u0004`(UPDATE)인데 ① 잔재 주석 `/* Insert 처리 */` ② "이력 1건 등록" 어휘 ③ 일련번호 `+1` 에 끌려 op 를 INSERT·동사 "신규 등록" 으로. (statement 는 "갱신" 인데 op 만 INSERT 로 다는 자기모순 금지.)
  - ✅ 셋 다 무시. 키가 `_u` 이므로 op=UPDATE, 동사="갱신". ★ 형제 일관성: 같은 파일의 같은 접미사 함수는 모두 같게 판정.

  ## 5.2 검사 헬퍼의 역방향 반환 규약 오독 금지 (조건 반전 방지)
  일부 프레임워크 널·공백 검사 헬퍼는 반환 규약이 **반대**다. `isBlank(x) != OK` = "x 가 **비어있지 않다(값이 있다)**".
  - ❌ `if (isBlank(계좌번호) != OK)` 를 "계좌번호가 **없으면**" 으로 읽어 given 반전. ✅ "계좌번호가 **입력되어 있으면**".
  - 부등호 정확: `>=` 이상 ≠ `>` 초과, `<=` 이하 ≠ `<` 미만.

  # ════════════════════════════════════════════════════════════════
  # 6. 도메인 언어 — 코드 토큰 박멸 (given/when/then/statement)
  # ════════════════════════════════════════════════════════════════
  사람이 읽는 시나리오다. **무엇을 의미하나(도메인) + 어떤 값인가(코드 VALUE 리터럴)** 는 남기고,
  **어떻게 구현됐나(변수·메서드 이름)** 는 뺀다. 도메인 코드값 리터럴('CARD'·'03'·'0000')만 예외로 보존.
  - ❌ "in.flag='Y' 이면 out.code='3'" → ✅ "비활성 여부='Y' 이면 처리구분='3'" / ❌ "checkXxx() 호출" → ✅ "XX 여부를 조회".
  - **출력 직전 블랙리스트 점검** — 하나라도 남으면 도메인어로 교체:
    - 전역/구조체 접두: `gc_*`·`in.*`·`out.*`·`객체.필드` / 반환·상태 매크로: `OK`·`ERR`·`NOT_FOUND` 류
    - 컬럼·플래그: `*_yn`·`*_cd`·`*_num` / 함수·메서드: `이름()`·`*_proc`·`*_chk` / 파라미터: `iFlag` 류
    - 괄호 병기 금지: "적용 여부(use_flag)" → "적용 여부".
  - ★ 작성 절차(누출 0): given/when/then 적기 전에 본문 변수·메서드명의 도메인 의미를 먼저 정하고 그 의미만 쓴다(원 이름은 단 한 번도 등장 X).
  - ★ writer(필드 매핑) 함수: given 에 매핑되는 입력 필드를 전부 나열하지 마라(핵심 도메인 키 3~5개만). "무슨 필드를 어디 담나"는 다른 분할 몫.
  - **모호 단어 금지**("적절히/필요시/상황에 따라").

  # ════════════════════════════════════════════════════════════════
  # 7. questions — 0 = 최고의 답
  # ════════════════════════════════════════════════════════════════
  - Question = 아래 4 조건을 **모두** 만족하는 진짜 모호점만: ① 본문에 명확한 모호 단서(의미 모를 코드값·매핑 없는 상수·정의 없는 외부 호출)
    ② 코드·callee_summary·codebase_notes·referenced_symbols 어디에도 답 없음 ③ 이 함수 Rule/Example 정확성에 직접 영향 ④ 다른 Question 과 중복 없음.
  - **0 = 최고**(빈 배열이 가장 좋은 결과). 억지 추출 = hang 원인. 4 조건 못 채우면 폐기.
  - ❌ 가장 흔한 환각: **답이 본문에 있는데 묻기** — else·default·조건 가드(`if (isBlank(x) != OK) {…}`)가 곧 답이다. 그 처리를 example 로 담아라(질문 X).
  - 필드: `text`(한 줄 질문) / `reason`(코드 근거 부재 사유).

  # ════════════════════════════════════════════════════════════════
  # 8. 종합 예시 — 한 함수 처음부터 끝까지 (범용·추상)
  # ════════════════════════════════════════════════════════════════
  가상 함수: (검증) ID·금액 비면 거절 / (정책) 상태 ∈ [P1,P2,P3]→'승인', [F1,F2]→'거절', 그외→'보류' /
  (계산) 유형 M1→수수료=금액×0.02, M2→0 / (기술) 이력 1건 저장, 오류면 에러, 결과 로깅.
  - ✅ 올바른 추출:
    - R1 "필수 식별자(ID·금액) 누락 시 거절" — given "ID 또는 금액 누락" then "거절"
    - R2 "상태코드 집합에 따라 승인/거절/보류" — given "상태 ∈ [P1,P2,P3]" then "승인" / "∈ [F1,F2]" then "거절" / "그 외" then "보류"
    - R3 "유형별 수수료율" — given "유형=M1" then "수수료=금액×0.02" / "유형=M2" then "0"
    - (이력 저장·오류 반환·로깅 = 기술 → Rule 없음) / questions: []
  - ❌ 흔한 실패(대조): 누락(축2) R2 를 "상태로 분기"+"P1→승인" 1개만(나머지 소실) / 매핑깨짐(축3) "∈[P1..F2]→각각 승인 또는 거절" /
    분리실패(2.4) R2·R3 를 "상태·유형에 따라 처리" 한 Rule 로(수수료 정책 소실) / 과추출(2.1) "이력 저장"·"오류 반환"·"로깅"을 Rule 로 / 환각(§6) 본문에 없는 상태값 P9 지어냄.

  # ── 제출 전 자가 점검 (매 함수, 출력 직전 1회) ──
  - 본문 도메인 분기 중 Rule 로 안 잡힌 것 있나?(순수 기술 가지 제외) 코드값 집합의 모든 값이 given 에 있나?(축2) 값→결과 대응 복원되나?(축3)
  - 깊은 중첩 안쪽 집합·결정까지 담았나? given/then/statement 의 모든 값이 본문에 실제로 있나?(환각 0)
  - fetch·writer·위임 함수에 본문에 없는 분기를 지어내지 않았나?(§4) 쓰기 방향을 식별자 기준으로 정했나?(§5.1) 검사 헬퍼 반환 규약 반대로 안 읽었나?(§5.2)
  - given/when/then 에 변수·메서드 토큰(`객체.필드`/`gc_*`/`*_yn`/`이름()`) 남았나? 남았으면 도메인어로 교체.(§6)
  - 서로 다른 도메인 결정을 한 Rule 로 뭉개지 않았나?(2.4) example 행을 같은 결과 변주로 부풀리지 않았나?(축1)
  - questions 는 4 조건 다 만족하는 것만?(못 채우면 0) — 가드·else·default 가 곧 답이면 질문 X.

