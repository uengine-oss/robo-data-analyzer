  # [5] 제출 전 자가 점검 (매 함수 — 출력 직전 한 번)
  # ════════════════════════════════════════════════════════════════
  - 본문의 도메인 분기 중 Rule 로 안 잡힌 게 있나? (있으면 누락 — 단 순수 기술 가지는 제외)
  - 코드값 집합에 의존하는 분기마다, 집합의 **모든 값**이 given 에 있나? (축2 / 3.3)
  - 값마다 결과가 다른 곳에서, (값→결과) 대응이 example 만으로 복원되나? (축3 / 3.4)
  - 깊은 중첩 안쪽의 집합·결정까지 내려가 담았나? (3.5)
  - given/then/statement 의 모든 값이 **본문에 실제로** 있나? (환각 0 / 1.5)
  - given/when/then 에 변수·메서드 이름(`객체.필드`/`접두사_변수`/`이름()`/`*_proc`·`*_check`·`*_dbio_*`)이
    남았나? 남았으면 도메인 언어로 교체 (코드 VALUE 리터럴만 예외 / 1.5).
  - 기술 관심사(트랜잭션·로깅·변환·표준 에러반환)를 Rule 로 만들지 않았나? (1.4)
  - 서로 다른 도메인 결정을 한 Rule 로 뭉개지 않았나? (2.5)
  - example 행을 같은 결과 변주로 부풀리지 않았나? (축1 / 3.6)
  - questions 는 4 조건 다 만족하는 것만 남았나? (못 채우면 0)

  # ════════════════════════════════════════════════════════════════
  # [6] 추가 예시 모음 — 패턴 더 보기 (범용·추상)
  # ════════════════════════════════════════════════════════════════

  ## 6.1 집합·매핑 패턴 (가장 자주 누락되는 곳)
  - 단일 집합 → 단일 결과: given "코드 ∈ [a1, a2, a3]" then "허용"   (집합을 다 나열)
  - 다중 집합 → 각기 다른 결과(매핑 보존):
      given "코드 ∈ [a1, a2]" then "즉시 승인" / given "코드 ∈ [b1, b2, b3]" then "보류" /
      given "코드 ∈ 그 외" then "거절"
  - 값 → 값 치환(대응 보존이 핵심): given "입력ID ∈ [x1, x2]" then "각각 y1, y2 로 치환(x1→y1, x2→y2)"
      ★ 묶어서 "y1 또는 y2 로 치환"이라고 쓰면 어느 입력이 어느 출력인지 사라짐 = 금지.
  - 범위 임계값: given "금액 ≥ 본문의 임계값" then "거절"   (임계값은 본문에 있는 값으로)
  - 기본값 매핑: given "유형 미입력(NULL)" then "유형 = 본문에 정의된 기본값으로 설정"

  ## 6.2 검증 함수 패턴 (의미 다발 1 Rule + 필드별 example)
  - rule "필수 식별자 누락 시 거절"
  - examples: given "필드 A 누락" then "거절" / given "필드 B 누락" then "거절" / given "필드 C 누락" then "거절"
  - 조건부 필수가 따로 있으면 별도 example: given "유형 = T1 且 필드 X 누락" then "거절".

  ## 6.3 깊은 중첩 패턴 (바깥 분기 안의 안쪽 집합 — 누락 多)
  본문이 "구분이 G 면, 그 안에서 코드가 [k1, k2, k3] 면 정상" 구조라면:
  - 나쁨: "구분 G 면 처리"   (안쪽 집합 [k1, k2, k3] 통째 누락)
  - 좋음: given "구분 = G 且 코드 ∈ [k1, k2, k3]" then "정상" / given "구분 = G 且 그 외 코드" then "거절"

  ## 6.4 questions 예시 (범용)
  - 좋은 예: text "코드 집합 [c1, c2, c3] 외의 값이 오면 어떤 정책으로 처리하나?"
            reason "본문은 [c1, c2, c3] 만 분기하고, 그 외 처리·기본정책이 코드·요약·notes 어디에도 없음"
  - 좋은 예: text "NULL → 기본값으로 채우는 X 의 의미가 '미정'인지 '확정 후'인지?"
            reason "두 해석 모두 가능하고 근거 자료가 없음"
  - 나쁜 예(금지): "이 함수는 왜 호출되나?"(영향 0·호기심) / "코드 c1 의 의미는?"(본문 분기에 이미
    드러남 = 답이 본문에) / 같은 코드그룹을 값마다 질문 3개(1개로 통합).

  ## 6.5 좋은 산출물의 특징 (요약)
  - Rule 은 도메인 결정 단위로, 서로 다른 결정은 분리돼 있다(개수는 가치가 정함).
  - example 의 given 에는 그 분기가 의존하는 코드값 집합이 **빠짐없이** 들어 있다.
  - 값마다 결과가 다른 곳은 (값→결과) 대응이 example 만으로 복원된다.
  - 모든 값은 본문에 실제로 있는 값이다(환각 0).
  - 기술 관심사·노이즈는 0, 빈 영역은 솔직히 빈 배열이다.

  ## 6.6 flow_id 부여 예시 (제어 흐름 위치)
  - 메인 흐름은 순서대로: 첫 결정 "1", 다음 "2", 그 다음 "3" (서로 NEXT 로 이어짐).
  - 어떤 결정의 하위 분기: 부모가 "2" 면 그 분기들은 "2-1", "2-2" (BRANCH 로 갈라짐).
  - 분기 안의 또 분기: "2-1-1". 본문 제어흐름 순서를 그대로 반영한다(임의 번호 부여 X).

  ## 6.7 affected_tables 판단 예시
  - 이 함수가 **직접** 읽기/쓰기 하는 테이블만 넣고 op(READ/INSERT/UPDATE/DELETE/MERGE)를 정확히.
  - 하위 호출 함수가 건드리는 테이블은 넣지 않는다(그 함수의 몫).
  - 직접 R/W 하는 테이블이 없으면 `affected_tables: []`.
  - 본문에 없는 테이블명을 지어내지 않는다(환각 0).

