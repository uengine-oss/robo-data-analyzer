  # [4] 종합 예시 — 한 함수를 처음부터 끝까지 (범용·추상, 실제 코드 아님)
  # ════════════════════════════════════════════════════════════════

  ## 5.1 시나리오 A — 정책·계산이 있는 함수
  가상 함수가 다음을 한다고 하자(패턴 설명용 추상 예):
  - (검증) 식별자 ID 또는 금액이 비면 거절한다.
  - (정책) 상태코드가 [P1, P2, P3] 중 하나면 '승인', [F1, F2] 중 하나면 '거절', 그 외 값이면 '보류'.
  - (계산) 유형이 M1 이면 수수료 = 금액 × 0.02, M2 이면 0.
  - (기술) 이력을 1건 저장하고, 오류면 에러를 반환하며, 결과를 로깅한다.

  올바른 추출:
  - rules:
    - R1 "필수 식별자(ID·금액) 누락 시 거절"
    - R2 "상태코드 집합에 따라 승인/거절/보류 결정"   (상태→처리, 의미 한 묶음 = 1 Rule)
    - R3 "유형별 수수료율 적용"                        (계산 결과가 다름 = 별도 Rule)
    - (이력 저장·오류 반환·로깅 = 기술 → Rule 없음)
  - examples (★축2 집합 전부 + 축3 매핑 보존):
    - R1: given "ID 또는 금액 누락" then "거절(오류 반환)"
    - R2: given "상태코드 ∈ [P1, P2, P3]" then "승인" /
          given "상태코드 ∈ [F1, F2]"     then "거절" /
          given "상태코드 ∈ 그 외"         then "보류"
    - R3: given "유형 = M1" then "수수료 = 금액 × 0.02" / given "유형 = M2" then "수수료 = 0"
  - questions: [] (본문에 모든 값·의미가 있으면 0이 정답)

  흔한 실패(나쁜 추출) — 위와 대조:
  - ❌ 누락(축2): R2 를 "상태코드로 처리 분기" 한 줄 + example "상태=P1 → 승인" 1개만
       → P2·P3·F1·F2·'그 외' 누락 → 전환 시 거절/보류가 사라져 동작 깨짐.
  - ❌ 매핑 깨짐(축3): "상태코드 ∈ [P1,P2,P3,F1,F2] → 각각 승인 또는 거절"
       → 어느 코드가 승인이고 어느 게 거절인지 사라짐.
  - ❌ 분리 실패(2.5): R2 와 R3 를 "상태·유형에 따라 처리" 한 Rule 로 합침 → 수수료 정책 소실.
  - 🔇 과추출(1.4): "이력 저장" / "오류 시 에러 반환" / "결과 로깅"을 Rule 로 → 기술 노이즈.
  - 🔇 환각(1.5): 본문에 없는 상태값 P9 를 example 에 지어냄.

  ## 5.2 시나리오 B — 순수 기술 래퍼 함수
  함수가 "입력을 담아 외부 조회·호출 1건 하고, 오류면 에러·없으면 통과, 결과를 반환"만 한다면
  → 도메인 분기·값 매핑·정책 없음 → **`rules:[]`+`examples:[]`** 가 정답. ("조회/호출 실패 시 에러
  반환"을 Rule 로 만들지 마라.)

  ## 5.3 시나리오 C — 도메인·기술이 섞인 함수 (가지별 판단)
  함수가 ① 외부 조회(기술) ② 조회 결과 코드가 [c1,c2] 면 정상, 그 외면 거절(도메인) ③ 오류면 에러
  (기술) 를 한다면 → **②만 Rule**: "조회 결과 코드 ∈ [c1, c2] 면 정상, 그 외면 거절". ①③은 버린다.

