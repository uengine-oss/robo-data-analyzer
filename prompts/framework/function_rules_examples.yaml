  ## 이 분할의 일 — 비즈니스 규칙·시나리오·질문 추출 (rules + examples + questions)

  ### 이 분할 고유 원칙

  1. **비즈니스 규칙만 추출**. 기술 관심사 (DI / 로깅 / 트랜잭션 / DTO 변환 / 캐시 / 재시도 / 순수 방어 null) 는 Rule X.
  2. **컨벤션 우선**. codebase_notes 의 패턴 (회사 wrapper / 에러 매크로) 은 Rule X — 컨벤션의 반복 관용구.
  3. **인위적 개수 강제 X**. 단순 위임만 있는 함수는 Rule 0 정답. 분기 많으면 분기 수만큼.
  4. **DDL 타입 X** — Rule statement 에 DDL 컬럼 타입 노출 X.

  ---

  ## [1] rules — 비즈니스 규칙

  ### Rule 후보 — 하나라도 맞으면 O

  - 도메인 임계값 / 정책 값 (₩50,000 이상 할인 / 한도 초과 거절)
  - 역할·상태·유형 차등 (관리자만 가능 / 'PAID' 상태에서만 환불)
  - 엔티티·컬럼 값 분기 (결제수단 'CARD' vs 'BANK')
  - 도메인 계산식 (수수료 = 금액 × 0.03, 단 최소 1000)
  - 정책 상수 / 비즈니스 예외 throw

  ### Rule 제외 — 하나라도 맞으면 X

  - DI / 프레임워크 콜백 / 로깅 / 메트릭 / DTO↔Entity / SQL 바인딩 / 트랜잭션 / 캐시 / 재시도
  - 순수 기술 예외 (NPE 방어 / 타입 캐스팅 실패)
  - 순수 방어 null/empty (내부 헬퍼 인자 null 체크 / requireNonNull 일반 사용)
  - 컨벤션의 반복 관용구 (회사 wrapper 매크로의 표준 에러 처리)

  ### NULL/빈값 구분 — 결정 질문

  - O Rule: 도메인 식별자 NULL 검증 (청구번호·계좌번호·업무구분 검증) / NULL→기본값 / 조건부 필수.
    - 함수명이 `*_validation` / `*_check_*` / `input_validation` 이면 안의 NULL 체크는 도메인 정책.
  - X Rule: 내부 헬퍼 인자 null 체크 / 프레임워크 경계 방어.
  - 결정 질문: "이 조건을 제거하면 사용자 (고객/정산/감사) 결과가 달라지는가?" YES → Rule / NO → 제외.

  ### Rule 필드

  - `statement`: "<조건>이면 <결과>" 10~30자. 코드 식별자 금지 (엔티티 필드명은 OK).
  - `rule_id`: "R1", "R2", ...
  - `flow_id`: "1" / "2" (메인) · "1-1" (R1 분기) · "2-1-1" (중첩).
  - `guard_rule_id`: 선행 Rule 통과 전제이면 "R1", 없으면 null.
  - `branch_from`: if/else/switch 갈래면 분기 원 Rule id, 없으면 null.
  - `coupled_domains`: [] 기본. 타 도메인 테이블 WRITE·값 분기·enum·계산 시 도메인명 추가. 단순 코드 lookup·로깅 read 는 X.

  비즈니스 정책 예외 throw = 독립 Rule 로 승격.

  ### 개수 가이드

  - 인위적 상·하한 없음.
  - 단순 위임만 있는 함수: 0 정답.
  - 분기 많으면 분기 수만큼.
  - 같은 패턴 값마다 Rule 쪼개는 과한 세분화 X — 복수 값/필드는 1 Rule + 값마다 Example.

  ### 분기 누락 금지 — 모든 종료 경로 + silent pass

  본문에 분기가 N개면 비즈니스 Rule 도 그 분기 수와 의미를 반영해야 한다. 빠뜨리면
  상위(caller·부모) 분석이 흐름을 잃는다.

  - **각 도메인 분기마다 1 Rule** (값마다 Example) — if/else/switch 갈래가 도메인
    의미가 다르면 빠뜨림 없이.
  - **에러 분기도 비즈니스 의미가 있으면 별도 Rule** — 예: "외부 인증 실패 시 안내
    문구 결정" 은 기술 에러가 아니라 도메인 의사결정.
  - **silent pass 분기 명시** — 에러 신호(코드/예외/null 등)를 받았으나 처리 없이
    통과하는 분기는 의미상 별도 흐름. "특정 코드 (예: NotFound·재시도 가능) 는
    조용히 통과" 자체가 도메인 정책일 수 있음 → Rule 후보.
  - **조기 return / break** 로 인한 분기도 마찬가지.

  마인드셋: 종료 경로가 N개면 Rule 도 비즈니스 의미가 있는 만큼. 한 흐름만 적고
  다른 흐름 빠뜨리지 말 것. 언어 무관.

  ---

  ## [2] examples — given/when/then 시나리오

  각 Rule 의 행동 결과를 시나리오로:

  - `rule_id`: 참조 Rule id.
  - `description`: 사람용 한 줄 요약.
  - `given`:
    - `narrative`: 왜 이 시나리오인지 한 줄 (inputs 풀어쓰기 X).
    - `inputs`: `[{{ "key": "<파라미터명>", "value": "<값/JSON>" }}]` — 파라미터 이름·값 쌍.
    - `globals`: `[{{ "key": "<전역명>", "value": "<값/JSON>" }}]` — 전제 전역 상태.
    - `stubs`: `[{{ "key": "<외부호출>", "value": "<반환값/JSON>" }}]` — 스텁 반환값.
  - `when`: 자연어 한 줄 ("결제 요청" / "출금 요청"). 메서드명·클래스명 X.
  - `then`:
    - `narrative`: 결과 핵심 한 줄 (return·writes 풀어쓰기 X).
    - `return_value`: 반환값 (단순값 또는 JSON 문자열). 반환 없으면 "".
    - `exception`: null 또는 `{{ "type": "...", "code": "...", "message": "..." }}`.
    - `reads`: `[{{ "table": "...", "columns": ["..."] }}]`.
    - `writes`: `[{{ "table": "...", "op": "INSERT|UPDATE|DELETE|MERGE", "where": [{{key,value}}], "values": [{{key,value}}] }}]`.
    - `globals`: `[{{ "key": "<전역명>", "value": "<값/JSON>" }}]` — 변경된 전역.
    - `out_params`: `[{{ "key": "<OUT명>", "value": "<값/JSON>" }}]` — 변경된 OUT.
  - `is_boundary`: true/false.

  ### key/value 표기 규칙

  자유 키 영역(inputs / globals / stubs / out_params / where / values) 은 모두
  `[{{ "key": "...", "value": "..." }}]` 리스트로 출력. 값이 객체이면 value 안에 JSON
  문자열로 직렬화. 빈 영역은 `[]`.

  ### narrative 규칙

  "왜 이 시나리오인지" / "결과 핵심" 만 한 줄. inputs / return / writes 의 값을 풀어 쓰지 X
  (해당 필드에 이미 있음 — 중복 금지).

  ### 원칙

  - `given.inputs` = 이 Rule 까지 도달 가능한 전체 입력 (선행 가드 통과값 포함).
  - `then` = 관찰 가능한 모든 변화 (반환·예외·DB·전역·OUT) 빠짐없이.
  - `reads` = 이 시나리오 접근 테이블·컬럼 (단순 SELECT 도 누락 X).
  - 변경 없으면 `[]` (필드 생략 X).
  - 값은 실제 리터럴만 (변수명·메서드명 X).
  - JSON 유효 형식.

  ### Example 필수 커버리지

  - happy path + 경계 케이스 모두. "이상/이하/초과/미만" → X / X±1 두 개 (`is_boundary=true`).
  - 예외 throw Rule → 예외 시나리오 + 성공 시나리오 둘 다.
  - 1 Rule 이 복수 필드/분기 커버 → 필드/분기마다 example 별도.

  ### 개수 가이드

  - examples 총 ≤ 7개 권장. 더 필요하면 Rule 쪼개기 검토.

  ---

  ## [3] questions — 사람 검토 큐

  코드 / callee summary 만으로 답할 수 없는 모호함을 한 줄 질문으로:

  - text: 한 줄 질문 (예: "REQUEST_CHANNEL 컬럼의 'M'·'W'·'A' 코드값 의미는?")
  - reason: 코드 근거 없는 이유 (예: "본문에 리터럴은 박혀있으나 매핑 주석·상수 정의 없음")

  ★ 코드 단서가 분명한 사실은 Question X (환각 방지).
  ★ Question 0 도 정상 (Rule·Example 과 독립).

