  ## [4] search_text — 검색 전용 서술 (사용자 화면에 안 보임, 의미 검색 재료)

  이 필드는 사람이 읽는 요약이 아니라 **"자연어 요구사항 질의가 이 함수를 찾아내게 하는"
  검색 재료**다. 아키텍트가 "주문 취소하면 재고가 어떻게 되나" 같은 업무 말로 물었을 때
  이 함수가 검색에 걸리려면, 그 답이 되는 사실들이 여기 문장으로 들어있어야 한다.

  ### 4.1 반드시 담을 것 (누락 0 — 하나라도 빠지면 그 값을 묻는 질의가 이 함수를 영원히 못 찾음)

  1. **조건 분기** — "어떤 조건이면 어떤 결과" 쌍 문장으로, 갈래마다 하나씩.
  2. **상태 전이** — 무슨 상태가 언제 무엇으로 바뀌는지 (예: 'PAID' → 'CANCELED').
  3. **상태·결과 코드 값 전부** — IN 리스트·복수 분기값은 모든 값을 나열 (하나도 생략 X).
  4. **테이블 상호작용** — 읽는/쓰는 테이블과 그 업무 목적 ("재고 테이블의 예약 수량을 복원").
  5. **도메인·비즈니스 로직** — 임계값·계산식·업무 규칙.

  ### 4.2 작성 규칙

  - **코드 문장 복붙 금지** — SQL 원문·코드 라인·변수 대입 나열 X. 의미 문장으로.
  - **코드 어휘는 병기 보존** — 테이블명·코드값 리터럴·핵심 도메인 식별자는 자연어 설명과
    함께 그대로 담는다 (summary 와 반대 — 여기선 검색 변별력의 핵심).
    예: "외부 결제망(SK-VAN)에 승인 요청" / "주문 테이블(ORDER_TB) 상태를 'CANCELED' 로 갱신".
  - **업무 말로 서술** — 사람이 요구사항을 묻는 말투의 어휘(취소/환불/정산/승인)를 쓴다.
  - **질문 생성 X** — 사실 서술문만. 문단 하나(줄바꿈 없이 문장 나열)로 충분.
  - **단순 노드(순수 위임·단건 SELECT 등)는 빈 문자열** — 억지로 채우지 X (검색은 summary 폴백).
  - summary 와 중복돼도 됨 — 이 필드는 독립 소비(검색)라 자기완결이 우선.

  ### 4.3 예 (주문 취소 함수)

  > 주문 취소 처리. 주문 상태가 'PAID'(결제완료)면 PG사에 결제 취소를 요청하고,
  > 'SHIPPED'(배송중)면 취소 불가로 'ERR_SHIPPED' 반환. 취소 확정 시 주문 테이블(ORDER_TB)
  > 상태를 'CANCELED' 로 갱신하고 재고 테이블(STOCK_TB)의 예약 수량을 복원.
  > 환불 금액은 포인트 사용분을 제외하고 계산.

