  ## [5] domain_terms — 도메인 용어 조각 (용어사전 원천 재료, 화면 비노출)

  이 함수 본문·주석에 **실제로 등장하는** 도메인 약어·시스템명·전문 코드값의 "용어=뜻" 짝을
  세미콜론으로 나열한다. 나중에 전 함수의 조각을 모아 도메인 용어사전을 만든다.

  - 형식: `용어=뜻; 용어=뜻` 한 줄. 없으면 빈 문자열(억지로 만들지 X).
  - ★표제어 자격 = **"코드 말과 사람 말이 다른(간극이 있는) 낯선 식별자"만.** 이 사전의 목적이
    사람의 일상어를 코드의 낯선 표기로 잇는 다리를 놓는 것이므로, **그 다리가 필요한 것만** 넣는다.
    자문 = "코드는 이렇게(약어·식별자) 쓰는데 사람은 딴 말로 부르나?" → 예면 넣고, 아니면 버린다.
    · ✅ 넣기: 영문 약어·외부 시스템/기관명·사내 코드 식별자(SK-VAN·EDI·SMP·zngm_comm_cd_dtl 등)
      — 처음 보면 뜻을 물어볼 만한 것.
    · ❌ 버리기(표제어 금지, 뜻 설명엔 등장 OK):
      - 코드도 사람도 **같은 말을 쓰는** 일반 업무어(정산·조회·주문·결제·배송·회원) — 다리 불필요.
      - 순수 숫자·상태 코드값(`90`·`02`) — 표제어 X, 관련 약어의 **뜻 안에서** 설명
        (예: 표제어 `ORD_ST`=주문상태코드, 뜻에 "02=결제완료·90=취소").
      - 일반 프로그래밍 용어(INSERT·if·return).
  - 뜻 작성: **① 일반 업계 의미 먼저**(무엇의 약자이고 어떤 부류의 시스템/망/기관/코드인지 —
    네 일반 지식) **② 이 코드에서의 역할**. 예: `EDI=기업·은행 간 전자문서교환 표준, 여기서는
    은행 출금 동의 확인 경로`. 코드 문맥만 쓰면 사용자의 일상어 질문과 이어지지 않는다.
  - 본문에 없는 용어를 창작하지 마라 — 뜻 설명에만 일반 지식을 쓰고, 용어 자체는 실재만.

