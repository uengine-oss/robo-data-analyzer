## code_summary — 분할 1: summary + stereotype + logical_name + search_text + domain_terms
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실.
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 1: 함수 의미 종합
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드

  - **이 분할이 하는 일**: `summary` + `stereotype` + `logical_name` + `search_text` + `domain_terms` 5 필드 채움
  - **이 분할이 안 하는 일**: 테이블별 컬럼 의미(→분할 2) / 비즈니스 규칙·시나리오·질문(→분할 3)
  - **출력 미리보기** (type + 값 예시):
    ```
    SummaryOutput {                                              // ★ 반드시 이 순서대로 채운다
      search_text:  "업무 서술문 + 식별자 괄호 병기 (용어나열 X)",  // ① 코드 정독 (단순 노드는 "")
      domain_terms: "ack_cd=상대 시스템 수신 확인 응답 코드; ...",  // ② 함수 텍스트(주석 포함) 실재 토큰만 (없으면 "")
      logical_name: "한 줄 도메인 표시명 (22자 전후, 체언 끝)",    // ③
      summary:      "마커 없는 1~3줄 짧은 요약",                  // ④ 최종 결론
      stereotype:   "Command" | "Query" | "Validator" | ...       // ⑤ 허용 풀 15개 중
    }
    ```
    ★ 순서 이유: ①②는 코드를 훑어 사실을 뽑는 일이라 먼저, ④ 요약은 그것들을 다 본 뒤 내리는
      **최종 결론**이라 뒤. **`domain_terms` 는 본문 식별자를 다 훑었으면 즉시 멈추고** 다음 필드로 간다.

  ---

  ## 0. 작성 절대 원칙 — 모든 3 필드 공통

  ### 0.1 코드 식별자 박멸 ([[_common]] 단계 1 참조)
  메서드명·변수명·클래스명·매크로명·DBIO 식별자 그대로 X. **이름이 아니라 의미**.
  단 도메인 코드값 리터럴 (`'CARD'` / `'PAID'`) / 임계값 (₩50,000) / 상태값은 보존 OK.

  ### 0.2 본문 주석 환각 차단 — **동작 서술에 한정** ([[_common]] 단계 7 참조)
  본문 주석의 **동작 서술**(신규/갱신/삭제 류)은 코드 변경 잔재로 실제 동작과 어긋날 수
  있다 — codebase_notes 의 결정론 매핑 (함수 식별자·키 → op) 이 항상 우선.
  단 **도메인 용어·의미 설명으로서의 주석**(이 변수/시스템이 무엇인지)은 코드에 없는
  지식의 1차 근거다 — domain_terms·search_text 의 근거로 참고하라.

  - X: 본문 라인 위 `/* 데이터 신규 등록 */` 주석 + 실제 함수 키 = UPDATE
       → summary "신규 등록" / logical_name "신규 등록" 박음 (주석 환각)
    O: codebase_notes 의 UPDATE 매핑 보고 summary "갱신" / logical_name "갱신" 사용.
       동작은 결정론 매핑, 용어 의미는 주석 참고 — 역할이 다르다.

  ### 0.3 추측 X ([[_common]] 단계 2 참조)
  본문 코드에 등장한 사실만 결과로 출력. 본문에 근거 없는 의미 추가 X.

  ### 0.4 모호 단어 박멸 ([[_common]] 단계 6 참조)
  "적절히 / 필요시 / 상황에 따라" 같은 표현 X. 조건과 결과를 분리해 명시.
  비교 정확 — "이상" ≠ "초과", "이하" ≠ "미만".

  ---

  ## [1] logical_name — 함수의 도메인 한 줄 표시명

  형제 함수(같은 모듈 안 다른 함수) 와 옆에 놓였을 때 **문장만 보고도 역할이 갈려야**
  합니다. 같은 모듈 안 어떤 형제와도 문자열 전체가 동일하면 안 됨 — 한 글자라도 다르게.

  ### 1.1 형식 / 길이 강제

  - **한 줄, 줄바꿈 X**.
  - **통상 22자 전후 이상** — 두세 단어 라벨 금지.
  - **체언·명사형 어미** — "갱신", "등록", "조회", "검증", "매핑", "결정", "반영", "차단",
    "복원", "송신", "수신", "전이", "확정", "취소".
  - **금지 어미** — "처리한다 / 한다 / 함" 같은 동사 어미.

  ### 1.2 결정 트리 (4 요소 중 ≥ 2 동시 드러내기)

  1. **무슨 행위** — 신규 등록 / 특정 컬럼 갱신 / 단건 조회 / 외부 호출 / 코드 결정 등
  2. **무슨 업무 데이터** — 주문 이력 / 결제 결과 / 회원 마스터 / 안내 문구 / 정산 마감 등
  3. **언제·어떤 분기** — 성공 경로만 / 오류 경로만 / 사전 점검 / 이미 확정 조회만
  4. **쓰기면 무엇을 바꾸는지** — 결과 코드 컬럼만 / 승인번호+시각 동시 / 상태만 등

  ### 1.3 좋은 예 (다양 도메인 — 6쌍)

  - 결제 도메인: "결제 승인 결과를 인증 이력 테이블에 신규 등록"
  - 회원 도메인: "회원 등급 변경 시 누적 포인트 만료일 갱신"
  - 안내 결정: "외부 인증 결과 코드에 따른 사용자 안내 문구 결정"
  - 정산 일괄: "주문 마감 후 미정산 건의 정산일자 일괄 확정"
  - 거절 매핑: "카드 결제 한도 초과 시 거절 사유 코드 매핑"
  - 큐 적재: "재고 부족 발생 시 백오더 큐 등록 + 알림 발송"

  ### 1.4 ★ 형제 차별 패턴 표 (같은 모듈 형제 함수와 안 겹치게 — 9 쌍)

  같은 도메인 모듈의 형제 함수들이 의미 비슷해 보여도 ★ 한 글자라도 달라야 함.
  형제 흔한 패턴별로 "짧은 광역 표현 (X)" vs "차별 축 2+ 드러난 한 줄 (O)":

  | 형제 패턴 | ❌ 짧은 광역 표현 (형제와 구분 0) | ✅ 차별 축 2+ 동시 드러난 한 줄 |
  |---|---|---|
  | 검증·준비    | "입력 검증"          | "결제 요청 금액·계좌형식·기관코드 사전 검증 및 거절코드 매핑"   |
  | 메인 호출    | "메인 처리"          | "외부 인증 호출 파라미터 조립·송신·응답 타임아웃 분기"          |
  | 이력 INSERT  | "이력 등록"          | "실시간 인증 최초 요청분 신규 이력 INSERT 및 요청키 채번 반영"  |
  | 이력 SELECT  | "이력 조회"          | "동일 거래키 최종 인증 결과행 단건 조회 후 후속 분기용 코드 적재" |
  | UPDATE A     | "결과 갱신"          | "응답코드·사유코드 컬럼만 성공 분기 UPDATE"                     |
  | UPDATE B     | "결과 적용"          | "승인번호·승인시각·매입사코드 컬럼 반영 이력 확정 UPDATE"       |
  | UPDATE C     | "오류 메시지 갱신"   | "고객 노출용 오류문구·내부 오류코드 컬럼만 실패 분기 UPDATE"    |
  | 메시지 결정  | "오류 결정"          | "은행·카드사별 오류코드를 안내 문구 리스트에서 결정해 OUT 세팅" |
  | 코드 검증    | "기관 코드 검증"     | "요청 기관코드 마스터 등록 여부 조회 후 미등록 시 즉시 거절"    |

  → 표 오른쪽 열처럼 형제와 첫 두 단어 조합이 다르게 / 차별 축 2+ 동시 드러나게.

  ### 1.5 logical_name 금지 패턴 — 안티패턴/정답 쌍

  **a. 메서드명·클래스명 그대로 박기**
  - X: "ProcessOrderService 의 processOrder 실행"
    O: "주문 결제 요청을 결제 모듈에 위임 후 결과 응답"
  - X: "checkInputValidation()"
    O: "결제수단·계좌번호 형식 검증 후 통과여부 반환"

  **b. 형제와 공통 광역 표현 단독**
  - X: "데이터 처리" (형제와 구분 0)
    O: "회원 등급 변경 시 누적 포인트 만료일 갱신"
  - X: "인증 수행"
    O: "외부 PG 인증 응답을 거래 이력에 'APPROVED' 또는 'DECLINED' 로 기록"

  **c. 코드 주석에 끌려 잘못된 동사 (★ 0.2 적용)**
  주석이 실제 DB 작업과 어긋나는 경우가 잦음. `codebase_notes` 의 op 매핑이 진실.
  주석 "Insert 처리" 라 적혀있어도 실제 op = SELECT 면 동사는 **조회·매핑** 계열.

  - X: 주석 `// 공통코드 신규 등록` 에 끌려 logical_name = "공통코드 상세 데이터 신규 등록"
       (실제 함수 키 = SELECT 함수)
    O: "공통코드 상세에서 인증결과 코드값 조회·매핑"
  - X: 주석 `// 상태 등록` (실제 UPDATE)
    O: "주문 상태를 'PAID' 로 갱신"

  **d. 빈 문자열·단순 위임 후 침묵**
  단순 위임 함수도 "어떤 서비스에 무엇을 넘겨 호출하는지" 까지는 적어야 함.

  - X: "" (위임만 있다고 빈 값)
    O: "결제 검증 결과를 외부 PG 모듈에 전달 후 응답 회수"

  ---

  ## [2] summary — 짧은 요약 (마커 없는 1~3줄)

  ### 2.1 형식 강제

  - **비어있지 않은 줄 1~3줄.** 통상 1~2줄, 코드가 크고 흐름이 복잡할 때만 3줄(상한).
  - `[핵심]` 같은 섹션 라벨 절대 X. 마크다운 헤딩·리스트 기호 (`#` / `*` / `-` / `1.`) X. 빈 줄 X.
  - 목적 = 읽는 사람이 "아, 이 함수가 뭘 하는 거구나"를 즉시 파악.
  - **성의 없는 한 줄 달랑 X** — 단순 위임 함수도 "무엇을 어디에 위임하는지"까지 담는다
    (자식 실패를 그대로 전달하는 것은 배관 — 적지 않는다).

  ### 2.2 담을 것 / 뺄 것 (역할 분리)

  **담기** — 무슨 행위를 어떤 업무 데이터에 하는지 + 결정적 결과(무엇이 기록/전이되는지)를
  의미어 문장으로. 상위(caller/부모) 분석이 이 요약을 입력으로 쓰므로 처리 축·대상은 정확히.

  **빼기** — ① 코드 식별자·테이블명·컬럼명 (→ [4] `search_text` 가 병기해 담는다)
  ② 분기 갈래와 코드값의 **완전한 나열** (→ 분할 3 `rules`/`examples` 가 빠짐없이 담는다).
  summary 는 뜻만 담는다. 세 필드가 같은 말을 나눠 갖지 않는다.

  ### 2.3 작성 절대 규칙

  1. **원문(코드)보다 짧게** — 요약이지 확장이 아님.
  2. **코드적이면 안 됨** — "변수 x 에 0 대입 / 매크로 길이만큼 복사" 식 X.
     비즈니스 로직 표현으로 (예: "실시간 인증 요청을 외부 인증 게이트웨이에 송신").
  3. **자식 끌어올림 X** ([[_common]] 단계 4 참조) — 자식 요약의 처리 축은 맥락으로 반영
     OK. 단 자식의 내부 분기·NULL 체크·검증을 부모 summary 로 끌어올림 X.
  4. ★★ **주어진 컨텍스트 무시 말고 충실 반영** — 입력의 모든 단서(**하위 함수(callee)** 요약·
     reads/writes·참조 심볼·함수/단위 이름·module_intent)에 드러난 도메인 의미를 검토해 summary 에
     반영한다. 코드·하위 함수·이름이 특정 도메인 개념(처리 대상·기준·집계 축)을 가리키면 **정확히
     담고**, 근거 있는 정보를 임의로 다른 개념으로 **치환·누락하지 마라(환각 금지)**. 단서가 충돌하면
     (이름은 A 인데 하위 함수 요약은 B) **코드 동작·하위 함수 요약을 우선**해 종합한다.
  5. ★ **쓰기/저장 대상도 의미어로 + 입력→출력 종합** — 대상은 식별자(테이블/DBIO명) 그대로 노출
     금지(역할 의미어로 — 식별자 보존은 search_text 책임). 가능하면 하위 함수가 무엇을 반환·R/W
     해서 → 호출 함수가 어느 대상에 무엇을 쓰는지를 한 문장에 종합한다.

  ### 2.4 좋은 예 (다이어트 — 1~3줄)

  #### 예 1 — 외부 호출 + 결과 기록 (2줄)

  > 카드 결제 승인 요청을 검증한 뒤 외부 PG 사에 송신하고, 승인/거절 결과를 거래 이력에 기록한다.
  > 응답 타임아웃이면 재시도 큐에 적재한다.

  #### 예 2 — 단순 조회 (1줄)

  > 회원 ID 로 회원 마스터에서 등급과 누적 포인트를 단건 조회해 반환한다.

  #### 예 3 — 복잡 오케스트레이션 (3줄 상한)

  > 회원의 주문 요청을 인증·재고·한도·결제·배송 순으로 검증·처리해 주문을 생성·확정한다.
  > 재고 선점이나 결제 승인이 실패하면 주문을 롤백하고, 성공하면 주문 상태를 결제완료를 거쳐
  > 배송준비로 전이시킨다.

  #### 예 4 — 단순 위임 entry point

  > 입항 신고 등록의 입력 검증과 본 처리를 각각 전용 자식 함수에 위임한다.

  ### 2.5 ★ codebase_notes 우선 — 본문 주석 환각 차단 ([[_common]] 단계 7 적용)

  본문 주석은 코드 변경 잔재로 실제 동작과 어긋날 수 있음. summary 의 동사 결정 시
  **codebase_notes 의 결정론 메타** (함수 식별자·키 → op) 가 항상 우선.

  - X: 본문 잔재 주석 `/* DBIO 단일 Insert처리 */` + 실제 함수 키 = UPDATE
       → summary 에 "신규 등록/INSERT 한다" 박음 (주석 환각)
    O: codebase_notes 의 UPDATE 매핑 보고 "갱신" 으로 서술. 본문 주석은 무시.

  - X: 본문에 모든 함수 공통 잔재 주석 박혀있음 → 모든 함수가 INSERT 처럼 보임
       (실제는 i/u/s/d 다양)
    O: 함수의 결정론 메타가 진실. 공통 잔재 주석 무시.

  ---

  ## [3] stereotype — 함수 역할 라벨

  실제 동작 기준 (이름·annotation 이 아니라 본문 동작). 허용 풀에서만 선택, 다른 값 X.

  ### 3.1 허용 풀 (15개)

  `ApplicationService` / `DomainService` / `Repository` / `Factory` / `Command` /
  `Query` / `Validator` / `Translator` / `Adapter` / `Strategy` / `EventHandler` /
  `Scheduler` / `Helper` / `Controller` / `Initializer`

  ### 3.2 결정 트리

  ```
  본문에 INSERT/UPDATE/DELETE 가 본질인가?
    → 예 → Command
    → 아니오 → 다음
  SELECT 만 + 결과 분기·계산·안내?
    → 예 → Query
    → 아니오 → 다음
  검증만 + 검증 결과 반환?
    → 예 → Validator (검증 후 쓰기 있으면 Command)
    → 아니오 → 다음
  DAO / DB 접근 일관 추상화?  → Repository
  객체 생성·조립 (생성된 객체 반환)?  → Factory
  이벤트·콜백 처리?  → EventHandler
  형식 변환·내외부 표현 매핑?  → Translator / Adapter
  분기 알고리즘 선택·실행?  → Strategy
  초기화·setup (main / init / @PostConstruct)?  → Initializer
  진입점 (HTTP / route / @Mapping)?  → Controller
  주기 실행·트리거?  → Scheduler
  비즈니스 흐름 조립 (여러 단계 합산)?  → ApplicationService / DomainService
  그 외 유틸성?  → Helper
  ```

  ### 3.3 reads / writes / codebase_notes 와 일관성

  - `reads` 만 있고 `writes` 없음 + `codebase_notes` op 가 SELECT 계열 → **Query** 후보.
  - `writes` 있음 + op 가 INSERT/UPDATE/DELETE → **Command** 후보.
  - 주석이 op 와 어긋나면 `reads`/`writes` + `codebase_notes` 가 진실. 주석에 끌려
    Command 로 잘못 판단하지 X (실제 잦은 오류 — 0.2 / 2.5 참조).

  ### 3.4 stereotype 안티패턴 — 안티패턴/정답 쌍

  - X: 함수명 `processOrder` 라서 **ApplicationService** 박음
    O: 본문이 단순 SELECT 뿐이면 **Query**, INSERT 가 본질이면 **Command**
  - X: try-catch 안 어찌됐든 어떤 처리 있으니 **EventHandler**
    O: 이벤트·콜백 시그니처가 아니면 EventHandler X

  ---

  ## [4] search_text — 검색 어휘 다리 (사용자 화면에 안 보임, 의미 검색 재료)

  ★ 이 필드는 `summary` 와 **이어붙여 하나의 벡터**가 된다 (`요약:{summary} | 검색:{search_text}`).
  그래서 둘은 역할이 다르고, 같은 말을 두 번 하면 벡터만 길어지고 정보는 늘지 않는다.

  | | summary | search_text | domain_terms |
  |---|---|---|---|
  | 형태 | 서술문 | **서술문** | 용어=뜻 나열 |
  | 코드 식별자 | 금지 | **괄호로 병기 필수** | 표제어 |
  | 담는 것 | 이 함수가 무엇을 하는지 | 이 함수를 **갈라주는 업무 사실** + 그 사실에 붙은 식별자 | 낯선 약어의 뜻 |

  ★ `search_text` 는 **문장이다.** 용어=뜻을 세미콜론으로 나열하지 마라 — 그건 [5] `domain_terms`
  의 책임이고, 여기서 또 하면 두 필드가 같은 일을 한다. summary 문장을 그대로 베끼지도 마라.

  ### 4.1 판별 기준 — 단 하나 (아래 4.2·4.3 은 이 기준의 적용일 뿐 별도 규칙이 아니다)

  > **① 이 문장이 이 함수를 다른 함수와 갈라주는가?**
  > **② 이 사실의 주인이 이 함수인가?** (자식이 하는 일을 대신 읊는 게 아닌가)

  둘 다 "예" 인 문장만 담는다.

  **①에서 탈락 — 어느 함수에나 똑같이 적히는 문장.** 주어가 함수·시스템 자신인 서술이
  전형이다: "실패 코드를 반환한다" · "오류를 로그에 적재한다" · "500건마다 커밋한다" ·
  "널 여부를 확인한다". 함수 백 개에 똑같이 붙어 모두를 닮게 만든다. 한 글자도 쓰지 마라.
  주어가 업무 대상이면 남긴다 — "확정된 정산은 재갱신이 거절된다".
  ★ 예외: 오류 코드를 안내 문구로 매핑하는 것이 **이 함수의 본업**이면 그 코드는 업무 대상이다.

  **②에서 탈락 — 자식의 분기를 부모가 복창하는 것.** ([[_common]] 단계 4 (c) 와 같은 원칙 —
  rules 뿐 아니라 이 필드에도 적용된다.) 부모는 자기 결정만 쓴다. 자식이 무슨 조건으로
  무엇을 거절하는지는 **그 자식이 쓴다.** 검색은 호출 관계를 따라 자식을 함께 물어온다.

  ### 4.2 담을 것 (①②를 통과한 것만) — 업무 서술문으로 쓰고, 식별자는 괄호로 붙인다

  1. **이 함수 고유의 업무 결정** — 판정 기준·임계값·거절 조건 (예: 1일 3회를 넘으면 거절).
  2. **그 사실에 붙은 코드 어휘** — 방금 쓴 업무 문장 안의 대상에 테이블명·컬럼명·식별자를
     괄호로 병기한다. 업무 말과 코드 말을 잇는 다리다.
     예(무관 도메인): "국제 선박식별번호(imo_no)로 입항 신고" / "선석 배정 테이블(BERTH_TB)".
  3. **업무 코드값** — 그 값이 이 함수의 결정을 가르는 경우에 한해 (`'BERTHED'`=접안중).
     함수 반환코드·에러 상수는 업무 코드값이 아니다 (①에서 탈락).

  ### 4.3 쓰지 말 것

  - **용어=뜻 나열 금지** — `a_cd=구분코드; b_yn=여부;` 식의 사전 나열은 [5] `domain_terms`
    의 책임이다. 여기는 **서술문**이다. 식별자 홀로 두지 말고 업무 문장 안에 괄호로 넣어라.
  - **분기 전수 나열 금지** — 갈래가 많으면 갈래마다 한 문장씩 쓰지 말고 **무엇을 기준으로
    갈리는지(결정 축)** 를 한 문장으로. 모든 갈래·모든 값의 완전한 목록은 **분할 3
    (`rules`/`examples`) 의 책임**이고 그쪽이 이미 빠짐없이 담는다. 여기서 또 담으면 벡터가
    흐려져 검색이 무너진다.
  - **코드 문장 복붙 금지** — SQL 원문·코드 라인·구조체 멤버 나열 X. 의미 문장으로.
  - **질문 생성 X** — 사실 서술문만. 줄바꿈 없이 한 문단.
  - **단순 노드(순수 위임·기술 처리)는 빈 문자열** — 억지로 채우지 X.

  ### 4.4 예 (무관 도메인: 선박 입항 — 패턴만 배우고 단어를 베끼지 마라)

  ✅ 정답 — 자기 결정 + 코드 어휘 병기. 짧다.

  > 입항 신고 취소. 접안이 시작된 배('BERTHED')는 취소할 수 없다. 입항 신고 테이블(ENTRY_TB)
  > 상태를 'CANCELED' 로 바꾸고 선석 배정 테이블(BERTH_TB)의 예약 선석을 해제. 환불액은 이미
  > 쓴 예인선 비용을 뺀 나머지.

  ❌ 오답 1 — 배관이 붙었다 (①탈락).

  > …선석을 해제. **송신 실패 시 오류 로그를 적재하고 실패 코드(RET_FAIL)를 반환. 1000건마다
  > 분할 커밋. 입력 버퍼는 초기화하고 널 여부를 확인.**

  ❌ 오답 2 — 자식 분기를 복창했다 (②탈락). 이 함수는 판정을 자식에게 맡길 뿐이다.

  > …취소 처리. **선석 점유 확인 함수는 상태가 '02'면 점유중, '03'이면 해제됨으로 보고,
  > 요금 계산 함수는 예인선 사용시간이 3시간 이상이면 할증을 적용하며, 전문 송신 함수는
  > 기관코드가 'P'면 항만공사로, 'C'면 세관으로 보낸다.**

  ❌ 오답 3 — 서술문이 아니라 **용어사전**을 썼다. 이건 [5] `domain_terms` 의 일이다.
  이런 나열은 업무 질문("입항 취소하면 선석은 어떻게 되나")에 절대 걸리지 않는다.

  > **entry_st_cd=입항상태코드('BERTHED'=접안중); berth_no=선석번호;
  > tug_fee=예인선비용; RET_FAIL=실패 반환코드**

  ---

  ## [5] domain_terms — 도메인 용어 조각 (용어사전 원천 재료, 화면 비노출)

  이 함수 본문·주석에 **실제로 등장하는** 도메인 약어·시스템명·전문 코드값의 "용어=뜻" 짝을
  세미콜론으로 나열한다. 나중에 전 함수의 조각을 모아 도메인 용어사전을 만든다.

  ### ★★★ 절대 규칙 1 — 표제어는 "이 함수 텍스트에 그 글자 그대로 실재하는 토큰"만 (위반 시 실패)

  표제어로 쓸 수 있는 것은 **이 함수 텍스트(코드와 주석 모두)에서 그대로 복사해 붙일 수
  있는 토큰뿐**이다: 변수명·함수명·테이블명·컬럼명·상수명·문자열 리터럴, 그리고 **주석에
  적힌 도메인 고유명**(시스템·기관·프로토콜·규격 이름).

  **★ 단어를 조합·변형·응용해 새 표제어를 만드는 것은 절대 금지.** 이것이 무한 생성의 원인이다.
  텍스트에 없는 말을 지어내면 끝없이 만들 수 있게 되어 출력이 폭주하고 분석이 실패한다.

  **판정법 (매 표제어마다 반드시 자문):**
  > "이 표제어를 이 함수 텍스트에서 Ctrl+F 로 검색하면 **똑같은 글자**가 나오는가?"
  > 안 나오면 **쓰지 마라.**

  → 후보는 이 함수 텍스트의 토큰 목록이라 **유한하다.** 훑고 나면 끝이다. 더 만들어내지 마라.

  **★ 주석 두 종류를 구별하라 (섞으면 사고):**
  - **비활성화된 코드**(주석 처리된 옛 로직·수식·분기) 안의 토큰 → 표제어 **X**. 실행되지
    않으므로 존재하지 않는 것으로 본다 ([[_common]] 단계 7).
  - **설명 주석**(이 변수·시스템·기관·규격이 무엇인지 알려주는 주석) 안의 도메인 고유명 →
    표제어 **O**. 코드에 없는 지식의 1차 근거이며, 오직 여기에만 등장하는 핵심 용어가 많다.

  ### ★★★ 절대 규칙 2 — 다 훑으면 끝. 개수를 채우려 하지 마라

  본문 식별자를 훑어 **낯선 것만** 담고, 더 없으면 **거기서 끝낸다.**
  억지로 개수를 채우지도, 아쉽다고 조합어를 지어내지도 마라. 하나도 없으면 빈 문자열.
  같은 개념은 표제어 **하나**로 끝낸다.

  ### 무엇을 고르나 — 기준은 하나: "업무(도메인) 개념을 가리키는가"

  이 사전은 업무 담당자의 질문을 코드로 잇는 다리다. 자문: *"현업 담당자가 업무 질문을
  하다가 이 단어에 도달할 수 있는가?"* → 그렇다면 넣고, 기술 배관이면 버린다.

  - ✅ 업무 개념을 담은 테이블·컬럼·변수명 (축약형이라 낯설수록 다리 가치가 큼)
  - ✅ 영문 약어 리터럴 · 외부 시스템/기관/프로토콜 이름 — **주석에만 등장해도 표제어다**
    (주석 표기가 코드 변수명과 다르면 둘 다 각자 표제어로: 예. 주석의 규격명과 그 축약 변수명)
  - ✅ 무슨 뜻인지 모를 상태·구분 코드 **컬럼명** — 뜻에 **코드값 매핑과 기준값을 반드시
    보존**(무관 도메인 예: `'A'=입항 'D'=출항` / `1일 상한 5건`) — 업무 질문이 정확히 이 값들로 온다
  - ❌ **기술 배관 — 업무 질문이 절대 도달하지 않는 것**: 프레임워크 리턴/에러 코드 상수,
    길이·버퍼 상수, 루프/임시 변수, 로깅·매크로 이름
  - ❌ 코드도 사람도 같은 말을 쓰는 일반 업무어 — 다리가 필요 없다
  - ❌ 순수 숫자·상태값 자체(`'03'`) — 표제어 X, 관련 **컬럼명의 뜻 안에서** 설명
  - ❌ 일반 프로그래밍 용어(INSERT·if·return)

  ### ★★★ 뜻 작성 — 근거주의 (이 함수 텍스트에 적힌 것만)

  뜻의 근거는 **이 함수 텍스트에 실제로 적힌 표현**(주석 포함)뿐이다. 주석은 이 용어가
  무엇인지 알려주는 **1차 근거**다 — 주석이 용어를 설명하고 있으면 그 설명을 뜻에 살려라.

  **규칙: 뜻 = ① 텍스트(주석)가 이 용어를 부르는 말 → ② 이 코드에서의 역할.**

  **★★ 정체 창작 절대 금지.** 이 용어가 무엇의 약자인지·어느 기관/회사/시스템인지가
  텍스트 어디에도 안 적혀 있으면 **정체를 추측해 쓰지 말고, 이 코드에서의 역할만 서술**하라.
  틀린 정체 하나가 사전 전체를 오염시킨다. 비슷한 이름의 다른 것(옆 주석의 다른 시스템명
  등)을 정체로 갖다 붙이는 것이 전형적 오염이다.

  아래는 **무관 도메인 예시**다. 패턴만 배우고 단어를 베끼지 마라.

  - 주석에 `/* IMO : 국제해사기구 선박 등록번호 */` 가 있으면 →
    ✅ `IMO=국제해사기구가 선박마다 부여하는 고유 등록번호` (주석 근거 그대로)
  - 주석에 `/* ndc_cd 체크 */` 뿐, 정체 설명이 없으면 →
    ✅ `ndc_cd=입고 검수 시 품목 식별에 쓰는 코드` (역할만)
    ❌ `ndc_cd=NDC(미국 의약품 표준 식별번호) 코드` (텍스트에 없는 정체 — 창작 금지)
  - 옆 주석에 다른 시스템명이 있다고 그것을 정체로 붙이기 →
    ❌ `HL7=HIS(병원정보시스템) 전문` (HL7 의 정체가 아니라 옆 단어를 갖다 붙임 — 오염)

  자문: **"이 뜻의 모든 명제를 이 함수 텍스트에서 손가락으로 짚을 수 있나?"**
  못 짚는 명제는 지워라. **표제어 자체는 텍스트 실재 토큰만** — 뜻도 텍스트 근거만.

  ### 예시 — 함수 텍스트에 이렇게 등장하면, 이렇게 뽑는다

  **함수 텍스트(무관 도메인 예):**
  ```
  /* HL7(병원 간 진료정보 교환 표준) 전문 버전 세팅 */
  strcpy(rq.hl7_ver, "2.5");
  if (memcmp(itf->in.ack_cd, "03", 2) == 0) { ... }  /* 수신거부 응답 */
  SELECT pat_reg_no, insr_typ_cd FROM hosp_pat_mst WHERE ...
  ```
  ✅ 정답 — 표제어는 **텍스트(코드·주석)에서 복사해 온 글자**, 뜻은 **텍스트 근거로**:
  ```
  HL7=병원 간 진료정보 교환 표준(주석 근거), 전문 버전 세팅에 사용; hl7_ver=HL7 전문 버전; ack_cd=상대 시스템 수신 응답 코드('03'=수신거부); hosp_pat_mst=병원 환자 기본정보 마스터 테이블; pat_reg_no=환자 등록번호; insr_typ_cd=보험 유형 구분 코드
  ```
  ❌ 오답 1 — 텍스트에 없는 **지어낸 조합어**(끝없이 만들 수 있어 폭주한다):
  ```
  HL7 메시지=...; HL7 메시지 문자열=...; 환자 마스터=...; 환자 등록번호 컬럼=...
  ```
  ❌ 오답 2 — 텍스트에 없는 **정체 창작**(틀리면 사전 전체 오염):
  ```
  ack_cd=ACK(미군 통신규약) 코드; hosp_pat_mst=HIS(병원정보시스템) 마스터
  ```

  **낯선 식별자가 없는 함수**(단순 위임·평이한 이름만) → `""` (빈 문자열)

