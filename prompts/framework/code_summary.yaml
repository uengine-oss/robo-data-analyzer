## code_summary — 분할 1: summary + stereotype + logical_name
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실.
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 1: 함수 의미 종합
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드

  - **이 분할이 하는 일**: `summary` + `stereotype` + `logical_name` + `search_text` + `domain_terms` 5 필드 채움
  - **이 분할이 안 하는 일**: 테이블별 컬럼 의미(→분할 2) / 비즈니스 규칙·시나리오·질문(→분할 3)
  - **출력 미리보기** (type + 값 예시):
    ```
    SummaryOutput {
      logical_name: "한 줄 도메인 표시명 (22자 전후, 체언 끝)",   // string
      summary:      "마커 없는 1~3줄 짧은 요약",                 // string ([핵심] 등 섹션 라벨 금지)
      stereotype:   "Command" | "Query" | "Validator" | ...      // 허용 풀 15개 중
      search_text:  "검색 전용 서술 — 분기·상태전이·코드값·테이블" // string (단순 노드는 빈 값)
      domain_terms: "SK-VAN=결제 승인을 중계하는 밴사 연동망; ..."  // string (없으면 빈 값)
    }
    ```

  ---

  ## 0. 작성 절대 원칙 — 모든 3 필드 공통

  ### 0.1 코드 식별자 박멸 ([[_common]] 단계 1 참조)
  메서드명·변수명·클래스명·매크로명·DBIO 식별자 그대로 X. **이름이 아니라 의미**.
  단 도메인 코드값 리터럴 (`'CARD'` / `'PAID'`) / 임계값 (₩50,000) / 상태값은 보존 OK.

  ### 0.2 본문 주석 환각 차단 ([[_common]] 단계 7 참조)
  본문 주석은 코드 변경 잔재로 실제 동작과 어긋날 수 있는 신호.
  codebase_notes 의 결정론 매핑 (함수 식별자·키 → op) 이 항상 우선.

  - X: 본문 라인 위 `/* 데이터 신규 등록 */` 주석 + 실제 함수 키 = UPDATE
       → summary "신규 등록" / logical_name "신규 등록" 박음 (주석 환각)
    O: codebase_notes 의 UPDATE 매핑 보고 summary "갱신" / logical_name "갱신" 사용.
       본문 주석은 무시.

  ### 0.3 추측 X ([[_common]] 단계 2 참조)
  본문 코드에 등장한 사실만 결과로 출력. 본문에 근거 없는 의미 추가 X.

  ### 0.4 모호 단어 박멸 ([[_common]] 단계 6 참조)
  "적절히 / 필요시 / 상황에 따라" 같은 표현 X. 조건과 결과를 분리해 명시.
  비교 정확 — "이상" ≠ "초과", "이하" ≠ "미만".

  ---

  ## [1] logical_name — 함수의 도메인 한 줄 표시명

  형제 함수(같은 모듈 안 다른 함수) 와 옆에 놓였을 때 **문장만 보고도 역할이 갈려야**
  합니다. 같은 모듈 안 어떤 형제와도 문자열 전체가 동일하면 안 됨 — 한 글자라도 다르게.

  ### 1.1 형식 / 길이 강제

  - **한 줄, 줄바꿈 X**.
  - **통상 22자 전후 이상** — 두세 단어 라벨 금지.
  - **체언·명사형 어미** — "갱신", "등록", "조회", "검증", "매핑", "결정", "반영", "차단",
    "복원", "송신", "수신", "전이", "확정", "취소".
  - **금지 어미** — "처리한다 / 한다 / 함" 같은 동사 어미.

  ### 1.2 결정 트리 (4 요소 중 ≥ 2 동시 드러내기)

  1. **무슨 행위** — 신규 등록 / 특정 컬럼 갱신 / 단건 조회 / 외부 호출 / 코드 결정 등
  2. **무슨 업무 데이터** — 주문 이력 / 결제 결과 / 회원 마스터 / 안내 문구 / 정산 마감 등
  3. **언제·어떤 분기** — 성공 경로만 / 오류 경로만 / 사전 점검 / 이미 확정 조회만
  4. **쓰기면 무엇을 바꾸는지** — 결과 코드 컬럼만 / 승인번호+시각 동시 / 상태만 등

  ### 1.3 좋은 예 (다양 도메인 — 6쌍)

  - 결제 도메인: "결제 승인 결과를 인증 이력 테이블에 신규 등록"
  - 회원 도메인: "회원 등급 변경 시 누적 포인트 만료일 갱신"
  - 안내 결정: "외부 인증 결과 코드에 따른 사용자 안내 문구 결정"
  - 정산 일괄: "주문 마감 후 미정산 건의 정산일자 일괄 확정"
  - 거절 매핑: "카드 결제 한도 초과 시 거절 사유 코드 매핑"
  - 큐 적재: "재고 부족 발생 시 백오더 큐 등록 + 알림 발송"

  ### 1.4 ★ 형제 차별 패턴 표 (같은 모듈 형제 함수와 안 겹치게 — 9 쌍)

  같은 도메인 모듈의 형제 함수들이 의미 비슷해 보여도 ★ 한 글자라도 달라야 함.
  형제 흔한 패턴별로 "짧은 광역 표현 (X)" vs "차별 축 2+ 드러난 한 줄 (O)":

  | 형제 패턴 | ❌ 짧은 광역 표현 (형제와 구분 0) | ✅ 차별 축 2+ 동시 드러난 한 줄 |
  |---|---|---|
  | 검증·준비    | "입력 검증"          | "결제 요청 금액·계좌형식·기관코드 사전 검증 및 거절코드 매핑"   |
  | 메인 호출    | "메인 처리"          | "외부 인증 호출 파라미터 조립·송신·응답 타임아웃 분기"          |
  | 이력 INSERT  | "이력 등록"          | "실시간 인증 최초 요청분 신규 이력 INSERT 및 요청키 채번 반영"  |
  | 이력 SELECT  | "이력 조회"          | "동일 거래키 최종 인증 결과행 단건 조회 후 후속 분기용 코드 적재" |
  | UPDATE A     | "결과 갱신"          | "응답코드·사유코드 컬럼만 성공 분기 UPDATE"                     |
  | UPDATE B     | "결과 적용"          | "승인번호·승인시각·매입사코드 컬럼 반영 이력 확정 UPDATE"       |
  | UPDATE C     | "오류 메시지 갱신"   | "고객 노출용 오류문구·내부 오류코드 컬럼만 실패 분기 UPDATE"    |
  | 메시지 결정  | "오류 결정"          | "은행·카드사별 오류코드를 안내 문구 리스트에서 결정해 OUT 세팅" |
  | 코드 검증    | "기관 코드 검증"     | "요청 기관코드 마스터 등록 여부 조회 후 미등록 시 즉시 거절"    |

  → 표 오른쪽 열처럼 형제와 첫 두 단어 조합이 다르게 / 차별 축 2+ 동시 드러나게.

  ### 1.5 logical_name 금지 패턴 — 안티패턴/정답 쌍

  **a. 메서드명·클래스명 그대로 박기**
  - X: "ProcessOrderService 의 processOrder 실행"
    O: "주문 결제 요청을 결제 모듈에 위임 후 결과 응답"
  - X: "checkInputValidation()"
    O: "결제수단·계좌번호 형식 검증 후 통과여부 반환"

  **b. 형제와 공통 광역 표현 단독**
  - X: "데이터 처리" (형제와 구분 0)
    O: "회원 등급 변경 시 누적 포인트 만료일 갱신"
  - X: "인증 수행"
    O: "외부 PG 인증 응답을 거래 이력에 'APPROVED' 또는 'DECLINED' 로 기록"

  **c. 코드 주석에 끌려 잘못된 동사 (★ 0.2 적용)**
  주석이 실제 DB 작업과 어긋나는 경우가 잦음. `codebase_notes` 의 op 매핑이 진실.
  주석 "Insert 처리" 라 적혀있어도 실제 op = SELECT 면 동사는 **조회·매핑** 계열.

  - X: 주석 `// 공통코드 신규 등록` 에 끌려 logical_name = "공통코드 상세 데이터 신규 등록"
       (실제 함수 키 = SELECT 함수)
    O: "공통코드 상세에서 인증결과 코드값 조회·매핑"
  - X: 주석 `// 상태 등록` (실제 UPDATE)
    O: "주문 상태를 'PAID' 로 갱신"

  **d. 빈 문자열·단순 위임 후 침묵**
  단순 위임 함수도 "어떤 서비스에 무엇을 넘겨 호출하는지" 까지는 적어야 함.

  - X: "" (위임만 있다고 빈 값)
    O: "결제 검증 결과를 외부 PG 모듈에 전달 후 응답 회수"

