## function_rules_examples (dbms) — 분할 3: 비즈니스 규칙 + Example Mapping + Questions
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실.
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 3: 비즈니스 규칙·시나리오·질문 추출
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드

  - **이 분할이 하는 일**: `rules` (비즈니스 규칙) + `examples` (given/when/then 시나리오)
    + `questions` (모호점 검토 큐) 3 배열.
  - **이 분할이 안 하는 일**: range 의미·역할(→분할 1) / 컬럼 의미(→분할 2)
  - **출력 미리보기**:
    ```
    RulesExamplesOutput {
      rules:     [{ rule_id, statement, flow_id, guard_rule_id, branch_from, coupled_domains }],
      examples:  [{ rule_id, description, given, when, then, is_boundary }],
      questions: [{ text, reason }]
    }
    ```

  ### 빈값 규칙

  - 단순 leaf / wrapper / 자식 결과 합본만 있는 부모: `rules: []` + `examples: []` 정답.
  - 코드 단서 명확 + 다른 분할에서 처리 가능: `questions: []` 정답 (환각 방지).

  ---

  ## [1] rules — 비즈니스 규칙

  ### Rule 결정 트리

  ```
  이 조건/분기가 도메인 정책·임계값·역할·상태·코드값 분기인가?
    → 예 → 결정 질문: "이 조건을 제거하면 사용자(고객/정산/감사) 결과가 달라지는가?"
            → YES → Rule O
            → NO  → Rule X (단순 기술 분기)
    → 아니오 → Rule X
  ```

  ### Rule 후보 — 하나라도 맞으면 O

  - 도메인 임계값·정책값 (마감일 이전 / 한도 초과 / 잔액 미달)
  - 역할·상태·유형 차등 (가맹점 '01' / 중계사 '02' 분기 / 정산상태 'CONFIRMED' 에서만)
  - 엔티티·컬럼 값 분기 (처리구분 '01'=신규 / '02'=수정 / '03'=취소)
  - 도메인 계산식 (수수료 = 거래금액 × 0.03, 단 최소 1000)
  - 정책 상수 / `RAISE_APPLICATION_ERROR` / 비즈니스 예외 코드

  ### Rule 제외 — 하나라도 맞으면 X

  - 트랜잭션 커밋 / 롤백 / 세이브포인트
  - 임시 변수 할당 / 변수 초기화
  - 순수 기술 예외 (NO_DATA_FOUND 일반 방어 / OTHERS 일반 catch)
  - 순수 방어 NULL 체크 (도메인 식별자 NULL 검증은 O)
  - 컨벤션 반복 관용구 (회사 에러 처리 패턴 / 표준 wrapper)

  ### NULL 구분 — 결정 질문

  - O Rule (도메인 검증): 정산코드·계좌번호 NULL → RAISE / NULL → 기본값 / 조건부 필수
  - X Rule (기술 방어): 내부 변수 NULL 방어 / OTHERS catch

  ### 자식 규칙 (child_business_logic) — 재추출 X, 분기 조건만 prefix

  이 range 가 부모면 `child_business_logic` 에 자식 range 들이 이미 추출한 규칙이 옵니다.

  **자식 규칙 처리 결정 트리**:
  ```
  child_business_logic 이 "(없음)" 인가?
    → 예 → 자기 raw 코드만으로 규칙 추출
    → 아니오 → 다음
  자식 규칙이 이미 자식 분석에서 추출됐는가?
    → 예 → 다시 추출하지 X (중복 emit 절대 금지)
    → 자기 range 의 분기 조건만 prefix 해서 통과
  자기 range 자체에 자식엔 없는 새 비즈니스 로직?
    → 예 → 새 Rule 추가 (ELSE fallback · EXCEPTION 메시지 등)
    → 아니오 → 추가 X
  ```

  안티패턴/정답 쌍:
  - X: 자식이 추출한 "주문 테이블에 INSERT" 를 부모가 다시 "주문 테이블에 INSERT" 로 출력
       (중복 emit)
    O: 자식 규칙 그대로 사용 + 자기 분기 조건만 prefix
       (자식 = "주문 테이블에 INSERT" / 자기 IF = "수량 10 이상" →
        통과되는 규칙 = "수량 10 이상이면 주문 테이블에 INSERT")

  ### IF / ELSIF / ELSE 상호배타 ([[_common]] §4.a 자세히)

  IF·ELSIF·ELSE 동시 실행 X. 형제 분기 조건을 자기 prefix 에 AND 결합 절대 금지.

  안티패턴/정답 쌍 (자식 prefix 모순):
  - X: `IF X='A' THEN <child1> ELSIF X='B' THEN <child2> END IF`
       child2 prefix = "X='A' AND X='B' 이면 ..." (동시 만족 불가능 — 환각)
    O: child2 prefix = "X='B' 이면 ..."
  - X: `IF amt >= 1000 THEN <child1> ELSIF amt >= 500 THEN <child2> END IF`
       child2 prefix = "금액 1000 이상 AND 금액 500 이상이면 ..." (1000 이상이면 child2 진입 X)
    O: child2 prefix = "금액 500 이상 1000 미만이면 ..."

  ### DECODE / CASE / NVL unmatched 환각 방지 ([[_common]] §4.b)

  명시된 case 만 정확히. unmatched 를 임의로 다른 case 와 묶지 X.

  안티패턴/정답 쌍:
  - X: `DECODE(STATUS, 'A', 1, 'B', 2)` 의 Rule statement = "STATUS 가 'A' 이면 1, 아니면 2"
       ('아니면' 으로 두 case 묶음 + unmatched 미명시)
    O: "STATUS 가 'A' 이면 1, 'B' 이면 2 산출 (그 외 NULL)" — Rule 1개에 분기 명시,
       또는 Example 에서 unmatched 케이스 별도 시나리오

  ### 분기 누락 금지 — 종료 경로 N 개 = Rule 의미 N 개

  body 의 종료 경로 N 개를 Rule 에 모두 반영. 빠뜨리면 상위 분석이 흐름을 잃음.

  - 각 도메인 분기마다 1 Rule (값마다 Example).
  - 에러 분기도 비즈니스 의미가 있으면 별도 Rule.
  - **silent pass 분기 명시** — `EXCEPTION WHEN NO_DATA_FOUND THEN NULL`,
    SQLCODE 흡수 등. "특정 코드는 조용히 통과" 자체가 도메인 정책.
  - 조기 `RETURN` / `EXIT` / `GOTO` 도 마찬가지.

  ### Rule 필드 6개

  - `statement` — `"<조건>이면 <결과>"` 10~30자. 코드 식별자 금지 (테이블·컬럼명 OK).
  - `rule_id` — "R1", "R2", ...
  - `flow_id` — "1" / "2" (메인) · "1-1" (R1 분기) · "2-1-1" (중첩).
  - `guard_rule_id` — 선행 Rule 통과 전제이면 "R1", 없으면 null.
  - `branch_from` — IF/ELSIF/CASE 갈래면 분기 원 Rule id, 없으면 null.
  - `coupled_domains` — `[]` 기본. 타 도메인 테이블 WRITE·값 분기·집계 시 도메인명 추가.

  ### 개수 가이드 (★ 무한 생성 금지)

  - **인위적 상·하한 없음**. 단순 leaf/wrapper 는 **0 정답**. 분기 많으면 분기 수만큼.

  ### ★ 무한 생성 자가 점검 (필수)

  Rule 작성 중 *다음 신호* 가 오면 즉시 멈추고 출력:

  - 같은 statement 가 미세하게 변주된 채 반복되고 있음.
  - 한 분기에 대해 동일 의미 Rule 이 2개 이상 생기고 있음.
  - 보통 PL/SQL 함수·프로시저는 3~7 Rule. **8개 넘어가는 충동은 분해 신호이지 더 만들 신호 X**.
    그 경우 의미 가장 큰 것만 남기고 압축, 또는 그대로 출력 후 종료.

  ---

  ## [2] examples — given/when/then 시나리오

  각 Rule 의 결과를 시나리오로. 자유 키 영역은 모두 `[{{ "key": "...", "value": "..." }}]`
  리스트로 출력 ([[_common]] §5 — Pydantic strict).

  ### Example 필드

  - `rule_id` — 참조 Rule id.
  - `description` — 사람용 한 줄 요약.
  - `given`:
    - `narrative` — 왜 이 시나리오인지 한 줄 (inputs 풀어쓰기 X).
    - `inputs` — `[{{ "key": "<파라미터/IN명>", "value": "<값/JSON>" }}]`.
    - `globals` — `[{{ "key": "<패키지변수>", "value": "<값/JSON>" }}]` — 전제 전역 상태.
    - `stubs` — `[{{ "key": "<외부 프로시저/함수>", "value": "<반환값/JSON>" }}]` — 스텁 반환값.
  - `when` — 자연어 한 줄 ("정산 마감 실행" / "거래 취소 요청"). 프로시저명·패키지명 X.
  - `then`:
    - `narrative` — 결과 핵심 한 줄.
    - `return_value` — OUT / 함수 반환 (단순값 또는 JSON 문자열). 반환 없으면 `""`.
    - `exception` — `null` 또는 `{{ "type": "RAISE_APPLICATION_ERROR", "code": "-20001", "message": "재고부족" }}`.
    - `reads` — `[{{ "table": "...", "columns": ["..."] }}]`.
    - `writes` — `[{{ "table": "...", "op": "INSERT|UPDATE|DELETE|MERGE", "where": [{{key,value}}], "values": [{{key,value}}] }}]`.
    - `globals` — `[{{ "key": "<패키지변수>", "value": "<값/JSON>" }}]` — 변경된 패키지 변수.
    - `out_params` — `[{{ "key": "<OUT명>", "value": "<값/JSON>" }}]` — 변경된 OUT.
  - `is_boundary` — true/false (이상/이하/초과/미만 경계).

  ### Example 작성 원칙

  - `given.inputs` = 이 Rule 까지 도달 가능한 전체 입력 (선행 가드 통과값 포함).
  - `then` = 관찰 가능한 모든 변화 (반환·예외·DB·전역·OUT) 빠짐 없이.
  - `reads` = 이 시나리오 접근 테이블·컬럼 (단순 SELECT 도 누락 X).
  - 변경 없으면 `[]` (필드 생략 X).
  - 값은 실제 리터럴만 (변수명·프로시저명 X).
  - JSON 유효 형식. 자유 키 dict 절대 X.

  ### Example 필수 커버리지

  - happy path + 경계 케이스.
  - `RAISE_APPLICATION_ERROR` Rule → 예외 시나리오 + 성공 시나리오 둘 다.
  - 1 Rule 이 복수 분기 커버 → 분기마다 example 별도.
  - **unmatched 케이스** (DECODE/CASE default 없음) → 그 시나리오도 별도 example.

  ### 개수 가이드 (★ 무한 생성 금지)

  - examples 총 **≤ 7개 권장**. 1 Rule 당 평균 1~2 example.
    더 필요하면 Rule 쪼개기 검토.

  ### ★ 무한 생성 자가 점검 (필수)

  - 같은 시나리오 변주가 3번 이상 반복되면 즉시 멈춤 (같은 happy path 미세 변주 X).
  - 자유 키 dict (`inputs` / `globals` / `stubs` / `reads` / `writes` / `out_params`)
    안에서 같은 키 반복 또는 의미 동일 entry 가 생기면 즉시 멈춤. 각 dict 의
    entries 는 시나리오 본질을 담는 범위까지만.

  ---

  ## [3] questions — 사람 검토 큐 (★ 환각 + 난사 동시 방지)

  코드만으로 답할 수 없는 모호함을 한 줄 질문으로.

  ### Question 필드 2개

  - `text` — 한 줄 질문 (예: "PROCESS_TYPE 컬럼의 '01'·'02'·'03' 코드값 의미는?")
  - `reason` — 코드 근거 없는 이유 (예: "본문에 리터럴은 박혀있으나 매핑 주석·상수 정의 / 마스터 테이블 SELECT 없음")

  ### Question 강제 조건 — 4가지 **모두** 만족해야 출력 ([[framework.function_rules_examples]] 와 동일 강제)

  하나라도 만족 못 하면 **출력 금지** (환각·난사 방지):

  1. **본문에 명확한 모호 단서** — 의미 알 수 없는 코드값 리터럴 / 매핑 없는 상수 / 정의 없는 외부 호출
  2. **코드 / callee_summary / codebase_notes / referenced_symbols 어디에도 답 없음**
  3. **이 range 의 분석 결과(Rule / Example 정확성) 에 직접 영향**
  4. **다른 Question 과 의미 중복 없음** — 한 모호점은 1 Question

  ### Question 금지 패턴

  - **답이 본문에 있는 질문** → 환각
  - **단순 호기심·일반 질문** ("이 프로시저는 왜 만들어졌나요?") → 분석 영향 0
  - **외부 시스템 일반 질문** ("외부 PG 가 어떻게 응답하나요?") → 본문 범위 밖
  - **분석 결과 영향 없는 질문** ("이 컬럼 옆 컬럼 의미?") → 영향 0

  ### 개수 가이드 (★ 난사 방지 — 직전 검증 이슈)

  - **상한**: range 당 **≤ 5개**. 초과하면 분석 자체가 모호한 것 — 도메인 컨텍스트 부족 신호.
  - **하한**: **0 정답** 정상. 강제로 만들지 X.
  - **중복 거부**: 같은 코드값 1 Question.

  ### 좋은 예 (3가지 DBMS 도메인)

  - 결제: "RESPONSE_CODE 의 '0000' / '0001' 외 코드값 분기 정책은?"
    reason: "본문에서 '0000', '0001' 만 분기. 마스터 테이블 SELECT·주석·상수 정의 없음"
  - 정산: "SETTLE_STATUS 의 'PENDING' / 'CONFIRMED' 외 상태값 의미는?"
    reason: "본문은 두 값만 분기. codebase_notes·상수 정의 부재"
  - 처리구분: "PROCESS_TYPE 의 '01' / '02' / '03' 각각의 비즈니스 의미와 후속 처리 차이는?"
    reason: "본문에 리터럴은 박혀 있으나 매핑 주석·상수 정의 / 마스터 테이블 SELECT 없음"

  ### 안티패턴/정답 쌍

  - X: "이 프로시저가 왜 호출되는가?" (분석 영향 X)
    O: Question 출력 X
  - X: 같은 상태값 Question 3개 ("STATUS 'A'?", "'B'?", "'C'?")
    O: Question 1개 ("STATUS 의 'A' / 'B' / 'C' 각각의 비즈니스 의미는?")
  - X: 본문 분기 명시된 사실 ("처리구분 '01' 의미는?" — 본문에 '신규' 주석 명시)
    O: Question X (본문에 답 있음)

  ---

  child_business_logic: (자식 range 들이 이미 추출한 규칙 — 재추출 X, 분기 조건만 prefix)
  {child_business_logic}

