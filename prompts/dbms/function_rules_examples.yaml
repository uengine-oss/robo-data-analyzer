## function_rules_examples (dbms) — 분할 3: 비즈니스 규칙 + Example Mapping + Questions
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실.
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 3: 비즈니스 규칙·시나리오·질문 추출
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드

  - **이 분할이 하는 일**: `rules` (비즈니스 규칙) + `examples` (given/when/then 시나리오)
    + `questions` (모호점 검토 큐) 3 배열.
  - **이 분할이 안 하는 일**: range 의미·역할(→분할 1) / 컬럼 의미(→분할 2)
  - **출력 미리보기** (type + 값 예시):
    ```
    RulesExamplesOutput {
      rules: [
        {
          rule_id: "R1",                            // string
          statement: "<조건>이면 <결과>",            // string 10~30자
          flow_id: "1" | "1-1" | "1-1-1",          // string — NEXT/BRANCH 엣지 자동
          coupled_domains: ["payment", "..."]       // list[string]
        }
      ],
      examples: [
        {
          rule_id: "R1",                            // string
          description: "한 줄 요약",                 // string
          given: "처리구분=01, 거래일자=20260530",    // ★ string 자연어 (공백·빈 영역 X)
          when:  "정산 마감 실행",                    // ★ string 한 줄
          then:  "RAISE_APPLICATION_ERROR -20001 재고부족", // ★ string 자연어
          affected_tables: [
            { table: "...", op: "READ"|"INSERT"|"UPDATE"|"DELETE"|"MERGE" }
          ]
        }
      ],
      questions: [
        { text: "string 한 줄 질문", reason: "string — 코드 근거 부재 사유" }
      ]
    }
    ```

  ---

  ## 0. 추출 절대 원칙 — 모든 영역 공통 강조

  rules / examples / questions 3 영역 모두에 적용되는 절대 원칙. 각 영역의 디테일
  (1.x / 2.x / 3.x) 보다 우선 작용한다. 위반 시 환각·폭주 사고 직결.

  ### 0.1 ★ 분기 난사 절대 금지

  body 의 IF / ELSIF / ELSE / CASE / 조건 마다 Rule 만들기 = 분기 난사 = 최악 안티패턴.
  body 분기 12 개여도 비즈니스 의미는 보통 1~3 가지로 수렴한다.

  ### 0.2 ★ 막무가내 채우기 = 환각 사고의 시작점

  "다 채워야 한다" 충동 = 환각. body 에서 가치 못 찾으면 빈 배열.
  rules 0 / examples 0 / questions 0 = 정상 결과.

  ### 0.3 ★ 한도 초과 = 누락 아니라 위반

  가치 결정 질문 (1.1) 통과 못 한 것 출력 = 사고. Pydantic max_length 와 무관 —
  **가치 자체로 한도**.

  ### 0.4 ★ 최대치 X / 빈 배열 = 정상

  examples 도 모든 분기 조합 채우려 X.
  단순 leaf / wrapper / 자식 결과 합본만인 부모: `rules: []` + `examples: []` 정답.
  자기 range 에 비즈니스 로직 0 이면 빈 배열이 정답.

  ### 0.5 ★ 출력 양식 충돌 = 실제 폭주 직접 원인 (★ 가장 강조)

  과거 examples 길이 길어지면 토큰 패턴 반복 루프에 갇혀 **17만 자 / 10만 자
  무한 폭주 사고** 발생.

  ★ examples 짧게 끝내는 것 = 최우선:
  - rule 당 examples 1~2 개
  - given / then = 자연어 한 줄 (모든 분기 조합 X)
  - 빈 영역은 빈 list `[]` 또는 `null`

  ### 0.6 ★ 공백·인덴트로 끝낼 수 없음 (★ 절대 금지)

  - 어떤 string 필드도 빈 값·공백·줄바꿈만으로 끝낼 수 없음. 항상 의미 있는 한 줄.
  - `"key":` 적었으면 즉시 값 토큰 (`"문자열"`) 작성. 콜론 뒤 공백 무한 출력 X.
  - JSON 닫는 `}` / `]` 즉시 작성. 다음 토큰 망설여 공백 늘이기 X.

  ---

  ## [1] rules — 비즈니스 규칙 (★ 진짜 비즈니스 가치만)

  ### 1.1 가치 결정 트리 — 단일 입구 (모든 후보·NULL·검증 통합)

  body 의 분기·조건·NULL 체크·검증 절은 **이 질문 하나로 결판**:

  ```
  이 조건을 제거하면 사용자(고객 / 정산 / 감사) 결과가 달라지는가?
    → YES → Rule O (도메인 가치 있음)
    → NO  → Rule X (단순 기술 분기 — 폐기)
  ```

  **질문 통과 후보** (Rule 적격):

  - 도메인 임계값·정책값 (마감일 이전 / 한도 초과 / 잔액 미달)
  - 역할·상태·유형 차등 (가맹점 '01' / 중계사 '02' 분기 / 정산상태 'CONFIRMED' 에서만)
  - 엔티티·컬럼 값 분기 (처리구분 '01'=신규 / '02'=수정 / '03'=취소)
  - 도메인 계산식 (수수료 = 거래금액 × 0.03, 단 최소 1000)
  - 정책 상수 / `RAISE_APPLICATION_ERROR` / 비즈니스 예외 코드

  **질문 FAIL = Rule 절대 X** (Rule 부적격):

  - 트랜잭션 커밋 / 롤백 / 세이브포인트
  - 임시 변수 할당 / 변수 초기화
  - 순수 기술 예외 (`NO_DATA_FOUND` 일반 방어 / `OTHERS` 일반 catch)
  - 순수 방어 NULL 체크 (도메인 식별자 NULL 검증은 O)
  - 컨벤션 반복 관용구 (회사 에러 처리 패턴 / 표준 wrapper)

  ### 1.2 NULL 구분 — 결정 질문 적용

  - ✓ **O Rule (도메인 검증)**:
    - 정산코드·계좌번호 NULL → RAISE
    - NULL → 기본값 (COALESCE / NVL 패턴)
    - 조건부 필수
  - ✗ **X Rule (기술 방어)**:
    - 내부 변수 NULL 방어 / OTHERS catch

  ### 1.3 ★ 검증 전용 프로시저 정책 — Rule 1~3 수렴 (★ 가장 중요)

  프로시저 전체가 검증이면 (`PKG_VALIDATE_*` / `*_CHECK_PROC` / `*_VERIFY` /
  `validate_input` 등) body NULL 체크 10+ 개여도 — 같은 의미 다발은
  **1 Rule + 필드마다 Example** 로 수렴한다:

  - **Rule 1** — 필수 도메인 식별자 누락 → `RAISE_APPLICATION_ERROR` (거래일자·통화·금액·기관코드 등)
  - **Rule 2** — 조건부 필수 (특정 거래·기관·결제수단일 때만 부가 필드 필수)
  - **Rule 3** — 기본값 매핑 (NULL → 도메인 기본값, COALESCE / NVL 패턴)

  필드별 시나리오는 각 Rule 의 Example 에 분리. `RAISE_APPLICATION_ERROR(-20001, ...)`
  같은 사용자 예외도 Rule 1 통합 (개별 에러 코드는 Example).

  - ★ **Rule 4 개 넘으면 의미 합성 사고** — 통합 재검토.
  - ★ body 12+ 분기여도 비즈니스 의미는 보통 1~3 가지 수렴.
  - ★ body 가 단순 NULL 체크 + 즉시 RAISE 만이면 **Rule 1 개로 충분**.

  ### 1.4 자식 규칙 (`child_business_logic`) — 재추출 X, 분기 조건만 prefix

  이 range 가 부모면 `child_business_logic` 에 자식 range 들이 이미 추출한 규칙이
  옵니다.

  ```
  child_business_logic 이 "(없음)" 인가?
    → 예 → 자기 raw 코드만으로 규칙 추출
    → 아니오 → 다음
  자식 규칙이 이미 자식 분석에서 추출됐는가?
    → 예 → 다시 추출하지 X (★ 중복 emit 절대 금지)
    → 자기 range 의 분기 조건만 prefix 해서 통과
  자기 range 자체에 자식엔 없는 새 비즈니스 로직?
    → 예 → 새 Rule 추가 (ELSE fallback · EXCEPTION 메시지 등)
    → 아니오 → 추가 X
  ```

  - X: 자식이 추출한 "주문 테이블 INSERT" 를 부모가 다시 출력 (중복 emit)
    O: 자기 IF "수량 10 이상" → 통과 규칙 = "수량 10 이상이면 주문 테이블 INSERT"

  ### 1.5 IF / ELSIF / ELSE 상호배타 ([[_common]] §4.a)

  IF·ELSIF·ELSE 동시 실행 X. 형제 분기 조건을 자기 prefix 에 AND 결합 절대 금지.

  - X: `IF X='A' THEN <c1> ELSIF X='B' THEN <c2>` 의 c2 prefix =
       "X='A' AND X='B' 이면 ..." (모순)
    O: c2 prefix = "X='B' 이면 ..."
  - X: `IF amt >= 1000 THEN <c1> ELSIF amt >= 500 THEN <c2>` c2 prefix =
       "1000 이상 AND 500 이상이면 ..." (1000 이상이면 c2 진입 X)
    O: c2 prefix = "500 이상 1000 미만이면 ..."

  ### 1.6 DECODE / CASE / NVL unmatched 환각 방지 ([[_common]] §4.b)

  명시된 case 만 정확히. unmatched 를 임의로 다른 case 와 묶지 X.

  - X: `DECODE(STATUS, 'A', 1, 'B', 2)` Rule = "STATUS 'A' 이면 1, 아니면 2"
       (unmatched 미명시)
    O: Rule 1 "STATUS 'A' 이면 1, 'B' 이면 2 (그 외 NULL)" — 분기 명시

  ### 1.7 Rule 필드 4 개

  - `rule_id` — "R1", "R2", ... (단일 식별).
  - `statement` — `"<조건>이면 <결과>"` 10~30자.
    코드 식별자 박지 마 (프로시저명·패키지명·변수명 등 — [[_common]] 단계 2 참조).
    테이블·컬럼명·도메인 코드값 리터럴은 보존 OK.
  - `flow_id` — 제어 흐름 위치:
    - `"1"` / `"2"` / `"3"` — 메인 흐름 순서 (NEXT 엣지 자동 도출)
    - `"1-1"` — R1 의 분기 (BRANCH 엣지 자동 도출)
    - `"1-1-1"` — 중첩 분기
  - `coupled_domains` — `[]` 기본. 타 도메인 테이블 WRITE·값 분기·집계 시 도메인명 추가.

  ### 1.8 rules 영역 한정 정책

  **(a) 개수 한도 — 가치 자체로 한도 (인위적 상·하한 X)**:
  - body 분기 12 개여도 Rule 8 개 넘으면 의미 합성 사고 신호
  - Rule 8 개 넘는 프로시저 = **분해 권고 question 으로 표면화** (인위적 압축 X)

  **(b) 값별 통합 — Rule N → 1 + Example N** (★ 폭주 직접 원인 차단):
  - 처리구분 3 값마다 Rule 3 X / Rule 1 + Example 3 O
  - 응답코드 10 코드마다 Rule 10 X / Rule 1 + Example 10 O

  **(c) 종료 경로 빠짐 X** ([[_common]] 단계 5 참조):
  - silent pass — `EXCEPTION WHEN NO_DATA_FOUND THEN NULL` / SQLCODE 흡수 명시
  - 에러 분기에 비즈니스 의미 있으면 별도 Rule (단순 기술 에러 X)
  - 조기 `RETURN` / `EXIT` / `GOTO` 분기

  ### 1.9 rules 영역 한정 안티패턴 (★ 절대 금지)

  **a. 기술 관심사 → Rule** (★ 환각)
  - X: Rule "COMMIT 실행" / "임시 변수 초기화"
    O: Rule X (트랜잭션 관리·내부 메커니즘)

  **b. 값별 과한 세분화** (★ 폭주 직접 원인)
  - X: 처리구분 3 값마다 Rule 3 ("01 이면 ..." / "02 이면 ..." / "03 이면 ...")
    O: Rule 1 "처리구분별 분기 처리" + Example 3 (값마다 시나리오)

  **c. 분기 난사** (★ 가장 흔한 사고)
  - X: body IF/ELSIF/CASE 매 갈래마다 Rule 1개씩 → Rule 12 개
    O: 가치 결정 질문 (1.1) 통과만 — 보통 1~3 개

  **d. 자식 Rule 부모로 끌어올림** ([[_common]] 단계 4 + 1.4 참조 — 절대 금지)
  - X: 자식 range 가 입력검증 Rule 8 개 → 부모도 그 8 개를 자기 Rule 로 출력
    O: Rule 1 "입력 검증 위임 (실패 시 RAISE_APPLICATION_ERROR 전파)"

  **e. 분기 누락 — silent pass 미명시** ([[_common]] 단계 5 참조)
  - X: Rule "조회 후 결과 반환" 만 (`NO_DATA_FOUND` silent pass 누락)
    O: Rule 2 — 1) "조회 결과 있으면 반환" 2) "`NO_DATA_FOUND` 면 `EXCEPTION WHEN NULL`
       로 통과 (이미 처리됨 / 미존재가 정상)"

  ---

  ## [2] examples — given/when/then 시나리오 (★ rule 당 1~2 개)

  ### 2.1 Example 필드 6 개

  - `rule_id` — 참조 Rule id.
  - `description` — 시나리오 사람용 한 줄 요약 (이 한 줄이 narrative 단일 진실).
  - `given` — **자연어 한 줄** (진입 조건).
    예: "처리구분=01, 거래일자=20260530" / "iFlag=0, 오류코드=X001"
    핵심 입력 3-5 개 정도 콤마 결합. 모든 IN 채우려 X.
  - `when` — **자연어 한 줄** (자극·트리거).
    예: "정산 마감 실행" / "거래 취소 요청"
    프로시저명·패키지명 X.
  - `then` — **자연어 한 줄** (관찰 결과).
    예: "RAISE_APPLICATION_ERROR -20001 재고부족" / "OUT cd=RC_NRM 반환"
    반환·OUT·예외·전역 변화를 자연어로 결합. 보통 1~2 가지.
  - `affected_tables` — `[{{ "table": "...", "op": "READ|INSERT|UPDATE|DELETE|MERGE" }}]`.
    이 시나리오에서 영향받는 테이블만 (body R/W 와 일관). 없으면 `[]`.

  ### 2.2 ★★ 개수 정책 — rule 당 1~2 (★ 폭주 차단 핵심)

  **★ 1 Rule 당 examples 1~2 개로 충분**. 최대치 X. 모든 분기 조합 채우려 X.

  - **happy path 1 개** — 정상 경로 (가장 흔한 시나리오).
  - **예외 1 개** (Rule 이 `RAISE_APPLICATION_ERROR` 일 때만) — 실패 분기.
  - **★ 그 외 변주 X** — "다른 입력값" 미세 변주는 1 개로 통합:
    - description 한 줄에 "X 값 5종 모두 거절" 처럼 통합 표현
  - **0 정답 가능** — Rule 0 이면 examples 0.

  ### 2.3 examples 영역 한정 디테일 — 짧게 끝내기

  **0.5 / 0.6 의 examples 적용**:
  - `given` = 시나리오 본질 키 3-5 개 이내. 프로시저의 모든 IN 채우려 X.
  - `when` = 한 줄.
  - `then` = 1~2 가지 결과 자연어 결합.
  - `affected_tables` = body R/W 와 일관. 가짜 테이블 X.

  ### 2.4 examples 영역 한정 안티패턴 — 실제 폭주 사례 (★ 못 박기)

  **a. 분기 조합 다 채우기** (★ 실 사고 — 17만 자 폭주)
  - X: 검증 프로시저에서 "결제수단 5 × 고객번호 유무 × 해외카드" 조합 매 케이스
    → 같은 패턴 무한 반복 → 폭주
    O: example 1~2 ("필수 필드 누락 시 RAISE" 한 케이스로 통합)

  **b. 같은 시나리오 변주**
  - X: "처리구분 01 정상" / "처리구분 02 정상" / "처리구분 03 정상" 3 개
    O: 1 개 ("처리구분 모든 값 정상 처리" 통합)

  **c. inputs 모든 IN 채우기**
  - X: 프로시저 IN 20 개 모두 example.given 에 채움 → 토큰 폭증
    O: 시나리오 본질 3-5 개 키만

  **d. 공백·인덴트만 출력** (★ 실 사고 — 10만 자 공백 폭주)
  - X: `"given":` 적고 값 토큰 망설여 공백·줄바꿈만 무한 출력
    O: `"given": "iFlag=0, 오류코드=X001"` 즉시 의미 있는 한 줄 작성

  ---

  ## [3] questions — ★★ 0 이 가장 좋은 답 (★ 가장 강조)

  ### 3.1 의미 — 컨텍스트만으로 알 수 없는 것만

  Question 의 본질 = **"코드·callee_summary·codebase_notes·referenced_symbols
  어디에도 답 없음"** + **"분석 결과 (Rule / Example) 정확성에 직접 영향"** 모두 만족.

  ★ **사실 추측 X** — body 에 답 있는데 안전망으로 묻는 건 환각.

  ### 3.2 Question 필드 2 개

  - `text` — 한 줄 질문.
    예: "PROCESS_TYPE 컬럼의 '01'·'02'·'03' 코드값 의미는?"
  - `reason` — 코드 근거 없는 이유.
    예: "body 에 리터럴은 박혀있으나 매핑 주석·상수 정의 / 마스터 SELECT 없음"

  ### 3.3 강제 조건 — 4 가지 **모두** 만족해야 출력 (★ 환각·hang 차단)

  하나라도 만족 못 하면 출력 금지:

  1. **body 에 명확한 모호 단서** — 의미 알 수 없는 코드값 리터럴 / 매핑 없는 상수 /
     정의 없는 외부 호출
  2. **코드 / callee_summary / codebase_notes / referenced_symbols 어디에도 답 없음**
  3. **이 range 의 Rule / Example 정확성에 직접 영향** — 도메인 의미 / 시나리오 정확성에
     미치는 영향이 명확
  4. **다른 Question 과 의미 중복 없음** — 한 모호점 = 1 Question

  ### 3.4 Question 금지 패턴 — 절대 출력 X

  - **답이 body 에 있는 질문** — 환각 (가장 흔한 사고). 코드에 사실 있으면 그게 답.
  - **단순 호기심·일반 질문** — "이 프로시저는 왜 만들어졌나요?" → 분석 영향 0.
  - **외부 시스템 일반 질문** — "외부 PG 가 어떻게 응답하나요?" → body 범위 밖.
  - **분석 결과 영향 없는 질문** — Rule / Example 어느 것에도 영향 없으면 X.

  ### 3.5 ★★ 개수 정책 — 0 = 최고의 답 (★★ 가장 강조)

  - **★★ 0 = 최고의 답** — 의심 0 = 분석 완성도 ★. **빈 배열 통과는 정상 결과**.
  - **★★ 억지 추출 = 환각 사고** — "혹시 모를 안전망" 으로 1~2 개 출력 = hang 의 원인.
  - **★ 4 조건 (3.3) 못 채우면 그 자리에서 폐기** — 약간이라도 의심 있으면 폐기.
  - **인위적 상·하한 X** — 진짜 모호점만.
  - **중복 거부** — 같은 코드값에 대한 Question 1 개로 통합 (값마다 쪼개기 X).
  - 너무 많아지면 도메인 컨텍스트 부족 신호 — 우선순위 진짜 모호점만 1~2 개.

  ### 3.6 좋은 예 (3 DBMS 도메인) + 안티패턴

  **좋은 예**:

  - 결제: "RESPONSE_CODE 의 '0000' / '0001' 외 코드값 분기 정책은?"
    reason: "body 에서 '0000' / '0001' 만 분기. 마스터 SELECT·주석·상수 정의 없음"
  - 정산: "SETTLE_STATUS 의 'PENDING' / 'CONFIRMED' 외 상태값 의미는?"
    reason: "body 는 두 값만 분기. codebase_notes·상수 정의 부재"
  - 처리구분: "PROCESS_TYPE 의 '01' / '02' / '03' 각각의 비즈니스 의미와 후속 처리 차이는?"
    reason: "body 에 리터럴은 박혀 있으나 매핑 주석·상수 정의 / 마스터 SELECT 없음"

  **안티패턴/정답 쌍**:

  - X: "이 프로시저가 왜 호출되는가?" (분석 영향 X)
    O: Question 출력 X
  - X: 같은 상태값 Question 3 ("STATUS 'A'?", "'B'?", "'C'?")
    O: Question 1 ("STATUS 의 'A' / 'B' / 'C' 각각의 비즈니스 의미는?")
  - X: body 분기 명시 사실을 Question ("처리구분 '01' 의미는?" — body '신규' 주석 명시)
    O: Question X (body 에 답 있음)

  ---

