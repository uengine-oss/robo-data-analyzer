  ## 이 분할의 일 — 비즈니스 규칙·시나리오·질문 추출 (rules + examples + questions)

  ### 이 분할 고유 원칙

  1. **비즈니스 규칙만 추출**. 기술 관심사 (트랜잭션 커밋 / 예외 로깅 / 임시 변수 / NULL 방어) 는 Rule X.
  2. **컨벤션 우선**. 회사 wrapper / 표준 에러 처리 매크로는 Rule X — 반복 관용구.
  3. **인위적 개수 강제 X**. 단순 leaf / wrapper 는 Rule 0 정답.

  ---

  ## [1] rules — 비즈니스 규칙

  ### Rule 후보 — 하나라도 맞으면 O

  - 도메인 임계값 / 정책 값 (마감일 이전 / 한도 초과 / 잔액 미달).
  - 역할·상태·유형 차등 (가맹점 '01' / 중계사 '02' 분기 / 정산상태 'CONFIRMED' 에서만).
  - 엔티티·컬럼 값 분기 (처리구분 '01'=신규 / '02'=수정 / '03'=취소).
  - 도메인 계산식 (수수료 = 거래금액 × 0.03, 단 최소 1000).
  - 정책 상수 / `RAISE_APPLICATION_ERROR` / 비즈니스 예외 코드.

  ### Rule 제외 — 하나라도 맞으면 X

  - 트랜잭션 커밋 / 롤백 / 세이브포인트.
  - 임시 변수 할당 / 변수 초기화.
  - 순수 기술 예외 (NO_DATA_FOUND 일반 방어 / OTHERS 일반 catch).
  - 순수 방어 NULL 체크 (도메인 식별자 NULL 검증은 O).
  - 컨벤션의 반복 관용구 (회사 에러 처리 패턴).

  ### NULL 구분 — 결정 질문

  - O Rule: 도메인 식별자 NULL 검증 (정산코드·계좌번호 NULL → RAISE) / NULL → 기본값 / 조건부 필수.
  - X Rule: 내부 변수 NULL 방어 / OTHERS catch.
  - 결정 질문: "이 조건을 제거하면 사용자 (고객/정산/감사) 결과가 달라지는가?" YES → Rule.

  ### 자식 규칙 (child_business_logic) — 재추출 X, 분기 조건만 prefix

  이 range 가 부모면 `child_business_logic` 에 자식 range 들이 이미 추출한 규칙이 온다.
  - 자식 규칙은 **다시 추출하지 X** — 자식 책임. 같은 규칙 중복 emit 절대 금지.
  - 자식 규칙 각각에 **자기 range 의 분기 조건만 prefix** 해서 통과
    (예: 자식 = "주문 테이블에 INSERT" / 자기 IF = "수량 10 이상" → "수량 10 이상이면 주문 테이블에 INSERT").
  - 자기 range 자체에 자식엔 없는 새 비즈니스 로직이 있을 때만 새 Rule 추가 (ELSE fallback · EXCEPTION 메시지 등).
  - child_business_logic 이 "(없음)" 이면 자기 raw 코드만으로 규칙 추출.

  ---

  ## ★ IF / ELSIF / ELSE 상호배타 — 가장 흔한 환각 원인

  IF·ELSIF·ELSE 는 동시에 둘 이상 실행되지 X. 한 분기 자식이 다른 분기 조건을 자기 진입 조건으로 가져가면 동시 만족 불가능한 모순 prefix 가 생긴다.

  진입 조건:
  - 첫 IF 분기 → 자기 IF 조건만.
  - n 번째 ELSIF 분기 → 자기 ELSIF 조건만 (앞 분기 부정은 묵시).
  - ELSE → "그 외의 경우" / "다른 분기 미충족 시".

  ★ 절대 금지 — 모순 prefix:
  - 형제 분기 조건을 AND 로 자기 prefix 에 결합 (X='A' AND X='B' 동시 만족 불가능 모순).
  - 비교 변수 같아도 값 다르면 동시 만족 불가 → AND 결합 X.

  ✓ 정상 — `IF qty >= 10 THEN <INSERT> END IF`:
    "수량이 10 이상이면 주문 테이블에 INSERT"
  ✗ 환각 — `IF X='A' THEN ... ELSIF X='B' THEN ... END IF` 의 ELSIF 자식 prefix:
    잘못: "X='A' AND X='B' 이면 ..." (모순)
    옳음: "X='B' 이면 ..."

  ---

  ## ★ DECODE / CASE unmatched 환각 방지

  명시된 case 만 정확히. unmatched 를 임의로 다른 case 와 묶지 X.

  - `DECODE(X, v1, r1, v2, r2)` (default 없음) → unmatched = NULL.
  - `CASE WHEN ... THEN ... END` (ELSE 없음) → unmatched = NULL.

  ✓ "STATUS 가 'A' 이면 1, 'B' 이면 2 산출 (그 외 NULL)".
  ✗ "STATUS 가 'A' 이면 1, 아니면 2" ('아니면' 으로 두 case 묶음 — 금지).

  ---

  ### Rule 필드

  - `statement`: "<조건>이면 <결과>" 10~30자. 코드 식별자 금지 (테이블·컬럼명은 OK).
  - `rule_id`: "R1", "R2", ...
  - `flow_id`: "1" / "2" (메인) · "1-1" (R1 분기) · "2-1-1" (중첩).
  - `guard_rule_id`: 선행 Rule 통과 전제이면 "R1", 없으면 null.
  - `branch_from`: IF/ELSIF/CASE 갈래면 분기 원 Rule id, 없으면 null.
  - `coupled_domains`: [] 기본. 타 도메인 테이블 WRITE·값 분기·집계 시 도메인명 추가.

  ---

  ## [2] examples — given/when/then 시나리오

  각 Rule 의 결과를 시나리오로:

  - `rule_id`: 참조 Rule id.
  - `description`: 사람용 한 줄 요약.
  - `given`:
    - `narrative`: 왜 이 시나리오인지 한 줄 (inputs 풀어쓰기 X).
    - `inputs`: `[{{ "key": "<파라미터/IN명>", "value": "<값/JSON>" }}]`.
    - `globals`: `[{{ "key": "<패키지변수>", "value": "<값/JSON>" }}]` — 전제 전역 상태.
    - `stubs`: `[{{ "key": "<외부 프로시저/함수>", "value": "<반환값/JSON>" }}]` — 스텁 반환값.
  - `when`: 자연어 한 줄 ("정산 마감 실행" / "거래 취소 요청"). 프로시저명·패키지명 X.
  - `then`:
    - `narrative`: 결과 핵심 한 줄.
    - `return_value`: OUT 파라미터 / 함수 반환값 (단순값 또는 JSON 문자열). 반환 없으면 "".
    - `exception`: null 또는 `{{ "type": "RAISE_APPLICATION_ERROR", "code": "-20001", "message": "재고부족" }}`.
    - `reads`: `[{{ "table": "...", "columns": ["..."] }}]`.
    - `writes`: `[{{ "table": "...", "op": "INSERT|UPDATE|DELETE|MERGE", "where": [{{key,value}}], "values": [{{key,value}}] }}]`.
    - `globals`: `[{{ "key": "<패키지변수>", "value": "<값/JSON>" }}]` — 변경된 패키지 변수.
    - `out_params`: `[{{ "key": "<OUT명>", "value": "<값/JSON>" }}]` — 변경된 OUT.
  - `is_boundary`: true/false (이상/이하/초과/미만 경계).

  ### key/value 표기 규칙

  자유 키 영역(inputs / globals / stubs / out_params / where / values) 은 모두
  `[{{ "key": "...", "value": "..." }}]` 리스트로 출력. 값이 객체이면 value 안에 JSON
  문자열로 직렬화. 빈 영역은 `[]`.

  ### narrative 규칙

  "왜" / "결과 핵심" 만 한 줄. inputs / return / writes 의 값 풀어 쓰지 X (해당 필드에 이미 있음).

  ### Example 필수 커버리지

  - happy path + 경계 케이스.
  - `RAISE_APPLICATION_ERROR` Rule → 예외 시나리오 + 성공 시나리오 둘 다.
  - 1 Rule 이 복수 분기 커버 → 분기마다 example 별도.

  ### 개수 가이드

  - examples 총 ≤ 7개 권장.

  ---

  ## [3] questions — 사람 검토 큐

  코드만으로 답할 수 없는 모호함을 한 줄 질문으로:

  - text: 한 줄 질문 (예: "PROCESS_TYPE 컬럼의 '01'·'02'·'03' 코드값 의미는?")
  - reason: 코드 근거 없는 이유 (예: "본문에 리터럴은 박혀있으나 매핑 주석·상수 정의 / 마스터 테이블 SELECT 없음").

  ★ 코드 단서가 분명한 사실은 Question X (환각 방지).
  ★ Question 0 도 정상 (Rule·Example 과 독립).

  ---

  ## 이 분할 추가 규칙

  rules 0개도 valid (단순 leaf / wrapper). 그 경우 examples 도 [].

  ### 분기 누락 금지 — 모든 종료 경로 + silent pass

  본문에 분기가 N개면 비즈니스 Rule 도 그 분기 수와 의미를 반영해야 한다. 빠뜨리면
  상위(caller·부모) 분석이 흐름을 잃는다.

  - **각 도메인 분기마다 1 Rule** (값마다 Example) — IF/ELSIF/CASE 갈래가 도메인
    의미가 다르면 빠뜨림 없이.
  - **에러 분기도 비즈니스 의미가 있으면 별도 Rule** — 단순 RAISE 가 아니라 도메인
    의사결정이면 Rule.
  - **silent pass 분기 명시** — 에러 신호 (SQLCODE/NO_DATA_FOUND/null 등) 를
    받았으나 처리 없이 통과하는 분기는 의미상 별도 흐름. "특정 코드는 조용히 통과"
    자체가 도메인 정책일 수 있음 → Rule 후보.
  - **조기 return / EXIT / GOTO** 로 인한 분기도 마찬가지.

  마인드셋: 종료 경로가 N개면 Rule 도 비즈니스 의미가 있는 만큼. 한 흐름만 적고
  다른 흐름 빠뜨리지 말 것. 언어 무관.

  child_business_logic: (자식 range 들이 이미 추출한 규칙 — 재추출 X, 분기 조건만 prefix)
