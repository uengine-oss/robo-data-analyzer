## code_summary_batch (dbms 분할 1) — 배치 안 각 노드의 summary + stereotype + logical_name.
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실 (extends).
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 1: 노드 의미 종합 (배치 안 모든 노드)
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드

  - **이 분할이 하는 일**: 각 노드마다 `summary` + `stereotype` + `logical_name` + `search_text` + `domain_terms` 5 필드 채움.
  - **이 분할이 안 하는 일**: 테이블별 컬럼 의미(→분할 2) / 비즈니스 규칙·시나리오·질문(→분할 3).
  - **출력**: `nodes` 배열 — 입력 `### 노드 <key>` 마다 1 항목.
    ```
    BatchSummaryItem {
      node_key:     "<start>-<end>",                           // 입력 줄범위 echo
      logical_name: "한 줄 도메인 표시명 (22자 전후, 체언 끝)",
      summary:      "마커 없는 1~3줄 짧은 요약",                // [핵심] 등 섹션 라벨 금지
      stereotype:   "DataMutator" | "DataQuery" | ...           // 허용 풀에서만
      search_text:  "검색 전용 서술 — 분기·상태전이·코드값·테이블" // 기술 노드는 빈 값
      domain_terms: "RDD=일 단위 집계 데이터; ..."                 // 없으면 빈 값
    }
    ```

  ---

  ## [1] logical_name — 노드의 도메인 한 줄 표시명

  같은 부모 형제 노드와 옆에 놓였을 때 **문장만 보고도 역할이 갈려야** 합니다. 같은 배치
  안 어떤 형제와도 문자열 전체가 동일하면 안 됨 — 한 글자라도 다르게.

  ### 1.1 형식 / 길이
  - **한 줄, 줄바꿈 X**. 통상 **22자 전후 이상** — 두세 단어 라벨 금지.
  - **체언·명사형 어미** — "갱신/등록/조회/검증/매핑/결정/반영/차단/복원/확정/취소".
  - **금지 어미** — "처리한다 / 한다 / 함" 동사 어미.

  ### 1.2 결정 트리 (4 요소 중 ≥ 2 동시 드러내기)
  1. **무슨 행위** — 신규 삽입 / 특정 컬럼 갱신 / 단건 조회 / 외부 호출 / 코드 결정.
  2. **무슨 업무 데이터** — 일 용수공급량 / 태그 원본 / 정산 마감 등.
  3. **언제·어떤 분기** — 성공 경로만 / 예외 경로만 / 사전 점검 / MERGE 미존재시.
  4. **쓰기면 무엇을 바꾸는지** — 결과 컬럼만 / 수량+카운트 동시 / 상태만.

  ### 1.3 좋은 예 (범용)
  - "일별 정산 금액을 신규/기존 구분해 일 정산 테이블에 일괄 반영"
  - "신규 등록 상품 행을 후속 전송용 임시 테이블로 시퀀스 부여 전사"
  - "대상 미존재 시 집계 금액·건수로 신규 정산 행 삽입"
  - "전역 예외 포착 후 디버그 테이블에 시간·프로시저ID·오류내용 기록"

  ### 1.4 ★ 형제 차별 (같은 배치 형제와 안 겹치게)
  형제가 의미 비슷해 보여도 ★ 한 글자라도 달라야 함. "짧은 광역 표현" 금지:
  | ❌ 광역(형제 구분 0) | ✅ 차별 축 2+ 동시 |
  |---|---|
  | "데이터 삽입"   | "대상 미존재 시 집계 금액·건수 신규 정산 행 삽입" |
  | "결과 갱신"     | "응답·사유 코드 컬럼만 성공 분기 갱신" |
  | "예외 처리"     | "전역 예외 포착 후 디버그 테이블에 오류내용 기록" |
  | "데이터 조회"   | "동일 지점·일자 최종 정산 행 단건 조회 후 후속 분기 적재" |

  ### 1.5 금지 패턴
  - X: SQL 키워드/테이블명 그대로 ("ORD_SUM_TB 에 MERGE") → O: 의미로 ("일 주문 집계 일괄 반영").
  - X: 형제 공통 광역 표현 단독 ("구문 처리") → O: 차별 축 2+ 드러낸 한 줄.
  - X: 주석에 끌린 잘못된 동사(주석 "신규" + 실제 UPDATE) → O: 실제 키 기준 "갱신"(단계 7).
  - X: 빈 문자열·단순 위임 후 침묵 → O: "무엇을 어디에 위임/호출하는지"까지.
  - ★ X: 쓰기 노드(writes 있음)인데 읽기/준비로 끝 ("…조회 및 기존 값 준비" · "…데이터 조인" ·
    "…합계 집계") → O: 최종 쓰기 동작·대상 포함 ("…조회해 로그 테이블에 변경이력 기록" ·
    "…조인해 합산 결과를 대상 테이블에 반영"). SELECT/USING 절이 길어도 노드 본질은 쓰기.

  ---

  ## [2] summary — 짧은 요약 (마커 없는 1~3줄)

  ### 2.1 형식
  - **비어있지 않은 줄 1~3줄.** 통상 1~2줄, 본문이 크고 흐름이 복잡할 때만 3줄(상한).
    기술 노드(단건 SELECT·COMMIT·롤백·대입·커서 open/close·로그/출력)는 1줄
    (장황하면 상위 분석 입력이 잡음으로 부풀어 오염).
  - `[핵심]` 같은 섹션 라벨 절대 X. 마크다운 헤딩·리스트 기호 X. 빈 줄 X.
  - 원문보다 짧게(요약≤원문). SQL 문법 줄줄이 X → 비즈니스 의미
    ("WHERE STATUS='A' 조회" X / "활성 대상만 조회" O).
  - **역할 분리** — 분기 갈래·코드값 집합·컬럼 상세·모든 종료 경로 나열은 [4] search_text 가
    누락 없이 담는다. summary 는 "무엇을 하는 노드인지"만 (중복 서술 X).
  - ★★ 괄호병기 금지 — 도메인 의미어 뒤에 컬럼·변수명을 괄호로 달지 마라(상위 분석이 그대로 계승해 오염).
    ❌ "수량(VAL)과 건수(CNT)를 갱신" · "측정값(MEA_VAL) 합산" → ✅ "수량과 건수를 갱신" · "측정값 합산".
  - ★★ 쓰기 노드(writes 있는 INSERT/UPDATE/MERGE/DELETE)는 **무엇을 어느 대상에
    기록/갱신/반영/삽입/삭제하는지**(쓰기 동작 + 대상)를 첫 줄에 반드시 담는다.
    `INSERT INTO T ... SELECT ...` 처럼 SELECT·USING 절이 본문 대부분이어도 그건 입력 조회일 뿐 —
    노드의 본질은 **최종 쓰기**다. ✗ "…조회해 기존 값을 준비한다" (읽기로 끝)
    ✓ "…집계해 집계 결과를 대상 집계 테이블에 반영한다".
  - ★★ 주어진 컨텍스트를 무시 말고 충실히 반영: 입력의 모든 단서 — 자식 `[줄범위] 자식 요약`,
    `reads`/`writes` 테이블, 참조 심볼, 프로시저/단위 이름, module_intent — 에 드러난
    도메인 의미를 **검토해 summary 에 반영**한다. 근거 있는 정보를 임의로 다른 개념으로
    **치환하거나 빠뜨리지 마라(환각 금지)**. 단서가 충돌하면(예: 이름은 A 인데 자식 요약은 B)
    코드 동작·자식 요약을 우선해 가장 정확한 의미로 종합한다.
  - ★ 쓰기 대상도 의미어로 + 입력→출력 종합: 쓰기 대상은 코드 테이블명 그대로(예: RDD01DD_TB)
    노출 금지 — 역할 의미어로("일보"·"집계 테이블", 테이블명 보존은 search_text 책임). 가능하면
    **자식 SELECT 가 어느 입력에서 무엇을 읽어 → 부모가 어느 대상에 무엇을 쓰는지**를 한 문장에 종합.

  ### 2.2 좋은 예 (dbms — 다이어트)
  #### 예 1 — MERGE 분기 (2줄)
  > 일별 정산 금액을 기존 행 존재 여부로 갱신/신규 구분해 일 정산 테이블에 반영한다.
  > 조회 0건이면 반영 없이 통과한다.

  #### 예 2 — 단순 (1줄)
  > 처리 구간 종료를 커밋한다.

  #### 예 3 — 예외 silent/로깅 (2줄)
  > 프로시저 전역 예외를 포착해 시간·프로시저 ID·오류 내용을 디버그 테이블에 기록한다.
  > 흐름 중단 없이 표준출력으로 오류를 알린다.

  ---

  ## [3] stereotype — 노드 역할 라벨 (허용 풀에서만, 없으면 빈 값)

  실제 동작 기준(이름 아니라 body 동작). 허용 풀 외 값 X.

  ### 3.1 허용 풀 (12)
  `DataMutator` / `DataQuery` / `BatchProcessor` / `Validator` / `MetadataLookup` /
  `EventTrigger` / `Aggregator` / `ReportGenerator` / `DataMigrator` / `CursorLooper` /
  `PackageInitializer` / `Helper`.

  ### 3.2 결정
  - writes 있고 INSERT/UPDATE/DELETE/MERGE → 단건 `DataMutator` / LOOP 안 반복 `BatchProcessor`.
  - SELECT 만 → `DataQuery` / 메타 단건 `MetadataLookup` / 집계 `Aggregator`.
  - 검증 + RAISE → `Validator`. 커서 반복 → `CursorLooper`. 트리거 → `EventTrigger`.
  - reads/writes·실제 키가 진실 — 주석에 끌려 잘못 판단 X(단계 7).

  ---

  ## [4] search_text — 검색 전용 서술 (사용자 화면에 안 보임, 의미 검색 재료)

  이 필드는 사람이 읽는 요약이 아니라 **"자연어 요구사항 질의가 이 노드를 찾아내게 하는"
  검색 재료**다. "정산 마감 때 무슨 테이블이 바뀌나" 같은 업무 말 질의에 이 노드가 걸리려면,
  그 답이 되는 사실들이 여기 문장으로 들어있어야 한다.

  ### 4.1 반드시 담을 것 (누락 0 — 하나라도 빠지면 그 값을 묻는 질의가 이 노드를 영원히 못 찾음)

  1. **조건 분기** — "어떤 조건이면 어떤 결과" 쌍 문장으로, 갈래마다 하나씩.
  2. **상태 전이** — 무슨 상태·플래그가 언제 무엇으로 바뀌는지.
  3. **상태·결과 코드 값 전부** — IN 리스트·복수 분기값은 모든 값을 나열 (하나도 생략 X).
  4. **테이블 상호작용** — 읽는/쓰는 테이블과 그 업무 목적 ("일 정산 테이블에 금액·건수 반영").
  5. **도메인·비즈니스 로직** — 임계값·계산식·업무 규칙.

  ### 4.2 작성 규칙

  - **코드 문장 복붙 금지** — SQL 원문·WHERE 절 나열 X. 의미 문장으로.
  - **코드 어휘는 병기 보존** — 테이블명·코드값 리터럴·핵심 도메인 식별자는 자연어 설명과
    함께 그대로 담는다 (summary 와 반대 — 여기선 검색 변별력의 핵심).
    예: "일 정산 테이블(RDD01DD_TB)에 반영" / "자동납부 상태를 '04'(해지) 로 갱신".
  - **업무 말로 서술** — 사람이 요구사항을 묻는 말투의 어휘(정산/마감/납부/해지)를 쓴다.
  - **질문 생성 X** — 사실 서술문만. 문단 하나(줄바꿈 없이 문장 나열)로 충분.
  - **기술 노드(COMMIT·롤백·대입·커서 open/close·로그)는 빈 문자열** — 억지로 채우지 X.
  - summary 와 중복돼도 됨 — 이 필드는 독립 소비(검색)라 자기완결이 우선.

  ### 4.3 예 (MERGE 정산 노드)

  > 일별 정산 반영. 일자·지점 키가 일 정산 테이블(RDD01DD_TB)에 존재하면 정산 금액과 건수를
  > 갱신하고, 없으면 신규 행을 삽입. 원본은 주문 상세 테이블(ORD_DTL_TB)에서 상태가
  > '02'(결제완료)·'03'(부분취소) 인 건만 집계. 조회 0건이면 반영 없이 통과.

  ---

  ## [5] domain_terms — 도메인 용어 조각 (용어사전 원천 재료, 화면 비노출)

  각 노드 본문·주석에 **실제로 등장하는** 도메인 약어·시스템명·전문 코드값의 "용어=뜻" 짝을
  세미콜론으로 나열한다. 나중에 전 노드의 조각을 모아 도메인 용어사전을 만든다.

  - 형식: `용어=뜻; 용어=뜻` 한 줄. 없으면 빈 문자열(억지로 만들지 X).
  - ★표제어 자격 = **"코드 말과 사람 말이 다른(간극이 있는) 낯선 식별자"만.** 이 사전의 목적이
    사람의 일상어를 코드의 낯선 표기로 잇는 다리를 놓는 것이므로, **그 다리가 필요한 것만** 넣는다.
    자문 = "코드는 이렇게(약어·식별자) 쓰는데 사람은 딴 말로 부르나?" → 예면 넣고, 아니면 버린다.
    · ✅ 넣기: 영문 약어·외부 시스템/기관명·사내 코드 식별자(RDD·SK-VAN·zngm_comm_cd_dtl 등)
      — 처음 보면 뜻을 물어볼 만한 것.
    · ❌ 버리기(표제어 금지, 뜻 설명엔 등장 OK):
      - 코드도 사람도 **같은 말을 쓰는** 일반 업무어(정산·조회·집계·마감) — 다리 불필요.
      - 순수 숫자·상태 코드값(`90`·`02`) — 표제어 X, 관련 약어의 **뜻 안에서** 설명
        (예: 표제어 `ORD_ST`=주문상태코드, 뜻에 "02=결제완료·90=취소").
      - SQL 키워드·자명한 단어.
  - 뜻 작성: **① 일반 업계 의미 먼저**(무엇의 약자/어떤 부류인지 — 네 일반 지식)
    **② 이 코드에서의 역할**. 코드 문맥만 쓰면 사용자의 일상어 질문과 이어지지 않는다.
  - 본문에 없는 용어를 창작하지 마라 — 뜻 설명에만 일반 지식을 쓰고, 용어 자체는 실재만.

  # ════════════════════════════════════════════════════════════════
  # [응답 형식 마무리]
  # ════════════════════════════════════════════════════════════════
  # BatchSummaryOutput.nodes — 입력 각 노드마다 BatchSummaryItem 1개.
  # node_key 는 입력 줄범위 그대로 echo. 누락·추가 금지. 이번 호출은 summary/stereotype/
  # logical_name/search_text/domain_terms 5 필드만 (테이블·규칙은 다른 분할). 공백 폭주 금지.
