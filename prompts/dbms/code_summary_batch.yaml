## code_summary_batch (dbms 분할 1) — 배치 안 각 노드의 summary + stereotype + logical_name.
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실 (extends).
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 1: 노드 의미 종합 (배치 안 모든 노드)
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드

  - **이 분할이 하는 일**: 각 노드마다 `summary` + `stereotype` + `logical_name` 3 필드 채움.
  - **이 분할이 안 하는 일**: 테이블별 컬럼 의미(→분할 2) / 비즈니스 규칙·시나리오·질문(→분할 3).
  - **출력**: `nodes` 배열 — 입력 `### 노드 <key>` 마다 1 항목.
    ```
    BatchSummaryItem {
      node_key:     "<start>-<end>",                           // 입력 줄범위 echo
      logical_name: "한 줄 도메인 표시명 (22자 전후, 체언 끝)",
      summary:      "[핵심] ...\n\n내용 ...",                   // [핵심] 마커 필수
      stereotype:   "DataMutator" | "DataQuery" | ...           // 허용 풀에서만
    }
    ```

  ---

  ## [1] logical_name — 노드의 도메인 한 줄 표시명

  같은 부모 형제 노드와 옆에 놓였을 때 **문장만 보고도 역할이 갈려야** 합니다. 같은 배치
  안 어떤 형제와도 문자열 전체가 동일하면 안 됨 — 한 글자라도 다르게.

  ### 1.1 형식 / 길이
  - **한 줄, 줄바꿈 X**. 통상 **22자 전후 이상** — 두세 단어 라벨 금지.
  - **체언·명사형 어미** — "갱신/등록/조회/검증/매핑/결정/반영/차단/복원/확정/취소".
  - **금지 어미** — "처리한다 / 한다 / 함" 동사 어미.

  ### 1.2 결정 트리 (4 요소 중 ≥ 2 동시 드러내기)
  1. **무슨 행위** — 신규 삽입 / 특정 컬럼 갱신 / 단건 조회 / 외부 호출 / 코드 결정.
  2. **무슨 업무 데이터** — 일 용수공급량 / 태그 원본 / 정산 마감 등.
  3. **언제·어떤 분기** — 성공 경로만 / 예외 경로만 / 사전 점검 / MERGE 미존재시.
  4. **쓰기면 무엇을 바꾸는지** — 결과 컬럼만 / 수량+카운트 동시 / 상태만.

  ### 1.3 좋은 예 (dbms)
  - "일 용수공급량을 신규/기존 구분해 RDD 일보에 일괄 반영"
  - "태그 원본 신규 행을 2차 처리 임시 테이블로 시퀀스 부여 전사"
  - "MERGE 조건 미일치 시 조회 수량·카운트로 신규 일보 행 삽입"
  - "전역 예외 포착 후 디버그 테이블에 시간·프로시저ID·오류내용 기록"

  ### 1.4 ★ 형제 차별 (같은 배치 형제와 안 겹치게)
  형제가 의미 비슷해 보여도 ★ 한 글자라도 달라야 함. "짧은 광역 표현" 금지:
  | ❌ 광역(형제 구분 0) | ✅ 차별 축 2+ 동시 |
  |---|---|
  | "데이터 삽입"   | "MERGE 미존재 시 조회 수량·카운트 신규 일보 INSERT" |
  | "결과 갱신"     | "응답·사유 코드 컬럼만 성공 분기 UPDATE" |
  | "예외 처리"     | "전역 예외 포착 후 디버그 테이블에 오류내용 기록" |
  | "데이터 조회"   | "동일 태그·시각 최종 일보 행 단건 조회 후 후속 분기 적재" |

  ### 1.5 금지 패턴
  - X: SQL 키워드/테이블명 그대로 ("RDD01DD_TB 에 MERGE") → O: 의미로 ("일 용수공급량 일괄 반영").
  - X: 형제 공통 광역 표현 단독 ("구문 처리") → O: 차별 축 2+ 드러낸 한 줄.
  - X: 주석에 끌린 잘못된 동사(주석 "신규" + 실제 UPDATE) → O: 실제 키 기준 "갱신"(단계 7).
  - X: 빈 문자열·단순 위임 후 침묵 → O: "무엇을 어디에 위임/호출하는지"까지.

  ---

  ## [2] summary — 2 섹션 `[핵심]` + 내용

  ### 2.1 형식
  ```
  [핵심] <한 줄 — 비즈니스 의미, SQL 키워드·프로시저명·테이블명 그대로 X>

  <내용 — 비즈니스 로직 자유 서술. 분기·조건·임계값·상태값·도메인 코드값 보존.
   단순 노드(단건 SELECT·COMMIT·대입·커서 open/close)는 [핵심] 한 줄로 끝 — 내용 생략 OK.>
  ```
  - 섹션 라벨은 `[핵심]` 하나만. 마크다운 헤딩·리스트 기호 X.
  - 원문보다 짧게(요약≤원문). SQL 문법 줄줄이 X → 비즈니스 의미
    ("WHERE STATUS='A' 조회" X / "활성 대상만 조회" O).
  - 모든 종료 경로(RAISE / silent pass / 조기 RETURN·EXIT) 빠짐 없이(공통 단계 5).

  ### 2.2 좋은 예 (dbms)
  #### 예 1 — MERGE 분기
  > [핵심] 일 용수공급량을 기존 행 존재 여부로 갱신/신규 구분해 일보에 반영한다.
  >
  > LOG_TIME·TAGSN 일치 행이 있으면 수량(VAL)·카운트(CNT) 컬럼 UPDATE, 없으면 신규 행
  > INSERT. 조회 0건이면 반영 없이 통과.

  #### 예 2 — 단순 (짧게)
  > [핵심] 처리 구간 종료를 커밋한다.

  #### 예 3 — 예외 silent/로깅
  > [핵심] 프로시저 전역 예외를 포착해 디버그 테이블에 기록 후 표준출력으로 알린다.
  >
  > 실행 중 모든 예외 포착 → 시스템 시간·프로시저 ID·오류 내용을 디버그 테이블에 INSERT,
  > 표준출력으로 오류 메시지 표시(흐름 중단 없이 사후 분석용).

  ---

  ## [3] stereotype — 노드 역할 라벨 (허용 풀에서만, 없으면 빈 값)

  실제 동작 기준(이름 아니라 body 동작). 허용 풀 외 값 X.

  ### 3.1 허용 풀 (12)
  `DataMutator` / `DataQuery` / `BatchProcessor` / `Validator` / `MetadataLookup` /
  `EventTrigger` / `Aggregator` / `ReportGenerator` / `DataMigrator` / `CursorLooper` /
  `PackageInitializer` / `Helper`.

  ### 3.2 결정
  - writes 있고 INSERT/UPDATE/DELETE/MERGE → 단건 `DataMutator` / LOOP 안 반복 `BatchProcessor`.
  - SELECT 만 → `DataQuery` / 메타 단건 `MetadataLookup` / 집계 `Aggregator`.
  - 검증 + RAISE → `Validator`. 커서 반복 → `CursorLooper`. 트리거 → `EventTrigger`.
  - reads/writes·실제 키가 진실 — 주석에 끌려 잘못 판단 X(단계 7).

