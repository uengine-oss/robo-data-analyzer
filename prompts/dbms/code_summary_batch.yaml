## code_summary_batch (dbms 분할 1) — 배치 안 각 노드의 summary + stereotype + logical_name + search_text + domain_terms.
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실 (extends).
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 1: 노드 의미 종합 (배치 안 모든 노드)
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드

  - **이 분할이 하는 일**: 각 노드마다 `summary` + `stereotype` + `logical_name` + `search_text` + `domain_terms` 5 필드 채움.
  - **이 분할이 안 하는 일**: 테이블별 컬럼 의미(→분할 2) / 비즈니스 규칙·시나리오·질문(→분할 3).
  - **출력**: `nodes` 배열 — 입력 `### 노드 <key>` 마다 1 항목.
    ```
    BatchSummaryItem {                                          // ★ 반드시 이 순서대로 채운다
      node_key:     "<start>-<end>",                            // 입력 줄범위 echo
      search_text:  "업무 서술문 + 식별자 괄호 병기 (용어나열 X)",  // ① 코드 정독 (기술 노드는 "")
      domain_terms: "ACK_CD=상대 시스템 수신 확인 응답 코드; ...", // ② 노드 텍스트(주석 포함) 실재 토큰만 (없으면 "")
      logical_name: "한 줄 도메인 표시명 (22자 전후, 체언 끝)",    // ③
      summary:      "마커 없는 1~3줄 짧은 요약",                  // ④ 최종 결론
      stereotype:   "DataMutator" | "DataQuery" | ...            // ⑤ 허용 풀에서만
    }
    ```
    ★ 순서 이유: ①②는 코드를 훑어 사실을 뽑는 일이라 먼저, ④ 요약은 그것들을 다 본 뒤 내리는
      **최종 결론**이라 뒤. **`domain_terms` 는 본문 식별자를 다 훑었으면 즉시 멈추고** 다음 필드로 간다.

  ---

  ## [1] logical_name — 노드의 도메인 한 줄 표시명

  같은 부모 형제 노드와 옆에 놓였을 때 **문장만 보고도 역할이 갈려야** 합니다. 같은 배치
  안 어떤 형제와도 문자열 전체가 동일하면 안 됨 — 한 글자라도 다르게.

  ### 1.1 형식 / 길이
  - **한 줄, 줄바꿈 X**. 통상 **22자 전후 이상** — 두세 단어 라벨 금지.
  - **체언·명사형 어미** — "갱신/등록/조회/검증/매핑/결정/반영/차단/복원/확정/취소".
  - **금지 어미** — "처리한다 / 한다 / 함" 동사 어미.

  ### 1.2 결정 트리 (4 요소 중 ≥ 2 동시 드러내기)
  1. **무슨 행위** — 신규 삽입 / 특정 컬럼 갱신 / 단건 조회 / 외부 호출 / 코드 결정.
  2. **무슨 업무 데이터** — 일별 접안 실적 / 입출항 원본 / 정산 마감 등.
  3. **언제·어떤 분기** — 성공 경로만 / 예외 경로만 / 사전 점검 / MERGE 미존재시.
  4. **쓰기면 무엇을 바꾸는지** — 결과 컬럼만 / 수량+카운트 동시 / 상태만.

  ### 1.3 좋은 예 (범용)
  - "일별 정산 금액을 신규/기존 구분해 일 정산 테이블에 일괄 반영"
  - "신규 등록 상품 행을 후속 전송용 임시 테이블로 시퀀스 부여 전사"
  - "대상 미존재 시 집계 금액·건수로 신규 정산 행 삽입"
  - "전역 예외 포착 후 디버그 테이블에 시간·프로시저ID·오류내용 기록"

  ### 1.4 ★ 형제 차별 (같은 배치 형제와 안 겹치게)
  형제가 의미 비슷해 보여도 ★ 한 글자라도 달라야 함. "짧은 광역 표현" 금지:
  | ❌ 광역(형제 구분 0) | ✅ 차별 축 2+ 동시 |
  |---|---|
  | "데이터 삽입"   | "대상 미존재 시 집계 금액·건수 신규 정산 행 삽입" |
  | "결과 갱신"     | "응답·사유 코드 컬럼만 성공 분기 갱신" |
  | "예외 처리"     | "전역 예외 포착 후 디버그 테이블에 오류내용 기록" |
  | "데이터 조회"   | "동일 지점·일자 최종 정산 행 단건 조회 후 후속 분기 적재" |

  ### 1.5 금지 패턴
  - X: SQL 키워드/테이블명 그대로 ("ORD_SUM_TB 에 MERGE") → O: 의미로 ("일 주문 집계 일괄 반영").
  - X: 형제 공통 광역 표현 단독 ("구문 처리") → O: 차별 축 2+ 드러낸 한 줄.
  - X: 주석에 끌린 잘못된 동사(주석 "신규" + 실제 UPDATE) → O: 실제 키 기준 "갱신"(단계 7).
  - X: 빈 문자열·단순 위임 후 침묵 → O: "무엇을 어디에 위임/호출하는지"까지.
  - ★ X: 쓰기 노드(writes 있음)인데 읽기/준비로 끝 ("…조회 및 기존 값 준비" · "…데이터 조인" ·
    "…합계 집계") → O: 최종 쓰기 동작·대상 포함 ("…조회해 로그 테이블에 변경이력 기록" ·
    "…조인해 합산 결과를 대상 테이블에 반영"). SELECT/USING 절이 길어도 노드 본질은 쓰기.

  ---

  ## [2] summary — 짧은 요약 (마커 없는 1~3줄)

  ### 2.1 형식
  - **비어있지 않은 줄 1~3줄.** 통상 1~2줄, 본문이 크고 흐름이 복잡할 때만 3줄(상한).
    기술 노드(단건 SELECT·COMMIT·롤백·대입·커서 open/close·로그/출력)는 1줄
    (장황하면 상위 분석 입력이 잡음으로 부풀어 오염).
  - `[핵심]` 같은 섹션 라벨 절대 X. 마크다운 헤딩·리스트 기호 X. 빈 줄 X.
  - 원문보다 짧게(요약≤원문). SQL 문법 줄줄이 X → 비즈니스 의미
    ("WHERE STATUS='A' 조회" X / "활성 대상만 조회" O).
  - **역할 분리** — ① 코드 식별자·테이블명·컬럼명은 [4] `search_text` 가 병기해 담고
    ② 분기 갈래·코드값의 **완전한 나열**은 분할 3 `rules`/`examples` 가 빠짐없이 담는다.
    summary 는 "무엇을 하는 노드인지"(뜻)만. 세 필드가 같은 말을 나눠 갖지 않는다.
  - ★★ 괄호병기 금지 — 도메인 의미어 뒤에 컬럼·변수명을 괄호로 달지 마라(상위 분석이 그대로 계승해 오염).
    ❌ "수량(VAL)과 건수(CNT)를 갱신" · "측정값(MEA_VAL) 합산" → ✅ "수량과 건수를 갱신" · "측정값 합산".
  - ★★ 쓰기 노드(writes 있는 INSERT/UPDATE/MERGE/DELETE)는 **무엇을 어느 대상에
    기록/갱신/반영/삽입/삭제하는지**(쓰기 동작 + 대상)를 첫 줄에 반드시 담는다.
    `INSERT INTO T ... SELECT ...` 처럼 SELECT·USING 절이 본문 대부분이어도 그건 입력 조회일 뿐 —
    노드의 본질은 **최종 쓰기**다. ✗ "…조회해 기존 값을 준비한다" (읽기로 끝)
    ✓ "…집계해 집계 결과를 대상 집계 테이블에 반영한다".
  - ★★ 주어진 컨텍스트를 무시 말고 충실히 반영: 입력의 모든 단서 — 자식 `[줄범위] 자식 요약`,
    `reads`/`writes` 테이블, 참조 심볼, 프로시저/단위 이름, module_intent — 에 드러난
    도메인 의미를 **검토해 summary 에 반영**한다. 근거 있는 정보를 임의로 다른 개념으로
    **치환하거나 빠뜨리지 마라(환각 금지)**. 단서가 충돌하면(예: 이름은 A 인데 자식 요약은 B)
    코드 동작·자식 요약을 우선해 가장 정확한 의미로 종합한다.
  - ★ 쓰기 대상도 의미어로 + 입력→출력 종합: 쓰기 대상은 코드 테이블명 그대로(예: BERTH_DAY_TB)
    노출 금지 — 역할 의미어로("일 실적"·"집계 테이블", 테이블명 보존은 search_text 책임). 가능하면
    **자식 SELECT 가 어느 입력에서 무엇을 읽어 → 부모가 어느 대상에 무엇을 쓰는지**를 한 문장에 종합.

  ### 2.2 좋은 예 (dbms — 다이어트)
  #### 예 1 — MERGE 분기 (2줄)
  > 일별 정산 금액을 기존 행 존재 여부로 갱신/신규 구분해 일 정산 테이블에 반영한다.
  > 조회 0건이면 반영 없이 통과한다.

  #### 예 2 — 단순 (1줄)
  > 처리 구간 종료를 커밋한다.

  #### 예 3 — 예외 silent/로깅 (2줄)
  > 프로시저 전역 예외를 포착해 시간·프로시저 ID·오류 내용을 디버그 테이블에 기록한다.
  > 흐름 중단 없이 표준출력으로 오류를 알린다.

  ---

  ## [3] stereotype — 노드 역할 라벨 (허용 풀에서만, 없으면 빈 값)

  실제 동작 기준(이름 아니라 body 동작). 허용 풀 외 값 X.

  ### 3.1 허용 풀 (12)
  `DataMutator` / `DataQuery` / `BatchProcessor` / `Validator` / `MetadataLookup` /
  `EventTrigger` / `Aggregator` / `ReportGenerator` / `DataMigrator` / `CursorLooper` /
  `PackageInitializer` / `Helper`.

  ### 3.2 결정
  - writes 있고 INSERT/UPDATE/DELETE/MERGE → 단건 `DataMutator` / LOOP 안 반복 `BatchProcessor`.
  - SELECT 만 → `DataQuery` / 메타 단건 `MetadataLookup` / 집계 `Aggregator`.
  - 검증 + RAISE → `Validator`. 커서 반복 → `CursorLooper`. 트리거 → `EventTrigger`.
  - reads/writes·실제 키가 진실 — 주석에 끌려 잘못 판단 X(단계 7).

  ---

  ## [4] search_text — 검색 어휘 다리 (사용자 화면에 안 보임, 의미 검색 재료)

  ★ 이 필드는 `summary` 와 **이어붙여 하나의 벡터**가 된다 (`요약:{summary} | 검색:{search_text}`).
  그래서 둘은 역할이 다르고, 같은 말을 두 번 하면 벡터만 길어지고 정보는 늘지 않는다.

  | | summary | search_text | domain_terms |
  |---|---|---|---|
  | 형태 | 서술문 | **서술문** | 용어=뜻 나열 |
  | 코드 식별자 | 금지 | **괄호로 병기 필수** | 표제어 |
  | 담는 것 | 이 노드가 무엇을 하는지 | 이 노드를 **갈라주는 업무 사실** + 그 사실에 붙은 식별자 | 낯선 약어의 뜻 |

  ★ `search_text` 는 **문장이다.** 용어=뜻을 세미콜론으로 나열하지 마라 — 그건 [5] `domain_terms`
  의 책임이고, 여기서 또 하면 두 필드가 같은 일을 한다. summary 문장을 그대로 베끼지도 마라.

  ### 4.1 판별 기준 — 단 하나 (아래 4.2·4.3 은 이 기준의 적용일 뿐 별도 규칙이 아니다)

  > **① 이 문장이 이 노드를 다른 노드와 갈라주는가?**
  > **② 이 사실의 주인이 이 노드인가?** (자식 구문이 하는 일을 대신 읊는 게 아닌가)

  둘 다 "예" 인 문장만 담는다.

  **①에서 탈락 — 어느 노드에나 똑같이 적히는 문장.** 주어가 프로시저·시스템 자신인 서술이
  전형이다: "실패 코드를 반환한다" · "오류를 로그에 적재한다" · "1000건마다 커밋한다" ·
  "널 여부를 확인한다". 노드 백 개에 똑같이 붙어 모두를 닮게 만든다. 한 글자도 쓰지 마라.
  주어가 업무 대상이면 남긴다 — "확정된 정산은 재갱신이 거절된다".
  ★ 예외: 오류 코드를 안내 문구로 매핑하는 것이 **이 노드의 본업**이면 그 코드는 업무 대상이다.

  **②에서 탈락 — 자식의 분기를 부모가 복창하는 것.** ([[_common]] 단계 4 와 같은 원칙.)
  부모는 자기 결정만 쓴다. 자식 구문이 무슨 조건으로 무엇을 거절하는지는 **그 자식이 쓴다.**

  ### 4.2 담을 것 (①②를 통과한 것만) — 업무 서술문으로 쓰고, 식별자는 괄호로 붙인다

  1. **이 노드 고유의 업무 결정** — 판정 기준·임계값·거절 조건.
  2. **그 사실에 붙은 코드 어휘** — 방금 쓴 업무 문장 안의 대상에 테이블명·컬럼명·식별자를
     괄호로 병기한다. 업무 말과 코드 말을 잇는 다리다.
     예(무관 도메인): "선석 배정 테이블(BERTH_TB)에 반영".
  3. **업무 코드값** — 그 값이 이 노드의 결정을 가르는 경우에 한해 ("상태를 '04'(취소) 로 갱신").
     프로시저 결과·에러 코드 상수는 업무 코드값이 아니다 (①에서 탈락).

  ### 4.3 쓰지 말 것

  - **용어=뜻 나열 금지** — `A_CD=구분코드; B_YN=여부;` 식의 사전 나열은 [5] `domain_terms`
    의 책임이다. 여기는 **서술문**이다. 식별자 홀로 두지 말고 업무 문장 안에 괄호로 넣어라.
  - **분기 전수 나열 금지** — 갈래가 많으면 갈래마다 한 문장씩 쓰지 말고 **무엇을 기준으로
    갈리는지(결정 축)** 를 한 문장으로. 모든 갈래·모든 값의 완전한 목록은 **분할 3
    (`rules`/`examples`) 의 책임**이고 그쪽이 이미 빠짐없이 담는다. 여기서 또 담으면 벡터가
    흐려져 검색이 무너진다.
  - **코드 문장 복붙 금지** — SQL 원문·WHERE 절·컬럼 나열 X. 의미 문장으로.
  - **질문 생성 X** — 사실 서술문만. 줄바꿈 없이 한 문단.
  - **기술 노드(COMMIT·롤백·대입·커서 open/close·로그)는 빈 문자열** — 억지로 채우지 X.

  ### 4.4 예 (무관 도메인: MERGE 집계 노드 — 패턴만 배우고 단어를 베끼지 마라)

  ✅ 정답 — 자기 결정 + 코드 어휘 병기. 짧다.

  > 일별 접안 실적 반영. 일자·부두 키가 일 실적 테이블(BERTH_DAY_TB)에 있으면 접안 횟수와
  > 하역량을 갱신하고 없으면 신규 삽입. 원본은 입출항 상세 테이블(ENTRY_DTL_TB)에서 상태가
  > '02'(접안완료)·'03'(조기출항) 인 건만. 조회 0건이면 반영 없이 통과.

  ❌ 오답 1 — 배관이 붙었다 (①탈락).

  > …반영 없이 통과. **MERGE 실패 시 오류 로그를 적재하고 실패 코드를 반환. 1000건마다
  > 분할 커밋하며 예외 발생 시 해당 건은 스킵. 처리 건수를 감사 로그에 기록.**

  ❌ 오답 2 — 자식 구문의 분기를 복창했다 (②탈락).

  > …반영. **하위 집계 커서는 부두코드가 'A'면 컨테이너, 'B'면 벌크로 나눠 합산하고,
  > 요금 계산 구문은 정박시간이 6시간 이상이면 할증률 1.2 를 곱하며…**

  ❌ 오답 3 — 서술문이 아니라 **용어사전**을 썼다. 이건 [5] `domain_terms` 의 일이다.
  이런 나열은 업무 질문("접안 실적은 어디서 집계되나")에 절대 걸리지 않는다.

  > **BERTH_DAY_TB=일 실적 테이블; BERTH_CNT=접안횟수; ENTRY_ST_CD=상태코드('02'=접안완료)**

  ---

  ## [5] domain_terms — 도메인 용어 조각 (용어사전 원천 재료, 화면 비노출)

  각 노드 본문·주석에 **실제로 등장하는** 도메인 약어·시스템명·전문 코드값의 "용어=뜻" 짝을
  세미콜론으로 나열한다. 나중에 전 노드의 조각을 모아 도메인 용어사전을 만든다.

  ### ★★★ 절대 규칙 1 — 표제어는 "이 노드 텍스트에 그 글자 그대로 실재하는 토큰"만 (위반 시 실패)

  표제어로 쓸 수 있는 것은 **이 노드 텍스트(SQL 과 주석 모두)에서 그대로 복사해 붙일 수
  있는 토큰뿐**이다: 변수명·테이블명·컬럼명·상수명·문자열 리터럴, 그리고 **주석에 적힌
  도메인 고유명**(시스템·기관·프로토콜·규격 이름).

  **★ 단어를 조합·변형·응용해 새 표제어를 만드는 것은 절대 금지.** 이것이 무한 생성의 원인이다.
  텍스트에 없는 말을 지어내면 끝없이 만들 수 있게 되어 출력이 폭주하고 분석이 실패한다.

  **판정법 (매 표제어마다 반드시 자문):**
  > "이 표제어를 이 노드 텍스트에서 Ctrl+F 로 검색하면 **똑같은 글자**가 나오는가?"
  > 안 나오면 **쓰지 마라.**

  → 후보는 이 노드 텍스트의 토큰 목록이라 **유한하다.** 훑고 나면 끝이다. 더 만들어내지 마라.

  **★ 주석 두 종류를 구별하라 (섞으면 사고):**
  - **비활성화된 코드**(`/* */` 블록·`--` 뒤에 죽어 있는 옛 SQL·수식·분기) 안의 토큰 →
    표제어 **X**. 실행되지 않으므로 존재하지 않는 것으로 본다 ([[_common]] 단계 7).
  - **설명 주석**(이 컬럼·시스템·기관·규격이 무엇인지 알려주는 주석) 안의 도메인 고유명 →
    표제어 **O**. 코드에 없는 지식의 1차 근거이며, 오직 여기에만 등장하는 핵심 용어가 많다.

  ### ★★★ 절대 규칙 2 — 다 훑으면 끝. 개수를 채우려 하지 마라

  본문 식별자를 훑어 **낯선 것만** 담고, 더 없으면 **거기서 끝낸다.**
  억지로 개수를 채우지도, 아쉽다고 조합어를 지어내지도 마라. 하나도 없으면 빈 문자열.
  같은 개념은 표제어 **하나**로 끝낸다.

  ### 무엇을 고르나 — 기준은 하나: "업무(도메인) 개념을 가리키는가"

  이 사전은 업무 담당자의 질문을 코드로 잇는 다리다. 자문: *"현업 담당자가 업무 질문을
  하다가 이 단어에 도달할 수 있는가?"* → 그렇다면 넣고, 기술 배관이면 버린다.

  - ✅ 업무 개념을 담은 테이블·컬럼·변수명 (축약형이라 낯설수록 다리 가치가 큼)
  - ✅ 영문 약어 리터럴 · 외부 시스템/기관/프로토콜 이름 — **주석에만 등장해도 표제어다**
    (주석 표기가 컬럼명과 다르면 둘 다 각자 표제어로: 예. 주석의 규격명과 그 축약 컬럼명)
  - ✅ 무슨 뜻인지 모를 상태·구분 코드 **컬럼명** — 뜻에 **코드값 매핑과 기준값을 반드시
    보존**(무관 도메인 예: `'A'=입항 'D'=출항` / `1일 상한 5건`) — 업무 질문이 정확히 이 값들로 온다
  - ❌ **기술 배관 — 업무 질문이 절대 도달하지 않는 것**: 프레임워크 리턴/에러 코드 상수,
    길이·버퍼 상수, 루프/임시 변수, 로깅·매크로 이름
  - ❌ 코드도 사람도 같은 말을 쓰는 일반 업무어 — 다리가 필요 없다
  - ❌ 순수 숫자·상태값 자체(`'03'`) — 표제어 X, 관련 **컬럼명의 뜻 안에서** 설명
  - ❌ SQL 키워드·자명한 단어

  ### ★★★ 뜻 작성 — 근거주의 (이 노드 텍스트에 적힌 것만)

  뜻의 근거는 **이 노드 텍스트에 실제로 적힌 표현**(주석 포함)뿐이다. 주석은 이 용어가
  무엇인지 알려주는 **1차 근거**다 — 주석이 용어를 설명하고 있으면 그 설명을 뜻에 살려라.

  **규칙: 뜻 = ① 텍스트(주석)가 이 용어를 부르는 말 → ② 이 코드에서의 역할.**

  **★★ 정체 창작 절대 금지.** 이 용어가 무엇의 약자인지·어느 기관/회사/시스템인지가
  텍스트 어디에도 안 적혀 있으면 **정체를 추측해 쓰지 말고, 이 코드에서의 역할만 서술**하라.
  틀린 정체 하나가 사전 전체를 오염시킨다. 비슷한 이름의 다른 것(옆 주석의 다른 시스템명
  등)을 정체로 갖다 붙이는 것이 전형적 오염이다.

  아래는 **무관 도메인 예시**다. 패턴만 배우고 단어를 베끼지 마라.

  - 주석에 `-- IMO : 국제해사기구 선박 등록번호` 가 있으면 →
    ✅ `IMO_NO=국제해사기구가 선박마다 부여하는 고유 등록번호` (주석 근거 그대로)
  - 주석 설명 없이 `NDC_CD` 컬럼만 있으면 →
    ✅ `NDC_CD=입고 검수 시 품목 식별에 쓰는 코드` (역할만)
    ❌ `NDC_CD=NDC(미국 의약품 표준 식별번호) 코드` (텍스트에 없는 정체 — 창작 금지)

  자문: **"이 뜻의 모든 명제를 이 노드 텍스트에서 손가락으로 짚을 수 있나?"**
  못 짚는 명제는 지워라. **표제어 자체는 텍스트 실재 토큰만** — 뜻도 텍스트 근거만.

  ### 예시 — 노드 텍스트에 이렇게 등장하면, 이렇게 뽑는다

  **노드 텍스트(무관 도메인 예):**
  ```
  -- HL7(병원 간 진료정보 교환 표준) 수신분 반영, '03'=수신거부
  MERGE INTO HOSP_PAT_MST T
  USING (SELECT PAT_REG_NO, INSR_TYP_CD FROM HL7_MSG_TB WHERE ACK_CD = '03') S
  ```
  ✅ 정답 — 표제어는 **텍스트(SQL·주석)에서 복사해 온 글자**, 뜻은 **텍스트 근거로**:
  ```
  HL7=병원 간 진료정보 교환 표준(주석 근거); HOSP_PAT_MST=병원 환자 기본정보 마스터 테이블; HL7_MSG_TB=HL7 메시지 수신 테이블; PAT_REG_NO=환자 등록번호; INSR_TYP_CD=보험 유형 구분 코드; ACK_CD=상대 시스템 수신 응답 코드('03'=수신거부)
  ```
  ❌ 오답 1 — 텍스트에 없는 **지어낸 조합어**(끝없이 만들 수 있어 폭주한다):
  ```
  환자 마스터=...; HL7 메시지=...; 환자 등록번호 컬럼=...; 보험 유형=...
  ```
  ❌ 오답 2 — 텍스트에 없는 **정체 창작**(틀리면 사전 전체 오염):
  ```
  ACK_CD=ACK(미군 통신규약) 코드; HOSP_PAT_MST=HIS(병원정보시스템) 마스터
  ```

  **낯선 식별자가 없는 노드**(단순 COMMIT·대입 등) → `""` (빈 문자열)

