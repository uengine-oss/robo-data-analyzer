## code_rules_examples_batch (dbms 분할 3) — 배치 안 각 노드의 rules + examples + questions.
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실 (extends).
## ★ 입력 body = 그 문장의 **원문 통째**(자식 서브트리 포함 — 1차 증거). 단위 = 예산 내 최고 조상 문장.
## ★ 단위 문장들이 배치로 들어옴 → 노드마다 1 항목(node_key echo). 단위 아래 노드는 규칙 없음(단위가 흡수).
## ★ 구조 = 모든 지침 바로 밑에 인라인 예시(✅/❌). 별도 "예시 모음" 섹션 없음.
## ※ 도메인어(단계1)·죽은주석(단계7)·DECODE/IF·ELSIF(§4)의 일반 원칙은 공통이 진실 — 상충 금지.
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 3: 비즈니스 규칙 · 시나리오 · 질문
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드
  - **하는 일**: 노드마다 `rules`(규칙, 각 규칙 하위 `examples` 중첩) + `questions`(모호점).
  - **안 하는 일**: 노드 의미·역할(→분할1) / 컬럼 의미(→분할2)는 손대지 않는다.
  - **출력 스키마**:
    ```
    BatchRulesItem { node_key:"<start>-<end>",
      rules:[ { statement:"<조건>이면 <결과>", coupled_domains:[],
                examples:[ { given, when, then, affected_tables:[{table, op:READ|INSERT|UPDATE|DELETE|MERGE}] } ] } ],
      questions:[ { text, reason } ] }
    ```
  - 아래 모든 예시는 **범용 설명용**(패턴만) — 산출물엔 그 노드 본문에 **실제 등장한 값만** 쓴다.
  - 목표: **rules+examples 만 보고 코드를 다시 만들면 원문과 똑같이 동작.**

  # ════════════════════════════════════════════════════════════════
  # 0. 북극성 — 두 축 + 흔한 오해
  # ════════════════════════════════════════════════════════════════
  ## 0.1 두 축 (충돌 아님, 경계 = "가치")
  - (A) 완전성: 동작에 영향 주는 도메인 결정·코드값 **하나도 안 빠뜨림**(값은 본문 그대로).
  - (B) 무폭주: 가치 없는 노이즈·중복·입력 변주는 **0**.
  - 경계 = "이 조건/값이 사라지면 코드 동작이 달라지나" → 달라지면 (A), 안 달라지면 (B).
  - 예: ✅가치(A) "한도 금액 이상이면 거절" · ❌노이즈(B) "처리 후 COMMIT" · "처리 건수를 변수에 담음".

  ## 0.2 흔한 오해 4가지 (누락·노이즈·붕괴의 원인) — 각 오해에 예시
  - 오해① "간결=코드값 집합 줄이기" → X. 예: ❌ "상태 ∈ [s1..s5]" 를 "상태=s1"로 축소 / ✅ 집합 다 나열.
  - 오해② "통합=다른 결정도 한 룰로" → X. 예: ❌ "상태 승인규칙" 과 "수수료 계산규칙"을 한 룰로 / ✅ 별 룰.
  - 오해③ "래퍼/IO 노드니 전부 빈 배열" → X. 예: 조회(기술)+코드분기(도메인) 섞이면 → ✅ 도메인 분기만 Rule.
  - 오해④ "한 노드=규칙 하나" → X. 예: 반복문이 재고조정·정산계산 2작업 → ✅ 규칙 2개. ❌ "재고·정산을 처리" 1개.

  # ════════════════════════════════════════════════════════════════
  # 1. 규칙을 몇 개·무엇을 (개수 = 서로 다른 "작업/결정" 수)
  # ════════════════════════════════════════════════════════════════
  ## 1.1 판단 단위 = 함수가 아니라 "작업/결정"
  한 노드가 기술 작업과 도메인 작업을 섞어 하면 → **도메인 작업만 Rule**.
  - 예: 노드가 ① 외부 조회(기술) ② 조회 코드 ∈ [c1,c2] 면 정상, 그 외 거절(도메인) ③ DB오류면 에러(기술)
    → ✅ ②만 Rule "조회 결과 코드 ∈ [c1,c2] 면 정상, 그 외 거절". ①③은 버림.

  ## 1.2 ★★ 한 문장 원문 안의 별개 작업마다 규칙 (과소추출 방지 1위)
  body 는 이 문장의 **원문 통째**(자식 구문 포함). 이 문장이 서브트리의 **유일한 규칙 소유자**(내부 구문은
  따로 규칙 안 뽑힘) → 원문 안 **서로 다른 도메인 작업/결정마다 규칙 하나**. 내부에 독립 작업이 6개면
  **규칙 6개**(3·8개도 정상). 내부 구문(IF·MERGE·SELECT·INSERT)의 경계가 작업의 경계다.
  - 예(입력 → 규칙 2개, FETCH=기술 제외):
    ```
    LOOP  -- 승인 대기 주문 순회
      FETCH 커서 INTO 주문행;
      IF 주문상태='APPROVED' THEN 재고를 주문수량만큼 차감
      ELSIF 주문상태='CANCELED' THEN 재고 복원 END IF;
      MERGE 정산 ... 등급 'GOLD','VIP' 는 수수료 1%, 그 외 3% 로 정산액 계산 반영;
    END LOOP
    ```
    ✅ R1 "주문 상태에 따라 재고를 조정한다" (재고 UPDATE) · R2 "회원 등급별 정산 수수료율 차등" (정산 INSERT).
    ❌ 붕괴: 규칙 하나 "주문을 순회하며 재고·정산을 처리한다" = 두 결정 뭉갬.
  - ★ body 에 `....` 로 **접힌 자식 구간**이 보이면 = 그 내부는 별도 단위가 규칙을 담당한다.
    이때는 **자기 줄의 조건(게이트)·선별·반복 대상만** 규칙으로 — 접힌 내부를 추측해 규칙 만들지 X.
    ✅ 예: body `IF 정산 대상이고 마감 전이면 THEN .... END IF`
       → 규칙 1개 "정산 대상이고 마감 전일 때만 후속 정산 집계를 수행한다" (내부 내용 규칙 X).
    ✅ 예: body `LOOP -- 검증 불일치 건 순회 .... END LOOP` → "검증 불일치 건만 재처리 대상으로 순회한다".

  ## 1.3 ★★ 절대 뭉치지 마라 ("A·B·C 순으로 처리" 나열 금지)
  서로 다른 작업을 한 statement 에 나열하면 손실. 나열하려던 것 **각각을 별 규칙**으로.
  - 예(게이트 IF 안 서로 다른 MERGE 4블록 원문):
    ```
    IF 정산 대상이고 마감 전이면 THEN
      MERGE ... 일별 순매출을 계산해 정산에 반영 ...;
      MERGE ... 등급별 수수료를 계산해 정산에 반영 ...;
      MERGE ... 지역별 합계를 집계해 정산에 반영 ...;
      MERGE ... 전체 총계를 집계해 정산에 반영 ...;
    END IF
    ```
    ✅ 규칙 4개(각 MERGE 별 규칙): "순매출 계산"·"등급별 수수료 계산"·"지역별 합계"·"전체 총계".
    ❌ 붕괴: 규칙 하나 "순매출·수수료·지역·총계를 **순으로** 반영한다".

  ## 1.4 ★ 분기 난사 금지 — 단 "같은 정책으로 가는 값 분기"만 통합 (§1.3 과 반대 아님)
  **하나의 판정**(if/elsif/CASE 한 트리)이 값에 따라 갈리되 **결과·정책의 종류가 같은** 다발만 1 Rule(값은 example).
  - 예(통합 O — 같은 정책): 하나의 IF 트리 "결제수단 'CARD' 且 금액≥50000 且 국내 → 허용; 금액<50000 → 거절;
    해외 → 거절" = **"허용 가부" 하나의 정책** →
    ✅ 규칙 1개 "결제수단·금액·카드종류에 따라 무이자 할부 가부 판정" (분기는 example given/then).
    ❌ 난사: "CARD면…" "금액<50000이면…" "해외면…" 을 각각 Rule 3개로.
  - ★★ 예(분리 O — 상위 분기마다 정책이 다르면 별 Rule, 과통합 금지): 한 IF/ELSIF/ELSE 트리라도
    "종류='a' → **이 조건이면 허용** / 종류='b' → **저 조건이면 허용** / 그 외 → **거절 + 사유 문구 부착**"
    처럼 **분기마다 정책 내용·결과 형태가 다르면** 분기별 별 Rule 이 정답 →
    ✅ R1 "종류 'a' 는 …이면 허용" / R2 "종류 'b' 는 …이면 허용" / R3 "그 외 종류는 거절하고 사유 부착".
    ❌ 과통합: "종류에 따라 허용 여부 판정" 1 Rule → 각 분기의 조건↔결과 짝이 뒤섞이거나 소실.
  - 구분 요약: **서로 다른 작업 = 분리(§1.2·§1.3) / 같은 정책의 값 분기 = 통합 / 분기마다 정책·결과가 다른
    상위 축 = 분리(§2.6)**. 판별 = "합치면 어느 분기의 조건↔결과 짝이 흐려지나?" → 흐려지면 분리.

  ## 1.5 ★ 빈 배열이 정답일 수 있다 (막무가내 채우기 = 환각)
  본문에서 가치를 못 찾으면 `rules:[]`·`questions:[]` 가 정상.
  - 예: 노드가 "입력을 담아 외부 조회 1건, DB오류면 에러·없으면 통과, 결과를 전역 저장"만
    → ✅ `rules:[]` (도메인 분기·값·정책 없음). ❌ "조회 실패면 에러 반환"을 Rule 로.

  ## 1.6 ★★ 잔심부름(기술) = 규칙 아님 (과추출 방지)
  본문의 구문 중 **종류만으로 규칙 아님**:
  - COMMIT·ROLLBACK·FETCH·커서 open/close·EXIT·CONTINUE·표준출력·단순 대입
    → 트랜잭션·반복·출력 = 기술 뼈대.
  - **DML/조회여도 용도가 기술이면 규칙 아님**: 로그·디버그·이력 기록 INSERT/UPDATE · 제어용 COUNT
    (존재·건수를 IF 게이트로만 씀) · 형식 변환(TO_CHAR·SYSDATE) · 개별 블록의 단순 "오류면 출력" 방어.
  - **반대로 규칙인 것**: 도메인 계산 대입(`수수료:=금액×0.02`) · 정책 임계 판단 · 업무 데이터 write · 의미 있는 silent pass.
  - **★ 헷갈리기 쉬운 규칙 O 두 가지 (빼먹지 마라)**:
    - **업무 절차의 후속 위임 호출(CALL)** = 규칙 O — "무엇을 마친 뒤 무엇을 이어서 하는가"는 업무 절차다.
      ✅ 예: body 가 후속 프로시저 호출이면 → "일 집계 완료 후 공급량 재계산을 이어서 수행한다".
      (❌ 단순 출력·유틸 호출은 X — 업무 데이터가 이어지는 호출만.)
    - **루틴 전역의 예외 복구 정책(EXCEPTION)** = 규칙 O — "실패 시 전체를 되돌리고 감사 기록을 남긴다"는
      데이터 무결성 정책이다. ✅ 예: "처리 중 오류가 발생하면 전체를 롤백하고 오류 이력을 기록한다".
      (❌ 개별 블록의 "오류 메시지 출력" 만인 EXCEPTION 은 X.)
  - 예(원문):
    ```
    LOOP
      SELECT COUNT(*) INTO 지점수 FROM ...;   FETCH 커서 INTO ...;   EXIT WHEN 없음;
      MERGE ... 지점별 판매량을 합산해 본사 합계에 반영 ...;
      COMMIT;
    END LOOP
    ```
    ✅ 규칙 1개(도메인은 MERGE 뿐): "지점별 판매량을 합산해 본사 합계에 반영한다".
    ❌ 과추출: COUNT·FETCH·EXIT·COMMIT 을 각각 규칙으로.
  - 예(용도 구분): ❌ "오류 메시지를 디버그 테이블에 기록"(로그) / ✅ "확정된 주문을 주문 테이블에 기록"(도메인 write).
  - 예(감사·이력 로그도 기술): 처리 전후로 "변경 전 값 기록 → 본처리 → 변경 후 값 기록" 구조라면
    → ✅ 규칙은 **본처리만** / ❌ "변경 전후 값을 이력 테이블에 기록한다"를 별도 Rule 로 (감사 이력 = 기술 뼈대).

  ## 1.7 ★ 코드값 보존 + 도메인 언어 (일반 원칙은 공통 단계1)
  - 도메인 코드 VALUE 리터럴은 본문 그대로 보존(상태·구분·결과·임계·기본값). 없는 값 지어내기 X.
  - 변수·테이블·컬럼·함수·커서명은 statement·given/when/then 에 베끼지 말고 도메인어로.
  - 예: ❌ "V_FLAG='Y' 이면 OUT_CODE='3'"·"XXX_TB 에 MERGE"·"checkStatus() 호출"
        ✅ "비활성 여부='Y' 이면 처리구분='3'"·"일 집계를 반영"·"상태를 조회" (값 '3'·'Y' 는 보존).
  - ★ 괄호 병기도 베끼기: ❌ "적용여부(gc_yn)" → ✅ "적용여부".

  ## 1.8 출력 폭주 = 사고
  어떤 string 도 공백·줄바꿈만으로 끝낼 수 없음 — `:` 뒤 즉시 값, `}`/`]` 즉시 닫기.
  - 예: ❌ `"then":"          "`(공백 폭주) / ✅ `"then":"거절"`.

  # ════════════════════════════════════════════════════════════════
  # 2. rules — ★★★ 언제 RULE 이 발동되는가 (이 분할에서 가장 중요한 판단기준)
  # ════════════════════════════════════════════════════════════════
  ## 2.1 리트머스 한 문장 (모든 판단의 단일 입구)
  **"이 조건/분기/계산을 제거하면 업무 담당자(고객·정산·감사·운영)가 보는 결과가 달라지는가?"**
  → **달라진다 = RULE 발동** / **안 달라진다(개발자만 아는 내부 사정) = 폐기.**
  - ✅ "누적 주문액이 한도 이상이면 추가 주문 거절" 을 지우면 → 한도 초과 주문이 통과 = 업무 결과 달라짐 → RULE.
  - ❌ "처리 후 COMMIT" 을 지우면 → 업무 정책은 그대로(트랜잭션 내부 사정) → 폐기.

  ## 2.2 RULE 이 발동되는 7가지 패턴 (본문에서 이걸 보면 = 규칙 후보)
  ① **상태·유형·코드값별 차등 처리** — 같은 입력이 값에 따라 다른 길로 감.
     ✅ "회원 등급 ∈ [g1,g2] 면 배송비 면제, 그 외 등급은 정상 부과."
  ② **임계값·정책값 판단** — 숫자·기간·비율 경계에서 행동이 바뀜.
     ✅ "재고 수량이 안전재고 미만이면 자동 발주를 생성한다." / "가입 90일 미만이면 혜택 제외."
  ③ **도메인 계산식** — 수식·비율·부호·가중치·반올림 정책.
     ✅ "정산액 = 판매액 × 수수료율(등급별 상이), 반품 건은 감산(-) 으로 합산한다."
  ④ **값→값 / 값→결과 매핑** — DECODE/CASE 로 코드가 다른 코드·채널·방식으로 치환.
     ✅ "결제수단 'c' 는 카드사 채널로, 'v' 는 가상계좌 채널로 라우팅한다."
  ⑤ **자격·검증·선별 조건** — 무엇이 통과/대상이 되는가 (커서의 선별 조건 포함).
     ✅ "검증 결과가 '불일치' 인 일자만 재계산 대상으로 선별한다." / "필수 식별자 누락 시 거절한다."
  ⑥ **예외·거절·보정 정책** — 정책 위반 거절, 비정상 값의 도메인 보정.
     ✅ "계산 결과가 음수면 당일 상세 내역 합계로 대체한다."(보정) / "기준일이 오늘 이후면 처리하지 않는다."
     ✅ silent pass 도 정책이면 발동: "대상이 없으면 오류 없이 조용히 통과한다(대상 없음이 정상)."
  ⑦ **데이터 반영 정책** — 무엇을 어느 범위·키로 만들고 갱신하는가.
     ✅ "동일 키(일자·상품)가 이미 있으면 갱신, 없으면 신규 생성한다."(upsert = 반영 정책 1 Rule)
     ✅ "당일 01시~24시 구간의 상세 내역만 집계 대상으로 한다."(기간 범위 정책)

  ## 2.3 RULE 이 발동되지 않는 것 = §1.6 잔심부름 (그쪽이 단일 진실 — 중복 안 둠)
  트랜잭션·반복 제어·로그/감사 기록·형식 변환·임시 대입·제어용 건수 조회·기술 예외.

  ## 2.4 ★★ 경계 사례 6가지 — 헷갈릴 때 이 짝으로 판정 (각각 ✅/❌)
  ① **조회**: 제어용 건수 조회 = ❌ ("대상 건수를 세어 변수에 담는다" — IF 게이트 재료일 뿐, 규칙은 그 IF 몫)
     / 선별 조건이 업무인 조회 = ✅ ("미정산 상태이고 마감일이 지난 건만 골라낸다").
  ② **대입**: 임시 변수 대입 = ❌ ("조회 결과를 변수에 담는다") / 도메인 계산 대입 = ✅ ("수수료 := 금액 × 0.02").
  ③ **기록**: 감사·이력·디버그 기록 = ❌ ("변경 전후 값을 이력 테이블에 남긴다") / 업무 데이터 기록 = ✅
     ("확정된 주문을 주문 테이블에 생성한다").
  ④ **NULL 체크**: 내부 인자 방어 = ❌ ("헬퍼 함수 인자가 null 이면 skip") / 도메인 필수·기본값 = ✅
     ("필수 식별자 누락 시 거절" · "유형 미입력이면 기본 유형으로 처리").
  ⑤ **예외**: 기술 예외 = ❌ ("DB 오류면 롤백하고 오류를 출력한다") / 도메인 예외 = ✅
     ("재고 부족이면 주문을 거절한다" · "대상 없음은 정상 통과(silent pass)").
  ⑥ **upsert**: WHEN MATCHED/NOT MATCHED 짝 = ✅ 하나의 반영 정책으로 **1 Rule**
     ("있으면 갱신, 없으면 생성") — ❌ "갱신 규칙"과 "삽입 규칙" 2개로 쪼개 부풀리기.

  ## 2.5 검증 전용 노드 — 의미 다발은 1 Rule + 필드별 example
  검증이 10+ 개여도 같은 의미 다발은 한 Rule + 필드마다 example.
  - 예: ✅ R "필수 식별자 누락 시 거절" + example given "필드A 누락" then "거절" / "필드B 누락" then "거절".
    조건부 필수는 별 example: given "유형=T1 且 필드X 누락" then "거절".

  ## 2.6 ★★ 통합 vs 분리 — 규칙 개수의 진짜 기준
  - 통합(1 Rule): 조건 의미 같고 **값만 다름**(값은 example). / 분리(별 Rule): 의미·결과가 **다름**(합치면 누락).
  - 개수는 "가치"로만 — 진짜 다른 결정이 8개면 Rule 8개. 자가점검: "두 Rule 합치면 어느 한쪽 동작이 사라지나?"
  - 예: ✅통합 "결제수단 값마다(A·B·C) 같은 방식 한도 검증" → 1 Rule + example 에 값들.
        ✅분리 "상태 X면 환불 / Y면 취소 / Z면 보류" → 결과가 달라 Rule 3개(또는 1 Rule + 값→결과 매핑 example).

  ## 2.7 안티패턴 (금지) — 각각 예
  - a. 기술 관심사→Rule: ❌ "커밋"·"로깅"을 Rule.
  - b. 값별 과세분화 부풀리기: ❌ "코드=a1이면…" "a2이면…" 을 값마다 Rule → ✅ 집합 1 Rule + example.
  - c. 서로 다른 작업 "순으로" 뭉침: ❌ "A·B·C 순으로 처리" → ✅ 각각 Rule(§1.3).
  - d. 종료 경로 누락: ❌ "조회 후 반환"만 → ✅ "대상 없으면 조용히 통과(silent pass)"도 정책이면 명시.

  # ════════════════════════════════════════════════════════════════
  # 3. examples — given/when/then (★ 세 축)
  # ════════════════════════════════════════════════════════════════
  ## 3.1 필드
  - given 진입조건(핵심 키, 자연어) / when 트리거(자연어, 함수명 X) / then 결과(자연어).
  - affected_tables `[{table,op}]` — 이 노드가 **직접** R/W 하는 테이블만(주어진 reads/writes 내), 없으면 `[]`.
  - 예: ✅ `{given:"금액<한도", then:"거절", affected_tables:[{table:"주문", op:"READ"}]}`.
        ❌ 하위 호출 함수가 쓰는 테이블을 넣기 / 본문에 없는 테이블명 지어내기.

  ## 3.2 ★★ 세 축을 분리하라 (이 분할의 핵심)
  **행 수는 줄이되(축1), 값 집합은 다 담고(축2), 값↔결과 대응은 깨지 마라(축3).**
  - 축1 행 수: 같은 결과 입력 변주를 여러 행으로 X (정상 1 + 예외 1). 예: ❌ "금액=100"·"금액=200"·"금액=300" 3행 → ✅ 1행.
  - 축2 값 집합: 예는 §3.3. / 축3 값→결과 대응: 예는 §3.4.

  ## 3.2.5 ★★ example 작성 5단계 절차 (given/then 쓰기 직전 — 매 example 강제)
  ① **자기 분기 조건 그대로** — 각 example 의 given 은 그 결과가 나온 **분기의 조건만** 담는다. 통합 Rule
    (한 판정을 1 Rule 로)일수록 다른 분기의 조건을 섞어 쓰기 쉽다 — 절대 금지.
    - 예: 본문 "종류='A' 且 등급 ∈ [g1,g2] → 허용 / 종류='B' 且 등급 ∈ [g1,g2] → 보류"
      ❌ given "종류='A' 且 등급 ∈ [g1,g2]" then "보류"  (분기 B 의 결과를 분기 A 조건에 붙임 = 짝 뒤집힘)
      ✅ given "종류='A' …" then "허용" / given "종류='B' …" then "보류"  (조건↔결과 짝 보존).
  ② **값 집합을 본문에서 전부 세어** 나열 — 집합 분기를 옮길 땐 본문 IN(...)·조건의 값을 하나씩 세어
    모두 given 에 넣는다. 예: 본문 `IN ('q','s','d','f')` 4개 → ❌ "['q','s','d']"(1개 누락) ✅ 4개 다.
  ③ **각 값·조건이 활성 코드에 실제 존재하는지 확인** — 주석(죽은 코드) 속 값·제외조건·수식은 given/then 에
    넣지 않는다(공통 단계7).
    - 예: 주석 블록에만 있는 "특수 항목 제외(x1,x2)" 조건 → ❌ given "항목이 x1,x2 가 아니고 …"(죽은 조건 부활)
      ✅ 활성 코드에 그 제외가 없으면 given 에도 없다.
    - 예: 헤더 주석 "유형 p = 기하 평균" + 활성 코드는 단순 평균 → ❌ then "기하 평균으로 집계" ✅ "평균으로 집계".
  ④ **코드토큰 박멸 (examples 에도)** — given/when/then 안의 테이블·컬럼·변수·파라미터 이름을 도메인어로.
    - ❌ given "ORD_TB 의 ORD_DT 가 WORK_DT 구간, PROC_CD='q'" then "VAL·CNT 갱신"
      ✅ given "주문일이 작업일 구간이고 처리유형='q'" then "일별 수량과 건수를 갱신"  (값 'q' 는 보존).
  ⑤ **의미 창작 금지** — 코드값 리터럴은 보존하되, 그 값의 **괄호 의미·풀이는 본문(주석·요약)에 근거 있을 때만**.
    - ❌ 코드 'X7' 에 근거 없이 "(취소됨)" 붙임 → ✅ 근거 없으면 'X7' 그대로 (의미가 분석에 중요하면 §4 question).

  ## 3.3 코드값 집합 완전성 (누락 직접 원인 ①)
  "코드가 어떤 집합에 속하면 처리"면 집합의 **모든 값**을 given 에 나열.
  - 예: ❌ 본문 "상태 ∈ [s1..s5] 면 정상"인데 given "상태=s1"만 / ✅ given "상태 ∈ [s1,s2,s3,s4,s5]" then "정상".

  ## 3.4 값→결과 매핑 보존 (누락 직접 원인 ②)
  값마다 결과 다르면 대응을 명시(example 만 보고 복원 가능).
  - 예: ❌ given "유형 ∈ [t1,t2,t3,t4]" then "각각 A 또는 B" / ✅ "∈ [t1,t2]"→"A" / "∈ [t3,t4]"→"B".
  - 값→값 치환도: ✅ given "입력 ∈ [x1,x2]" then "각각 y1,y2 로(x1→y1, x2→y2)". ❌ "y1 또는 y2 로".

  ## 3.5 깊은 중첩 안의 집합·결정도 빠짐없이
  바깥 분기 안의 안쪽 집합·매핑까지 내려가 담는다.
  - 예: 본문 "구분 G 면, 그 안에서 코드 ∈ [k1,k2,k3] 면 정상" → ❌ "구분 G 면 처리"(안쪽 누락)
    / ✅ given "구분=G 且 코드 ∈ [k1,k2,k3]" then "정상" / given "구분=G 且 그 외" then "거절".

  ## 3.6 개수·폭주 (축1 전용)
  한 Rule 의 example 행 = 정상 1 + 예외 1 기본. 축2(집합)·축3(매핑)·서로 다른 케이스는 예외 — 빠짐없이.
  - 예: ❌ 모든 파라미터를 given 에 채우기 / ✅ 본질 키 3~5개만.

  ## 3.7 DECODE/CASE 매핑 (값→결과 정밀 — 공통 §4 의 규칙 적용)
  - 예: `DECODE(구분,'A',AVG,'B',SUM)` + 필터 `구분 IN('A','B','C','D')`
    → ✅ given "구분='A'" then "평균" / "구분 ∈ ['B','C','D']" then "합계". ❌ "구분에 따라 집계"(뭉갬)·역전.
  - default 없으면(`DECODE(부호,'+',1,'-',-1)`) 그 외→NULL 명시. 부호 곱 `SUM(값*계수*DECODE(부호,'+',1,'-',-1,1))`
    → ✅ "'+'=가산,'-'=감산,그 외=가산" 보존(뭉개면 감산 정책 소실).

  # ════════════════════════════════════════════════════════════════
  # 4. questions — ★★ 0 = 최고의 답
  # ════════════════════════════════════════════════════════════════
  4 조건 **모두** 만족만: ① 본문에 모호 단서(의미 모를 코드값·매핑 없는 상수) ② 코드·요약·심볼·notes 어디에도
  답 없음 ③ 이 노드 Rule/Example 정확성에 직접 영향 ④ 다른 질문과 중복 없음. **0 = 최고.** 못 채우면 폐기.
  - 예: ✅ text "코드값 'Z9' 의 업무 의미는?" reason "분기 근거가 코드·요약·notes 어디에도 없음".
    ❌ "코드 'A' 의 의미는?"(본문 분기에 이미 드러남 = 답이 본문에 → question 아니라 example) / "왜 호출되나?"(영향 0).

  # ── 제출 전 자가 점검 (출력 직전 한 번) ──
  - 본문 안 서로 다른 작업마다 규칙? "순으로/차례로" 한 문장에 뭉개지 않았나?(§1.2·§1.3 과소추출)
  - 한 판정의 값 분기를 규칙으로 난사하지 않았나?(§1.4) 서로 다른 결정을 한 Rule 로 합치지 않았나?(§2.6)
  - 각 example 이 §3.2.5 5단계 통과? ①자기 분기 조건 그대로 ②집합 전부 셈 ③활성 코드만(죽은 주석 X)
    ④코드토큰 0 ⑤의미 창작 X
  - 잔심부름(COMMIT·FETCH·EXIT·제어COUNT·로그INSERT·대입)을 규칙으로?(§1.6 과추출)
  - 코드값 집합의 모든 값이 given 에?(축2·본문에서 세었나) 값→결과 대응 복원되나?(축3) 깊은 중첩까지?(§3.5)
  - 각 example 이 §3.2.5 5단계를 통과했나 — ①자기 분기 조건 그대로(짝 뒤집힘 X) ②집합 전부 셈
    ③활성 코드에만 근거(죽은 주석 값·제외조건 X) ④given/then 코드토큰 0 ⑤근거 없는 의미 창작 X
  - 모든 값이 본문에 실제로?(환각 0) questions 4 조건 다?(못 채우면 0)

