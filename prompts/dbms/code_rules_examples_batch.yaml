## code_rules_examples_batch (dbms 분할 3) — 배치 안 각 노드의 rules + examples + questions.
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실 (extends).
## ★ 그룹(같은 유효부모 형제) 전 노드가 배치로 들어옴 → 노드마다 1 항목(node_key echo).
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 3: 비즈니스 규칙·시나리오·질문 (배치 안 각 노드)
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드
  - **이 분할이 하는 일**: 각 노드마다 `rules`(비즈니스 규칙) + `examples`(given/when/then
    시나리오) + `questions`(모호점 검토 큐) 3 배열.
  - **이 분할이 안 하는 일**: 노드 의미·역할(→분할 1) / 컬럼 의미(→분할 2).
  - **출력**: `nodes` 배열 — 입력 `### 노드 <key>` 마다 1 항목.
    ```
    BatchRulesItem {
      node_key: "<start>-<end>",
      rules:     [ { rule_id:"R1", statement:"<조건>이면 <결과>", flow_id:"1", coupled_domains:[] } ],
      examples:  [ { rule_id:"R1", description:"한 줄", given:"...", when:"...", then:"...",
                     affected_tables:[ { table:"...", op:"READ"|"INSERT"|"UPDATE"|"DELETE"|"MERGE" } ] } ],
      questions: [ { text:"한 줄 질문", reason:"코드 근거 부재 사유" } ]
    }
    ```

  ## 0. 추출 절대 원칙 — 모든 영역 공통 (각 영역 디테일보다 우선)
  - **0.1 ★ 분기 난사 절대 금지**: 본문 if/else/CASE 마다 Rule = 최악. 12 분기여도 의미는 1~3 수렴.
  - **0.2 ★ 막무가내 채우기 = 환각 시작**: 가치 못 찾으면 빈 배열. rules 0 / examples 0 / questions 0 = 정상.
  - **0.3 ★ 한도 초과 = 위반**: 가치 결정 질문(1.1) 통과만 출력. max_length 무관 — 가치 자체로 한도.
  - **0.4 ★ 빈 배열 = 정상**: 단순 위임/wrapper/단건 SELECT/COMMIT/대입 → `rules:[]`+`examples:[]`.
  - **0.5 ★ 출력 폭주 = 실제 사고 (★최강조)**: 과거 examples 길어져 토큰 반복 루프 17만/10만 자
    무한 폭주. → examples rule당 1~2, given/then 자연어 한 줄(분기 조합 X), 빈 영역 `[]`/`null`.
  - **0.6 ★ 공백·인덴트로 끝낼 수 없음**: 어떤 string 도 공백·줄바꿈만으로 X. `"key":` 뒤 즉시 값,
    `}`/`]` 즉시. 콜론 뒤 공백 무한 출력 = 폭주(절대 금지).

  ## [1] rules — 비즈니스 규칙 (★ 진짜 가치만)
  ### 1.1 가치 결정 트리 (단일 입구)
  ```
  이 조건 제거 시 사용자(고객/정산/감사) 결과가 달라지는가?  → YES=Rule O / NO=폐기
  ```
  - 통과(적격): 도메인 임계값·정책값 / 상태·유형 차등 / 코드값 분기 / 도메인 계산식 /
    RAISE_APPLICATION_ERROR 비즈니스 예외.
  - FAIL(부적격): 커밋·롤백 / 임시변수 대입 / 순수 기술 NULL 방어 / 표준 wrapper / 로깅.
  ### 1.2 NULL 구분
  - O(도메인): 필수 식별자 NULL→거절 / NULL→기본값 매핑 / 조건부 필수.
  - X(기술): 내부 헬퍼 인자 null 체크 / 프레임워크 경계 방어.
  ### 1.3 ★ 검증 전용 노드 — Rule 1~3 수렴 (★중요)
  NULL/0 체크 10+ 개여도 같은 의미 다발은 **1 Rule + 필드마다 Example**:
  - Rule1 필수 식별자 누락 거절 / Rule2 조건부 필수 / Rule3 기본값 매핑.
  - ★ Rule 4 넘으면 의미 합성 사고 — 통합 재검토. 단건 NULL+즉시거절은 Rule 1 충분.
  ### 1.4 Rule 필드 4개
  - `rule_id` "R1"/"R2"… / `statement` "<조건>이면 <결과>" 10~30자(코드 식별자 박지 마,
    도메인 코드값 리터럴 'A001' 보존 OK) / `flow_id` "1"/"2"(메인=NEXT) "1-1"(분기=BRANCH)
    "1-1-1"(중첩) / `coupled_domains` `[]` 기본, 타 도메인 테이블 WRITE·값분기·계산 시만.
  ### 1.5 한정 정책
  - (a) 가치 자체로 한도. Rule 8 넘으면 분해 권고 question 으로 표면화(인위 압축 X).
  - (b) ★ 값별 통합: 처리구분 5값마다 Rule 5 X → Rule 1 + Example 5. 응답코드 10 → Rule 1 + Example 10.
  - (c) 종료 경로 빠짐 X: silent pass(EXCEPTION WHEN…THEN NULL)=도메인 정책 반드시 명시.
  ### 1.6 안티패턴 (★금지)
  - a. 기술 관심사→Rule(커밋·롤백·변환) = 환각.
  - b. 값별 과세분화(폭주 직접원인) → 값별은 Example 로.
  - c. 분기 난사(가장 흔한 사고) → 가치결정 통과만.
  - d. 자식 Rule 부모로 끌어올림(공통 단계4) → 부모는 자기 분기만. compact body 의 `[줄범위]
    자식 요약`을 다시 규칙으로 X.
  - e. silent pass 미명시 → "조회 후 반환"만 X, "NotFound 면 로그·에러 없이 통과" 명시.

  ## [2] examples — given/when/then (★ rule당 1~2)
  ### 2.1 필드 6개
  - `rule_id` 참조 / `description` 한 줄 요약 / `given` 자연어 한 줄(진입조건, 핵심 키 3-5개)
    / `when` 자연어 한 줄(트리거, 프로시저명 X) / `then` 자연어 한 줄(반환·예외·OUT 변화 결합)
    / `affected_tables` `[{ table, op }]` 본문 R/W 와 일관, 없으면 `[]`.
  ### 2.2 ★★ 개수 — rule당 1~2 (★폭주 차단 핵심)
  - happy path 1 + (예외 throw 면) 예외 1. 그 외 변주 X(미세 변주는 description 한 줄에 통합).
  - 0 정답 가능(Rule 0 → examples 0).
  ### 2.3 안티패턴 (★실제 폭주 사례 못박기)
  - a. 분기 조합 다 채우기(17만 자 폭주) → 1~2 케이스 통합.
  - b. 같은 시나리오 값 변주 ("CARD 정상"/"BANK 정상"…) → 1 개 통합.
  - c. 모든 파라미터 given 에 채우기 → 본질 3-5 키만.
  - d. 공백·인덴트만 출력(10만 자 공백 폭주) → `"given": "..."` 즉시 의미 있는 한 줄.

  ## [3] questions — ★★ 0 = 최고의 답 (★★최강조)
  ### 3.1 의미: 코드·요약·심볼·codebase_notes 어디에도 답 없음 + Rule/Example 정확성에 직접 영향, 모두 만족.
  ### 3.2 필드 2개: `text` 한 줄 질문 / `reason` 코드 근거 부재 사유.
  ### 3.3 강제 조건 (4 모두 만족해야 출력)
  ① 본문에 명확한 모호 단서(의미 모를 코드값 리터럴/매핑 없는 상수) ② 코드·요약·심볼·notes
  어디에도 답 없음 ③ 이 노드 Rule/Example 정확성에 직접 영향 ④ 다른 Question 과 중복 없음.
  ### 3.4 금지: 답이 본문에 있는 질문(가장 흔한 환각) / 단순 호기심 / 외부 시스템 일반질문 /
    분석 영향 없는 질문.
  ### 3.5 ★★ 개수: 0 = 최고(빈 배열 통과 = 가장 좋은 결과). 억지 추출 = hang 원인. 4 조건 못 채우면
    그 자리 폐기(보수적). 같은 코드값 Question 1 개 통합.

  # ════════════════════════════════════════════════════════════════
  # [응답 형식 마무리]
  # ════════════════════════════════════════════════════════════════
  # BatchRulesOutput.nodes — 입력 각 노드마다 BatchRulesItem 1개. node_key echo.
  # 이번 호출은 rules/examples/questions 만 (의미·테이블은 다른 분할). 공백 폭주 절대 금지.
