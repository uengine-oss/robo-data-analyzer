## function_summary (dbms) — 분할 1: summary + stereotype + logical_name
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실.
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 1: range 의미 종합
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드

  - **이 분할이 하는 일**: `summary` + `stereotype` + `logical_name` 3 필드 채움
  - **이 분할이 안 하는 일**: 테이블별 컬럼 의미(→분할 2) / 비즈니스 규칙·시나리오·질문(→분할 3)
  - **출력 미리보기**:
    ```
    SummaryOutput {
      logical_name: "한 줄 도메인 표시명 (22자 전후, 체언 끝)"
      summary:      "핵심: ...\n\n본문 ..."
      stereotype:   "DataMutator | DataQuery | Validator | ... (허용 풀에서)"
    }
    ```

  ---

  ## [1] logical_name — range 의 도메인 한 줄 표시명

  같은 부모 아래 형제 range 와 옆에 놓였을 때 **문장만 보고도 역할이 갈려야** 합니다.

  ### 형식 / 길이 강제

  - **한 줄, 줄바꿈 X**, **통상 22자 전후**, **체언·명사형 어미** ([[_common]] 단계 2).
  - **금지**: 프로시저명·패키지명·변수명 그대로 / 형제와 광역 표현 공통.

  ### 한 줄 안에 ≥ 2 요소 동시에 드러내기

  1. **무슨 DML 행위** — 단건 SELECT / 배치 INSERT / 특정 컬럼 UPDATE / 커서 LOOP /
     트리거 EXCEPTION / MERGE / 집계 등
  2. **무슨 업무 데이터** — 정산 마감 / 인증 이력 / 회계 분개 / 카드사 코드 / 마스터 등록
  3. **언제·어떤 분기** — 마감일 이전 / 성공 경로만 / 이상 케이스 EXCEPTION
  4. **쓰기면 무엇을 바꾸는지** — 응답코드·사유코드 컬럼만 / 승인번호·승인시각 동시

  ### 좋은 예 (5가지 DBMS 도메인)

  - 정산: "마감일 이전 미정산 거래의 정산일자 일괄 확정"
  - 인증 이력: "외부 PG 응답 코드를 인증 이력 테이블에 신규 적재"
  - 회계 분개: "결제 승인 건의 차변/대변 회계 분개 일괄 INSERT"
  - 코드 마스터: "카드사 코드 마스터에서 카드 정보 단건 매핑 조회"
  - 트리거 검증: "주문 상태 'CANCEL' 전이 시 미환불 잔액 검증 EXCEPTION 발생"

  ### 안티패턴/정답 쌍

  - X: "ZPAY_AP_RLTM_AUTH_HST 에 INSERT" (테이블명 그대로)
    O: "결제 실시간 인증 이력에 신규 적재"
  - X: "PROCESS_TYPE 값에 따라 분기" (변수명 그대로)
    O: "처리구분 '신규(01)' / '수정(02)' / '취소(03)' 별 분기 처리"
  - X: "정산 데이터 처리" (광역 표현, 형제 구분 0)
    O: "마감일 이전 미정산 거래의 정산일자 일괄 확정"

  ---

  ## [2] summary — 핵심 한 줄 + 본문

  ### 형식 강제

  ```
  핵심: <한 줄 — 사용자 친화 표현, 프로시저명·SQL 키워드 X>

  <본문 — 비즈니스 의미. 마크다운 헤딩·리스트 기호(`#` / `*` / `-` / `1.`) X.>
  ```

  ### `핵심:` (첫 줄)

  이 range 가 무엇을 하는지 한 줄. 프로시저명·SQL 키워드(SELECT / INSERT / UPDATE /
  DELETE / MERGE) 그대로 박지 X. 비개발자 친화.

  ### 본문 — 반드시 지킬 6 규칙

  1. **원문(코드) 보다 짧게** — 요약이지 확장이 아니다.
  2. **핵심 키포인트 누락 0** — 이 summary 는 상위(부모 range) 분석에 그대로 전달.
     - 도메인 값 + 의미 (예: "처리구분 '01'=신규 / '02'=수정")
     - "이상"≠"초과" / "이하"≠"미만" 정확히
     - 상태 전이 (예: "주문 상태 'PAID' → 'REFUND_PENDING'")
  3. **종료 경로 모두 반영** ([[_common]] 단계 5):
     - 정상 종료 / 에러 종료 (`RAISE`) / silent pass (`EXCEPTION WHEN ... THEN NULL`) /
       조기 `RETURN` / `EXIT` / `GOTO`
  4. **단순 leaf 면 한두 문장** — 억지로 늘리지 X.
  5. **모호 단어 X** ([[_common]] 단계 6).
  6. **DDL 타입 X / SQL 문법 줄줄 X** — 비즈니스 의미만.

  ### DML 키포인트 (본문에 반드시 담을 것)

  본문에 등장한 DML 별로 키포인트를 빠뜨리지 않습니다. SQL 문법이 아니라 **비즈니스
  의미** 로 풀어 쓰세요.

  - **SELECT** — 무엇을 / 어떤 조건으로 / 어떻게 (JOIN·집계·정렬)
  - **INSERT** — 대상 테이블 + 어떤 컬럼 + 값 출처 (리터럴 / 다른 테이블 / 시퀀스 / 파라미터)
  - **UPDATE** — 어떤 컬럼을 어떤 값으로 + WHERE 조건 + 상태 전이 의미
  - **DELETE** — 대상 테이블 + WHERE 컬럼=값 + 도메인 의미 ("취소" / "만료 정리" 등)
  - **MERGE** — source / ON 조건 / WHEN MATCHED ↔ WHEN NOT MATCHED 각각

  ### DBMS 확장 표현 — 환각 방지 ([[_common]] §4)

  - Oracle `NVL` / `DECODE` / `CASE` — unmatched 처리 명시
  - PostgreSQL `COALESCE` / `ON CONFLICT` — 충돌 동작 명시
  - SQL Server `ISNULL` / `OUTPUT` — 출력 컬럼 명시
  - MySQL `IFNULL` / `ON DUPLICATE KEY UPDATE` — upsert 의미 명시

  ### 좋은 예 (5가지 DBMS 패턴)

  #### 예 1 — 단순 SELECT + 매핑

  > 핵심: 카드사 코드로 카드 마스터에서 카드사명과 매입사 코드를 단건 매핑 조회한다.
  >
  > 카드사 코드를 키로 카드 마스터에서 카드사명, 매입사 코드, 가맹점 수수료율을 조회.
  > 결과를 OUT 파라미터에 매핑. 미존재(NO_DATA_FOUND) 인 경우 오류 코드 'CARD_NOT_FOUND'
  > 로 RAISE.

  #### 예 2 — INSERT + 시퀀스 채번

  > 핵심: 결제 승인 결과를 인증 이력에 신규 적재한다.
  >
  > 인증 이력 테이블에 신규 행을 INSERT — 시퀀스 채번으로 PK 생성, 승인번호·승인시각·
  > 응답코드·카드사코드 컬럼 채움. 응답코드 '0000' 은 성공, '0001'~'0099' 는 거절 사유별
  > 분기. 시퀀스 실패 시 RAISE_APPLICATION_ERROR (-20001, "SEQ_FAIL").

  #### 예 3 — UPDATE + 상태 전이

  > 핵심: 정산 마감 후 미정산 거래의 정산상태를 'CONFIRMED' 로 일괄 갱신한다.
  >
  > 마감일 이전 + 정산상태 'PENDING' 인 거래만 대상. SETTLE_DATE 컬럼에 마감일 적용,
  > SETTLE_STATUS 컬럼을 'CONFIRMED' 로 전이. 대상 0건이면 로그만 남기고 정상 종료.

  #### 예 4 — MERGE (upsert)

  > 핵심: 환율 마스터를 일별 환율 피드로 일괄 동기화한다 (신규 통화는 INSERT, 기존은 UPDATE).
  >
  > 외부 환율 피드를 source 로 MERGE. 통화코드 일치 (`ON CURRENCY_CD`) 시 RATE 와
  > LAST_UPDATED 컬럼을 UPDATE. 미일치 시 신규 INSERT. unmatched 행은 처리 X (그 외 통화는
  > 마스터에 미반영).

  #### 예 5 — silent pass 분기 포함

  > 핵심: 결제 취소 요청에 대해 환불 대상 확인 후 미존재면 조용히 통과, 존재 시 환불 큐 적재.
  >
  > 결제 ID 로 결제 이력 단건 조회. NO_DATA_FOUND 의 경우 `EXCEPTION WHEN NO_DATA_FOUND THEN
  > NULL` 로 조용히 통과 (이미 환불됐거나 미존재면 별도 처리 없음 = 정상). 조회 성공 시
  > 환불 큐에 INSERT. 그 외 예외는 RAISE.

  ---

  ## [3] stereotype — range 역할 라벨

  실제 동작 기준. 허용 풀에서만 선택. 다른 값 X.

  ### 허용 풀 (12개)

  `DataMutator` / `DataQuery` / `BatchProcessor` / `Validator` / `MetadataLookup` /
  `EventTrigger` / `Aggregator` / `ReportGenerator` / `DataMigrator` / `CursorLooper` /
  `PackageInitializer` / `Helper`

  ### 결정 트리

  ```
  INSERT/UPDATE/DELETE/MERGE 가 본질?
    → 예 + 단일 행 처리 → DataMutator
    → 예 + 커서 LOOP 안 반복 → BatchProcessor
    → 아니오 → 다음
  SELECT 만 + 결과 분기·반환?
    → 예 + 집계 (SUM/COUNT/GROUP BY) → Aggregator
    → 예 + 단순 코드/마스터 조회 → MetadataLookup
    → 예 + 그 외 → DataQuery
    → 아니오 → 다음
  검증만 + 검증 후 RAISE 또는 결과 분기?  → Validator
  커서 LOOP, DML 없거나 외부 위임?  → CursorLooper
  TRIGGER 본문 (AFTER · BEFORE 분기)?  → EventTrigger
  패키지 초기화 블록 (BEGIN ... END 의 외부 호출 setup)?  → PackageInitializer
  리포트·요약 결과 산출?  → ReportGenerator
  소스→타깃 마이그레이션 (한 번성)?  → DataMigrator
  그 외 유틸성?  → Helper
  ```

  ### 안티패턴/정답 쌍

  - X: 커서 LOOP 안에 INSERT 반복 → `DataMutator` (단일 행 분류로 잘못 적용)
    O: `BatchProcessor` (LOOP 안 DML 반복 = 배치 본질)
  - X: SELECT 결과를 그냥 OUT 으로 반환 → `Validator`
    O: `DataQuery` 또는 `MetadataLookup` (검증·RAISE 없음)
  - X: AFTER INSERT 트리거 본문 안 DML 있다고 `DataMutator`
    O: `EventTrigger` (트리거 본문 자체가 우선 분류)

