  ## [3] stereotype — range 역할 라벨

  실제 동작 기준. 허용 풀에서만 선택. 다른 값 X.

  ### 3.1 허용 풀 (12개)

  `DataMutator` / `DataQuery` / `BatchProcessor` / `Validator` / `MetadataLookup` /
  `EventTrigger` / `Aggregator` / `ReportGenerator` / `DataMigrator` / `CursorLooper` /
  `PackageInitializer` / `Helper`

  ### 3.2 결정 트리

  ```
  INSERT/UPDATE/DELETE/MERGE 가 본질?
    → 예 + 단일 행 처리 → DataMutator
    → 예 + 커서 LOOP 안 반복 → BatchProcessor
    → 아니오 → 다음
  SELECT 만 + 결과 분기·반환?
    → 예 + 집계 (SUM/COUNT/GROUP BY) → Aggregator
    → 예 + 단순 코드/마스터 조회 → MetadataLookup
    → 예 + 그 외 → DataQuery
    → 아니오 → 다음
  검증만 + 검증 후 RAISE 또는 결과 분기?  → Validator
  커서 LOOP, DML 없거나 외부 위임?  → CursorLooper
  TRIGGER 본문 (AFTER · BEFORE 분기)?  → EventTrigger
  패키지 초기화 블록 (BEGIN ... END 의 외부 호출 setup)?  → PackageInitializer
  리포트·요약 결과 산출?  → ReportGenerator
  소스→타깃 마이그레이션 (한 번성)?  → DataMigrator
  그 외 유틸성?  → Helper
  ```

  ### 3.3 reads / writes / codebase_notes 와 일관성

  - `reads` 만 있고 `writes` 없음 + codebase_notes op 가 SELECT 계열 → **DataQuery** /
    **MetadataLookup** / **Aggregator** 후보.
  - `writes` 있음 + op 가 INSERT/UPDATE/DELETE/MERGE → **DataMutator** / **BatchProcessor** 후보.
  - 주석이 op 와 어긋나면 `reads`/`writes` + codebase_notes 가 진실. 주석에 끌려
    DataMutator 로 잘못 판단하지 X (실제 잦은 오류 — 0.2 / 2.6 참조).

  ### 3.4 stereotype 안티패턴 — 안티패턴/정답 쌍

  - X: 커서 LOOP 안에 INSERT 반복 → `DataMutator` (단일 행 분류로 잘못 적용)
    O: `BatchProcessor` (LOOP 안 DML 반복 = 배치 본질)
  - X: SELECT 결과를 그냥 OUT 으로 반환 → `Validator`
    O: `DataQuery` 또는 `MetadataLookup` (검증·RAISE 없음)
  - X: AFTER INSERT 트리거 본문 안 DML 있다고 `DataMutator`
    O: `EventTrigger` (트리거 본문 자체가 우선 분류)

  # ════════════════════════════════════════════════════════════════
  # [응답 형식 마무리]
  # ════════════════════════════════════════════════════════════════

  Pydantic 모델: **SummaryOutput** (`summary` / `stereotype` / `logical_name`).
  이번 호출은 이 3 필드만 응답에 포함. 다른 필드는 다른 분할 책임.
