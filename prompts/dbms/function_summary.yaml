  ## 이 분할의 일 — 프로시저/range 의미 종합 (summary + stereotype + logical_name)

  ### 이 분할 고유 원칙

  - **보수적 — 모호하면 안 한다**. 명확한 의미가 있을 때만 작성.
  - **마크다운 헤딩·리스트 기호** (`#` / `*` / `-` / `1.`) 사용 X.
  - **뭉뚱그림** ("상황에 따라"·"적절히") X.

  ---

  ### [0] logical_name — 형제와 한 글자라도 달라야

  같은 부모 아래 형제 range 와 옆에 놓였을 때 문장만 보고도 역할이 갈려야.
  통상 22자 전후, 체언·명사형 끝, 줄바꿈 X.

  한 줄 안에 가능한 한 둘 이상 동시에 드러내기:
  1. 무슨 DML 행위 (단건 SELECT / 배치 INSERT / 특정 컬럼만 UPDATE / 커서 LOOP / 트리거 EXCEPTION).
  2. 무슨 업무 데이터 (정산 마감 / 인증 이력 / 회계 분개 / 카드사 코드 / 마스터 등록 등).
  3. 언제·어떤 분기 (마감일 이전 / 성공 경로만 / 이상 케이스 EXCEPTION).
  4. 쓰기면 무엇을 바꾸는지 (응답코드·사유코드 컬럼만 / 승인번호·승인시각 동시).

  금지: 프로시저명 / 패키지명 / 변수명 그대로 / 형제와 광역 표현 공통.

  ---

  ### [1] summary — 핵심 한 줄 + 내용

  형식: 첫 줄 `핵심:` 한 줄 → 빈 줄 → 내용. 하위 섹션 라벨 (`[흐름]`/`[쓰기]` 등) 없음.

  `핵심:` — 이 range 가 무엇을 하는지 한 줄. 사용자 친화 (프로시저명·SQL 키워드 X).

  내용 — 이 range 가 하는 일을 비즈니스 언어로 서술. 반드시 지킬 것:
  - **원문(코드)보다 짧게** — 요약이지 확장이 아니다.
  - **핵심 키포인트 누락 0** — 이 summary 는 상위(부모 range) 분석에 그대로 전달된다.
    분기·조건·임계값·도메인 코드값·상태 전이를 빠뜨리면 상위가 정보를 잃는다.
    · 도메인 값 + 의미 (예: "처리구분 '01'=신규 / '02'=수정 분기").
    · "이상"≠"초과" / "이하"≠"미만" 정확히.
  - 단순 leaf 면 한두 문장으로 충분 — 억지로 늘리지 X.

  #### DML 키포인트 (내용에 반드시 담을 것)

  - SELECT: WHERE 컬럼·비교값 + JOIN 대상·조건 + 집계·정렬.
  - INSERT: 대상 테이블 + 컬럼 + 값 출처 (리터럴·다른 테이블·시퀀스).
  - UPDATE: SET 컬럼=값 + WHERE 조건 + 상태 전이.
  - DELETE: 대상 테이블 + WHERE 컬럼=값.
  - MERGE: USING source + ON 조건 + WHEN MATCHED / NOT MATCHED 각각.
  - DBMS 확장 표현 보존: Oracle NVL·DECODE·CONNECT BY / PG COALESCE·ON CONFLICT /
    SQL Server ISNULL·OUTPUT / MySQL IFNULL·ON DUPLICATE KEY UPDATE.

  #### DECODE / CASE / NVL — unmatched 환각 방지

  명시된 case 만 정확히. unmatched 를 임의로 다른 case 와 묶거나 일반화 X.
  - `DECODE(X, v1, r1, v2, r2)` (default 없음) → unmatched = NULL. "그 외 NULL" 명시.
  - `CASE WHEN ... THEN ... END` (ELSE 없음) → unmatched = NULL.
  - `NVL(A, B)` → A NULL 이면 B. A 가 NULL 아닐 때 의미 추가 X.

  ✓ `DECODE(COMPUTE, '+', 1, '-', -1)` → "COMPUTE 가 '+' 이면 1, '-' 이면 -1 (그 외 NULL)".
  ✗ 잘못: "COMPUTE 가 '+' 이면 1, 아니면 -1" ('아니면' 으로 두 case 묶음).

  ---

  ### [2] stereotype — 실제 동작 기준

  허용 풀 (ontology_roles.yaml dbms):
  DataMutator / DataQuery / BatchProcessor / Validator / MetadataLookup /
  EventTrigger / Aggregator / ReportGenerator / DataMigrator / CursorLooper /
  PackageInitializer / Helper

  - DataMutator: INSERT/UPDATE/DELETE/MERGE 직접.
  - DataQuery: SELECT 만, 결과 분기·반환.
  - BatchProcessor: 커서 LOOP + DML 반복.
  - CursorLooper: 커서 LOOP, DML 없거나 외부 위임.
  - Validator: 검증만, 검증 후 RAISE / 결과 분기.
  - Aggregator: 집계 (SUM / COUNT / GROUP BY) 후 반환·반영.
  - EventTrigger: TRIGGER 본문 / AFTER · BEFORE 분기.
  - PackageInitializer: 패키지 초기화 블록.

  ---

  ## 이 분할 추가 규칙

  summary 는 `핵심:` 한 줄로 시작 (핵심 + 내용).

  ### 종료 경로 누락 금지 — silent pass 포함

  함수 본문의 **모든 종료 경로 (return / exit / raise / 조기 분기)** 를 summary 내용에
  반영. 하나라도 빠뜨리면 상위(caller·부모) 분석이 흐름을 잃는다.

  - **정상 종료** — 어느 흐름 끝에 이른 결과인지
  - **에러 종료** — 어떤 조건일 때 어떤 에러로
  - **silent pass 분기** — 에러 신호(SQLCODE/NO_DATA_FOUND/null 등)를 받았으나
    로그·raise 없이 통과하는 분기. 의미상 별도 흐름이므로 명시
  - **조기 return / EXIT / GOTO** 로 인한 분기도 마찬가지

  마인드셋: 종료 경로가 N개면 summary 내용에 N개 흐름 명시. 한 흐름만 적고 다른
  흐름 빠뜨리지 말 것. 언어 무관.

