## function_summary (dbms) — 분할 1: summary + stereotype + logical_name
## 공통 system + user_template 입력값은 [[_common.yaml]] 가 단일 진실.
extends: _common
user_template_specific: |
  # ════════════════════════════════════════════════════════════════
  # [이 분할 고유 지침] — 분할 1: range 의미 종합
  # ════════════════════════════════════════════════════════════════

  ## 분할 책임 카드

  - **이 분할이 하는 일**: `summary` + `stereotype` + `logical_name` 3 필드 채움
  - **이 분할이 안 하는 일**: 테이블별 컬럼 의미(→분할 2) / 비즈니스 규칙·시나리오·질문(→분할 3)
  - **출력 미리보기** (type + 값 예시):
    ```
    SummaryOutput {
      logical_name: "한 줄 도메인 표시명 (22자 전후, 체언 끝)",     // string
      summary:      "[핵심] ...\n\n내용 ...",                      // string ([핵심] 마커 필수)
      stereotype:   "DataMutator" | "DataQuery" | "Validator" | ... // 허용 풀 12개 중
    }
    ```

  ---

  ## 0. 작성 절대 원칙 — 모든 3 필드 공통

  ### 0.1 식별자 보존 + 코드 토큰 가독성 ([[_common]] 단계 2 참조)
  - 테이블·컬럼·시퀀스·변수·프로시저명은 **본문 그대로 보존** (만들지·축약·일반화 X).
  - 단 **사람용 자연어 한 줄** ([핵심] / logical_name / narrative) 에는 코드 토큰을
    그대로 박지 X — 의미로 풀어쓰기.

  ### 0.2 body 주석 환각 차단 ([[_common]] 단계 7 참조)
  body 주석은 코드 변경 잔재로 실제 동작과 어긋날 수 있는 신호.
  결정론 메타 (codebase_notes / 함수 식별자 / 키) 가 항상 우선.

  - X: body 라인 위 `-- 데이터 신규 등록` 주석 + 실제 키 = UPDATE
       → summary "신규 등록" / logical_name "신규 적재" 박음 (주석 환각)
    O: 결정론 메타가 UPDATE → summary "갱신" / logical_name "갱신". 주석 무시.

  ### 0.3 추측 X ([[_common]] 단계 1 참조)
  자기 range 의 raw 코드 라인이 1차 근거. ancestor_context / reads / writes /
  callee_summaries 는 해석 참고 자료 — 거기서 추가 추출·모방·복제 X.

  ### 0.4 모호 단어 박멸 ([[_common]] 단계 6 참조)
  "적절히 / 필요시 / 상황에 따라" 같은 표현 X.
  비교 정확 — "이상" ≠ "초과", "이하" ≠ "미만".

  ### 0.5 SQL 문법 줄줄 X ([[_common]] 단계 7 (a) 참조)
  "WHERE STATUS='A' AND DELETED='N' 조회" 식 X → "활성 + 미삭제 사용자만 대상" O.
  "MERGE 의 USING 절에 SELECT" X → "신규 정산 코드는 INSERT, 기존 코드는 UPDATE 로 일괄 반영" O.

