  ## [2] summary — 2 섹션 구조 [핵심] + 내용

  ### 2.1 형식 강제

  ```
  [핵심] <한 줄 — 사용자 친화 표현, 프로시저명·SQL 키워드 X>

  <내용 — 비즈니스 의미 본문 자유 서술. 분기·조건·임계값·상태값·도메인 코드값 +
   RAISE / EXCEPTION 보존. 단순 leaf 면 [핵심] 한 줄로 끝 — 내용 생략 OK.>
  ```

  - 섹션 라벨은 `[핵심]` 한 가지만. 다른 어떤 섹션 라벨도 사용 X.
  - 마크다운 헤딩·리스트 기호 (`#` / `*` / `-` / `1.`) 사용 X.
  - `[핵심]` 다음 빈 줄 → 내용 (한두 문장 ~ 여러 문장 자유).
  - 단순 leaf / wrapper / 단건 SELECT range: `[핵심]` 한 줄로 충분 — 내용 생략 OK.

  ### 2.2 각 섹션 책임

  **[핵심]** — 첫 줄. 한 줄. 이 range 가 무엇을 하는지 (사용자 친화). 프로시저명·SQL
  키워드 (SELECT / INSERT / UPDATE / DELETE / MERGE) 그대로 X.

  **내용** — 비즈니스 의미 본문 자유 서술. 필요한 만큼 (단순 leaf 면 생략).
  - 도메인 값 + 의미 — 예: "처리구분('01'=신규 / '02'=수정 / '03'=취소)".
  - 상태 전이 — 예: "주문 상태 'PAID' → 'REFUND_PENDING'".
  - DML 의미 — INSERT 대상·컬럼·값 출처 / UPDATE 어떤 컬럼·WHERE / DELETE WHERE+도메인 의미 /
    MERGE source·ON·MATCHED/NOT MATCHED. SQL 문법 줄줄 X (0.5 참조).
  - 종료 경로 모두 — 정상 / `RAISE` / `EXCEPTION WHEN ... THEN NULL` silent pass /
    조기 `RETURN`·`EXIT`·`GOTO` ([[_common]] 단계 5 참조).
  - DBMS 환각 4 함정 ([[_common]] §4) — IF/ELSIF 상호배타 / DECODE·CASE·NVL unmatched
    명시 / EXCEPTION silent 명시 / 자식 재추출 X.

  ### 2.3 DBMS 확장 표현 — 환각 방지

  body 내용에 등장하면 정확히 표현:

  - Oracle `NVL` / `DECODE` / `CASE` — unmatched 처리 명시 (그 외 NULL 등).
  - PostgreSQL `COALESCE` / `ON CONFLICT` — 충돌 동작 명시.
  - SQL Server `ISNULL` / `OUTPUT` — 출력 컬럼 명시.
  - MySQL `IFNULL` / `ON DUPLICATE KEY UPDATE` — upsert 의미 명시.

  ### 2.4 본문 작성 절대 규칙

  1. **원문(코드)보다 짧게** — 요약이지 확장이 아님.
  2. **단순 leaf** = [핵심] 1줄로 충분. 억지로 늘리지 X.
  3. **자식 끌어올림 X** ([[_common]] 단계 4 참조) — 자식의 [핵심] 한 줄은 summary 에
     맥락으로 반영 OK. 단 자식의 내부 분기·NULL 체크·검증을 부모 summary 의 자세한
     내용으로 끌어올림 X. 자기 body (호출 자체) 만 요약.

  ### 2.5 좋은 예 (5가지 DBMS 패턴 — 2 섹션 적용)

  #### 예 1 — 단순 SELECT + 매핑

  > [핵심] 카드사 코드로 카드 마스터에서 카드사명과 매입사 코드를 단건 매핑 조회한다.
  >
  > 카드사 코드 키로 카드 마스터 (`card_master`) 단건 조회 (컬럼: card_co_name,
  > acquirer_cd, merchant_fee_rate). 결과를 OUT 파라미터에 매핑. NO_DATA_FOUND →
  > 오류 코드 'CARD_NOT_FOUND' RAISE.

  #### 예 2 — INSERT + 시퀀스 채번

  > [핵심] 결제 승인 결과를 인증 이력에 신규 적재한다.
  >
  > 응답코드 '0000' = 성공, '0001'~'0099' = 거절 사유별 분기. 인증 이력
  > (`auth_history`) 에 신규 INSERT — PK 는 시퀀스 `seq_auth.NEXTVAL`, 컬럼 채움
  > (approve_no, approve_time, response_code, card_co_cd). 시퀀스 실패 →
  > `RAISE_APPLICATION_ERROR(-20001, "SEQ_FAIL")`.

  #### 예 3 — UPDATE + 상태 전이

  > [핵심] 정산 마감 후 미정산 거래의 정산상태를 'CONFIRMED' 로 일괄 갱신한다.
  >
  > 마감일 이전 + 정산상태 'PENDING' 거래만 대상으로 정산 (`settlement`) UPDATE —
  > settle_status 'PENDING' → 'CONFIRMED', settle_dt 마감일 적용. 대상 0 건이면
  > 로그만 남기고 정상 종료.

  #### 예 4 — MERGE (upsert)

  > [핵심] 환율 마스터를 일별 환율 피드로 일괄 동기화한다 (신규 통화 INSERT, 기존 UPDATE).
  >
  > 외부 환율 피드 source 로 환율 마스터 (`exchange_rate`) MERGE — 통화코드
  > (CURRENCY_CD) 일치 시 rate·last_updated UPDATE, 미일치 시 신규 INSERT.
  > unmatched 처리 X (그 외 통화는 마스터에 미반영).

  #### 예 5 — silent pass 분기 포함

  > [핵심] 결제 취소 요청에 대해 환불 대상 확인 후 미존재면 조용히 통과, 존재 시
  > 환불 큐 적재.
  >
  > 결제 ID 로 결제 이력 (`payment_history`) 단건 조회 (amount, status).
  > NO_DATA_FOUND → `EXCEPTION WHEN NO_DATA_FOUND THEN NULL` 조용히 통과 (이미
  > 환불됐거나 미존재 = 정상 케이스). 조회 성공 시 환불 큐 (`refund_queue`) 에
  > payment_id·refund_amount INSERT. 그 외 예외 → RAISE.

  ### 2.6 ★ codebase_notes 우선 — body 주석 환각 차단 ([[_common]] 단계 7 적용)

  body 주석은 코드 변경 잔재로 실제 동작과 어긋날 수 있음. summary 의 동사 결정 시
  **결정론 메타** (codebase_notes / 함수 식별자 / 키 → op) 가 항상 우선.

  - X: body 라인 위 잔재 주석 `-- 신규 등록` + 실제 함수 키 = UPDATE
       → [핵심] "신규 적재" / 내용 "INSERT 한다" 박음 (주석 환각)
    O: 결정론 메타가 UPDATE → [핵심] "갱신" / 내용 "UPDATE 한다". body 주석은 무시.

  - X: body 에 모든 프로시저 공통 잔재 주석 박혀있음 → 모두 INSERT 처럼 보임
       (실제는 i/u/s/d 다양)
    O: 함수의 결정론 메타가 진실. 공통 잔재 주석 무시.

