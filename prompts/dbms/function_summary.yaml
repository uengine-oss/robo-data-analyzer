  ## [1] logical_name — range 의 도메인 한 줄 표시명

  같은 부모 아래 형제 range 와 옆에 놓였을 때 **문장만 보고도 역할이 갈려야** 합니다.

  ### 1.1 형식 / 길이 강제

  - **한 줄, 줄바꿈 X**.
  - **통상 22자 전후** — 두세 단어 라벨 금지.
  - **체언·명사형 어미** — "갱신", "등록", "조회", "검증", "매핑", "결정", "반영", "차단",
    "확정", "취소", "RAISE".
  - **금지 어미** — "처리한다 / 한다 / 함" 같은 동사 어미.
  - **금지** — 프로시저명·패키지명·변수명 그대로 / 형제와 광역 표현 공통.

  ### 1.2 결정 트리 (4 요소 중 ≥ 2 동시 드러내기)

  1. **무슨 DML 행위** — 단건 SELECT / 배치 INSERT / 특정 컬럼 UPDATE / 커서 LOOP /
     트리거 EXCEPTION / MERGE / 집계 등
  2. **무슨 업무 데이터** — 정산 마감 / 인증 이력 / 회계 분개 / 카드사 코드 / 마스터 등록
  3. **언제·어떤 분기** — 마감일 이전 / 성공 경로만 / 이상 케이스 EXCEPTION
  4. **쓰기면 무엇을 바꾸는지** — 응답코드·사유코드 컬럼만 / 승인번호·승인시각 동시

  ### 1.3 좋은 예 (5가지 DBMS 도메인)

  - 정산: "마감일 이전 미정산 거래의 정산일자 일괄 확정"
  - 인증 이력: "외부 PG 응답 코드를 인증 이력 테이블에 신규 적재"
  - 회계 분개: "결제 승인 건의 차변/대변 회계 분개 일괄 INSERT"
  - 코드 마스터: "카드사 코드 마스터에서 카드 정보 단건 매핑 조회"
  - 트리거 검증: "주문 상태 'CANCEL' 전이 시 미환불 잔액 검증 EXCEPTION 발생"

  ### 1.4 ★ 형제 차별 패턴 표 (같은 패키지 형제와 안 겹치게 — 9 쌍)

  같은 패키지·스크립트의 형제 프로시저들이 의미 비슷해 보여도 ★ 한 글자라도 달라야 함.

  | 형제 패턴 | ❌ 짧은 광역 표현 | ✅ 차별 축 2+ 동시 드러난 한 줄 |
  |---|---|---|
  | 검증 프로시저 | "입력 검증"     | "정산 요청 거래일자·통화·금액·기관코드 사전 검증 및 거절코드 OUT 매핑" |
  | 메인 프로시저 | "메인 처리"     | "결제 승인 트랜잭션 시작·외부 호출·결과 적재 일괄 처리 흐름"           |
  | 이력 INSERT   | "이력 등록"     | "결제 승인 결과 신규 이력 INSERT 및 시퀀스 PK 채번·승인시각 기록"     |
  | 마스터 조회   | "코드 조회"     | "카드사 코드 마스터 단건 조회 및 카드사명·매입사 코드 OUT 매핑"       |
  | UPDATE A      | "결과 갱신"     | "응답코드·사유코드 컬럼만 성공 분기 UPDATE 후 외부 인증 이력 확정"    |
  | UPDATE B      | "결과 적용"     | "승인번호·승인시각·매입사코드 컬럼 반영 결제 이력 확정 UPDATE"        |
  | 트리거 검증   | "트리거 검증"   | "주문 상태 'CANCEL' 전이 시 미환불 잔액 검증 EXCEPTION RAISE"         |
  | 배치 정산     | "정산 일괄"     | "마감일 이전 미정산 거래의 정산일자·상태 일괄 확정 BatchProcessor"    |
  | MERGE 동기화  | "마스터 동기화" | "외부 환율 피드 source MERGE: 통화코드 일치 UPDATE / 미일치 INSERT"   |

  → 표 오른쪽 열처럼 형제와 첫 두 단어 조합이 다르게 / 차별 축 2+ 동시 드러나게.

  ### 1.5 logical_name 금지 패턴 — 안티패턴/정답 쌍

  **a. 프로시저명·테이블명·변수명 그대로 박기**
  - X: "ZPAY_AP_RLTM_AUTH_HST 에 INSERT" (테이블명 그대로)
    O: "결제 실시간 인증 이력에 신규 적재"
  - X: "PROCESS_TYPE 값에 따라 분기" (변수명 그대로)
    O: "처리구분 '신규(01)' / '수정(02)' / '취소(03)' 별 분기 처리"

  **b. 형제와 공통 광역 표현 단독**
  - X: "정산 데이터 처리" (광역 표현, 형제 구분 0)
    O: "마감일 이전 미정산 거래의 정산일자 일괄 확정"

  **c. body 주석에 끌려 잘못된 동사 (★ 0.2 적용)**
  주석이 실제 DML 과 어긋나는 경우가 잦음. 결정론 메타 (codebase_notes / 함수 키) 가 진실.

  - X: 주석 `-- 신규 등록` 에 끌려 logical_name = "신규 적재" (실제 키 = UPDATE)
    O: "정산상태 컬럼만 UPDATE 로 갱신"

