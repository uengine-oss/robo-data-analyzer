spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://db-main.example.com:5432/orders
    username: app_user
    password: secret123
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
  redis:
    host: cache.example.com
    port: 6379

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.example: DEBUG
  file:
    name: /var/log/order-service.log
